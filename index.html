const DATA={"ped": {"sess": {"1": {"obj": [["Citer les trois raisons de faire de la microbiologie en usine.", "تذكر الأسباب الثلاثة لإجراء التحاليل الميكروبيولوجية في المصنع."], ["Ordonner les 7 étapes d'une analyse microbiologique.", "ترتّب المراحل السبع للتحليل الميكروبيولوجي."], ["Distinguer les micro-organismes utiles, nuisibles et pathogènes.", "تميّز بين الكائنات الدقيقة النافعة والضارّة والممرضة."]], "sum": [["La microbiologie sert à accepter un lot, vérifier le système et fabriquer.", "علم الأحياء الدقيقة يُستعمل لقبول دفعة، ومراقبة النظام، والتصنيع."], ["Une analyse suit 7 étapes, du matériel stérile au rapport de conformité.", "التحليل يمرّ بسبع مراحل، من الأدوات المعقّمة إلى تقرير المطابقة (conformité)."], ["Observer, cultiver, maîtriser : Leeuwenhoek, Spallanzani, puis Semmelweis, Koch et Pasteur.", "الملاحظة، الزرع، التحكم: ليفنهوك، سبالانزاني، ثم سيملفايس وكوخ وباستور."], ["Cinq besoins : eau, nutriments, température, temps, oxygène. En retirer un bloque la croissance.", "خمس حاجيات: الماء، المغذيات، الحرارة، الوقت، الأكسجين. حذف واحدة يوقف النمو."], ["On favorise les utiles, on limite les nuisibles, on élimine les pathogènes.", "نشجّع النافعة، نحدّ من الضارّة، نقضي على الممرضة."]], "q3": [{"q": ["Au labo, un échantillon arrive avec un emballage déchiré. Que fais-tu à la réception ?", "في المختبر، تصل عيّنة بتغليف ممزّق. ماذا تفعل عند الاستقبال؟"], "o": [["Tu l'analyses normalement", "Tu notes l'anomalie : l'emballage doit être intact", "Tu la mets directement à l'étuve"], ["تحلّلها بشكل عادي", "تسجّل الخلل: يجب أن يكون التغليف سليمًا", "تضعها مباشرة في الحاضنة"]], "a": 1, "w": ["À la réception, on vérifie l'identification, la température et un emballage intact.", "عند الاستقبال نتحقق من التعريف ودرجة الحرارة وسلامة التغليف."]}, {"q": ["Un lot de viande hachée a une belle couleur et une odeur normale. Un collègue veut sauter l'analyse. Ton avis ?", "دفعة لحم مفروم لونها جميل ورائحتها عادية. زميل يريد تجاوز التحليل. ما رأيك؟"], "o": [["Il a raison : rien n'est visible", "On le goûte pour vérifier", "On analyse : pas visible ne veut pas dire pas présent"], ["معه حق: لا شيء ظاهر", "نتذوّقه للتحقق", "نحلّل: عدم الرؤية لا يعني عدم الوجود"]], "a": 2, "w": ["Les pathogènes sont souvent invisibles : seule l'analyse permet d'accepter le lot.", "الممرضات غالبًا غير مرئية: التحليل وحده يسمح بقبول الدفعة."]}]}, "2": {"obj": [["Classer un micro-organisme avec la cellule et le noyau.", "تصنّف كائنًا دقيقًا حسب وجود الخلية والنواة."], ["Légender le schéma de la cellule eucaryote.", "تسمّي أجزاء رسم الخلية حقيقية النواة (eucaryote)."], ["Associer chaque organite à son rôle.", "تربط كل عضيّة (organite) بدورها."]], "sum": [["Cellulaires : algues, protozoaires, champignons, bactéries. Non cellulaires : virus, phages, prions.", "الخلوية: الطحالب، الأوالي، الفطريات، البكتيريا. غير الخلوية: الفيروسات، العاثيات، البريونات."], ["Procaryote : sans noyau, ADN libre. Eucaryote : vrai noyau à double membrane.", "بدائي النواة: بدون نواة، ADN حرّ. حقيقي النواة: نواة حقيقية بغشاء مزدوج."], ["Le noyau commande, la mitochondrie donne l'ATP, le Golgi trie et distribue.", "النواة تقود، الميتوكوندري تعطي ATP، جهاز غولجي يفرز ويوزّع."], ["La membrane laisse passer, la paroi maintient la forme.", "الغشاء يسمح بالمرور، والجدار يحافظ على الشكل."]], "q3": [{"q": ["Au microscope, tu vois une cellule avec noyau, paroi et chloroplastes, prise dans un bassin d'irrigation. C'est :", "تحت المجهر، ترى خلية لها نواة وجدار وصانعات اليخضور، مأخوذة من صهريج سقي. إنها:"], "o": [["une algue", "un protozoaire", "une bactérie"], ["طحلب", "من الأوالي", "بكتيريا"]], "a": 0, "w": ["Noyau = eucaryote ; chloroplastes et paroi = algue. Le protozoaire n'a pas de chloroplastes.", "النواة = حقيقي النواة؛ صانعات اليخضور والجدار = طحلب. الأوالي ليس لها صانعات اليخضور."]}, {"q": ["Un collègue veut cultiver un virus sur une boîte de gélose, comme une bactérie. Qu'en penses-tu ?", "زميل يريد زرع فيروس في علبة وسط زرع (gélose) مثل البكتيريا. ما رأيك؟"], "o": [["Bonne idée, à 37 °C il poussera", "Il faut ajouter plus de nutriments", "Impossible : le virus a besoin d'une cellule hôte"], ["فكرة جيدة، سينمو في 37 درجة", "يجب إضافة مغذيات أكثر", "مستحيل: الفيروس يحتاج إلى خلية مضيفة"]], "a": 2, "w": ["Le virus n'est pas cellulaire : il ne se multiplie que dans une cellule hôte.", "الفيروس ليس خلويًا: لا يتكاثر إلا داخل خلية مضيفة."]}]}, "3": {"obj": [["Distinguer moisissures et levures, et les deux groupes de moisissures.", "تميّز بين العفن والخمائر، وبين مجموعتي العفن."], ["Donner un exemple utile et un exemple nuisible de champignon.", "تعطي مثالًا نافعًا ومثالًا ضارًّا للفطريات."], ["Décrire les modes de reproduction des champignons.", "تصف طرق تكاثر الفطريات."]], "sum": [["Champignons : hétérotrophes, sans chlorophylle. Moisissures filamenteuses, levures unicellulaires.", "الفطريات: غيرية التغذية، بدون يخضور. العفن خيطي، والخمائر أحادية الخلية."], ["Hyphes = filaments ; mycélium = leur ensemble. Non cloisonné = zygomycète ; cloisonné = ascomycète.", "الخيوط الفطرية = خيوط؛ الغزل الفطري = مجموعها. غير مقسّم = لاقحي؛ مقسّم = زقي."], ["Saccharomyces fait lever le pain ; Candida est pathogène.", "Saccharomyces تجعل الخبز ينتفخ؛ و Candida ممرضة."], ["Levure : bourgeonnement (inégal). Moisissure : spores transportées par l'air.", "الخميرة: التبرعم (غير متساوٍ). العفن: أبواغ (spores) ينقلها الهواء."], ["Sexuée : fusion (n + n = 2n), puis méiose, puis spores.", "التكاثر الجنسي: اندماج (n + n = 2n)، ثم انقسام اختزالي، ثم أبواغ."]], "q3": [{"q": ["Dans la réserve d'une boulangerie, tu trouves un pain moisi. Que fais-tu ?", "في مخزن مخبزة، تجد خبزًا متعفّنًا. ماذا تفعل؟"], "o": [["Tu coupes la partie moisie et tu vends le reste", "Tu le laisses, ce n'est qu'un pain", "Tu le jettes en sac fermé et tu nettoies le rayon"], ["تقطع الجزء المتعفّن وتبيع الباقي", "تتركه، إنه مجرد خبز", "ترميه في كيس مغلق وتنظّف الرفّ"]], "a": 2, "w": ["Ses spores voyagent dans l'air et peuvent contaminer tout l'atelier.", "أبواغه تنتقل في الهواء ويمكن أن تلوّث الورشة كلها."]}, {"q": ["Au microscope, un jus altéré montre des cellules ovoïdes avec de petites excroissances. Tu penses à :", "تحت المجهر، عصير فاسد يُظهر خلايا بيضوية عليها بروزات صغيرة. تفكّر في:"], "o": [["des levures qui bourgeonnent", "des bactéries en fission binaire", "des moisissures filamenteuses"], ["خمائر تتبرعم", "بكتيريا في انشطار ثنائي", "عفن خيطي"]], "a": 0, "w": ["Cellules ovoïdes + petite excroissance = bourgeonnement, le mode de la levure.", "خلايا بيضوية + بروز صغير = تبرعم، وهي طريقة الخميرة."]}]}, "4": {"obj": [["Reconnaître les formes des bactéries et légender la cellule bactérienne.", "تتعرّف على أشكال البكتيريا وتسمّي أجزاء الخلية البكتيرية."], ["Expliquer les étapes et les couleurs de la coloration de Gram.", "تشرح مراحل وألوان صبغة غرام (Gram)."], ["Expliquer pourquoi la spore impose l'autoclave.", "تشرح لماذا يفرض البوغ (spore) استعمال الأوتوكلاف."]], "sum": [["Trois formes : coques, bacilles, spiralés.", "ثلاثة أشكال: مكوّرات، عصيات، حلزونية."], ["Constants : paroi, membrane, cytoplasme, chromosome. Facultatifs : capsule, flagelle, pili, spore.", "الثابتة: الجدار، الغشاء، السيتوبلازم، الصبغي. الاختيارية: المحفظة، السوط، الأشعار، البوغ."], ["Gram : violet, lugol, alcool, safranine. Gram + violet, Gram − rose.", "غرام: البنفسجي، اللوغول، الكحول، السافرانين. موجبة غرام بنفسجية، سالبة غرام وردية."], ["Pas de mitochondrie : la membrane produit l'ATP. Division possible toutes les 20 minutes.", "لا ميتوكوندري: الغشاء ينتج ATP. الانقسام ممكن كل 20 دقيقة."], ["La spore survit à 100 °C : il faut l'autoclave pour la détruire.", "البوغ ينجو في 100 درجة: يلزم الأوتوكلاف لتدميره."]], "q3": [{"q": ["Après ta coloration de Gram, même le témoin Gram + est rose. Quelle est la cause probable ?", "بعد صبغة غرام، حتى الشاهد موجب غرام أصبح ورديًا. ما السبب المحتمل؟"], "o": [["Trop peu de violet de gentiane", "L'alcool est resté trop longtemps", "La fuchsine était trop diluée"], ["بنفسجي جنسياني قليل جدًا", "بقي الكحول مدة طويلة جدًا", "الفوكسين كان مخفّفًا جدًا"]], "a": 1, "w": ["L'alcool est l'étape critique : trop long, il décolore aussi les Gram +.", "الكحول هو المرحلة الحرجة: إذا طال، يزيل لون موجبة غرام أيضًا."]}, {"q": ["Pour économiser, un chef veut traiter des conserves de sardines à 100 °C, mais longtemps. Ta réponse ?", "لتوفير المصاريف، يريد رئيس معالجة علب السردين في 100 درجة لكن مدة طويلة. ما جوابك؟"], "o": [["Non : les spores survivent, il faut l'autoclave", "Oui : 100 °C longtemps tue tout", "Oui, si on ajoute du sel"], ["لا: الأبواغ تنجو، يلزم الأوتوكلاف", "نعم: 100 درجة مدة طويلة تقتل كل شيء", "نعم، إذا أضفنا الملح"]], "a": 0, "w": ["Toutes les spores survivent à un chauffage prolongé à 100 °C : il faut dépasser 100 °C.", "كل الأبواغ تنجو من تسخين مطوّل في 100 درجة: يجب تجاوز 100 درجة."]}]}, "5": {"obj": [["Décrire la structure d'un virus et ses quatre caractéristiques.", "تصف بنية الفيروس وخصائصه الأربع."], ["Ordonner les 5 étapes de la multiplication d'un virus.", "ترتّب المراحل الخمس لتكاثر الفيروس."], ["Reconnaître une attaque de bactériophage en laiterie.", "تتعرّف على هجوم العاثية (bactériophage) في معمل الحليب."]], "sum": [["Virus : acellulaire, bien plus petit qu'une bactérie, ADN ou ARN, jamais les deux.", "الفيروس: عديم الخلية، أصغر بكثير من البكتيريا، ADN أو ARN، لا يجمع بينهما أبدًا."], ["Nucléocapside = capside + acide nucléique. Le virus enveloppé est plus sensible aux détergents.", "القفيصة النووية = القفيصة + الحمض النووي. الفيروس المغلّف أكثر حساسية للمنظفات."], ["Cycle : adsorption, pénétration, réplication, assemblage, libération.", "الدورة: الامتزاز، الاختراق، التضاعف، التجميع، التحرر."], ["Le phage attaque les ferments : le lait ne caille pas, la cuve est perdue.", "العاثية تهاجم الخمائر: لا يتخثر الحليب ويضيع الحوض."], ["Le prion : une protéine mal repliée, sans ADN ni ARN.", "البريون: بروتين مطويّ بشكل خاطئ، دون ADN ولا ARN."]], "q3": [{"q": ["Une cuve de lben ne s'acidifie pas. Le levain et la température sont les mêmes qu'hier. Que suspectes-tu ?", "حوض لبن لا يتحمّض. الخميرة الأم والحرارة نفس ما كانت عليه أمس. بماذا تشكّ؟"], "o": [["Une attaque de bactériophages sur les ferments", "Un excès de ferments lactiques", "Des prions dans le lait"], ["هجوم عاثيات على الخمائر", "إفراط في الخمائر اللبنية", "بريونات في الحليب"]], "a": 0, "w": ["Le phage détruit les ferments : l'acidification s'arrête. Il faut changer de souche et désinfecter.", "العاثية تدمّر الخمائر فيتوقف التحمّض. يجب تغيير السلالة والتطهير."]}, {"q": ["En cuisine collective, on nettoie les surfaces au détergent. Quel virus risque de mieux résister ?", "في مطبخ جماعي، ننظّف الأسطح بالمنظّف. أيّ فيروس قد يقاوم أكثر؟"], "o": [["Le virus enveloppé", "Les deux résistent pareil", "Le virus nu"], ["الفيروس المغلّف", "الاثنان يقاومان بنفس الشكل", "الفيروس العاري"]], "a": 2, "w": ["Le détergent attaque l'enveloppe du virus enveloppé. Le virus nu n'en a pas.", "المنظّف يهاجم غلاف الفيروس المغلّف. أما الفيروس العاري فليس له غلاف."]}]}, "6": {"obj": [["Nommer le type trophique d'un micro-organisme avec trois questions.", "تسمية نمط تغذية كائن دقيق بواسطة ثلاثة أسئلة."], ["Citer le rôle de l'azote, du soufre et du phosphore.", "ذكر دور الآزوت والكبريت والفوسفور."], ["Distinguer une souche prototrophe d'une souche auxotrophe.", "التمييز بين سلالة prototrophe وسلالة auxotrophe."]], "sum": [["Trois questions : d'où vient l'énergie, qui donne les électrons, d'où vient le carbone.", "ثلاثة أسئلة: من أين تأتي الطاقة، من يمنح الإلكترونات، من أين يأتي الكربون."], ["Presque tous les germes alimentaires sont chimio-organo-hétérotrophes : ils vivent de ton produit.", "كل الجراثيم الغذائية تقريبًا chimio-organo-hétérotrophes: تعيش من منتوجك."], ["Azote pour les protéines, soufre dans certains acides aminés, phosphore pour l'ATP.", "الآزوت للبروتينات، الكبريت في بعض الأحماض الأمينية، الفوسفور لـ ATP."], ["Un facteur de croissance est une substance que le germe ne sait pas fabriquer.", "عامل النمو مادة لا يستطيع الجرثوم صنعها."], ["Prototrophe : aucun facteur exigé. Auxotrophe : exige un facteur, qu'on nomme toujours.", "Prototrophe: لا يحتاج أي عامل. Auxotrophe: يحتاج عاملًا، ونذكر اسمه دائمًا."]], "q3": [{"q": ["Au labo, une souche isolée d'un jben ne pousse sur milieu minéral + glucose qu'après ajout de thiamine. Tu la décris comment ?", "في المختبر، سلالة معزولة من الجبن لا تنمو على وسط معدني + غلوكوز إلا بعد إضافة الثيامين. كيف تصفها؟"], "o": [["Autotrophe et prototrophe", "Hétérotrophe et prototrophe", "Hétérotrophe et auxotrophe vis-à-vis de la thiamine"], ["ذاتية التغذية و prototrophe", "غيرية التغذية و prototrophe", "غيرية التغذية و auxotrophe تجاه الثيامين"]], "a": 2, "w": ["Elle a besoin de glucose (carbone organique) et de thiamine qu'elle ne fabrique pas.", "تحتاج إلى الغلوكوز (كربون عضوي) وإلى الثيامين الذي لا تصنعه."]}, {"q": ["Tu dois cultiver les bactéries d'un lait de ferme sans savoir lesquelles. Quel milieu prends-tu ?", "عليك زرع بكتيريا حليب ضيعة دون معرفة نوعها. أيّ وسط تختار؟"], "o": [["Un bouillon à l'extrait de viande", "Un milieu minéral avec le CO₂ comme seul carbone", "De l'eau distillée stérile"], ["مرق بمستخلص اللحم", "وسط معدني مع CO₂ كمصدر وحيد للكربون", "ماء مقطّر معقّم"]], "a": 0, "w": ["Les germes du lait sont hétérotrophes ; l'extrait de viande couvre presque tous leurs besoins.", "جراثيم الحليب غيرية التغذية؛ ومستخلص اللحم يغطي تقريبًا كل حاجياتها."]}]}, "7": {"obj": [["Classer un micro-organisme selon la température, le pH et l'oxygène.", "تصنيف كائن دقيق حسب درجة الحرارة وpH والأكسجين."], ["Expliquer pourquoi l'eau libre (Aw) compte plus que l'eau totale.", "شرح لماذا يهم الماء الحر (Aw) أكثر من الماء الكلي."], ["Choisir le levier de l'atelier qui agit sur chaque facteur.", "اختيار رافعة الورشة التي تؤثر على كل عامل."]], "sum": [["Psychrophiles −15 à 20 °C, mésophiles 10 à 40 °C, thermophiles 40 à 80 °C.", "محبّة البرودة من −15 إلى 20، محبّة الاعتدال من 10 إلى 40، محبّة الحرارة من 40 إلى 80 درجة."], ["Le froid ne tue pas : il ralentit. Les psychrophiles continuent au réfrigérateur.", "البرودة لا تقتل: إنها تبطئ. محبّة البرودة تستمر في الثلاجة."], ["Acidifier écarte les bactéries, pas les levures ni les moisissures. pH 4,5 : frontière des conserves.", "التحميض يُبعد البكتيريا، وليس الخمائر ولا العفن. pH 4,5: حدّ المصبّرات."], ["Le vide arrête les aérobies, pas les anaérobies comme Clostridium botulinum.", "التفريغ يوقف الهوائية، وليس اللاهوائية مثل Clostridium botulinum."], ["Sécher, saler, sucrer : on baisse l'Aw. Aucun levier ne suffit seul, on les combine.", "التجفيف، التمليح، التسكير: نخفض Aw. لا رافعة تكفي وحدها، نجمع بينها."]], "q3": [{"q": ["À l'usine de conserve, deux lignes : légumes non acidifiés (pH 6) et légumes acidifiés sous pH 4,5. Laquelle surveilles-tu le plus pour Clostridium botulinum ?", "في مصنع المصبّرات خطّان: خضر غير محمّضة (pH 6) وخضر محمّضة تحت pH 4,5. أيّهما تراقب أكثر بسبب Clostridium botulinum؟"], "o": [["Les légumes acidifiés sous pH 4,5", "Les légumes non acidifiés à pH 6", "Les deux présentent le même risque"], ["الخضر المحمّضة تحت pH 4,5", "الخضر غير المحمّضة في pH 6", "الاثنان لهما نفس الخطر"]], "a": 1, "w": ["Au-dessus de pH 4,5, les bactéries poussent ; au cœur de la boîte, sans air, Clostridium est chez lui.", "فوق pH 4,5 تنمو البكتيريا؛ وفي قلب العلبة، دون هواء، Clostridium في مكانه."]}, {"q": ["Des sardines d'Agadir stockées à 4 °C s'altèrent après quelques jours. Ton chef accuse la chambre froide. Qu'expliques-tu ?", "سردين أكادير المخزّن في 4 درجات يفسد بعد أيام. رئيسك يتّهم غرفة التبريد. ماذا تشرح؟"], "o": [["Des thermophiles ont poussé", "Le froid a tué les bonnes bactéries", "Des psychrophiles continuent de pousser au froid"], ["نمت محبّة الحرارة", "البرودة قتلت البكتيريا النافعة", "محبّة البرودة تستمر في النمو في البرد"]], "a": 2, "w": ["À 4 °C, les mésophiles ralentissent, mais les psychrophiles poussent : le froid a donc une limite.", "في 4 درجات تتباطأ محبّة الاعتدال، لكن محبّة البرودة تنمو: للبرودة إذن حدّ."]}]}, "8": {"obj": [["Citer les trois conditions d'un bon milieu de culture.", "ذكر الشروط الثلاثة لوسط زرع جيد."], ["Choisir entre bouillon et gélose selon le but de l'analyse.", "الاختيار بين المرق والآغار حسب هدف التحليل."], ["Différencier milieu synthétique, empirique, enrichi et sélectif.", "التمييز بين الوسط الاصطناعي والتجريبي والمُغنى والانتقائي."]], "sum": [["Un bon milieu couvre les besoins, est isotonique et a un pH proche de l'optimum.", "الوسط الجيد يغطي الحاجيات، ومتساوي التوتر، وله pH قريب من الأمثل."], ["Bouillon : on voit un trouble. Gélose : on compte des colonies.", "المرق: نرى عكارة. الآغار: نعدّ المستعمرات."], ["Une colonie est un clone : elle vient d'une seule cellule. On compte en UFC.", "المستعمرة نسيلة: تأتي من خلية واحدة. نعدّ بـ UFC."], ["Synthétique : composition exacte. Empirique : extrait de viande, de levure, peptones.", "اصطناعي: تركيب دقيق. تجريبي: مستخلص اللحم، مستخلص الخميرة، الببتونات."], ["Enrichi : on ajoute pour faire pousser. Sélectif : on ajoute pour empêcher.", "المُغنى: نضيف لكي ينمو. الانتقائي: نضيف لكي نمنع."]], "q3": [{"q": ["Le labo te demande combien de bactéries contient un lait cru. Quel type de milieu utilises-tu ?", "يطلب منك المختبر عدد البكتيريا في حليب خام. أيّ نوع من الأوساط تستعمل؟"], "o": [["Un bouillon liquide", "Une gélose (milieu solide)", "Un milieu synthétique pour E. coli"], ["مرق سائل", "آغار (وسط صلب)", "وسط اصطناعي لـ E. coli"]], "a": 1, "w": ["Pour dénombrer, il faut des colonies séparées : seule la gélose le permet.", "للإحصاء نحتاج مستعمرات منفصلة: الآغار وحده يسمح بذلك."]}, {"q": ["Un germe exigeant ne pousse pas sur la gélose de base. Que proposes-tu au technicien ?", "جرثومة متطلبة لا تنمو على الآغار الأساسي. ماذا تقترح على التقني؟"], "o": [["Ajouter un antibiotique au milieu", "Passer à un milieu synthétique", "Ajouter du sang de mouton au milieu"], ["إضافة مضاد حيوي إلى الوسط", "الانتقال إلى وسط اصطناعي", "إضافة دم الغنم إلى الوسط"]], "a": 2, "w": ["Le sang enrichit le milieu en facteurs de croissance : on ajoute pour faire pousser.", "الدم يُغني الوسط بعوامل النمو: نضيف لكي ينمو."]}]}, "9": {"obj": [["Calculer G, µ et la population N après un temps donné.", "حساب G و µ والساكنة N بعد مدة معينة."], ["Tracer et annoter les six phases de la courbe de croissance.", "رسم وتسمية المراحل الست لمنحنى النمو."], ["Réaliser des dilutions et calculer une concentration en UFC/mL.", "إنجاز تخفيفات وحساب تركيز بـ UFC/mL."]], "sum": [["G est le temps pour doubler ; µ = 1/G est la vitesse de division.", "G هو زمن التضاعف؛ و µ = 1/G هي سرعة الانقسام."], ["Loi de croissance : N = N₀ × 2^(µt).", "قانون النمو: N = N₀ × 2^(µt)."], ["Six phases : latence, accélération, exponentielle, ralentissement, stationnaire, déclin.", "ست مراحل: الكمون، التسارع، الأسّية، التباطؤ، الاستقرار، الانحدار."], ["Allonger la latence par le froid ou l'acidité, c'est gagner du temps de conservation.", "إطالة الكمون بالبرودة أو بالحموضة تعني ربح وقت الحفظ."], ["Dénombrement : dilutions au 1/10 dans l'eau physiologique, boîte entre 15 et 300 colonies.", "الإحصاء: تخفيفات بـ 1/10 في الماء الفيزيولوجي، علبة بين 15 و300 مستعمرة."]], "q3": [{"q": ["Au labo, 1 mL ensemencé par boîte : 10⁻² → 350 colonies, 10⁻³ → 42, 10⁻⁴ → 3. Quel résultat notes-tu ?", "في المختبر، 1 مل مزروع في كل علبة: 10⁻² ← 350 مستعمرة، 10⁻³ ← 42، 10⁻⁴ ← 3. أيّ نتيجة تسجّل؟"], "o": [["10⁻² : 3,5 × 10⁴ UFC/mL", "10⁻³ : 4,2 × 10⁴ UFC/mL", "10⁻⁴ : 3 × 10⁴ UFC/mL"], ["10⁻²: 3,5 × 10⁴ UFC/mL", "10⁻³: 4,2 × 10⁴ UFC/mL", "10⁻⁴: 3 × 10⁴ UFC/mL"]], "a": 1, "w": ["Seule la boîte 10⁻³ est entre 15 et 300 : 42 ÷ 1 × 10³ = 4,2 × 10⁴ UFC/mL.", "العلبة 10⁻³ وحدها بين 15 و300: 42 ÷ 1 × 10³ = 4,2 × 10⁴ UFC/mL."]}, {"q": ["À la coopérative, le lait de ferme arrive le matin et sera transformé demain. Quelle décision protège le mieux le lait ?", "في التعاونية، يصل حليب الضيعة صباحًا وسيُحوَّل غدًا. أيّ قرار يحمي الحليب أكثر؟"], "o": [["Le refroidir dès l'arrivée", "Le refroidir en fin de journée", "Le laisser à température ambiante jusqu'à demain"], ["تبريده منذ وصوله", "تبريده في آخر النهار", "تركه في درجة حرارة الغرفة حتى الغد"]], "a": 0, "w": ["Refroidir tôt allonge la latence : les bactéries n'entrent pas vite en phase exponentielle.", "التبريد المبكر يُطيل الكمون: لا تدخل البكتيريا بسرعة في المرحلة الأسّية."]}]}, "10": {"obj": [["Distinguer la flore originelle de la flore de contamination.", "التمييز بين الفلورا الأصلية (flore originelle) وفلورا التلوث (flore de contamination)."], ["Citer les réservoirs (eau, sol, air, homme) et leurs germes typiques.", "ذكر المستودعات (الماء، التربة، الهواء، الإنسان) وجراثيمها المميزة."], ["Remonter d'un germe trouvé en analyse à sa source probable.", "الرجوع من جرثومة وُجدت في التحليل إلى مصدرها المحتمل."]], "sum": [["Un produit porte déjà une flore originelle ; l'atelier ajoute la flore de contamination.", "المنتوج يحمل أصلًا فلورا أصلية؛ والورشة تضيف فلورا التلوث."], ["Eau : Pseudomonas ; si pollution fécale, entérobactéries, entérocoques, Clostridium.", "الماء: Pseudomonas؛ وإذا كان هناك تلوث برازي: بكتيريا معوية، مكورات معوية، Clostridium."], ["Sol : réservoir riche et permanent, avec les sporulés Bacillus et Clostridium.", "التربة: مستودع غني ودائم، فيه المكوّنة للأبواغ Bacillus و Clostridium."], ["Air : aucun nutriment ; les germes y voyagent seulement sur les poussières.", "الهواء: لا مغذيات فيه؛ الجراثيم تسافر فيه فقط عالقة بالغبار."], ["L'homme est un réservoir : Staphylococcus oriente vers le manipulateur.", "الإنسان مستودع: وجود Staphylococcus يوجّهنا نحو العامل الذي يتداول الغذاء."]], "q3": [{"q": ["Dans une usine de conserve de sardines, l'analyse d'un lot trouve Staphylococcus. Où cherches-tu d'abord la source ?", "في مصنع لتصبير السردين، وجد التحليل Staphylococcus في دفعة. أين تبحث أولًا عن المصدر؟"], "o": [["Chez les manipulateurs : mains, bouche, tenue", "Dans le sol de la cour", "Dans l'air extérieur seulement"], ["عند العمال: الأيدي، الفم، اللباس", "في تربة الساحة", "في الهواء الخارجي فقط"]], "a": 0, "w": ["Staphylococcus vit sur la peau et dans les voies respiratoires : il oriente vers le manipulateur.", "يعيش Staphylococcus على الجلد وفي المجاري التنفسية: فهو يوجّه نحو العامل."]}, {"q": ["Dans une salle de conditionnement, on trouve beaucoup de spores de moisissures dans l'air. On y balaie à sec pendant le travail. Que proposes-tu ?", "في قاعة التعبئة، نجد أبواغ عفن كثيرة في الهواء. ويُكنس المكان كنسًا جافًا أثناء العمل. ماذا تقترح؟"], "o": [["Chauffer l'air de la salle", "Ajouter une ventilation sans rien changer au nettoyage", "Nettoyer sans soulever de poussière, hors production"], ["تسخين هواء القاعة", "إضافة تهوية دون تغيير طريقة التنظيف", "التنظيف دون رفع الغبار، خارج أوقات الإنتاج"]], "a": 2, "w": ["Les germes de l'air voyagent sur les poussières : moins de poussière, moins de germes.", "جراثيم الهواء تسافر عالقة بالغبار: غبار أقل يعني جراثيم أقل."]}]}, "11": {"obj": [["Différencier commensalisme, symbiose, parasitisme et saprophytisme.", "التفريق بين التعايش والتكافل والتطفل والترمّم."], ["Distinguer infection, toxi-infection, intoxination et intoxication.", "التمييز بين العدوى (infection) والتسمم العدوائي (toxi-infection) والتسمم الذيفاني (intoxination) والتسمم (intoxication)."], ["Associer chaque pathogène majeur à ses aliments à risque.", "ربط كل ممرض رئيسي بالأغذية الخطرة المرتبطة به."]], "sum": [["Commensalisme + / 0, symbiose + / +, parasitisme − / +, saprophytisme 0 / 0.", "التعايش + / 0، التكافل + / +، التطفل − / +، الترمّم 0 / 0."], ["Intoxination : la toxine seule rend malade, même sans bactérie vivante.", "التسمم الذيفاني: السمّ وحده يُمرض، حتى دون بكتيريا حية."], ["Salmonella : œufs, viande, lait crus. E. coli ECEH : viande hachée peu cuite.", "السالمونيلا: بيض، لحم، حليب نيء. E. coli ECEH: لحم مفروم قليل الطهي."], ["Campylobacter : volaille, lait cru. Listeria : se multiplie encore à 4 °C.", "كامبيلوباكتر: الدواجن، الحليب النيء. الليستيريا: تتكاثر حتى في 4 درجات."], ["Porteur sain : pas malade mais contaminant. Examens positifs = retrait du poste.", "الحامل السليم: غير مريض لكنه ملوِّث. فحوص إيجابية = إبعاد عن المنصب."]], "q3": [{"q": ["À la cantine, un ouvrier sans symptôme parle au-dessus des plats de salade, sans masque. Que fais-tu ?", "في المطعم الجماعي، عامل بلا أعراض يتكلم فوق أطباق السلطة دون قناع. ماذا تفعل؟"], "o": [["Rien, il n'est pas malade", "Je lui donne seulement des gants", "Je lui fais porter un masque : il peut être porteur sain"], ["لا شيء، فهو ليس مريضًا", "أعطيه القفازات فقط", "أجعله يضع القناع: قد يكون حاملًا سليمًا للجراثيم"]], "a": 2, "w": ["La bouche et les voies respiratoires sont des réservoirs, même chez une personne qui se sent bien.", "الفم والمجاري التنفسية مستودعات للجراثيم، حتى عند شخص يشعر أنه بخير."]}, {"q": ["Une femme enceinte veut acheter un fromage à pâte molle au lait cru, gardé au frigo. Que lui conseilles-tu ?", "امرأة حامل تريد شراء جبن طري من حليب نيء محفوظ في الثلاجة. بماذا تنصحها؟"], "o": [["Oui, le froid bloque tous les germes", "Non, Listeria se multiplie même à 4 °C", "Oui, Listeria ne touche que la viande"], ["نعم، البرد يوقف كل الجراثيم", "لا، الليستيريا تتكاثر حتى في 4 درجات", "نعم، الليستيريا لا تخص إلا اللحم"]], "a": 1, "w": ["Listeria est psychrophile et dangereuse pendant la grossesse ; le fromage à pâte molle au lait cru est un aliment typique.", "الليستيريا محبّة للبرودة وخطيرة أثناء الحمل؛ والجبن الطري من حليب نيء غذاء نموذجي لها."]}]}, "12": {"obj": [["Distinguer phycotoxines et mycotoxines, leurs producteurs et leurs aliments.", "التمييز بين السموم الطحلبية والسموم الفطرية، ومن ينتجها، وفي أي أغذية نجدها."], ["Expliquer pourquoi la cuisson ne détruit pas toujours une toxine.", "شرح لماذا لا يدمّر الطهي السمّ دائمًا."], ["Reconnaître les altérations et les micro-organismes utiles de transformation.", "التعرف على أنواع الإفساد وعلى الكائنات الدقيقة المفيدة في التحويل."]], "sum": [["Phycotoxines : produites par des algues, concentrées par les coquillages ; PSP agit en 5 à 30 minutes.", "السموم الطحلبية: تنتجها الطحالب ويركّزها المحار؛ التسمم PSP يظهر خلال 5 إلى 30 دقيقة."], ["Mycotoxines : moisissures sur céréales, fruits secs, épices ; gratter la moisissure ne suffit pas.", "السموم الفطرية: أعفان على الحبوب والفواكه الجافة والتوابل؛ كشط العفن لا يكفي."], ["Beaucoup de toxines sont thermostables : seule la prévention au stockage marche.", "كثير من السموم مقاومة للحرارة: الوقاية في التخزين وحدها تنجح."], ["Altération : couleur, texture, odeur ; l'odeur apparaît vers 10⁶ à 10⁷ germes/g.", "الإفساد: اللون، القوام، الرائحة؛ تظهر الرائحة عند حوالي 10⁶ إلى 10⁷ جرثومة/غ."], ["Utiles : yaourt (S. thermophilus + L. bulgaricus) ; pain, vin, bière (Saccharomyces cerevisiae).", "المفيدة: الياغورت (S. thermophilus + L. bulgaricus)؛ الخبز والنبيذ والجعة (Saccharomyces cerevisiae)."]], "q3": [{"q": ["Dans l'entrepôt d'une coopérative, un sac de paprika montre des taches de moisissure. Que fais-tu ?", "في مخزن تعاونية، يظهر على كيس من الفلفل الأحمر المطحون (paprika) بقع عفن. ماذا تفعل؟"], "o": [["Je tamise le paprika et je le vends", "Je le chauffe fort pour détruire la toxine", "J'écarte le lot et j'améliore la ventilation du stock"], ["أغربل الفلفل وأبيعه", "أسخّنه بقوة لتدمير السمّ", "أستبعد الدفعة وأحسّن تهوية المخزن"]], "a": 2, "w": ["La mycotoxine est invisible, diffuse et souvent thermostable : on écarte le lot et on agit sur le stockage.", "السمّ الفطري غير مرئي ومنتشر وغالبًا مقاوم للحرارة: نستبعد الدفعة ونعمل على ظروف التخزين."]}, {"q": ["De la viande hachée est restée hors froid au souk toute la matinée. Elle ne sent rien. Un collègue dit qu'elle est sûre. Qu'en penses-tu ?", "بقي لحم مفروم خارج البرد في السوق طوال الصباح. لا رائحة له. زميل يقول إنه سليم. ما رأيك؟"], "o": [["Faux : l'odeur n'apparaît que vers 10⁶ à 10⁷ germes/g", "Vrai : pas d'odeur, donc peu de germes", "Vrai, à condition de bien le cuire"], ["خطأ: الرائحة لا تظهر إلا عند حوالي 10⁶ إلى 10⁷ جرثومة/غ", "صحيح: لا رائحة، إذن جراثيم قليلة", "صحيح، بشرط طهيه جيدًا"]], "a": 0, "w": ["Le nez est un capteur tardif. Le temps hors froid a laissé les germes se multiplier.", "الأنف مستشعر متأخر. الوقت خارج البرد ترك الجراثيم تتكاثر."]}]}, "13": {"obj": [["Distinguer maîtrise du développement et maîtrise de la contamination.", "تميّز بين التحكم في النمو (développement) والتحكم في التلوث (contamination)."], ["Comparer réfrigération, congélation, pasteurisation, stérilisation et UHT.", "تقارن بين التبريد والتجميد والبسترة والتعقيم وUHT."], ["Choisir le barème le plus doux qui assure la sécurité du produit.", "تختار أخفّ معيار حراري (barème) يضمن سلامة المنتوج."]], "sum": [["Deux façons d'agir : sur le germe présent, ou sur son arrivée.", "طريقتان للتدخل: على الجرثومة الموجودة، أو على وصولها."], ["Le froid ralentit sans tuer ; son effet est réversible.", "البرودة تُبطئ ولا تقتل؛ أثرها قابل للرجوع."], ["Les ruptures de la chaîne du froid s'additionnent.", "انقطاعات سلسلة التبريد تتراكم وتُجمع."], ["Pasteurisation 60–100 °C ; stérilisation > 100 °C ; UHT 135–150 °C pendant 1–5 s.", "البسترة 60–100 درجة؛ التعقيم أكثر من 100 درجة؛ UHT من 135 إلى 150 درجة لمدة 1–5 ثوانٍ."], ["La spore survit à l'ébullition : un produit pasteurisé se garde au froid.", "البوغ (spore) يقاوم الغليان: المنتوج المبستر يُحفظ في البرودة."]], "q3": [{"q": ["Dans une laiterie, un lot de lait pasteurisé reste une nuit à température ambiante. Que fais-tu ?", "في مصنع للحليب، بقيت دفعة من الحليب المبستر ليلة كاملة في حرارة الغرفة. ماذا تفعل؟"], "o": [["Tu écartes le lot : les germes survivants ont pu se multiplier.", "Tu le remets au froid : le froid va tout annuler.", "Tu le vends vite : pasteurisé veut dire stérile."], ["تُبعد الدفعة: الجراثيم الناجية ربما تكاثرت.", "تُعيده إلى البرودة: البرودة ستمحو كل شيء.", "تبيعه بسرعة: المبستر يعني معقّم."]], "a": 0, "w": ["Le pasteurisé n'est pas stérile, et le froid ne remet pas le compteur à zéro.", "المبستر ليس معقّمًا، والبرودة لا تُعيد العدّاد إلى الصفر."]}, {"q": ["Ta coopérative veut vendre un lait qui se garde plusieurs mois dans les épiceries sans frigo. Quel traitement ?", "تريد تعاونيتك بيع حليب يُحفظ عدة أشهر عند البقالين بدون ثلاجة. أيّ معالجة تختار؟"], "o": [["Une pasteurisation à 70 °C.", "Une réfrigération à 4 °C.", "Un traitement UHT avec conditionnement aseptique."], ["بسترة في 70 درجة.", "تبريد في 4 درجات.", "معالجة UHT مع تعبئة معقّمة (aseptique)."]], "a": 2, "w": ["Parmi ces choix, seul l'UHT détruit tout et permet des mois à température ambiante.", "من بين هذه الخيارات، وحده UHT يدمّر كل شيء ويسمح بالحفظ أشهرًا في حرارة الغرفة."]}]}, "14": {"obj": [["Expliquer comment le sel, le sucre et le séchage abaissent l'Aw.", "تشرح كيف يخفض الملح والسكر والتجفيف نشاط الماء (Aw)."], ["Citer le rôle des conservateurs, de la fermentation, du fumage et des atmosphères modifiées.", "تذكر دور المواد الحافظة والتخمّر والتدخين والأجواء المعدّلة."], ["Identifier les barrières multiples d'un produit courant.", "تحدد الحواجز المتعددة في منتوج شائع."]], "sum": [["Le sel et le sucre n'enlèvent pas l'eau : ils l'occupent.", "الملح والسكر لا يزيلان الماء: بل يشغلانه."], ["Aw > 0,95 : tout pousse ; Aw < 0,60 : plus aucune croissance.", "Aw أكبر من 0,95: كل شيء ينمو؛ Aw أقل من 0,60: لا نمو إطلاقًا."], ["Un conservateur s'utilise à faible dose, porte un numéro E et ne remplace pas un procédé.", "المادة الحافظة تُستعمل بجرعة ضعيفة، تحمل رقم E، ولا تعوّض طريقة الحفظ."], ["Sans oxygène, les anaérobies profitent : l'atmosphère modifiée va toujours avec le froid.", "بدون أكسجين، تستفيد اللاهوائيات: الجو المعدّل يُرافَق دائمًا بالبرودة."], ["Plusieurs obstacles doux valent mieux qu'un seul obstacle forcé.", "عدة حواجز معتدلة أفضل من حاجز واحد قوي."]], "q3": [{"q": ["Une confiture maison de figues montre une tache de moisissure en surface. D'où vient-elle le plus probablement ?", "ظهرت بقعة عفن على سطح مربّى تين منزلي. من أين أتت على الأرجح؟"], "o": [["Des bactéries du pot, qui résistent au sucre.", "De l'air, au moment de l'ouverture ou du remplissage.", "Du sucre, qui contient des moisissures."], ["من بكتيريا الإناء التي تقاوم السكر.", "من الهواء، عند الفتح أو الملء.", "من السكر الذي يحتوي على العفن."]], "a": 1, "w": ["Aucune bactérie ne pousse dans la confiture ; la moisissure de surface arrive par l'air.", "لا تنمو أي بكتيريا في المربّى؛ عفن السطح يأتي من الهواء."]}, {"q": ["Ton atelier emballe de la viande sous vide. Un collègue propose de la stocker à température ambiante. Ta réponse ?", "مشغلك يعبّئ اللحم تحت الفراغ. زميل يقترح تخزينه في حرارة الغرفة. ما جوابك؟"], "o": [["Non : sans oxygène, les anaérobies comme C. botulinum peuvent se développer ; il faut le froid.", "Oui : sans air, aucun germe ne peut pousser.", "Oui, à condition d'ajouter plus de sel."], ["لا: بدون أكسجين قد تنمو اللاهوائيات مثل C. botulinum؛ يجب التبريد.", "نعم: بدون هواء لا يمكن لأي جرثومة أن تنمو.", "نعم، بشرط إضافة ملح أكثر."]], "a": 0, "w": ["Le sous-vide favorise les anaérobies : il se combine toujours avec le froid.", "التعبئة تحت الفراغ تساعد اللاهوائيات: تُرافَق دائمًا بالبرودة."]}]}, "15": {"obj": [["Classer un danger en physique, chimique ou biologique.", "تصنّف الخطر إلى فيزيائي أو كيميائي أو بيولوجي."], ["Utiliser les 5 M pour chercher les causes d'une contamination.", "تستعمل طريقة 5 M للبحث عن أسباب التلوث."], ["Appliquer les règles de réception, de stockage, de marche en avant et d'hygiène du personnel.", "تطبّق قواعد الاستلام والتخزين والسير إلى الأمام ونظافة المستخدمين."]], "sum": [["Trois familles de dangers : physique, chimique, biologique.", "ثلاث عائلات من الأخطار: فيزيائية، كيميائية، بيولوجية."], ["Les 5 M : Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "الـ 5 M: المواد، المعدات، الوسط، الطرق، اليد العاملة."], ["À la réception, on peut refuser ; après, le problème est dans l'usine.", "عند الاستلام يمكن الرفض؛ بعده تصبح المشكلة داخل المصنع."], ["Marche en avant : du sale vers le propre, sans retour ni croisement.", "السير إلى الأمام: من المتّسخ إلى النظيف، دون رجوع ولا تقاطع."], ["AMER : Apports, Multiplication, Élimination, Recontamination. Les gants ne remplacent pas le lavage des mains.", "AMER: الإدخال، التكاثر، الإزالة، إعادة التلوث. القفازات لا تعوّض غسل اليدين."]], "q3": [{"q": ["Des jben ont un goût de javel. Avec les 5 M, dans quelle famille cherches-tu d'abord la cause ?", "قطع من الجبن لها طعم ماء جافيل. باستعمال الـ 5 M، في أيّ عائلة تبحث أولًا عن السبب؟"], "o": [["Main-d'œuvre : la tenue du personnel.", "Milieu : la présence de nuisibles.", "Méthodes : un rinçage oublié après la désinfection."], ["اليد العاملة: لباس المستخدمين.", "الوسط: وجود الحيوانات المؤذية.", "الطرق: شطف منسيّ بعد التطهير."]], "a": 2, "w": ["Un goût de désinfectant signale un résidu chimique : la méthode de nettoyage est en cause.", "طعم المطهّر يدل على بقايا كيميائية: طريقة التنظيف هي المعنية."]}, {"q": ["Dans une petite cuisine de traiteur, légumes terreux et plats cuits passent par la même table. Que fais-tu ?", "في مطبخ ممون صغير، تمرّ الخضر المتربة والأطباق المطبوخة على نفس الطاولة. ماذا تفعل؟"], "o": [["Tu les travailles en même temps pour gagner du temps.", "Tu sépares dans le temps : le propre d'abord, nettoyage, puis le sale.", "Tu ajoutes du sel dans les plats cuits."], ["تشتغل عليهما في نفس الوقت لربح الوقت.", "تفصل بينهما زمنيًا: النظيف أولًا، ثم التنظيف، ثم المتّسخ.", "تضيف الملح إلى الأطباق المطبوخة."]], "a": 1, "w": ["Si le local est trop petit, on sépare dans le temps, avec un nettoyage entre les deux.", "إذا كان المكان ضيقًا، نفصل زمنيًا مع تنظيف بين المرحلتين."]}]}, "16": {"obj": [["Distinguer nettoyage et désinfection, et les trois propretés.", "تميّز بين التنظيف (nettoyage) والتطهير (désinfection)، وبين أنواع النظافة الثلاثة."], ["Choisir le détergent selon la souillure et régler les paramètres TACT.", "تختار المنظّف حسب نوع الوسخ وتضبط عوامل TACT."], ["Appliquer le protocole de N&D en 7 étapes et en contrôler l'efficacité.", "تطبّق بروتوكول التنظيف والتطهير في 7 مراحل وتراقب فعاليته."]], "sum": [["Toujours nettoyer avant de désinfecter : la souillure neutralise le désinfectant.", "نظّف دائمًا قبل التطهير: الوسخ يُبطل مفعول المطهّر."], ["Organique → alcalin ; minéral → acide ; germes → désinfectant.", "عضوي ← منظّف قاعدي؛ معدني ← منظّف حمضي؛ جراثيم ← مطهّر."], ["TACT : Température, Action mécanique, Concentration, Temps ; ils se compensent.", "TACT: الحرارة، الفعل الميكانيكي، التركيز، الزمن؛ وهي تعوّض بعضها."], ["Ne jamais mélanger détergent et désinfectant ; toujours finir par un rinçage à l'eau potable.", "لا تخلط أبدًا منظّفًا ومطهّرًا؛ واختم دائمًا بشطف بالماء الصالح للشرب."], ["Ce qui n'est pas écrit n'a pas été fait.", "ما لم يُكتب لم يُنجَز."]], "q3": [{"q": ["Sur l'échangeur d'une laiterie, tu vois un dépôt blanc et dur de calcaire. Quel produit choisis-tu ?", "على مبادل حراري في مصنع حليب، ترى رواسب كلسية بيضاء وصلبة. أيّ منتوج تختار؟"], "o": [["Un détergent acide.", "Un détergent alcalin (soude).", "Un désinfectant chloré seul."], ["منظّف حمضي.", "منظّف قاعدي (الصودا).", "مطهّر كلوري وحده."]], "a": 0, "w": ["Le calcaire est une souillure minérale : c'est le détergent acide qui l'élimine.", "الكلس وسخ معدني: المنظّف الحمضي هو الذي يزيله."]}, {"q": ["Juste après le nettoyage d'une trancheuse, tu dois savoir tout de suite si elle est propre. Quel contrôle ?", "مباشرة بعد تنظيف آلة التقطيع، يجب أن تعرف فورًا هل هي نظيفة. أيّ مراقبة تختار؟"], "o": [["Une empreinte sur gélose.", "Aucun contrôle : elle brille.", "Une ATP-métrie."], ["بصمة على الهلام (gélose).", "لا مراقبة: إنها تلمع.", "قياس ATP (ATP-métrie)."]], "a": 2, "w": ["L'ATP-métrie répond en quelques secondes : tu peux re-nettoyer tout de suite si besoin.", "قياس ATP يعطي النتيجة في ثوانٍ: يمكنك إعادة التنظيف فورًا عند الحاجة."]}]}}, "card": {"s01_08": {"lvl": 1, "ex": ["À la coopérative laitière, on analyse le lait de ferme avant de l'accepter. Le même lait devient ensuite lben grâce aux ferments.", "في التعاونية الحليبية، نحلّل حليب الضيعة قبل قبوله. ثم يصبح نفس الحليب لبنًا بفضل الخمائر (ferments)."]}, "s01_10": {"lvl": 2, "trap": ["« Du matériel bien lavé suffit. » Faux : il doit être stérile, sinon tu comptes les germes du matériel.", "«أدوات مغسولة جيدًا تكفي». خطأ: يجب أن تكون معقّمة، وإلا ستحسب جراثيم الأدوات."]}, "s01_17": {"lvl": 1, "trap": ["« Pasteur a prouvé le premier le lien maladie-microbe. » Non : c'est Koch, en 1876.", "«باستور أول من أثبت العلاقة بين المرض والميكروب». لا: إنه كوخ (Koch) سنة 1876."], "ex": ["Dans un atelier de découpe de la viande de l'Aïd, le lavage des mains reste la règle de Semmelweis.", "في ورشة تقطيع لحم العيد، يبقى غسل اليدين قاعدة سيملفايس (Semmelweis)."]}, "s01_21": {"lvl": 2, "trap": ["« Après le nettoyage, l'atelier est stérile. » Faux : l'hygiène réduit les microbes, elle ne les supprime pas.", "«بعد التنظيف تصبح الورشة معقّمة». خطأ: النظافة تُقلّص الميكروبات ولا تُلغيها."], "ex": ["Le khlii se garde longtemps : la viande est séchée, on lui retire l'eau.", "الخليع يُحفظ مدة طويلة: اللحم مجفّف، أي نزعنا منه الماء."], "cmp": ["C'est comme un feu : enlève le bois ou l'air, et il s'éteint.", "إنها مثل النار: انزع الحطب أو الهواء فتنطفئ."]}, "s01_24": {"lvl": 2, "trap": ["« Il a l'air normal, donc il est sûr. » Faux : les pathogènes ne laissent souvent aucun signe visible.", "«مظهره عادي، إذن هو آمن». خطأ: الممرضات (pathogènes) غالبًا لا تترك أي علامة ظاهرة."], "ex": ["Le raïb et le jben sont faits par des utiles. Le pain qui moisit est gâté par des nuisibles.", "الرايب والجبن البلدي تصنعهما كائنات نافعة. والخبز الذي يتعفّن تفسده كائنات ضارّة."]}, "s02_10": {"lvl": 1, "cmp": ["Le virus est un passager sans voiture : il lui faut une cellule hôte pour avancer.", "الفيروس راكب بلا سيارة: يحتاج إلى خلية مضيفة (cellule hôte) ليتقدّم."]}, "s02_12": {"lvl": 1, "ex": ["Les bactéries lactiques qui font le lben sont des procaryotes.", "البكتيريا اللبنية التي تصنع اللبن من بدائيات النواة (procaryotes)."]}, "s02_14": {"lvl": 1, "ex": ["La levure du pain du four et la moisissure d'un jben oublié sont des eucaryotes.", "خميرة خبز الفرّان والعفن على جبن بلدي منسي من حقيقيات النواة (eucaryotes)."]}, "s02_16": {"lvl": 1, "trap": ["« Le prion est un tout petit virus. » Non : c'est une protéine seule, sans ADN ni ARN.", "«البريون فيروس صغير جدًا». لا: إنه بروتين وحده، دون ADN ولا ARN."], "ex": ["À la coopérative laitière, un bactériophage peut détruire les ferments du levain.", "في التعاونية الحليبية، يمكن لعاثية (bactériophage) أن تدمّر خمائر الخميرة الأم (levain)."]}, "s02_21": {"lvl": 1, "cmp": ["Noyau = bureau du directeur ; mitochondrie = centrale électrique ; Golgi = service expédition ; vacuole = entrepôt.", "النواة = مكتب المدير؛ الميتوكوندري = محطة الكهرباء؛ غولجي = مصلحة الإرسال؛ الفجوة = المخزن."]}, "s02_23": {"lvl": 1, "trap": ["« La membrane donne sa forme à la cellule. » Non : c'est la paroi. La membrane gère les échanges.", "«الغشاء يعطي الخلية شكلها». لا: إنه الجدار (paroi). الغشاء يدير التبادل."]}, "s02_25": {"lvl": 1}, "s02_29": {"lvl": 1, "ex": ["Dans l'eau verte d'un bassin d'irrigation, les algues ont des chloroplastes ; un protozoaire n'en a pas.", "في الماء الأخضر لصهريج السقي، للطحالب صانعات اليخضور (chloroplastes)؛ أما الأوالي فلا."]}, "s03_17": {"lvl": 2, "ex": ["La moisissure sur un jben oublié se nourrit du fromage lui-même.", "العفن على جبن بلدي منسي يتغذّى من الجبن نفسه."]}, "s03_21": {"lvl": 1, "ex": ["Sur un pain du four oublié dans un sac, les taches visibles sont le mycélium.", "على خبز الفرّان المنسي في كيس، البقع الظاهرة هي الغزل الفطري (mycélium)."], "cmp": ["Une hyphe est un fil ; le mycélium est la pelote de laine emmêlée.", "الخيط الفطري (hyphe) خيط واحد؛ والغزل الفطري كُبّة صوف متشابكة."]}, "s03_23": {"lvl": 2, "cmp": ["Cloisonné = un train avec des wagons ; non cloisonné = un long tuyau sans séparation.", "مقسّم = قطار بعربات؛ غير مقسّم = أنبوب طويل بلا فواصل."]}, "s03_25": {"lvl": 1, "trap": ["« Le sucre empêche toute moisissure. » Faux : Aspergillus glaucum pousse sur les confitures.", "«السكر يمنع كل عفن». خطأ: Aspergillus glaucum ينمو على المربى."], "ex": ["Un pot de confiture de figues ouvert peut moisir en surface malgré le sucre.", "برطمان مربى التين المفتوح قد يتعفّن على سطحه رغم السكر."]}, "s03_29": {"lvl": 1, "trap": ["« Toutes les levures sont utiles. » Non : Candida est pathogène et cause des mycoses.", "«كل الخمائر نافعة». لا: Candida ممرضة وتسبب فطريات جلدية."], "ex": ["La pâte du msemen et du pain du four lève grâce à Saccharomyces.", "عجين المسمّن وخبز الفرّان ينتفخ بفضل Saccharomyces."]}, "s03_31": {"lvl": 2, "ex": ["Un jus d'orange frais vendu au souk mousse en bouteille : des levures fermentent son sucre.", "عصير برتقال طازج يُباع في السوق يُزبد في القنينة: خمائر تخمّر سكّره."]}, "s03_33": {"lvl": 2, "ex": ["Un pain moisi laissé en réserve envoie ses spores dans l'air de toute la boulangerie.", "خبز متعفّن متروك في المخزن يطلق أبواغه في هواء المخبزة كلها."], "cmp": ["Les spores sont comme les graines de pissenlit : le vent les emporte loin.", "الأبواغ مثل بذور الهندباء البرية: تحملها الريح بعيدًا."]}, "s03_35": {"lvl": 1}, "s03_37": {"lvl": 1}, "s04_09": {"lvl": 1, "cmp": ["Coque = une bille ; bacille = un bâtonnet ; spiralé = un tire-bouchon.", "المكوّرة = كُرية؛ العصية = عُصيّة؛ الحلزونية = مفتاح فلّين لولبي."]}, "s04_11": {"lvl": 1, "cmp": ["Constants = le moteur et la carrosserie d'une voiture ; facultatifs = les options.", "الثابتة = محرّك السيارة وهيكلها؛ الاختيارية = التجهيزات الإضافية."]}, "s04_13": {"lvl": 1, "cmp": ["Gram + : un mur épais sans manteau. Gram − : un mur fin avec un manteau gras.", "موجبة غرام: جدار سميك بلا معطف. سالبة غرام: جدار رقيق مع معطف دهني."]}, "s04_17": {"lvl": 2, "trap": ["« Plus on laisse l'alcool, mieux c'est. » Faux : trop long, toutes les bactéries deviennent roses.", "«كلما طال الكحول كان أفضل». خطأ: إذا طال، تصبح كل البكتيريا وردية."], "ex": ["Au laboratoire d'une usine de conserve, le Gram est souvent la première étape d'identification.", "في مختبر مصنع التصبير، صبغة غرام غالبًا أول مرحلة في التعرّف."]}, "s04_19": {"lvl": 2, "trap": ["« La Gram − est rose dès l'alcool. » Non : elle est incolore, puis rose après la fuchsine.", "«سالبة غرام وردية منذ الكحول». لا: تكون عديمة اللون، ثم وردية بعد الفوكسين."]}, "s04_21": {"lvl": 2}, "s04_23": {"lvl": 1, "ex": ["Viande de l'Aïd laissée au chaud : en 1 heure, 3 divisions, 1 bactérie devient 8. Mets-la vite au froid.", "لحم العيد المتروك في الحرارة: في ساعة واحدة 3 انقسامات، بكتيريا واحدة تصبح 8. ضعه بسرعة في البرودة."]}, "s04_27": {"lvl": 2, "ex": ["Dans une coopérative laitière, un biofilm dans un tuyau résiste au détergent grâce à la capsule.", "في تعاونية حليبية، غشاء حيوي (biofilm) داخل أنبوب يقاوم المنظّف بفضل المحفظة (capsule)."], "cmp": ["La capsule est un imperméable collant ; le flagelle est une hélice.", "المحفظة معطف مطري لاصق؛ والسوط مروحة دافعة."]}, "s04_29": {"lvl": 1}, "s04_31": {"lvl": 2, "trap": ["« Faire bouillir détruit tous les microbes. » Faux : les spores survivent à 100 °C.", "«الغليان يقتل كل الميكروبات». خطأ: الأبواغ تنجو في 100 درجة."], "ex": ["À l'usine de conserve de sardines d'Agadir, les boîtes passent à l'autoclave, au-dessus de 100 °C.", "في مصنع تصبير السردين بأكادير، تمرّ العلب في الأوتوكلاف فوق 100 درجة."], "cmp": ["La spore, c'est la bactérie en armure : elle attend que le danger passe.", "البوغ هو البكتيريا وهي تلبس درعًا: تنتظر حتى يمرّ الخطر."]}, "s04_35": {"lvl": 1}, "s05_07": {"lvl": 1, "trap": ["« Je peux voir un virus au microscope du labo. » Non : il faut un microscope électronique.", "«يمكنني رؤية الفيروس بمجهر المختبر». لا: يلزم المجهر الإلكتروني (microscope électronique)."]}, "s05_09": {"lvl": 1, "trap": ["« Un virus contient de l'ADN et de l'ARN. » Faux : c'est l'un ou l'autre, jamais les deux.", "«الفيروس يحتوي على ADN و ARN». خطأ: إما هذا أو ذاك، لا يجمع بينهما أبدًا."]}, "s05_11": {"lvl": 1, "cmp": ["Acide nucléique = la lettre ; capside = l'enveloppe ; nucléocapside = la lettre dans son enveloppe.", "الحمض النووي = الرسالة؛ القفيصة = الظرف؛ القفيصة النووية = الرسالة داخل ظرفها."]}, "s05_13": {"lvl": 2, "cmp": ["L'enveloppe est un manteau gras : le détergent le dissout, comme le savon enlève la graisse.", "الغلاف معطف دهني: المنظّف يذيبه، كما يزيل الصابون الدهون."]}, "s05_15": {"lvl": 1, "trap": ["« Un virus se multiplie dans un plat laissé au chaud. » Non : il ne se multiplie que dans une cellule hôte.", "«الفيروس يتكاثر في طبق متروك في الحرارة». لا: لا يتكاثر إلا داخل خلية مضيفة."], "cmp": ["Le virus est un pirate : il prend l'usine de la cellule pour fabriquer ses copies.", "الفيروس قرصان: يستولي على مصنع الخلية ليصنع نسخه."]}, "s05_17": {"lvl": 1, "trap": ["« Le bactériophage peut rendre l'homme malade. » Non : son seul hôte est une bactérie.", "«العاثية يمكن أن تُمرض الإنسان». لا: مضيفها الوحيد بكتيريا."], "cmp": ["Le phage est une seringue : les fibres se posent, la queue injecte l'ADN.", "العاثية حقنة: الألياف تلتصق، والذيل يحقن ADN."]}, "s05_19": {"lvl": 2, "ex": ["À la coopérative laitière, une cuve de raïb reste liquide le lendemain : on soupçonne un phage.", "في التعاونية الحليبية، حوض رايب يبقى سائلًا في الغد: نشكّ في عاثية."]}, "s05_21": {"lvl": 1}, "s05_23": {"lvl": 2}, "s06_09": {"lvl": 1, "ex": ["Du lait de ferme laissé au souk nourrit ses bactéries : elles tirent leur énergie du lait lui-même.", "حليب ضيعة متروك في السوق يغذي بكتيرياه: تستمد طاقتها من الحليب نفسه."]}, "s06_11": {"lvl": 1, "cmp": ["Lis le nom comme une adresse : chaque morceau donne une information précise.", "اقرأ الاسم كعنوان: كل جزء يعطي معلومة محددة."]}, "s06_13": {"lvl": 2, "trap": ["Erreur : « autotrophe » et « auxotrophe », c'est pareil. Non : auto = carbone du CO₂ ; auxo = besoin d'un facteur de croissance.", "خطأ: «autotrophe» و«auxotrophe» نفس الشيء. لا: auto = كربون من CO₂؛ auxo = حاجة إلى عامل نمو."], "ex": ["Le sucre du jus d'orange ou le lactose du lait : c'est le carbone organique des hétérotrophes.", "سكر عصير البرتقال أو لاكتوز الحليب: هذا هو الكربون العضوي للكائنات غيرية التغذية."]}, "s06_15": {"lvl": 1, "cmp": ["Le nom trophique, c'est comme un nom complet : prénom, nom du père, nom de famille.", "الاسم التغذوي مثل الاسم الكامل: الاسم الشخصي، اسم الأب، اسم العائلة."]}, "s06_19": {"lvl": 1, "ex": ["La viande et le lait sont riches en protéines : ils apportent beaucoup d'azote aux bactéries.", "اللحم والحليب غنيان بالبروتينات: يوفّران كثيرًا من الآزوت للبكتيريا."]}, "s06_21": {"lvl": 2, "cmp": ["Donner de l'extrait de viande à une bactérie, c'est lui donner des briques identiques aux siennes.", "إعطاء مستخلص اللحم للبكتيريا يعني إعطاءها لبنات مماثلة للبناتها."]}, "s06_25": {"lvl": 2, "trap": ["Erreur : dire seulement « auxotrophe ». Il faut préciser la substance : « auxotrophe vis-à-vis de la thiamine ».", "خطأ: قول «auxotrophe» فقط. يجب تحديد المادة: «auxotrophe تجاه الثيامين»."], "cmp": ["Un auxotrophe, c'est un apprenti qui a besoin d'un outil qu'il ne sait pas fabriquer.", "الـ auxotrophe متعلّم يحتاج أداة لا يعرف صنعها."]}, "s06_27": {"lvl": 1, "ex": ["Les lactobacilles du lben et du raïb sont souvent exigeants : ils demandent des facteurs de croissance.", "العصيات اللبنية (lactobacilles) في اللبن والرايب غالبًا متطلبة: تحتاج عوامل نمو."]}, "s07_03": {"lvl": 2, "trap": ["Erreur : « beaucoup d'eau = beaucoup de microbes ». Ce qui compte, c'est l'eau libre, pas l'eau totale.", "خطأ: «ماء كثير = ميكروبات كثيرة». المهم هو الماء الحر، وليس الماء الكلي."], "ex": ["La confiture de figues ou d'abricots d'une coopérative tient des mois grâce au sucre.", "مربى التين أو المشمش في تعاونية يدوم شهورًا بفضل السكر."]}, "s07_09": {"lvl": 2, "trap": ["Erreur : « au réfrigérateur, les microbes meurent ». Non : le froid ralentit, il ne tue pas.", "خطأ: «في الثلاجة تموت الميكروبات». لا: البرودة تبطئ، ولا تقتل."], "ex": ["Les sardines d'Agadir en chambre froide s'altèrent quand même après quelques jours : ce sont les psychrophiles.", "سردين أكادير في غرفة التبريد يفسد رغم ذلك بعد أيام: إنها محبّة البرودة."]}, "s07_12": {"lvl": 2, "ex": ["Le lben et le raïb sont acides : peu de bactéries dangereuses, mais une moisissure peut apparaître en surface.", "اللبن والرايب حمضيان: قليل من البكتيريا الخطيرة، لكن قد يظهر عفن على السطح."]}, "s07_14": {"lvl": 2, "cmp": ["Le pH trace une frontière : au-dessus de 4,5, le pays des bactéries ; en dessous, celui des levures et moisissures.", "pH يرسم حدًّا: فوق 4,5 بلاد البكتيريا؛ وتحته بلاد الخمائر والعفن."], "ex": ["La viande de l'Aïd et les sardines sont dans la zone à risque ; le citron confit, beaucoup moins.", "لحم العيد والسردين في المنطقة الخطرة؛ أما الحامض المصبّر فأقل بكثير."]}, "s07_16": {"lvl": 1, "trap": ["Erreur : « sous vide, plus rien ne pousse ». Faux : les anaérobies et les aéro-anaérobies continuent.", "خطأ: «تحت الفراغ لا ينمو شيء». خطأ: اللاهوائية والهوائية اللاهوائية الاختيارية تستمر."], "ex": ["Au cœur d'une boîte de sardines, il n'y a pas d'air : c'est la place de Clostridium.", "في قلب علبة السردين لا يوجد هواء: هذا مكان Clostridium."]}, "s07_18": {"lvl": 1, "cmp": ["Le sel et le sucre agissent comme une éponge : ils retiennent l'eau et la cachent aux microbes.", "الملح والسكر يعملان كالإسفنجة: يحبسان الماء ويخفيانه عن الميكروبات."], "ex": ["Les olives en saumure : seuls des germes halophiles peuvent y pousser.", "الزيتون في محلول الملح: لا تنمو فيه إلا الجراثيم المحبّة للملح (halophiles)."]}, "s07_22": {"lvl": 1, "trap": ["Erreur : inverser les mots. Hypertonique : l'eau sort, plasmolyse. Hypotonique : l'eau entre, turgescence.", "خطأ: قلب الكلمات. مفرط التوتر: يخرج الماء، بلزمة. ناقص التوتر: يدخل الماء، انتباج."]}, "s07_24": {"lvl": 2, "cmp": ["Chaque levier est un verrou sur la porte : un seul verrou ne suffit pas, on en met plusieurs.", "كل رافعة قفل على الباب: قفل واحد لا يكفي، نضع عدة أقفال."], "ex": ["Le khlii combine plusieurs leviers : viande salée, séchée, puis conservée dans la graisse.", "الخليع يجمع عدة رافعات: لحم مملّح، مجفّف، ثم محفوظ في الدهن."]}, "s08_07": {"lvl": 1, "cmp": ["Un milieu de culture, c'est une cuisine préparée exactement au goût du germe.", "وسط الزرع مطبخ محضّر بالضبط حسب ذوق الجرثوم."]}, "s08_09": {"lvl": 1, "trap": ["Erreur : vouloir compter les bactéries dans un bouillon. Le trouble montre la croissance, mais ne donne pas de nombre.", "خطأ: محاولة عدّ البكتيريا في المرق. العكارة تبيّن النمو، لكنها لا تعطي رقمًا."]}, "s08_11": {"lvl": 1, "cmp": ["Une colonie, c'est une grande famille : tous les membres ont la même mère.", "المستعمرة عائلة كبيرة: كل أفرادها لهم نفس الأم."]}, "s08_13": {"lvl": 1}, "s08_15": {"lvl": 1, "ex": ["Au labo d'une coopérative laitière, les milieux utilisés au quotidien sont des milieux empiriques.", "في مختبر تعاونية الحليب، الأوساط المستعملة يوميًا أوساط تجريبية."]}, "s08_17": {"lvl": 1, "cmp": ["Le milieu enrichi, c'est un repas de fête : on ajoute des plats pour les invités difficiles.", "الوسط المُغنى وليمة: نضيف أطباقًا للضيوف الصعبين."]}, "s08_18": {"lvl": 2, "trap": ["Erreur : confondre enrichi et sélectif. Enrichi aide un germe à pousser ; sélectif empêche les autres de pousser.", "خطأ: الخلط بين المُغنى والانتقائي. المُغنى يساعد جرثومة على النمو؛ والانتقائي يمنع الأخرى من النمو."], "cmp": ["Le milieu sélectif est un gardien à l'entrée : seuls les germes résistants passent.", "الوسط الانتقائي حارس عند الباب: لا تمرّ إلا الجراثيم المقاومة."], "ex": ["Chercher Salmonella dans la viande hachée d'une boucherie du souk demande un milieu sélectif.", "البحث عن Salmonella في اللحم المفروم لجزارة في السوق يتطلب وسطًا انتقائيًا."]}, "s09_03": {"lvl": 2, "cmp": ["C'est comme une nouvelle au souk : une personne la dit à deux, puis quatre, puis tout le souk la connaît.", "مثل خبر في السوق: شخص يقوله لاثنين، ثم لأربعة، ثم يعرفه السوق كله."], "ex": ["Une harira laissée tiède sur le comptoir tout l'après-midi devient un vrai bouillon de culture.", "حريرة متروكة دافئة على الكونتوار طول المساء تصبح وسط زرع حقيقيًا."]}, "s09_09": {"lvl": 2, "cmp": ["G, c'est le temps qu'il faut pour que la population double.", "G هو الوقت اللازم لكي تتضاعف الساكنة."]}, "s09_11": {"lvl": 2, "trap": ["Erreur : mélanger minutes et heures. Pour µ en h⁻¹, convertis d'abord G en heures.", "خطأ: الخلط بين الدقائق والساعات. لحساب µ بـ h⁻¹، حوّل G أولًا إلى ساعات."]}, "s09_15": {"lvl": 2, "trap": ["Erreur : multiplier N₀ par µt. Il faut multiplier par 2 puissance µt.", "خطأ: ضرب N₀ في µt. يجب الضرب في 2 أُسّ µt."]}, "s09_19": {"lvl": 1, "ex": ["Un lben au réfrigérateur est un système fermé : rien n'entre, rien ne sort.", "اللبن في الثلاجة نظام مغلق: لا شيء يدخل، لا شيء يخرج."]}, "s09_21": {"lvl": 1, "ex": ["À la coopérative laitière, on refroidit le lait de ferme dès la collecte pour allonger la latence.", "في تعاونية الحليب، نبرّد حليب الضيعة منذ الجمع لإطالة الكمون."], "cmp": ["La latence, c'est l'apprenti qui s'installe à l'atelier avant de commencer à produire.", "الكمون هو المتعلّم الذي يستقر في الورشة قبل أن يبدأ الإنتاج."]}, "s09_23": {"lvl": 1, "trap": ["Erreur : « en phase stationnaire, les bactéries ne bougent plus ». Elles se divisent et meurent au même rythme.", "خطأ: «في مرحلة الاستقرار البكتيريا لا تتحرك». إنها تنقسم وتموت بنفس الإيقاع."]}, "s09_27": {"lvl": 1, "trap": ["Erreur : croire que Malassez compte les bactéries vivantes. Il compte tout : vivantes et mortes.", "خطأ: الاعتقاد أن مالاسي تعدّ البكتيريا الحية. إنها تعدّ الكل: الحية والميتة."], "ex": ["Dans une pâte de msemen ou de pain, on peut compter les levures au microscope sur cette grille.", "في عجين المسمن أو الخبز، يمكن عدّ الخمائر بالمجهر على هذه الشبكة."]}, "s09_31": {"lvl": 2, "cmp": ["Diluer au 1/10, c'est comme verser un verre de thé dans neuf verres d'eau, encore et encore.", "التخفيف بـ 1/10 يشبه صبّ كأس من الشاي في تسعة كؤوس من الماء، مرة بعد مرة."]}, "s09_35": {"lvl": 2, "trap": ["Erreur : choisir la boîte la plus chargée pour être « plus précis ». Au-delà de 300, les colonies se touchent.", "خطأ: اختيار العلبة الأكثر امتلاءً لتكون «أدق». فوق 300 تتلاصق المستعمرات."]}, "s10_03": {"lvl": 1, "trap": ["« Un lait qui sort du pis est stérile. » Faux : il porte déjà une flore originelle, avant toute manipulation.", "«الحليب الخارج من الضرع معقّم.» خطأ: يحمل أصلًا فلورا أصلية قبل أي تداول."], "ex": ["Le lait de ferme arrive à la coopérative laitière avec sa flore originelle. La traite et les bidons ajoutent la flore de contamination.", "يصل حليب المزرعة إلى التعاونية الحليبية بفلورته الأصلية. والحلب والأواني تضيف فلورا التلوث."]}, "s10_09": {"lvl": 2, "ex": ["Le jour de l'Aïd, une carcasse laissée longtemps au chaud verdit plus vite. Mets-la au froid dès que possible.", "يوم العيد، الذبيحة المتروكة طويلًا في الحرارة تخضرّ بسرعة أكبر. ضعها في البرد في أقرب وقت."], "cmp": ["La flore digestive est un passager déjà à bord. Après l'abattage, plus personne ne la surveille.", "الفلورا الهضمية راكب موجود أصلًا على متن الذبيحة. بعد الذبح، لا أحد يراقبه."]}, "s10_11": {"lvl": 1, "ex": ["Les olives et les figues cueillies au verger portent déjà leur flore originelle sur la peau.", "الزيتون والتين المقطوفان من البستان يحملان أصلًا فلورتهما الأصلية على القشرة."], "cmp": ["La pruine, c'est un ferment « livré avec le fruit ».", "الـ pruine خميرة «تأتي مع الفاكهة»."]}, "s10_13": {"lvl": 2, "trap": ["« Une eau claire et sans odeur est sans danger. » Faux : les germes fécaux sont invisibles. Seule l'analyse le dit.", "«الماء الصافي والعديم الرائحة لا خطر فيه.» خطأ: الجراثيم البرازية غير مرئية. التحليل وحده يكشفها."], "ex": ["L'eau d'un puits proche d'une étable peut recevoir une pollution fécale. On la traite avant de l'utiliser à la laiterie.", "ماء بئر قريبة من إسطبل قد يتعرض لتلوث برازي. نعالجه قبل استعماله في المحلبة."]}, "s10_15": {"lvl": 2, "ex": ["Balayer à sec l'atelier pendant le conditionnement des olives soulève des poussières chargées de germes.", "كنس الورشة كنسًا جافًا أثناء تعبئة الزيتون يرفع غبارًا محمّلًا بالجراثيم."], "cmp": ["La poussière est le taxi des germes dans l'air.", "الغبار هو سيارة الأجرة التي تنقل الجراثيم في الهواء."]}, "s10_17": {"lvl": 2, "trap": ["« Un ouvrier propre et en bonne santé n'apporte aucun germe. » Faux : sa peau, sa bouche et son nez portent une flore abondante.", "«العامل النظيف والسليم لا يحمل أي جرثومة.» خطأ: جلده وفمه وأنفه تحمل فلورا كثيفة."], "ex": ["Au souk, le vendeur qui touche l'argent puis le msemen sans se laver les mains y dépose sa flore.", "في السوق، البائع الذي يلمس النقود ثم المسمن دون غسل يديه ينقل إليه فلورته."]}, "s10_19": {"lvl": 2, "ex": ["Dans une usine de conserve de sardines, un Clostridium oriente vers le sol ou le digestif ; un Staphylococcus, vers les ouvriers.", "في مصنع تصبير السردين، وجود Clostridium يوجّه نحو التربة أو الجهاز الهضمي؛ ووجود Staphylococcus نحو العمال."], "cmp": ["Le tableau est une enquête : le germe trouvé est l'empreinte qui mène au réservoir.", "الجدول تحقيق بوليسي: الجرثومة الموجودة هي البصمة التي تقود إلى المستودع."]}, "s11_10": {"lvl": 1, "cmp": ["Le commensal est un invité qui mange à ta table sans te déranger.", "المتعايش ضيف يأكل من مائدتك دون أن يزعجك."]}, "s11_12": {"lvl": 1, "ex": ["Les racines des fèves et des pois chiches abritent Rhizobium : l'agriculteur met moins d'engrais azoté.", "جذور الفول والحمص تأوي Rhizobium: فيستعمل الفلاح أسمدة آزوتية أقل."]}, "s11_14": {"lvl": 2, "trap": ["« Un aliment qui a bon aspect et bonne odeur est sans danger. » Faux : un pathogène peut être là sans altérer le produit.", "«الغذاء ذو المظهر والرائحة الجيدين لا خطر فيه.» خطأ: قد تكون جرثومة ممرضة موجودة دون أن تفسد المنتوج."], "ex": ["Une harira oubliée hors du frigo devient aigre : c'est une flore d'altération qui mange le produit.", "حريرة منسية خارج الثلاجة تصبح حامضة: إنها فلورا إفساد تأكل المنتوج."], "cmp": ["Le parasite est un voleur qui fait du mal ; le saprophyte est un éboueur qui mange les déchets.", "الطفيلي لص يُلحق الضرر؛ والرمّي عامل نظافة يأكل الفضلات."]}, "s11_18": {"lvl": 1, "trap": ["« Si la cuisson tue la bactérie, le danger disparaît toujours. » Faux : dans une intoxination, la toxine reste dans l'aliment.", "«إذا قتل الطهي البكتيريا، يختفي الخطر دائمًا.» خطأ: في التسمم الذيفاني، يبقى السمّ في الغذاء."], "ex": ["Une conserve maison de légumes ou de poisson mal stérilisée peut contenir la toxine de Clostridium botulinum.", "مُعلّبة منزلية من الخضر أو السمك غير معقّمة جيدًا قد تحتوي على سمّ Clostridium botulinum."], "cmp": ["Intoxination : la bactérie est partie, mais elle a laissé sa bombe, la toxine.", "التسمم الذيفاني: البكتيريا رحلت، لكنها تركت قنبلتها، أي السمّ."]}, "s11_20": {"lvl": 1, "ex": ["Une mayonnaise maison aux œufs crus, laissée au chaud pendant une fête de mariage : terrain idéal pour Salmonella.", "مايونيز منزلي بالبيض النيء، متروك في الحرارة أثناء حفل زفاف: وسط مثالي للسالمونيلا."]}, "s11_22": {"lvl": 1, "trap": ["« E. coli est toujours dangereuse. » Faux : la plupart des souches sont inoffensives ; seules les ECEH sont pathogènes.", "«E. coli خطيرة دائمًا.» خطأ: أغلب السلالات غير ضارة؛ فقط السلالات ECEH ممرضة."], "ex": ["Des kefta de bœuf grillées encore rosées au centre sont à risque. Cuis la viande hachée jusqu'au cœur.", "الكفتة من لحم البقر المشوية والتي بقي وسطها ورديًا فيها خطر. اطهُ اللحم المفروم حتى القلب."]}, "s11_24": {"lvl": 1, "ex": ["Le lait de ferme bu cru et le poulet cru mal manipulé en cuisine sont deux voies classiques de Campylobacter.", "حليب المزرعة المشروب نيئًا والدجاج النيء المتداول بشكل سيئ في المطبخ طريقان معروفان لكامبيلوباكتر."], "cmp": ["Campylobacter a la forme d'un tire-bouchon.", "كامبيلوباكتر له شكل فتّاحة الفلين (tire-bouchon)."]}, "s11_26": {"lvl": 2, "trap": ["« Le frigo protège de tous les germes. » Faux : Listeria se multiplie encore à 4 °C.", "«الثلاجة تحمي من كل الجراثيم.» خطأ: الليستيريا تتكاثر حتى في 4 درجات."], "ex": ["Un jben au lait cru ou du poisson fumé gardés au frigo sont déconseillés à une femme enceinte.", "الجبن (jben) من حليب نيء أو السمك المدخن المحفوظان في الثلاجة غير منصوح بهما للمرأة الحامل."]}, "s11_28": {"lvl": 1, "cmp": ["Chaque ligne est une fiche d'identité : qui, dans quel aliment, comment, et à quoi faire attention.", "كل سطر بطاقة تعريف: من، في أي غذاء، كيف، وما الذي يجب الانتباه إليه."]}, "s11_30": {"lvl": 1, "ex": ["Un pâtissier goûte la crème avec le doigt puis continue. Sans être malade, il peut y déposer ses staphylocoques.", "حلواني يتذوق الكريمة بإصبعه ثم يواصل العمل. دون أن يكون مريضًا، قد يضع فيها مكوراته العنقودية."], "cmp": ["Le porteur sain est comme une valise fermée : on ne voit pas ce qu'elle transporte.", "الحامل السليم مثل حقيبة مغلقة: لا نرى ما تحمله."]}, "s11_32": {"lvl": 1, "ex": ["Dans une laiterie ou un abattoir, un manipulateur aux examens positifs est écarté de la manipulation jusqu'à des examens négatifs.", "في محلبة أو مجزرة، العامل ذو الفحوص الإيجابية يُبعد عن التداول حتى تصبح فحوصه سلبية."]}, "s12_09": {"lvl": 1, "ex": ["Des moules ramassées sur les rochers, sans contrôle sanitaire, peuvent contenir des phycotoxines.", "بلح البحر (moules) المجموع من الصخور دون مراقبة صحية قد يحتوي على سموم طحلبية."], "cmp": ["Le coquillage est une éponge : il filtre l'eau et garde la toxine.", "المحار إسفنجة: يرشّح الماء ويحتفظ بالسمّ."]}, "s12_11": {"lvl": 1, "cmp": ["PSP frappe en minutes, E. coli en jours : une toxine déjà prête agit tout de suite.", "PSP يضرب في دقائق، و E. coli في أيام: السمّ الجاهز يعمل فورًا."]}, "s12_15": {"lvl": 2, "trap": ["« Je gratte la moisissure du pain et je mange le reste. » Faux : la toxine a déjà diffusé dans le produit.", "«أكشط العفن من الخبز وآكل الباقي.» خطأ: السمّ انتشر أصلًا في المنتوج."], "ex": ["Un sac de cumin stocké dans un local humide et mal ventilé du souk peut moisir. On écarte le lot.", "كيس كمون مخزّن في محل رطب وسيئ التهوية في السوق قد يتعفن. نستبعد الدفعة."]}, "s12_17": {"lvl": 1, "cmp": ["La moisissure est la partie visible de l'iceberg ; la toxine est cachée dessous.", "العفن هو الجزء الظاهر من جبل الجليد؛ والسمّ مختبئ تحته."]}, "s12_19": {"lvl": 1, "trap": ["« Bien cuire règle tout. » Faux : beaucoup de toxines sont thermostables et résistent à la cuisson.", "«الطهي الجيد يحل كل شيء.» خطأ: كثير من السموم مقاومة للحرارة وتصمد أمام الطهي."], "cmp": ["Arrêter le voleur ne rend pas l'argent volé : tuer le germe ne détruit pas sa toxine.", "القبض على اللص لا يعيد المال المسروق: قتل الجرثومة لا يدمّر سمّها."]}, "s12_25": {"lvl": 2, "ex": ["Des taches vertes ou bleues sur le pain du four : c'est une couleur qui apparaît, due aux moisissures.", "بقع خضراء أو زرقاء على خبز الفرن: إنه لون يظهر، سببه العفن."]}, "s12_27": {"lvl": 2, "ex": ["Des tomates ou des abricots qui ramollissent dans la caisse : leurs pectines sont attaquées.", "طماطم أو مشمش يلين داخل الصندوق: البكتين فيه يتعرض للتحلّل."], "cmp": ["La pectine est le ciment du fruit : quand les microbes la cassent, le fruit s'effondre.", "البكتين هو إسمنت الفاكهة: حين تكسره الميكروبات، تنهار الفاكهة."]}, "s12_29": {"lvl": 1, "ex": ["Des sardines mal conservées sentent fort le poisson : la triméthylamine fait partie des molécules en cause.", "السردين المحفوظ بشكل سيئ تفوح منه رائحة سمك قوية: ثلاثي ميثيل الأمين (triméthylamine) من الجزيئات المسؤولة."]}, "s12_35": {"lvl": 1, "ex": ["La levure qui fait lever la pâte du pain du four est Saccharomyces cerevisiae.", "الخميرة التي ترفع عجين خبز الفرن هي Saccharomyces cerevisiae."], "cmp": ["La levure est un ouvrier polyvalent : même ouvrier, trois matières premières, trois produits.", "الخميرة عامل متعدد المهام: نفس العامل، ثلاث مواد أولية، ثلاثة منتجات."]}, "s12_37": {"lvl": 2, "trap": ["« Toutes les moisissures sont nuisibles. » Faux : Penicillium roqueforti affine le fromage bleu.", "«كل الأعفان ضارة.» خطأ: Penicillium roqueforti يُنضج الجبن الأزرق."], "ex": ["Le raïb : des bactéries lactiques acidifient le lait, qui coagule. C'est une fermentation lactique.", "الرايب: بكتيريا لبنية تحمّض الحليب فيتخثّر. إنه تخمر لبني."]}, "s13_09": {"lvl": 2, "cmp": ["Maîtriser le développement, c'est freiner le voleur déjà entré. Maîtriser la contamination, c'est fermer la porte.", "التحكم في النمو هو إيقاف اللص الذي دخل. التحكم في التلوث هو إغلاق الباب."]}, "s13_13": {"lvl": 2, "trap": ["Faux : « Congeler la viande de l'Aïd tue les microbes. » Vrai : la congélation les bloque seulement.", "خطأ: «تجميد لحم العيد يقتل الميكروبات». الصحيح: التجميد يوقفها فقط."], "ex": ["La viande de l'Aïd va au congélateur pour des mois, et au réfrigérateur pour quelques jours.", "لحم العيد يوضع في المجمِّد لعدة أشهر، وفي الثلاجة لبضعة أيام."]}, "s13_15": {"lvl": 2, "cmp": ["Le froid, c'est le bouton pause d'un film : il ne rembobine jamais.", "البرودة مثل زر الإيقاف المؤقت في فيلم: لا يُرجِع الشريط أبدًا إلى البداية."], "ex": ["Des sardines débarquées à Agadir restent 2 h au soleil, puis 2 h dans un camion chaud. Cela fait 4 h de croissance.", "سردين مُفرَغ في أكادير يبقى ساعتين في الشمس، ثم ساعتين في شاحنة ساخنة. المجموع 4 ساعات من النمو."]}, "s13_19": {"lvl": 1, "trap": ["Faux : « Pasteurisé veut dire stérile. » Vrai : le produit est assaini, pas stérile.", "خطأ: «مبستر يعني معقّم». الصحيح: المنتوج مُطهَّر جزئيًا فقط، وليس معقّمًا."], "ex": ["Le lait pasteurisé du matin se vend au frais. Le lait UHT attend sur l'étagère de l'épicerie.", "الحليب المبستر يُباع في البرودة. أما حليب UHT فينتظر على رفّ البقال."]}, "s13_21": {"lvl": 2}, "s13_23": {"lvl": 2, "cmp": ["La spore, c'est la bactérie en armure : l'eau bouillante ne la perce pas.", "البوغ هو البكتيريا في درعها: الماء المغلي لا يخترقه."], "ex": ["Dans une usine de conserve de sardines, la stérilisation vise les spores, pas seulement les bactéries actives.", "في مصنع تصبير السردين، يستهدف التعقيم الأبواغ، وليس فقط البكتيريا النشطة."]}, "s13_25": {"lvl": 1}, "s13_27": {"lvl": 1, "ex": ["Le lait de ferme acheté au souk est un lait cru : il se garde au froid et se consomme vite.", "حليب الضيعة المشترى من السوق حليب خام: يُحفظ في البرودة ويُستهلك بسرعة."]}, "s13_29": {"lvl": 2, "trap": ["Faux : « Plus on chauffe, mieux c'est. » Vrai : un barème trop sévère abîme le produit pour rien.", "خطأ: «كلما سخّنّا أكثر كان أفضل». الصحيح: المعيار الحراري الشديد جدًا يُفسد المنتوج دون فائدة."]}, "s14_09": {"lvl": 2, "cmp": ["Le sel et le sucre, ce sont des invités qui occupent toutes les chaises : le germe ne trouve plus où s'asseoir.", "الملح والسكر كضيوف يحتلون كل الكراسي: لا تجد الجرثومة أين تجلس."], "ex": ["Les figues et les abricots séchés au soleil se gardent des mois sans frigo.", "التين والمشمش المجففان في الشمس يُحفظان أشهرًا بدون ثلاجة."]}, "s14_11": {"lvl": 1}, "s14_13": {"lvl": 2, "trap": ["Faux : « Le sel tue les microbes. » Vrai : le sel ne tue pas, il assèche.", "خطأ: «الملح يقتل الميكروبات». الصحيح: الملح لا يقتل، بل يُجفّف."], "ex": ["Le gueddid de l'Aïd : viande salée puis séchée au soleil, avant d'en faire le khlii.", "القديد في العيد: لحم مملّح ثم مجفّف في الشمس، قبل تحضير الخليع."]}, "s14_15": {"lvl": 1, "trap": ["Faux : « Avec un conservateur, l'hygiène compte moins. » Vrai : il accompagne le procédé, il ne le remplace jamais.", "خطأ: «مع المادة الحافظة، النظافة أقل أهمية». الصحيح: هي تُرافق طريقة الحفظ ولا تعوّضها أبدًا."]}, "s14_17": {"lvl": 2, "ex": ["Le lben et le raïb sont protégés par l'acide lactique. Les olives, par la saumure et la fermentation.", "اللبن والرايب يحميهما حمض اللبنيك. والزيتون يحميه المحلول الملحي (saumure) والتخمّر."], "cmp": ["Le ferment, c'est le premier arrivé qui occupe la place au souk : le contaminant ne trouve plus d'espace.", "الخميرة (ferment) هي من يصل أولًا ويحتل المكان في السوق: لا يجد الملوِّث مكانًا."]}, "s14_19": {"lvl": 2}, "s14_21": {"lvl": 2, "trap": ["Faux : « Sans oxygène, plus aucun germe ne pousse. » Vrai : les anaérobies, comme C. botulinum, en profitent.", "خطأ: «بدون أكسجين لا تنمو أي جرثومة». الصحيح: اللاهوائيات مثل C. botulinum تستفيد من ذلك."]}, "s14_23": {"lvl": 1}, "s14_27": {"lvl": 1, "ex": ["Le jben de la coopérative : lait pasteurisé, acidifié, salé, puis gardé au froid.", "جبن التعاونية: حليب مبستر، محمّض، مملّح، ثم محفوظ في البرودة."], "cmp": ["Les barrières, c'est une course d'obstacles : aucun germe ne saute toutes les haies.", "الحواجز كسباق حواجز: لا تستطيع أي جرثومة القفز فوقها جميعًا."]}, "s15_11": {"lvl": 2, "ex": ["Une arête dans une conserve de sardines : danger physique. Salmonella dans un œuf : danger biologique.", "حسكة في علبة سردين: خطر فيزيائي. السالمونيلا في بيضة: خطر بيولوجي."]}, "s15_13": {"lvl": 1}, "s15_15": {"lvl": 1, "cmp": ["Le diagramme ressemble à une arête de sardine : la tête est le problème, les arêtes sont les causes.", "المخطط يشبه حسكة سردينة: الرأس هو المشكلة، والحسكات هي الأسباب."]}, "s15_19": {"lvl": 2, "trap": ["Faux : « Un lait livré tiède, on le refroidit et c'est réglé. » Vrai : les germes ont déjà poussé ; on refuse.", "خطأ: «حليب وصل فاترًا، نبرّده وانتهى الأمر». الصحيح: الجراثيم نمت مسبقًا؛ نرفض الدفعة."]}, "s15_21": {"lvl": 1, "ex": ["Dans le stock d'une épicerie, le raïb qui périme demain sort avant celui qui périme dans cinq jours.", "في مخزن البقال، الرايب الذي تنتهي صلاحيته غدًا يخرج قبل الذي تنتهي بعد خمسة أيام."], "trap": ["Faux : « On range le nouveau lot devant, c'est plus pratique. » Vrai : l'ancien lot périme au fond.", "خطأ: «نضع الدفعة الجديدة في الأمام، هذا أسهل». الصحيح: الدفعة القديمة تفسد في الخلف."]}, "s15_25": {"lvl": 1, "trap": ["Faux : « La planche en bois de la maison convient à l'atelier. » Vrai : le bois est interdit au contact des aliments.", "خطأ: «لوح الخشب المنزلي يصلح للمشغل». الصحيح: الخشب ممنوع في تماس مع الأغذية."]}, "s15_31": {"lvl": 1, "ex": ["Dans une usine de conserve, le poisson entre côté quai, passe au parage, puis à la mise en boîte : jamais de retour.", "في مصنع التصبير، يدخل السمك من جهة الرصيف، ثم التنظيف، ثم التعليب: دون رجوع أبدًا."], "cmp": ["La marche en avant, c'est une rue à sens unique : le produit n'y fait jamais demi-tour.", "السير إلى الأمام شارع ذو اتجاه واحد: المنتوج لا يعود أبدًا إلى الوراء."]}, "s15_35": {"lvl": 1, "ex": ["Un chat de la rue qui entre dans l'atelier de msemen est un nuisible, même s'il semble propre.", "القط الذي يدخل مشغل المسمن حيوان مؤذٍ (nuisible)، حتى لو بدا نظيفًا."]}, "s15_37": {"lvl": 2, "ex": ["La viande hachée pour les kefta : machine très propre, froid, et emballage aussitôt. Vite, froid et propre.", "اللحم المفروم للكفتة: آلة نظيفة جدًا، برودة، وتعبئة فورية. بسرعة، بارد ونظيف."]}, "s15_41": {"lvl": 2, "trap": ["Faux : « J'ai des gants, je n'ai pas besoin de me laver les mains. » Vrai : les gants ne dispensent pas du lavage.", "خطأ: «ألبس القفازات، لا حاجة لغسل يديّ». الصحيح: القفازات لا تُغني عن الغسل."]}, "s16_07": {"lvl": 2, "trap": ["Faux : « La table brille, donc elle est saine. » Vrai : visuellement propre ne veut pas dire sans germes.", "خطأ: «الطاولة تلمع، إذن هي سليمة». الصحيح: النظافة الظاهرة لا تعني غياب الجراثيم."], "cmp": ["Désinfecter une surface sale, c'est peindre un mur plein de poussière : ça ne tient pas.", "تطهير سطح متّسخ كطلاء جدار مغطّى بالغبار: لا يصمد."]}, "s16_09": {"lvl": 2, "ex": ["Après la désinfection d'une cuve à lben, le rinçage final évite un goût de chlore dans le produit.", "بعد تطهير خزان اللبن، يمنع الشطف النهائي ظهور طعم الكلور في المنتوج."]}, "s16_11": {"lvl": 2, "ex": ["Dans une laiterie, les dépôts de lait cuit demandent un alcalin. Le tartre blanc de l'eau dure demande un acide.", "في مصنع الحليب، رواسب الحليب المطبوخ تحتاج منظّفًا قاعديًا. وترسّبات الكلس البيضاء تحتاج منظّفًا حمضيًا."]}, "s16_13": {"lvl": 1, "cmp": ["Le détergent a une main dans l'eau et une main dans la graisse : il tire la graisse vers l'eau.", "للمنظّف يد في الماء ويد في الدهون: يسحب الدهون نحو الماء."], "ex": ["Une marmite de harira grasse : l'eau seule glisse, le détergent décroche la graisse.", "قِدر حريرة دسم: الماء وحده ينزلق، أما المنظّف فينزع الدهون."]}, "s16_15": {"lvl": 1}, "s16_21": {"lvl": 2, "trap": ["Faux : « Plus l'eau est chaude, mieux on nettoie. » Vrai : au-delà de 70 °C, les protéines coagulent.", "خطأ: «كلما كان الماء أسخن كان التنظيف أفضل». الصحيح: فوق 70 درجة تتخثر البروتينات."], "cmp": ["La roue de Sinner, c'est un gâteau en quatre parts : si une part rétrécit, une autre doit grandir.", "عجلة سينر كعكة من أربع قطع: إذا صغرت قطعة، يجب أن تكبر أخرى."]}, "s16_25": {"lvl": 2}, "s16_29": {"lvl": 1}, "s16_33": {"lvl": 1, "cmp": ["L'ATP-métrie, c'est une photo instantanée ; la gélose, c'est un film qu'on regarde des jours plus tard.", "قياس ATP (ATP-métrie) صورة فورية؛ أما الهلام (gélose) ففيلم نشاهده بعد أيام."]}, "s16_35": {"lvl": 1, "ex": ["Dans une usine de conserve, chaque autoclave a sa fiche : quoi, comment, quand, qui, et la signature.", "في مصنع التصبير، لكل جهاز تعقيم (autoclave) بطاقته: ماذا، كيف، متى، من، والتوقيع."]}}, "chap": {"A": {"mnemo": [{"t": ["Les 7 étapes de l'analyse", "المراحل السبع للتحليل"], "x": ["« Sami Range Puis Envoie Ici Les Résultats » : Stériliser, Réceptionner, Préparer l'échantillon, Ensemencer, Incuber, Lire, Rédiger.", "«Sami Range Puis Envoie Ici Les Résultats»: التعقيم، الاستقبال، تحضير العيّنة، الزرع، الحضن، القراءة، التقرير."], "s": [1]}, {"t": ["L'ordre de la coloration de Gram", "ترتيب صبغة غرام"], "x": ["« Va Laver Avant de Sortir » : Violet de gentiane, Lugol, Alcool, Safranine (ou fuchsine).", "«Va Laver Avant de Sortir»: البنفسجي الجنسياني (Violet)، اللوغول (Lugol)، الكحول (Alcool)، السافرانين (Safranine) أو الفوكسين."], "s": [4]}, {"t": ["Le cycle du virus", "دورة الفيروس"], "x": ["« Ahmed Part Rapidement À Larache » : Adsorption, Pénétration, Réplication, Assemblage, Libération.", "«أحمد يذهب بسرعة إلى العرائش» (Ahmed Part Rapidement À Larache): الامتزاز، الاختراق، التضاعف، التجميع، التحرر."], "s": [5]}], "map": {"c": ["Le monde microbien", "عالم الكائنات الدقيقة"], "b": [{"t": ["Pourquoi la microbiologie", "لماذا علم الأحياء الدقيقة"], "i": [["Accepter un lot", "قبول دفعة"], ["Vérifier le système", "مراقبة النظام"], ["Fabriquer : lben, jben, pain", "التصنيع: اللبن، الجبن، الخبز"], ["Utiles, nuisibles, pathogènes", "نافعة، ضارّة، ممرضة"]]}, {"t": ["Classer le vivant", "تصنيف الكائنات الحية"], "i": [["Procaryotes : sans noyau", "بدائيات النواة: بدون نواة"], ["Eucaryotes : vrai noyau", "حقيقيات النواة: نواة حقيقية"], ["Acaryotes : virus, phages, prions", "عديمات الخلية: فيروسات، عاثيات، بريونات"]]}, {"t": ["La cellule eucaryote", "الخلية حقيقية النواة"], "i": [["Noyau : commande", "النواة: القيادة"], ["Mitochondrie : énergie (ATP)", "الميتوكوندري: الطاقة (ATP)"], ["Membrane : échanges ; paroi : forme", "الغشاء: التبادل؛ الجدار: الشكل"], ["Golgi : tri et distribution", "غولجي: الفرز والتوزيع"]]}, {"t": ["Les champignons", "الفطريات"], "i": [["Moisissures : hyphes et mycélium", "العفن: خيوط فطرية وغزل فطري"], ["Levures : unicellulaires, bourgeonnement", "الخمائر: أحادية الخلية، تبرعم"], ["Zygomycètes non cloisonnés, ascomycètes cloisonnés", "اللاقحية غير مقسّمة، الزقية مقسّمة"], ["Spores dans est perdue.", "نعم: العاثية تدمّر الخمائر اللبنية فيتوقف التحمّض. ضاع الحوض."]}, {"q": ["Le chef veut relancer demain le même levain dans la même cuve, sans rien changer. Ton conseil ?", "الرئيس يريد إعادة نفس الخميرة الأم غدًا في نفس الحوض دون تغيير. ما نصيحتك؟"], "o": [["D'accord, ce n'était qu'un accident", "Doubler la dose du même levain", "Changer de souche et nettoyer-désinfecter à fond"], ["موافق، إنها مجرد صدفة", "مضاعفة كمية نفس الخميرة", "تغيير السلالة وتنظيف وتطهير شامل"]], "a": 2, "fb": ["Exact : rotation des souches et désinfection rigoureuse, sinon l'atelier reste contaminé.", "صحيح: تناوب السلالات وتطهير صارم، وإلا تبقى الورشة ملوّثة."]}, {"q": ["En nettoyant, tu trouves un dépôt gluant dans un tuyau qui résiste au détergent. Pourquoi ?", "أثناء التنظيف، تجد رواسب لزجة في أنبوب تقاوم المنظّف. لماذا؟"], "o": [["Les bactéries ont des flagelles", "C'est un biofilm protégé par la capsule des bactéries", "Ce sont des virus enveloppés"], ["للبكتيريا أسواط", "إنه غشاء حيوي تحميه محفظة البكتيريا", "إنها فيروسات مغلّفة"]], "a": 1, "fb": ["Oui : la capsule fixe les bactéries aux surfaces et les protège des détergents.", "نعم: المحفظة تثبّت البكتيريا على الأسطح وتحميها من المنظفات."]}, {"q": ["Au labo, les bactéries du tuyau sont roses après la coloration de Gram. Elles sont :", "في المختبر، بكتيريا الأنبوب وردية بعد صبغة غرام. إنها:"], "o": [["Gram −, paroi fine avec membrane externe", "Gram +, paroi épaisse", "des levures"], ["سالبة غرام، جدار رقيق مع غشاء خارجي", "موجبة غرام، جدار سميك", "خمائر"]], "a": 0, "fb": ["Rose = Gram −. L'alcool les a décolorées, puis la fuchsine les a recolorées.", "وردي = سالبة غرام. الكحول أزال لونها، ثم أعاد الفوكسين تلوينها."]}], "end": ["Tu as utilisé tout le chapitre : accepter un lot, reconnaître un phage, comprendre la capsule et lire un Gram.", "استعملت الفصل كله: قبول دفعة، التعرّف على العاثية، فهم المحفظة وقراءة صبغة غرام."]}, "hot": {"s02_21": [{"x": 34, "y": 26, "t": ["Membrane plasmique", "الغشاء البلازمي"], "d": ["Elle délimite la cellule et laisse entrer et sortir les substances.", "يحدّ الخلية ويسمح بدخول المواد وخروجها."]}, {"x": 60, "y": 28, "t": ["Noyau", "النواة"], "d": ["Il contient l'information génétique et commande toute la cellule.", "تحتوي على المعلومة الوراثية وتقود الخلية كلها."]}, {"x": 40, "y": 28, "t": ["Mitochondrie", "الميتوكوندري"], "d": ["La centrale électrique : elle fournit l'énergie sous forme d'ATP.", "محطة الكهرباء: توفّر الطاقة على شكل ATP."]}, {"x": 68, "y": 45, "t": ["Réticulum endoplasmique", "الشبكة الإندوبلازمية"], "d": ["Avec les ribosomes, il fabrique les protéines et les lipides.", "مع الريبوزومات، تصنع البروتينات والدهون."]}, {"x": 66, "y": 56, "t": ["Appareil de Golgi", "جهاز غولجي"], "d": ["Il fait mûrir, trie et distribue les molécules.", "يُنضج الجزيئات ويفرزها ويوزّعها."]}, {"x": 54, "y": 65, "t": ["Vacuole", "الفجوة"], "d": ["Elle stocke les réserves de la cellule.", "تخزّن مدخرات الخلية."]}], "s04_11": [{"x": 41, "y": 25, "t": ["Paroi (constant)", "الجدار (ثابت)"], "d": ["Rigide, elle donne la forme ; son épaisseur fait le Gram.", "صلب، يعطي الشكل؛ وسمكه يحدّد صبغة غرام."]}, {"x": 37, "y": 39, "t": ["Membrane cytoplasmique (constant)", "الغشاء السيتوبلازمي (ثابت)"], "d": ["Elle contrôle les échanges et produit l'ATP.", "يتحكم في التبادلات وينتج ATP."]}, {"x": 46, "y": 47, "t": ["Chromosome (constant)", "الصبغي (ثابت)"], "d": ["Un seul filament d'ADN, libre dans le cytoplasme.", "خيط واحد من ADN، حرّ في السيتوبلازم."]}, {"x": 35, "y": 47, "t": ["Capsule (facultatif)", "المحفظة (اختياري)"], "d": ["Couche visqueuse qui colle aux surfaces et protège des détergents.", "طبقة لزجة تلتصق بالأسطح وتحمي من المنظفات."]}, {"x": 45, "y": 16, "t": ["Pili (facultatif)", "الأشعار (اختياري)"], "d": ["Fibres pour adhérer ; les pili sexuels échangent des gènes.", "ألياف للالتصاق؛ والأشعار الجنسية تتبادل الجينات."]}, {"x": 62, "y": 71, "t": ["Flagelle (facultatif)", "السوط (اختياري)"], "d": ["Filament protéique qui rend la bactérie mobile.", "خيط بروتيني ي
