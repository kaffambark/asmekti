cetobacter suboxydans."]], "k": ["Trois familles chimiques, trois fonctions.", "ثلاث عائلات كيميائية، ثلاث وظائف."], "q": ["La lysine est un facteur de croissance de la famille des :", "الليسين عامل نمو من عائلة:"], "o": [["vitamines", "acides aminés", "bases puriques"], ["الفيتامينات", "الأحماض الأمينية", "القواعد البورينية"]], "a": 1, "w": ["La lysine est un acide aminé, constituant des protéines.", "الليسين حمض أميني، مكوّن للبروتينات."]}]}, {"n": 7, "t": ["Les facteurs physico-chimiques de la croissance", "العوامل الفيزيائية والكيميائية للنمو"], "c": [{"img": "s07_03", "t": ["Pourquoi la confiture ne moisit-elle pas ?", "لماذا لا يتعفّن المربى؟"], "st": [["La confiture est pleine de sucre, donc de nourriture pour les micro-organismes.", "Elle n'est pas stérile : ouverte et manipulée, elle reçoit sans cesse des spores de moisissures.", "Pourtant elle se conserve des mois : il manque l'eau libre. Le sucre retient l'eau et la rend indisponible — c'est l'activité de l'eau (Aw).", "Les besoins nutritifs, c'est le produit qui les fixe ; les facteurs physiques, l'atelier peut les régler."], ["المربى مليء بالسكر، أي بالغذاء للكائنات الدقيقة.", "ليس معقّمًا: عندما يُفتح ويُستعمل، يستقبل باستمرار أبواغ العفن.", "ومع ذلك يُحفظ شهورًا: ينقصه الماء الحر. السكر يحبس الماء ويجعله غير متاح — إنه نشاط الماء (Aw).", "الحاجيات الغذائية يحددها المنتوج؛ أما العوامل الفيزيائية فيمكن للورشة أن تضبطها."]], "k": ["Ce n'est pas la quantité d'eau qui compte, c'est l'eau disponible.", "ليست كمية الماء هي المهمة، بل الماء المتاح."], "q": ["Pourquoi la confiture se conserve-t-elle ?", "لماذا يُحفظ المربى؟"], "o": [["Elle est stérile", "Le sucre retient l'eau, l'eau libre manque", "Elle ne contient pas de nutriments"], ["لأنه معقّم", "لأن السكر يحبس الماء فينقص الماء الحر", "لأنه لا يحتوي على مغذيات"]], "a": 1, "w": ["L'Aw basse bloque la plupart des germes.", "نشاط الماء المنخفض يوقف أغلب الجراثيم."]}, {"img": "s07_09", "t": ["La température", "درجة الحرارة"], "st": [["Psychrophiles : de −15 à 20 °C. Ce sont eux qui altèrent les produits réfrigérés.", "Mésophiles : de 10 à 40 °C. C'est la majorité des micro-organismes, dont les pathogènes de l'homme (vers 37 °C).", "Thermophiles : de 40 à 80 °C. On les retrouve après un traitement thermique insuffisant.", "À 4 °C, le froid ne tue pas : il ralentit les mésophiles, mais les psychrophiles continuent de pousser. C'est pourquoi un produit réfrigéré a quand même une DLC."], ["محبّة البرودة (psychrophiles): من −15 إلى 20 درجة. هي التي تفسد المنتجات المبرّدة.", "محبّة الاعتدال (mésophiles): من 10 إلى 40 درجة. أغلبية الكائنات الدقيقة، ومنها ممرضات الإنسان (حوالي 37 درجة).", "محبّة الحرارة (thermophiles): من 40 إلى 80 درجة. نجدها بعد معالجة حرارية غير كافية.", "في 4 درجات، البرودة لا تقتل: تبطئ محبّة الاعتدال، لكن محبّة البرودة تستمر في النمو. لهذا للمنتوج المبرّد تاريخ صلاحية (DLC)."]], "k": ["−15 à 20 °C, 10 à 40 °C, 40 à 80 °C.", "من −15 إلى 20، من 10 إلى 40، من 40 إلى 80 درجة."], "q": ["Quels micro-organismes altèrent un produit conservé à 4 °C ?", "أيّ كائنات دقيقة تفسد منتوجًا محفوظًا في 4 درجات؟"], "o": [["Les thermophiles", "Les psychrophiles", "Aucun"], ["محبّة الحرارة", "محبّة البرودة", "لا شيء"]], "a": 1, "w": ["Les psychrophiles poussent même au froid.", "محبّة البرودة تنمو حتى في البرد."]}, {"img": "s07_12", "t": ["Le pH", "درجة الحموضة"], "st": [["Acidophiles : pH inférieur à 6. Ce sont surtout les levures et les moisissures.", "Neutrophiles : pH de 5,5 à 8,5. C'est la plupart des bactéries.", "Alcalophiles (basophiles) : pH supérieur à 8, par exemple les Pseudomonas.", "Acidifier un produit écarte les bactéries et donc la plupart des pathogènes, mais laisse la place aux levures et moisissures : un yaourt ne donne pas d'intoxication, mais il peut moisir."], ["محبّة الحموضة (acidophiles): pH أقل من 6. إنها خاصة الخمائر والعفن.", "محبّة التعادل (neutrophiles): pH من 5,5 إلى 8,5. أغلب البكتيريا.", "محبّة القاعدية (alcalophiles): pH أكبر من 8، مثل Pseudomonas.", "تحميض المنتوج يُبعد البكتيريا وبالتالي أغلب الممرضات، لكنه يترك المجال للخمائر والعفن: الياغورت لا يسبب تسممًا، لكنه قد يتعفّن."]], "k": ["Acidifier écarte les bactéries, pas les moisissures.", "التحميض يُبعد البكتيريا، وليس العفن."], "q": ["Pourquoi un yaourt peut-il moisir ?", "لماذا قد يتعفّن الياغورت؟"], "o": [["Les moisissures sont acidophiles", "Les moisissures sont thermophiles", "Le yaourt est neutre"], ["لأن العفن محبّ للحموضة", "لأن العفن محبّ للحرارة", "لأن الياغورت متعادل"]], "a": 0, "w": ["Levures et moisissures aiment l'acide.", "الخمائر والعفن تحب الوسط الحمضي."]}, {"img": "s07_14", "t": ["Le pH des aliments", "درجة حموضة الأغذية"], "st": [["Viandes et poissons : pH de 5,5 à 6,5. C'est la zone neutrophile, donc bactérienne : ce sont les produits les plus à risque.", "Légumes : pH de 4,5 à 6,5 selon l'espèce. Passer sous pH 4,5 est la limite classique des conserves.", "Fruits et produits acides (citron, pomme, orange) : pH de 2,9 à 4,5. Zone acidophile : levures et moisissures plutôt que bactéries."], ["اللحوم والأسماك: pH من 5,5 إلى 6,5. إنها منطقة التعادل، أي منطقة البكتيريا: هي المنتجات الأكثر خطورة.", "الخضر: pH من 4,5 إلى 6,5 حسب النوع. النزول تحت pH 4,5 هو الحد الكلاسيكي للمصبّرات.", "الفواكه والمنتجات الحمضية (الليمون، التفاح، البرتقال): pH من 2,9 إلى 4,5. منطقة محبّة الحموضة: خمائر وعفن بدل البكتيريا."]], "k": ["pH 4,5 : la frontière des conserves.", "pH 4,5: حدّ المصبّرات."], "q": ["Quels produits sont les plus exposés aux bactéries ?", "أيّ المنتجات الأكثر عرضة للبكتيريا؟"], "o": [["Les agrumes", "Les viandes et poissons", "Les confitures"], ["الحوامض", "اللحوم والأسماك", "المربى"]], "a": 1, "w": ["Leur pH (5,5 à 6,5) est dans la zone des bactéries neutrophiles.", "درجة حموضتها (5,5 إلى 6,5) في منطقة البكتيريا محبّة التعادل."]}, {"img": "s07_16", "t": ["L'oxygène", "الأكسجين"], "st": [["Aérobies : ne se développent qu'en présence d'air. Ils colonisent les surfaces (moisissures, Pseudomonas).", "Anaérobies : ne se développent qu'en absence d'oxygène, au cœur du produit. Exemple : Clostridium, dont C. botulinum.", "Aéro-anaérobies facultatifs : vivent avec ou sans oxygène (levures, beaucoup d'entérobactéries). Ce sont les plus difficiles à maîtriser : aucun conditionnement ne les arrête."], ["الهوائية (aérobies): لا تنمو إلا بوجود الهواء. تستعمر الأسطح (العفن، Pseudomonas).", "اللاهوائية (anaérobies): لا تنمو إلا في غياب الأكسجين، في قلب المنتوج. مثال: Clostridium، ومنها C. botulinum.", "الهوائية اللاهوائية الاختيارية (aéro-anaérobies facultatifs): تعيش مع الأكسجين أو بدونه (الخمائر، كثير من البكتيريا المعوية). هي الأصعب في التحكم: لا يوقفها أي تغليف."]], "k": ["Le vide arrête les aérobies… mais pas les anaérobies.", "التفريغ من الهواء يوقف الهوائية… لكن ليس اللاهوائية."], "q": ["Clostridium botulinum est :", "Clostridium botulinum هي:"], "o": [["aérobie strict", "anaérobie", "phototrophe"], ["هوائية إجبارية", "لاهوائية", "ضوئية التغذية"]], "a": 1, "w": ["Il pousse à l'abri de l'air, au cœur des conserves.", "تنمو بعيدًا عن الهواء، في قلب المصبّرات."]}, {"img": "s07_18", "t": ["L'activité de l'eau (Aw)", "نشاط الماء (Aw)"], "st": [["L'Aw mesure l'eau libre, celle que le micro-organisme peut réellement utiliser, et non l'eau totale.", "Xérophiles : poussent dans les produits à faible activité de l'eau.", "Halophiles : poussent dans les milieux fortement salés. Osmophiles : poussent dans les milieux sucrés.", "Dans une confiture, le sucre fait chuter l'Aw ; seuls des osmophiles finissent par apparaître sur une confiture ouverte."], ["Aw يقيس الماء الحر، أي الماء الذي يستطيع الكائن الدقيق استعماله فعلًا، وليس الماء الكلي.", "Xérophiles: تنمو في المنتجات ذات نشاط ماء ضعيف.", "Halophiles: تنمو في الأوساط المالحة جدًا. Osmophiles: تنمو في الأوساط السكرية.", "في المربى، السكر يخفض Aw؛ ولا يظهر في النهاية على المربى المفتوح إلا المحبّة للسكر (osmophiles)."]], "k": ["L'eau libre décide, pas l'eau totale.", "الماء الحر هو الذي يقرر، وليس الماء الكلي."], "q": ["Un micro-organisme qui pousse dans la saumure est :", "كائن دقيق ينمو في محلول الملح هو:"], "o": [["osmophile", "halophile", "thermophile"], ["osmophile", "halophile", "thermophile"]], "a": 1, "w": ["Halo = sel.", "Halo = الملح."]}, {"img": "s07_22", "t": ["La pression osmotique", "الضغط الأسموزي"], "st": [["Milieu isotonique : même concentration dedans et dehors, c'est l'équilibre.", "Milieu hypotonique : moins concentré que la cellule. L'eau entre, la cellule gonfle : turgescence.", "Milieu hypertonique : plus concentré que la cellule. L'eau sort, la cellule se rétracte : plasmolyse.", "La plupart des bactéries y sont presque insensibles : leur paroi rigide les protège."], ["وسط متساوي التوتر (isotonique): نفس التركيز داخل الخلية وخارجها، إنه التوازن.", "وسط ناقص التوتر (hypotonique): أقل تركيزًا من الخلية. يدخل الماء وتنتفخ الخلية: الانتباج (turgescence).", "وسط مفرط التوتر (hypertonique): أكثر تركيزًا من الخلية. يخرج الماء وتنكمش الخلية: البلزمة (plasmolyse).", "أغلب البكتيريا تكاد لا تتأثر: جدارها الصلب يحميها."]], "k": ["Hypertonique → plasmolyse ; hypotonique → turgescence.", "مفرط التوتر ← بلزمة؛ ناقص التوتر ← انتباج."], "q": ["Dans un milieu hypertonique, la cellule :", "في وسط مفرط التوتر، الخلية:"], "o": [["gonfle", "se rétracte (plasmolyse)", "reste identique"], ["تنتفخ", "تنكمش (بلزمة)", "تبقى كما هي"]], "a": 1, "w": ["L'eau sort vers le milieu plus concentré.", "يخرج الماء نحو الوسط الأكثر تركيزًا."]}, {"img": "s07_24", "t": ["Les cinq facteurs, cinq leviers", "خمسة عوامل، خمس رافعات"], "st": [["Température : la chaîne du froid et les barèmes thermiques.", "pH : la formulation — acidifier écarte les bactéries.", "Oxygène : le conditionnement — sous vide ou atmosphère modifiée.", "Activité de l'eau : sécher, saler, sucrer. Pression osmotique : peu de prise, la paroi protège la bactérie. Aucun levier ne suffit seul : on les combine."], ["درجة الحرارة: سلسلة التبريد والمعايير الحرارية.", "درجة الحموضة: التركيبة — التحميض يُبعد البكتيريا.", "الأكسجين: التغليف — تحت الفراغ أو في جو معدّل.", "نشاط الماء: التجفيف، التمليح، التسكير. الضغط الأسموزي: تأثير ضعيف، الجدار يحمي البكتيريا. لا رافعة تكفي وحدها: نجمع بينها."]], "k": ["Régler un facteur, c'est choisir la flore qui pourra pousser.", "ضبط عامل يعني اختيار الفلورا التي ستنمو."], "q": ["Saler un poisson agit sur :", "تمليح السمك يؤثر على:"], "o": [["la température", "l'activité de l'eau", "l'oxygène"], ["درجة الحرارة", "نشاط الماء", "الأكسجين"]], "a": 1, "w": ["Le sel lie l'eau et abaisse l'Aw.", "الملح يربط الماء ويخفض Aw."]}]}, {"n": 8, "t": ["Milieux de culture, ensemencement et colonies", "أوساط الزرع، الزرع والمستعمرات"], "c": [{"img": "s08_07", "t": ["Qu'est-ce qu'un milieu de culture ?", "ما هو وسط الزرع؟"], "st": [["Un milieu de culture est une préparation dans laquelle des micro-organismes peuvent se multiplier.", "Condition 1 : couvrir les besoins élémentaires et les facteurs de croissance du germe étudié.", "Condition 2 : être isotonique, sinon la cellule éclate ou se rétracte.", "Condition 3 : avoir un pH proche de l'optimum du germe."], ["وسط الزرع (milieu de culture) تحضير يمكن للكائنات الدقيقة أن تتكاثر فيه.", "الشرط 1: تغطية الحاجيات الأساسية وعوامل النمو للجرثومة المدروسة.", "الشرط 2: أن يكون متساوي التوتر (isotonique)، وإلا انفجرت الخلية أو انكمشت.", "الشرط 3: أن يكون له pH قريب من الأمثل للجرثومة."]], "k": ["Besoins, isotonie, pH : les trois conditions viennent des séances 6 et 7.", "الحاجيات، تساوي التوتر، pH: الشروط الثلاثة مستمدة من الحصتين 6 و7."], "q": ["Laquelle n'est PAS une condition d'un bon milieu ?", "أيّها ليس شرطًا لوسط زرع جيد؟"], "o": [["Être isotonique", "Avoir le bon pH", "Être coloré en rouge"], ["أن يكون متساوي التوتر", "أن يكون له pH المناسب", "أن يكون ملوّنًا بالأحمر"]], "a": 2, "w": ["Les trois conditions : besoins couverts, isotonie, pH.", "الشروط الثلاثة: تغطية الحاجيات، تساوي التوتر، pH."]}, {"img": "s08_09", "t": ["Milieu liquide et milieu solide", "الوسط السائل والوسط الصلب"], "st": [["Le bouillon (liquide) : la croissance se voit par un trouble, le liquide passe de limpide à trouble. On constate, on ne compte pas.", "La gélose (solide) : la croissance donne des colonies visibles à l'œil nu. On compte, donc on dénombre.", "Incubation typique : 18 à 24 heures, le plus souvent à 37 °C.", "Sur gélose, chaque bactérie reste où elle est tombée et se multiplie sur place : c'est ce qui rend le dénombrement possible."], ["المرق (bouillon) السائل: يظهر النمو بالعكارة، يتحول السائل من صافٍ إلى عكر. نلاحظ ولا نعدّ.", "الآغار (gélose) الصلب: يعطي النمو مستعمرات (colonies) مرئية بالعين. نعدّ، إذن نحصي.", "الحضن النموذجي: 18 إلى 24 ساعة، غالبًا في 37 درجة.", "على الآغار، تبقى كل بكتيريا حيث سقطت وتتكاثر في مكانها: هذا ما يجعل الإحصاء ممكنًا."]], "k": ["Liquide = trouble ; solide = colonies.", "سائل = عكارة؛ صلب = مستعمرات."], "q": ["Dans un bouillon, la croissance se voit par :", "في المرق، يظهر النمو بـ:"], "o": [["des colonies", "un trouble", "un changement de couleur obligatoire"], ["مستعمرات", "عكارة", "تغيّر إجباري في اللون"]], "a": 1, "w": ["Le liquide limpide devient trouble.", "السائل الصافي يصبح عكرًا."]}, {"img": "s08_11", "t": ["Une bactérie, une colonie", "بكتيريا واحدة، مستعمرة واحدة"], "st": [["On ensemence une bactérie invisible sur la gélose.", "À l'étuve, elle se divise sur place, sans se déplacer.", "On obtient une colonie visible : plusieurs millions de cellules, toutes filles de la même mère.", "Une colonie est donc un clone : c'est la base du dénombrement en UFC (unités formant colonie)."], ["نزرع بكتيريا غير مرئية على الآغار.", "في الحاضنة، تنقسم في مكانها دون أن تتحرك.", "نحصل على مستعمرة مرئية: عدة ملايين من الخلايا، كلها بنات نفس الأم.", "المستعمرة إذن نسيلة (clone): هذا أساس الإحصاء بـ UFC (وحدات مكوّنة لمستعمرة)."]], "k": ["Une colonie = un clone issu d'une seule cellule.", "مستعمرة = نسيلة ناتجة عن خلية واحدة."], "q": ["Une colonie correspond à :", "المستعمرة تعني:"], "o": [["un mélange d'espèces", "la descendance d'une seule cellule", "un milieu de culture"], ["خليطًا من الأنواع", "نسل خلية واحدة", "وسط زرع"]], "a": 1, "w": ["Toutes les cellules d'une colonie descendent de la même bactérie.", "كل خلايا المستعمرة تنحدر من نفس البكتيريا."]}, {"img": "s08_13", "t": ["Les milieux synthétiques", "الأوساط الاصطناعية"], "st": [["Leur composition est exactement connue, conçue pour un germe ou un groupe voisin.", "Exemple pour E. coli : glucose 1 g (carbone et énergie), phosphates 10,5 g et 3,5 g (phosphore et tampon de pH), NH₄Cl 0,5 g (azote), sels et oligo-éléments, eau distillée pour 1 litre.", "Ils sont peu utilisés en microbiologie alimentaire : on connaît rarement à l'avance le germe exact, et ils sont trop pauvres pour les germes exigeants."], ["تركيبها معروف بالضبط، مصمّم لجرثومة أو مجموعة متقاربة.", "مثال لـ E. coli: غلوكوز 1 غ (الكربون والطاقة)، فوسفات 10,5 غ و3,5 غ (الفوسفور ومنظّم pH)، NH₄Cl 0,5 غ (الآزوت)، أملاح وعناصر نادرة، ماء مقطّر حتى 1 لتر.", "قليلة الاستعمال في الميكروبيولوجيا الغذائية: نادرًا ما نعرف مسبقًا الجرثومة بالضبط، وهي فقيرة جدًا بالنسبة للجراثيم المتطلبة."]], "k": ["Synthétique = composition exactement connue.", "اصطناعي = تركيب معروف بالضبط."], "q": ["Dans le milieu pour E. coli, le NH₄Cl apporte :", "في وسط E. coli، يوفّر NH₄Cl:"], "o": [["le carbone", "l'azote", "le phosphore"], ["الكربون", "الآزوت", "الفوسفور"]], "a": 1, "w": ["NH₄ = ammonium, source d'azote.", "NH₄ = الأمونيوم، مصدر الآزوت."]}, {"img": "s08_15", "t": ["Les milieux empiriques de base", "الأوساط التجريبية الأساسية"], "st": [["On y ajoute des composés qui favorisent la croissance : ce sont les milieux les plus utilisés en microbiologie alimentaire.", "L'extrait de viande : macération de viande bouillie 15 à 20 minutes, filtrée puis concentrée.", "Les extraits de levure : issus de l'hydrolyse de levures de boulangerie.", "Les peptones : dégradation de protéines (viande, caséine, soja) par des enzymes (pepsine, pancréatine, papaïne)."], ["نضيف إليها مركبات تشجّع النمو: إنها الأوساط الأكثر استعمالًا في الميكروبيولوجيا الغذائية.", "مستخلص اللحم: نقع لحم مغلي 15 إلى 20 دقيقة، مُصفّى ثم مركّز.", "مستخلصات الخميرة: ناتجة عن تحلّل خمائر الخبز.", "الببتونات (peptones): تحلّل بروتينات (لحم، كازين، صوجا) بواسطة إنزيمات (البيبسين، البنكرياتين، البابايين)."]], "k": ["Empirique = les plus utilisés en IAA.", "التجريبية = الأكثر استعمالًا في الصناعات الغذائية."], "q": ["Les peptones sont obtenues par :", "الببتونات تُحصَّل بـ:"], "o": [["cuisson du sucre", "dégradation enzymatique de protéines", "distillation de l'eau"], ["طبخ السكر", "التحلل الإنزيمي للبروتينات", "تقطير الماء"]], "a": 1, "w": ["Pepsine, pancréatine ou papaïne coupent les protéines.", "البيبسين أو البنكرياتين أو البابايين تقطّع البروتينات."]}, {"img": "s08_17", "t": ["Milieu enrichi", "الوسط المُغنى"], "st": [["On ajoute au milieu de base du sang de cheval ou de mouton, du sérum ou des suppléments vitaminés.", "Ces additifs apportent de nombreux facteurs de croissance.", "Il sert aux germes exigeants, qui poussent mal sur un milieu de base : les auxotrophes de la séance 6.", "En une phrase : « on ajoute pour faire pousser »."], ["نضيف إلى الوسط الأساسي دم الحصان أو الغنم، أو المصل، أو مكمّلات فيتامينية.", "هذه الإضافات توفر عوامل نمو كثيرة.", "يُستعمل للجراثيم المتطلبة التي تنمو بصعوبة على الوسط الأساسي: الـ auxotrophes من الحصة 6.", "في جملة: «نضيف لكي ينمو»."]], "k": ["Enrichi = on ajoute pour faire pousser.", "المُغنى = نضيف لكي ينمو."], "q": ["Un milieu enrichi au sang sert surtout à cultiver :", "الوسط المُغنى بالدم يُستعمل أساسًا لزرع:"], "o": [["les germes exigeants", "les virus", "les prions"], ["الجراثيم المتطلبة", "الفيروسات", "البريونات"]], "a": 0, "w": ["Le sang apporte des facteurs de croissance.", "الدم يوفّر عوامل النمو."]}, {"img": "s08_18", "t": ["Milieu sélectif", "الوسط الانتقائي"], "st": [["On ajoute au milieu de base des inhibiteurs : antibiotiques ou antiseptiques.", "Seuls les micro-organismes résistants à ces inhibiteurs peuvent se développer.", "Il sert à isoler un germe précis au milieu d'une flore abondante.", "Exemple : chercher Salmonella dans une viande, c'est chercher quelques cellules parmi des millions — impossible sans milieu sélectif."], ["نضيف إلى الوسط الأساسي مثبّطات: مضادات حيوية أو مطهّرات.", "لا تنمو إلا الكائنات الدقيقة المقاومة لهذه المثبطات.", "يُستعمل لعزل جرثومة محددة وسط فلورا كثيفة.", "مثال: البحث عن Salmonella في اللحم يعني البحث عن بضع خلايا بين الملايين — مستحيل دون وسط انتقائي."]], "k": ["Sélectif = on ajoute pour empêcher.", "الانتقائي = نضيف لكي نمنع."], "q": ["Pour rechercher Salmonella dans une viande, on utilise :", "للبحث عن Salmonella في اللحم نستعمل:"], "o": [["un milieu synthétique", "un milieu sélectif", "un bouillon sans rien"], ["وسطًا اصطناعيًا", "وسطًا انتقائيًا", "مرقًا دون أي إضافة"]], "a": 1, "w": ["Les inhibiteurs bloquent la flore abondante et laissent pousser le germe cherché.", "المثبطات توقف الفلورا الكثيفة وتترك الجرثومة المطلوبة تنمو."]}]}, {"n": 9, "t": ["La croissance bactérienne et le dénombrement", "النمو البكتيري والإحصاء"], "c": [{"img": "s09_03", "t": ["Huit heures, et combien de bactéries ?", "ثماني ساعات، وكم بكتيريا؟"], "st": [["On ensemence une seule bactérie dans un milieu favorable, à sa température optimale.", "Elle se divise en deux toutes les 20 minutes, puis chaque fille se divise à son tour.", "En 8 heures, cela fait 24 divisions : 2²⁴, soit plus de 16 millions de bactéries à partir d'une seule.", "C'est pourquoi un aliment laissé deux heures à température ambiante n'est plus le même produit."], ["نزرع بكتيريا واحدة في وسط ملائم، في درجة حرارتها المثلى.", "تنقسم إلى اثنتين كل 20 دقيقة، ثم تنقسم كل بنت بدورها.", "في 8 ساعات، يصبح ذلك 24 انقسامًا: 2²⁴، أي أكثر من 16 مليون بكتيريا انطلاقًا من واحدة.", "لهذا فإن غذاءً تُرك ساعتين في درجة حرارة الغرفة لم يعد نفس المنتوج."]], "k": ["Une cellule toutes les 20 min → 16 millions en 8 heures.", "انقسام كل 20 دقيقة ← 16 مليونًا في 8 ساعات."], "q": ["Combien de divisions en 8 heures si G = 20 minutes ?", "كم انقسامًا في 8 ساعات إذا كان G = 20 دقيقة؟"], "o": [["8", "16", "24"], ["8", "16", "24"]], "a": 2, "w": ["8 h = 480 min ; 480 ÷ 20 = 24 générations.", "8 ساعات = 480 دقيقة؛ 480 ÷ 20 = 24 جيلًا."]}, {"img": "s09_09", "t": ["Le temps de génération G", "زمن الجيل G"], "st": [["G est l'intervalle de temps entre deux divisions : le temps nécessaire pour que la population double.", "Formule : G = t / n (t = durée, n = nombre de générations), en minutes ou en heures.", "Pour la majorité des bactéries, G vaut 1 à 3 heures ; 20 minutes en conditions idéales ; plus de 24 heures pour certaines espèces.", "Plus G est court, plus vite le produit est perdu : c'est ce paramètre qui décide de la durée de vie d'un aliment."], ["G هو الفاصل الزمني بين انقسامين: الوقت اللازم لتضاعف الساكنة.", "الصيغة: G = t / n (t = المدة، n = عدد الأجيال)، بالدقائق أو بالساعات.", "عند أغلب البكتيريا، G يساوي 1 إلى 3 ساعات؛ 20 دقيقة في الظروف المثالية؛ أكثر من 24 ساعة عند بعض الأنواع.", "كلما كان G قصيرًا، ضاع المنتوج بسرعة: هذا المعيار هو الذي يحدد مدة صلاحية الغذاء."]], "k": ["G court = danger rapide.", "G قصير = خطر سريع."], "q": ["En 3 heures, une population a fait 6 générations. G vaut :", "في 3 ساعات، قامت الساكنة بـ 6 أجيال. G يساوي:"], "o": [["20 minutes", "30 minutes", "2 heures"], ["20 دقيقة", "30 دقيقة", "ساعتين"]], "a": 1, "w": ["G = t/n = 180 min ÷ 6 = 30 min.", "G = t/n = 180 دقيقة ÷ 6 = 30 دقيقة."]}, {"img": "s09_11", "t": ["Le taux de croissance µ", "معدل النمو µ"], "st": [["µ est le nombre de générations par unité de temps : µ = n / t.", "C'est l'inverse du temps de génération : µ = 1 / G, en min⁻¹ ou en h⁻¹.", "Exemple : E. coli a un G de 20 minutes ; en une heure, µ = 3 h⁻¹ (trois divisions par heure).", "G est une durée, µ est une vitesse : attention à garder des unités cohérentes."], ["µ هو عدد الأجيال في وحدة الزمن: µ = n / t.", "إنه مقلوب زمن الجيل: µ = 1 / G، بـ min⁻¹ أو h⁻¹.", "مثال: E. coli لها G يساوي 20 دقيقة؛ في ساعة واحدة µ = 3 h⁻¹ (ثلاثة انقسامات في الساعة).", "G مدة، و µ سرعة: انتبه للحفاظ على وحدات متناسقة."]], "k": ["µ = 1 / G.", "µ = 1 / G."], "q": ["Si G = 30 minutes, µ vaut :", "إذا كان G = 30 دقيقة، فإن µ يساوي:"], "o": [["0,5 h⁻¹", "2 h⁻¹", "30 h⁻¹"], ["0,5 h⁻¹", "2 h⁻¹", "30 h⁻¹"]], "a": 1, "w": ["30 min = 0,5 h ; µ = 1 ÷ 0,5 = 2 divisions par heure.", "30 دقيقة = 0,5 ساعة؛ µ = 1 ÷ 0,5 = انقسامان في الساعة."]}, {"img": "s09_15", "t": ["La loi de croissance", "قانون النمو"], "st": [["Après n générations, la population est multipliée par 2ⁿ.", "Or n = µ × t. On obtient la loi : N = N₀ × 2^(µt), avec N₀ la concentration de départ.", "En passant au logarithme : Ln N = µ·t·Ln 2 + Ln N₀, l'équation d'une droite.", "N se mesure en comptant des colonies sur gélose ou en mesurant le trouble d'un milieu liquide au spectrophotomètre."], ["بعد n جيلًا، تتضاعف الساكنة بـ 2ⁿ.", "و n = µ × t. نحصل على القانون: N = N₀ × 2^(µt)، حيث N₀ التركيز الأولي.", "بأخذ اللوغاريتم: Ln N = µ·t·Ln 2 + Ln N₀، وهي معادلة مستقيم.", "يُقاس N بعدّ المستعمرات على الآغار أو بقياس عكارة الوسط السائل بجهاز المطياف الضوئي (spectrophotomètre)."]], "k": ["N = N₀ × 2^(µt).", "N = N₀ × 2^(µt)."], "q": ["N₀ = 100 UFC/mL, µ = 3 h⁻¹, t = 2 h. N vaut :", "N₀ = 100 UFC/mL، µ = 3 h⁻¹، t = 2 ساعة. N يساوي:"], "o": [["600 UFC/mL", "6 400 UFC/mL", "800 UFC/mL"], ["600 UFC/mL", "6 400 UFC/mL", "800 UFC/mL"]], "a": 1, "w": ["µt = 6 ; 2⁶ = 64 ; 100 × 64 = 6 400.", "µt = 6؛ 2⁶ = 64؛ 100 × 64 = 6 400."]}, {"img": "s09_19", "t": ["La courbe de croissance en six phases", "منحنى النمو في ست مراحل"], "st": [["En culture fermée (batch), le milieu contient une quantité fixe de nutriments : rien n'entre, rien ne sort.", "On trace le logarithme de la masse bactérienne en fonction du temps : six phases se succèdent.", "Latence → accélération → exponentielle → ralentissement → stationnaire → déclin.", "Comme rien n'est réapprovisionné, la courbe finit par redescendre. Un aliment est un système fermé. Cette courbe tombe au contrôle n° 2."], ["في الزرع المغلق (batch)، يحتوي الوسط على كمية ثابتة من المغذيات: لا شيء يدخل، لا شيء يخرج.", "نرسم لوغاريتم الكتلة البكتيرية بدلالة الزمن: تتعاقب ست مراحل.", "الكمون ← التسارع ← الأسّية ← التباطؤ ← الاستقرار ← الانحدار.", "لأنه لا يُعاد التزويد، ينتهي المنحنى بالنزول. الغذاء نظام مغلق. هذا المنحنى يأتي في المراقبة رقم 2."]], "k": ["Six phases, à savoir tracer et annoter de mémoire.", "ست مراحل، يجب معرفة رسمها وتسميتها من الذاكرة."], "q": ["Quelle est la première phase de la courbe ?", "ما هي المرحلة الأولى في المنحنى؟"], "o": [["Exponentielle", "Latence", "Stationnaire"], ["الأسّية", "الكمون", "الاستقرار"]], "a": 1, "w": ["Au début, les bactéries s'adaptent sans se diviser.", "في البداية، تتكيف البكتيريا دون أن تنقسم."]}, {"img": "s09_21", "t": ["Latence, accélération, exponentielle", "الكمون، التسارع، الأسّية"], "st": [["Latence (µ = 0) : pas de division ; les bactéries s'adaptent et fabriquent les enzymes adaptées au milieu.", "Accélération : la division commence, µ devient positif et augmente.", "Exponentielle (µ = µmax) : les bactéries se divisent sans arrêt, le temps de génération est le plus court.", "La latence est la seule phase que l'atelier peut allonger, par le froid ou l'acidité : c'est tout l'enjeu de la conservation."], ["الكمون (µ = 0): لا انقسام؛ تتكيف البكتيريا وتصنع الإنزيمات الملائمة للوسط.", "التسارع: يبدأ الانقسام، يصبح µ موجبًا ويزداد.", "الأسّية (µ = µmax): تنقسم البكتيريا دون توقف، وزمن الجيل في أقصره.", "الكمون هو المرحلة الوحيدة التي يمكن للورشة إطالتها، بالبرودة أو بالحموضة: هذا هو رهان الحفظ كله."]], "k": ["Allonger la latence, c'est gagner du temps de conservation.", "إطالة الكمون تعني ربح وقت الحفظ."], "q": ["Dans quelle phase µ est-il maximal ?", "في أيّ مرحلة يكون µ في أقصاه؟"], "o": [["Latence", "Exponentielle", "Déclin"], ["الكمون", "الأسّية", "الانحدار"]], "a": 1, "w": ["Division continue, G le plus court.", "انقسام متواصل، G في أقصره."]}, {"img": "s09_23", "t": ["Ralentissement, stationnaire, déclin", "التباطؤ، الاستقرار، الانحدار"], "st": [["Ralentissement : la masse augmente moins vite, µ diminue.", "Stationnaire (µ = 0) : autant de nouvelles bactéries que de mortes, c'est l'équilibre.", "Déclin : les morts dépassent les naissances, la population diminue.", "Pourquoi l'exponentielle s'arrête : un élément essentiel s'épuise (C, N, P…), des produits toxiques s'accumulent, ou le pH et la température changent. C'est le facteur limitant."], ["التباطؤ: تزداد الكتلة بسرعة أقل، µ ينخفض.", "الاستقرار (µ = 0): عدد البكتيريا الجديدة يساوي عدد الميتة، إنه التوازن.", "الانحدار: الوفيات تفوق الولادات، تنخفض الساكنة.", "لماذا تتوقف المرحلة الأسّية: ينفد عنصر أساسي (C، N، P…)، تتراكم نواتج سامة، أو يتغير pH والحرارة. إنه العامل المحدِّد (facteur limitant)."]], "k": ["Facteur limitant : ce qui arrête la croissance.", "العامل المحدِّد: ما يوقف النمو."], "q": ["En phase stationnaire :", "في مرحلة الاستقرار:"], "o": [["il n'y a plus aucune bactérie", "les naissances égalent les morts", "µ est maximal"], ["لم تعد توجد أي بكتيريا", "الولادات تساوي الوفيات", "µ في أقصاه"]], "a": 1, "w": ["µ = 0 : équilibre entre divisions et morts.", "µ = 0: توازن بين الانقسامات والوفيات."]}, {"img": "s09_27", "t": ["Le comptage en cellule de Thoma ou de Malassez", "العدّ في خلية توما أو مالاسي"], "st": [["On place l'échantillon dans une grille gravée de volume connu, et on l'observe au microscope.", "On compte les cellules dans plusieurs grands carrés, on fait la moyenne, puis on extrapole au millilitre.", "Limite : on compte toutes les cellules, vivantes et mortes. C'est un dénombrement total et direct.", "Il sert pour les bactéries, les levures et les cellules sanguines."], ["نضع العيّنة في شبكة محفورة ذات حجم معروف، ونلاحظها بالمجهر.", "نعدّ الخلايا في عدة مربعات كبيرة، نحسب المتوسط، ثم نستنتج العدد في الميليلتر.", "الحد: نعدّ كل الخلايا، الحية والميتة. إنه إحصاء كلي ومباشر.", "يُستعمل للبكتيريا والخمائر وخلايا الدم."]], "k": ["Thoma/Malassez = total (vivantes + mortes).", "توما/مالاسي = كلي (حية + ميتة)."], "q": ["La cellule de Malassez compte :", "خلية مالاسي تعدّ:"], "o": [["seulement les bactéries vivantes", "toutes les cellules, vivantes et mortes", "seulement les spores"], ["البكتيريا الحية فقط", "كل الخلايا، الحية والميتة", "الأبواغ فقط"]], "a": 1, "w": ["Au microscope, on ne distingue pas les vivantes des mortes.", "بالمجهر لا نميّز الحية من الميتة."]}, {"img": "s09_31", "t": ["Les dilutions décimales", "التخفيفات العشرية"], "st": [["On prépare des tubes de 9 mL d'eau physiologique stérile.", "On transfère 1 mL de tube en tube : chaque tube divise la concentration par dix (10⁻¹, 10⁻², 10⁻³…).", "L'eau physiologique est isotonique : dans l'eau distillée, les cellules gonfleraient et éclateraient avant d'être comptées.", "Diluer sert à obtenir une boîte « comptable », où les colonies sont bien séparées."], ["نحضّر أنابيب فيها 9 مل من الماء الفيزيولوجي المعقّم.", "ننقل 1 مل من أنبوب إلى آخر: كل أنبوب يقسم التركيز على عشرة (10⁻¹، 10⁻²، 10⁻³…).", "الماء الفيزيولوجي متساوي التوتر: في الماء المقطّر تنتفخ الخلايا وتنفجر قبل أن تُعدّ.", "التخفيف يهدف إلى الحصول على علبة «قابلة للعدّ»، حيث المستعمرات منفصلة جيدًا."]], "k": ["1 mL dans 9 mL = dilution au 1/10.", "1 مل في 9 مل = تخفيف بـ 1/10."], "q": ["Pourquoi utilise-t-on de l'eau physiologique ?", "لماذا نستعمل الماء الفيزيولوجي؟"], "o": [["Pour nourrir les bactéries", "Parce qu'elle est isotonique", "Pour colorer les colonies"], ["لتغذية البكتيريا", "لأنه متساوي التوتر", "لتلوين المستعمرات"]], "a": 1, "w": ["Elle évite l'éclatement des cellules.", "يمنع انفجار الخلايا."]}, {"img": "s09_35", "t": ["La règle des 15 à 300", "قاعدة 15 إلى 300"], "st": [["On mélange 1 mL de chaque dilution avec de la gélose fondue à 40-45 °C, on incube 18 h à 37 °C, puis on compte.", "Plus de 300 colonies : elles sont confluentes, le comptage est faux. Moins de 15 : l'incertitude est trop forte.", "On ne retient que la boîte qui porte entre 15 et 300 colonies.", "Calcul : C = (UFC comptées ÷ volume déposé) × facteur de dilution. Exemple : 33 UFC, 0,1 mL, dilution 10⁻⁴ → 33 ÷ 0,1 × 10⁴ = 3,3 × 10⁶ UFC/mL."], ["نخلط 1 مل من كل تخفيف مع آغار مذاب في 40-45 درجة، نحضن 18 ساعة في 37 درجة، ثم نعدّ.", "أكثر من 300 مستعمرة: تكون متلاصقة والعدّ خاطئ. أقل من 15: الشك كبير جدًا.", "لا نحتفظ إلا بالعلبة التي فيها بين 15 و300 مستعمرة.", "الحساب: C = (عدد UFC ÷ الحجم المزروع) × معامل التخفيف. مثال: 33 UFC، 0,1 مل، تخفيف 10⁻⁴ ← 33 ÷ 0,1 × 10⁴ = 3,3 × 10⁶ UFC/mL."]], "k": ["Une bactérie, une colonie, un nombre — entre 15 et 300.", "بكتيريا واحدة، مستعمرة واحدة، رقم واحد — بين 15 و300."], "q": ["Quelle boîte est exploitable ?", "أيّ علبة قابلة للاستغلال؟"], "o": [["Celle avec 450 colonies", "Celle avec 120 colonies", "Celle avec 6 colonies"], ["التي فيها 450 مستعمرة", "التي فيها 120 مستعمرة", "التي فيها 6 مستعمرات"]], "a": 1, "w": ["120 est entre 15 et 300.", "120 بين 15 و300."]}]}, {"n": 10, "t": ["Les flores alimentaires et les réservoirs de contamination", "الفلورا الغذائية ومستودعات التلوث"], "c": [{"img": "s10_03", "t": ["Un lait qui sort du pis est-il stérile ?", "هل الحليب الخارج من الضرع معقّم؟"], "st": [["Ce qu'on croit : un produit animal ou végétal non encore manipulé serait propre, la contamination viendrait seulement après.", "Ce qui est vrai : une partie de la flore est déjà présente dans ou sur le produit avant toute manipulation. C'est la flore originelle.", "Ce qui s'ajoute : en traversant l'atelier (mains, air, eau, matériel), le produit reçoit la flore de contamination.", "Deux flores, deux origines, et donc deux façons différentes d'agir dessus."], ["ما نعتقده: منتوج حيواني أو نباتي لم يُلمس بعد يكون نظيفًا، والتلوث يأتي بعد ذلك فقط.", "الحقيقة: جزء من الفلورا موجود أصلًا داخل المنتوج أو على سطحه قبل أي تداول. إنها الفلورا الأصلية (flore originelle).", "ما يُضاف: عند مروره بالورشة (الأيدي، الهواء، الماء، المعدات)، يستقبل المنتوج فلورا التلوث (flore de contamination).", "فلورتان، مصدران، وبالتالي طريقتان مختلفتان للتعامل معهما."]], "k": ["Flore originelle (déjà là) + flore de contamination (ajoutée).", "فلورا أصلية (موجودة مسبقًا) + فلورا تلوث (مضافة)."], "q": ["La pruine d'un raisin fraîchement cueilli est une flore :", "الغشاء الطبيعي (pruine) على العنب المقطوف حديثًا هو فلورا:"], "o": [["de contamination", "originelle", "pathogène"], ["تلوث", "أصلية", "ممرضة"]], "a": 1, "w": ["Elle est présente sur le fruit avant toute manipulation.", "موجودة على الفاكهة قبل أي تداول."]}, {"img": "s10_09", "t": ["La viande verdâtre de l'Aïd", "اللحم المخضرّ في عيد الأضحى"], "st": [["Cas des moutons de l'Aïd Al-Adha au Maroc (2017) : des carcasses ont pris une couleur verdâtre.", "Les germes étaient déjà dans l'appareil digestif de l'animal vivant ; ils passent dans la carcasse après l'abattage, car le système immunitaire s'arrête.", "Ils prolifèrent quand les conditions sont favorables : chaleur, carcasse humide, réfrigération retardée.", "La couleur verte vient surtout de Pseudomonas et de Clostridies. Les trois facteurs aggravants sont physiques (séance 7) : température, eau, temps."], ["حالة أكباش عيد الأضحى في المغرب (2017): أخذت ذبائح لونًا مخضرًّا.", "كانت الجراثيم موجودة أصلًا في الجهاز الهضمي للحيوان الحي؛ وتنتقل إلى الذبيحة بعد الذبح لأن الجهاز المناعي يتوقف.", "تتكاثر حين تكون الظروف ملائمة: الحرارة، الذبيحة الرطبة، التأخر في التبريد.", "اللون الأخضر ناتج أساسًا عن Pseudomonas والـ Clostridies. العوامل المفاقِمة الثلاثة فيزيائية (الحصة 7): الحرارة، الماء، الوقت."]], "k": ["Flore digestive = flore originelle de la carcasse. Réfrigérer vite !", "الفلورا الهضمية = الفلورا الأصلية للذبيحة. برّد بسرعة!"], "q": ["Quel geste aurait le plus limité le verdissement ?", "أيّ إجراء كان سيحدّ أكثر من الاخضرار؟"], "o": [["Laver la viande à l'eau chaude", "Réfrigérer rapidement la carcasse", "Saler la peau"], ["غسل اللحم بالماء الساخن", "تبريد الذبيحة بسرعة", "تمليح الجلد"]], "a": 1, "w": ["Le retard de réfrigération laisse les germes proliférer.", "التأخر في التبريد يترك الجراثيم تتكاثر."]}, {"img": "s10_11", "t": ["La flore des fruits", "فلورا الفواكه"], "st": [["Raisin : sa surface est couverte d'un film de micro-organismes, la pruine. Ce sont eux qui déclenchent la fermentation spontanée du moût.", "Framboise : même principe, la flore est portée par le fruit avant la récolte.", "Viande : la flore digestive devient la flore originelle de la carcasse dès l'abattage.", "Astuce : du vinaigre ou du bicarbonate de soude éliminent jusqu'à 98 % des bactéries de surface d'un fruit."], ["العنب: سطحه مغطى بغشاء من الكائنات الدقيقة يسمى pruine. هي التي تُطلق التخمر التلقائي للعصير (moût).", "التوت (framboise): نفس المبدأ، الفلورا تحملها الفاكهة قبل القطف.", "اللحم: الفلورا الهضمية تصبح الفلورا الأصلية للذبيحة منذ الذبح.", "نصيحة: الخل أو بيكربونات الصودا يزيلان حتى 98٪ من بكتيريا سطح الفاكهة."]], "k": ["La pruine : une flore originelle utile au vigneron.", "الـ pruine: فلورا أصلية مفيدة لصانع النبيذ."], "q": ["Qui déclenche la fermentation spontanée du moût de raisin ?", "من يُطلق التخمر التلقائي لعصير العنب؟"], "o": [["L'eau de lavage", "La pruine", "L'air de la cave uniquement"], ["ماء الغسل", "الـ pruine", "هواء القبو فقط"]], "a": 1, "w": ["Les micro-organismes de la pruine sont déjà sur le fruit.", "كائنات الـ pruine الدقيقة موجودة أصلًا على الفاكهة."]}, {"img": "s10_13", "t": ["La flore de l'eau", "فلورا الماء"], "st": [["Sans pollution : les bactéries viennent du sol et des plantes aquatiques — Pseudomonas, Flavobacterium, Acinetobacter.", "Avec pollution fécale (humaine ou animale) : l'eau se charge de germes intestinaux — entérobactéries, entérocoques, Clostridium.", "L'eau est le premier vecteur de l'atelier : Pseudomonas, coliformes, Listeria.", "Conséquence : l'eau de consommation ou d'usage industriel est traitée, classiquement par chloration."], ["دون تلوث: تأتي البكتيريا من التربة والنباتات المائية — Pseudomonas، Flavobacterium، Acinetobacter.", "مع تلوث برازي (بشري أو حيواني): يحمل الماء جراثيم معوية — البكتيريا المعوية (entérobactéries)، المكورات المعوية (entérocoques)، Clostridium.", "الماء هو الناقل الأول في الورشة: Pseudomonas، القولونيات (coliformes)، Listeria.", "النتيجة: ماء الشرب أو الماء الصناعي يُعالَج، عادةً بالكلورة (chloration)."]], "k": ["Entérobactéries dans l'eau = signe de pollution fécale.", "بكتيريا معوية في الماء = علامة تلوث برازي."], "q": ["Trouver des entérocoques dans l'eau indique :", "وجود المكورات المعوية في الماء يدل على:"], "o": [["une eau de source pure", "une pollution d'origine fécale", "un excès de chlore"], ["ماء عين نقي", "تلوث من أصل برازي", "فائض في الكلور"]], "a": 1, "w": ["Ce sont des germes intestinaux.", "إنها جراثيم معوية."]}, {"img": "s10_15", "t": ["Le sol et l'air", "التربة والهواء"], "st": [["Le sol est un réservoir riche et permanent : algues, bactéries, champignons. Exemples : Pseudomonas, Bacillus et Clostridium (sporulés), Micrococcus, Nitrobacter.", "L'air ne contient pas de nutriments : les germes ne peuvent ni s'y multiplier ni s'y installer.", "Dans l'air, ils voyagent accrochés à des poussières : Bacillus, Staphylococcus, spores de moisissures.", "La flore de l'air d'une salle dépend donc surtout de l'activité qui s'y déroule."], ["التربة مستودع غني ودائم: طحالب، بكتيريا، فطريات. أمثلة: Pseudomonas، Bacillus و Clostridium (مكوّنة للأبواغ)، Micrococcus، Nitrobacter.", "الهواء لا يحتوي على مغذيات: لا تستطيع الجراثيم أن تتكاثر فيه ولا أن تستقر.", "في الهواء، تسافر عالقة بالغبار: Bacillus، Staphylococcus، أبواغ العفن.", "فلورا هواء القاعة تتعلق إذن أساسًا بالنشاط الذي يجري فيها."]], "k": ["Sol = on y vit ; air = on y voyage.", "التربة = نعيش فيها؛ الهواء = نسافر فيه."], "q": ["Pourquoi les germes ne se multiplient-ils pas dans l'air ?", "لماذا لا تتكاثر الجراثيم في الهواء؟"], "o": [["Il fait trop froid", "L'air ne contient pas de nutriments", "L'air est trop acide"], ["لأنه بارد جدًا", "لأن الهواء لا يحتوي على مغذيات", "لأن الهواء حمضي جدًا"]], "a": 1, "w": ["Sans nourriture, pas de croissance : ils ne font que transiter.", "دون غذاء لا نمو: هي فقط تعبر."]}, {"img": "s10_17", "t": ["La flore des êtres vivants", "فلورا الكائنات الحية"], "st": [["Le réservoir qu'on oublie toujours : l'homme lui-même, le manipulateur.", "Sur la peau, les micro-organismes forment des micro-colonies dans les couches de l'épiderme.", "Au niveau des poils, on trouve surtout des anaérobies, protégés de l'air par le follicule.", "La flore commensale de l'homme est abondante : bouche, tube digestif, peau, voies respiratoires. D'où la tenue, le lavage des mains et le masque (séance 15)."], ["المستودع الذي ننساه دائمًا: الإنسان نفسه، أي العامل الذي يتداول الغذاء.", "على الجلد، تكوّن الكائنات الدقيقة مستعمرات صغيرة في طبقات البشرة.", "عند الشعر، نجد خاصة البكتيريا اللاهوائية، محمية من الهواء بالجريب (follicule).", "الفلورا المتعايشة للإنسان كثيفة: الفم، الجهاز الهضمي، الجلد، المجاري التنفسية. لذلك اللباس وغسل اليدين والقناع (الحصة 15)."]], "k": ["Tout manipulateur apporte sa propre flore à l'aliment.", "كل من يتداول الغذاء يحمل إليه فلورته الخاصة."], "q": ["Pourquoi porte-t-on un masque en atelier ?", "لماذا نضع القناع في الورشة؟"], "o": [["Pour se protéger du froid", "Parce que la bouche et les voies respiratoires sont des réservoirs", "Pour l'esthétique"], ["للحماية من البرد", "لأن الفم والمجاري التنفسية مستودعات للجراثيم", "للمظهر"]], "a": 1, "w": ["L'homme porte une flore abondante qu'il peut transmettre.", "الإنسان يحمل فلورا كثيفة يمكن أن ينقلها."]}, {"img": "s10_19", "t": ["Les réservoirs et leurs germes", "المستودعات وجراثيمها المميزة"], "st": [["Eau : Pseudomonas, Flavobacterium, Acinetobacter ; si pollution fécale, entérobactéries, entérocoques, Clostridium.", "Sol : Pseudomonas, Clostridium, Bacillus, Micrococcus, Nitrobacter. Les sporulés y survivent entre deux hôtes.", "Air : Bacillus, Staphylococcus, spores de moisissures sur les poussières.", "Homme et animaux : Staphylococcus (peau, voies respiratoires), entérobactéries (digestif), anaérobies (poils). Un germe trouvé en analyse permet de remonter à sa source."], ["الماء: Pseudomonas، Flavobacterium، Acinetobacter؛ وإذا كان هناك تلوث برازي: بكتيريا معوية، مكورات معوية، Clostridium.", "التربة: Pseudomonas، Clostridium، Bacillus، Micrococcus، Nitrobacter. المكوّنة للأبواغ تعيش فيها بين مضيفين.", "الهواء: Bacillus، Staphylococcus، أبواغ العفن على الغبار.", "الإنسان والحيوان: Staphylococcus (الجلد، المجاري التنفسية)، بكتيريا معوية (الجهاز الهضمي)، لاهوائية (الشعر). الجرثومة الموجودة في التحليل تسمح بالرجوع إلى مصدرها."]], "k": ["Clostridium → sol ou digestif ; Staphylococcus → manipulateur.", "Clostridium ← التربة أو الجهاز الهضمي؛ Staphylococcus ← العامل."], "q": ["Un Staphylococcus trouvé dans un produit oriente vers :", "وجود Staphylococcus في منتوج يوجّهنا نحو:"], "o": [["le sol", "le manipulateur", "l'eau de source"], ["التربة", "العامل الذي يتداول الغذاء", "ماء العين"]], "a": 1, "w": ["Staphylococcus vit sur la peau et dans les voies respiratoires.", "يعيش Staphylococcus على الجلد وفي المجاري التنفسية."]}]}, {"n": 11, "t": ["Relations hôte / micro-organisme et pouvoir pathogène", "علاقات المضيف والكائن الدقيق والقدرة المُمرضة"], "c": [{"img": "s11_10", "t": ["Le commensalisme  (+ / 0)", "التعايش (commensalisme) ‏(+ / 0)"], "st": [["L'hôte fournit une partie de sa nourriture au commensal : c'est un bénéfice non réciproque.", "Le commensal gagne (+), l'hôte ne gagne ni ne perd rien (0).", "Chez l'homme : flore commensale abondante (bouche, tube digestif, peau, voies respiratoires).", "Chez l'animal : les hérons garde-bœufs mangent les insectes dérangés par le bétail. Cette flore normale nous protège en occupant la place."], ["المضيف يمنح جزءًا من غذائه للمتعايش: إنها منفعة غير متبادلة.", "المتعايش يربح (+)، والمضيف لا يربح ولا يخسر (0).", "عند الإنسان: فلورا متعايشة كثيفة (الفم، الجهاز الهضمي، الجلد، المجاري التنفسية).", "عند الحيوان: طائر أبقر (héron garde-bœufs) يأكل الحشرات التي تزعجها الماشية. هذه الفلورا العادية تحمينا باحتلال المكان."]], "k": ["Commensalisme = + / 0.", "التعايش = + / 0."], "q": ["Dans le commensalisme, l'hôte :", "في التعايش، المضيف:"], "o": [["subit des dommages", "ne gagne ni ne perd rien", "tire aussi un avantage"], ["يتضرر", "لا يربح ولا يخسر", "يستفيد هو أيضًا"]], "a": 1, "w": ["Symbole + / 0 : seul le commensal profite.", "الرمز + / 0: المتعايش وحده يستفيد."]}, {"img": "s11_12", "t": ["La symbiose ou mutualisme  (+ / +)", "التكافل (symbiose) ‏(+ / +)"], "st": [["Les deux partenaires trouvent un avantage : protection, nutriments.", "Intestin humain : 1 000 à 1 150 espèces de bactéries, dont Escherichia coli, utiles à la digestion.", "Racines des légumineuses : Rhizobium fixe l'azote de l'air (moins d'engrais) et la plante lui donne des sucres.", "L'abeille se nourrit et permet à la fleur de se reproduire. Attention : E. coli, utile dans l'intestin, peut ailleurs devenir pathogène."], ["الشريكان كلاهما يستفيد: حماية، مغذيات.", "أمعاء الإنسان: 1 000 إلى 1 150 نوعًا من البكتيريا، منها Escherichia coli، مفيدة للهضم.", "جذور البقوليات: Rhizobium تثبّت آزوت الهواء (أسمدة أقل) والنبتة تمنحها السكريات.", "النحلة تتغذى وتسمح للزهرة بالتكاثر. انتبه: E. coli المفيدة في الأمعاء قد تصبح ممرضة في مكان آخر."]], "k": ["Symbiose = + / + : gagnant-gagnant.", "التكافل = + / +: رابح-رابح."], "q": ["Rhizobium et la légumineuse sont un exemple de :", "Rhizobium والبقوليات مثال على:"], "o": [["parasitisme", "symbiose", "saprophytisme"], ["التطفل", "التكافل", "الترمّم"]], "a": 1, "w": ["Chacun apporte quelque chose à l'autre.", "كل منهما يقدم شيئًا للآخر."]}, {"img": "s11_14", "t": ["Parasitisme et saprophytisme", "التطفل والترمّم"], "st": [["Parasitisme (− / +) : un organisme vit aux dépens de l'autre, qui subit des dommages et des maladies. Parasites facultatifs ou obligatoires ; les virus sont des parasites obligatoires.", "Saprophytisme (0 / 0) : relations faibles ou absentes ; les saprophytes vivent des déchets organiques.", "En atelier, la flore d'altération est surtout saprophyte : elle mange le produit, elle ne s'attaque pas au consommateur.", "C'est toute la différence avec un pathogène."], ["التطفل (parasitisme) ‏(− / +): كائن يعيش على حساب الآخر الذي يتضرر ويمرض. طفيليات اختيارية أو إجبارية؛ الفيروسات طفيليات إجبارية.", "الترمّم (saprophytisme) ‏(0 / 0): علاقات ضعيفة أو منعدمة؛ الرمّيات تعيش على الفضلات العضوية.", "في الورشة، فلورا الإفساد رمّية أساسًا: تأكل المنتوج ولا تهاجم المستهلك.", "هذا هو الفرق الكامل مع الجرثومة الممرضة."]], "k": ["Parasite = − / + ; saprophyte = 0 / 0.", "الطفيلي = − / +؛ الرمّي = 0 / 0."], "q": ["La flore qui altère un produit sans rendre malade est surtout :", "الفلورا التي تفسد المنتوج دون أن تُمرض هي أساسًا:"], "o": [["parasite", "saprophyte", "symbiotique"], ["طفيلية", "رمّية", "تكافلية"]], "a": 1, "w": ["Elle vit de la matière organique du produit.", "تعيش على المادة العضوية للمنتوج."]}, {"img": "s11_18", "t": ["Les modes d'expression du pouvoir pathogène", "طرق تعبير القدرة المُمرضة"], "st": [["Infection : le germe se multiplie dans les tissus. Exemple : Mycobacterium tuberculosis.", "Toxi-infection : multiplication ET libération de toxines. Exemple : Salmonella ; ou toxine qui exige la présence de la bactérie, Vibrio cholerae.", "Intoxination : la toxine agit sans que la bactérie soit présente. Exemple : Clostridium botulinum.", "Intoxication : action toxique de produits de transformation, par exemple les amines produites par des coliformes. Dans une intoxination, tuer la bactérie ne suffit pas : la toxine reste."], ["العدوى (infection): تتكاثر الجرثومة في الأنسجة. مثال: Mycobacterium tuberculosis.", "التسمم العدوائي (toxi-infection): تكاثر وإفراز للسموم. مثال: Salmonella؛ أو سمّ يتطلب وجود البكتيريا، Vibrio cholerae.", "التسمم الذيفاني (intoxination): يعمل السمّ دون وجود البكتيريا. مثال: Clostridium botulinum.", "التسمم (intoxication): تأثير سام لنواتج التحويل، مثل الأمينات التي تنتجها القولونيات. في الـ intoxination، قتل البكتيريا لا يكفي: السمّ يبقى."]], "k": ["Intoxination : la toxine seule suffit à rendre malade.", "الـ intoxination: السمّ وحده يكفي للإمراض."], "q": ["Clostridium botulinum provoque :", "Clostridium botulinum يسبب:"], "o": [["une infection", "une intoxination", "une symbiose"], ["عدوى (infection)", "تسممًا ذيفانيًا (intoxination)", "تكافلًا"]], "a": 1, "w": ["Sa toxine agit même sans la bactérie vivante.", "سمّه يعمل حتى دون وجود البكتيريا الحية."]}, {"img": "s11_20", "t": ["Salmonella", "السالمونيلا (Salmonella)"], "st": [["Selon l'OMS : plus de 16 millions d'infections par an dans le monde, dont plus de 500 000 mortelles.", "Aliments crus : œufs, viande, lait ; risque fort dans les produits peu ou pas cuits (fromage au lait cru, saucisse crue, chocolat, crème glacée).", "Transmission par contact direct avec les animaux ou par les aliments.", "Mécanisme : toxi-infection. Exemple réel : avril 2022, 150 cas de S. Typhimurium dans neuf pays européens."], ["حسب منظمة الصحة العالمية: أكثر من 16 مليون إصابة سنويًا في العالم، منها أكثر من 500 000 حالة وفاة.", "الأغذية النيئة: البيض، اللحم، الحليب؛ خطر كبير في المنتجات غير المطبوخة أو قليلة الطهي (جبن الحليب الخام، النقانق النيئة، الشوكولاتة، المثلجات).", "الانتقال بالاتصال المباشر مع الحيوانات أو عبر الأغذية.", "الآلية: تسمم عدوائي (toxi-infection). مثال حقيقي: أبريل 2022، 150 حالة S. Typhimurium في تسعة بلدان أوروبية."]], "k": ["Salmonella : œufs, viande, lait crus → toxi-infection.", "السالمونيلا: بيض، لحم، حليب نيء ← تسمم عدوائي."], "q": ["Le mécanisme de Salmonella est :", "آلية السالمونيلا هي:"], "o": [["une intoxination", "une toxi-infection", "une symbiose"], ["تسمم ذيفاني", "تسمم عدوائي (toxi-infection)", "تكافل"]], "a": 1, "w": ["Elle se multiplie ET libère des toxines.", "تتكاثر وتفرز السموم معًا."]}, {"img": "s11_22", "t": ["Escherichia coli", "الإشريكية القولونية (E. coli)"], "st": [["E. coli fait partie de notre flore intestinale ; la majorité des souches sont inoffensives. Seules quelques-unes, les entérohémorragiques (ECEH), sont pathogènes.", "On l'attrape par la viande hachée de bœuf mal cuite, les produits laitiers non pasteurisés, les jeunes pousses de légumes, l'eau souillée.", "Symptômes 3 à 8 jours après : douleurs abdominales, diarrhées parfois sanglantes.", "Dans 10 % des cas : syndrome hémolytique et urémique (SHU) ; mortalité de 3 à 5 %. Les antibiotiques sont déconseillés."], ["E. coli جزء من فلورتنا المعوية؛ أغلب السلالات غير ضارة. فقط بعضها، المعوية النزفية (ECEH)، ممرضة.", "نُصاب بها عبر لحم البقر المفروم غير المطهو جيدًا، ومنتجات الحليب غير المبسترة، والبراعم الصغيرة للخضر، والماء الملوث.", "الأعراض بعد 3 إلى 8 أيام: آلام في البطن، إسهال دموي أحيانًا.", "في 10٪ من الحالات: متلازمة انحلال الدم اليوريمية (SHU)؛ الوفيات 3 إلى 5٪. المضادات الحيوية غير منصوح بها."]], "k": ["C'est la souche qui fait la différence, pas l'espèce.", "السلالة هي التي تصنع الفرق، وليس النوع."], "q": ["Quel aliment est typiquement associé à E. coli ECEH ?", "أيّ غذاء مرتبط عادة بـ E. coli ECEH؟"], "o": [["Viande hachée de bœuf mal cuite", "Confiture", "Pain bien cuit"], ["لحم بقر مفروم غير مطهو جيدًا", "المربى", "خبز مطهو جيدًا"]], "a": 0, "w": ["La cuisson insuffisante laisse survivre la bactérie au cœur de la viande.", "الطهي غير الكافي يترك البكتيريا حية في قلب اللحم."]}, {"img": "s11_24", "t": ["Campylobacter", "كامبيلوباكتر (Campylobacter)"], "st": [["Bactérie spiralée ; la campylobactériose est l'une des diarrhées les plus fréquentes au monde.", "Elle est répandue chez de nombreux animaux (sauvages, d'élevage, de compagnie), oiseaux et mammifères.", "Aliments : lait non pasteurisé, volaille, contact animal. Exemple : Pays de Galles, 2017, lait de ferme non pasteurisé ; 3 000 à 4 000 cas par an au Royaume-Uni.", "Symptômes : maux de tête, fatigue, fièvre, crampes abdominales, nausées, vomissements, diarrhées sanglantes."], ["بكتيريا حلزونية؛ داء الكامبيلوباكتر من أكثر أنواع الإسهال انتشارًا في العالم.", "منتشرة عند كثير من الحيوانات (البرية، المرباة، الأليفة)، الطيور والثدييات.", "الأغذية: الحليب غير المبستر، الدواجن، الاتصال بالحيوان. مثال: ويلز 2017، حليب مزرعة غير مبستر؛ 3 000 إلى 4 000 حالة سنويًا في المملكة المتحدة.", "الأعراض: صداع، تعب، حمى، تشنجات بطنية، غثيان، قيء، إسهال دموي."]], "k": ["Campylobacter : volaille et lait cru.", "كامبيلوباكتر: الدواجن والحليب النيء."], "q": ["Quelle forme a Campylobacter ?", "ما شكل Campylobacter؟"], "o": [["Sphérique", "Spiralée", "En chaînette de coques"], ["كروي", "حلزوني", "سلسلة من المكورات"]], "a": 1, "w": ["C'est une bactérie spiralée.", "إنها بكتيريا حلزونية."]}, {"img": "s11_26", "t": ["Listeria monocytogenes", "الليستيريا (Listeria monocytogenes)"], "st": [["Chez une personne en bonne santé : symptômes légers ou aucun. Chez une personne vulnérable : formes graves, parfois mortelles.", "Pendant la grossesse : risque de fausse couche ou de méningite chez le nouveau-né.", "Aliments : viande, poisson fumé, charcuterie, fromage à pâte molle au lait non pasteurisé.", "Listeria est psychrophile : elle se multiplie encore à 4 °C. Le froid ne la bloque pas (séance 7)."], ["عند شخص سليم: أعراض خفيفة أو منعدمة. عند شخص هش: أشكال خطيرة، قاتلة أحيانًا.", "أثناء الحمل: خطر الإجهاض أو التهاب السحايا (méningite) عند المولود.", "الأغذية: اللحم، السمك المدخن، اللحوم المصنعة (charcuterie)، الجبن الطري من حليب غير مبستر.", "الليستيريا محبّة للبرودة (psychrophile): تتكاثر حتى في 4 درجات. البرد لا يوقفها (الحصة 7)."]], "k": ["Listeria pousse au réfrigérateur ; danger pour la femme enceinte.", "الليستيريا تنمو في الثلاجة؛ خطر على المرأة الحامل."], "q": ["Pourquoi Listeria est-elle redoutée dans les produits réfrigérés ?", "لماذا نخشى الليستيريا في المنتجات المبردة؟"], "o": [["Elle est tuée à 4 °C", "Elle se multiplie encore à 4 °C", "Elle n'existe que dans l'eau"], ["تموت في 4 درجات", "تستمر في التكاثر في 4 درجات", "لا توجد إلا في الماء"]], "a": 1, "w": ["Elle est psychrophile.", "إنها محبّة للبرودة."]}, {"img": "s11_28", "t": ["Les quatre pathogènes majeurs", "الممرضات الأربعة الكبرى"], "st": [["Salmonella : œufs, viande, lait crus, chocolat, crème glacée — toxi-infection — 16 millions d'infections et 500 000 décès par an.", "E. coli ECEH : viande hachée peu cuite, lait non pasteurisé, jeunes pousses, eau souillée — toxi-infection — SHU dans 10 % des cas.", "Campylobacter : lait non pasteurisé, volaille, contact animal — infection — l'une des diarrhées les plus fréquentes.", "Listeria : viande, poisson fumé, charcuterie, fromage à pâte molle — infection — pousse à 4 °C. Tableau à compléter de mémoire au contrôle n° 3."], ["Salmonella: بيض، لحم، حليب نيء، شوكولاتة، مثلجات — تسمم عدوائي — 16 مليون إصابة و500 000 وفاة سنويًا.", "E. coli ECEH: لحم مفروم قليل الطهي، حليب غير مبستر، براعم صغيرة، ماء ملوث — تسمم عدوائي — SHU في 10٪ من الحالات.", "Campylobacter: حليب غير مبستر، دواجن، اتصال بالحيوان — عدوى — من أكثر أنواع الإسهال انتشارًا.", "Listeria: لحم، سمك مدخن، charcuterie، جبن طري — عدوى — تنمو في 4 درجات. جدول يجب إكماله من الذاكرة في المراقبة رقم 3."]], "k": ["Germe, aliment, mécanisme, vigilance : les 4 colonnes à savoir.", "الجرثومة، الغذاء، الآلية، نقطة اليقظة: الأعمدة الأربعة التي يجب معرفتها."], "q": ["Quel pathogène est lié au fromage à pâte molle et au poisson fumé ?", "أيّ ممرض مرتبط بالجبن الطري والسمك المدخن؟"], "o": [["Campylobacter", "Listeria", "Salmonella"], ["Campylobacter", "Listeria", "Salmonella"]], "a": 1, "w": ["Ce sont les aliments vecteurs typiques de Listeria.", "إنها الأغذية الناقلة النموذجية لليستيريا."]}, {"img": "s11_30", "t": ["Les porteurs sains", "حاملو الجراثيم الأصحاء"], "st": [["Un porteur sain héberge un germe pathogène sans aucun signe de maladie. Le portage peut être permanent ou transitoire.", "Il est dangereux s'il travaille en cuisine collective ou en industrie agroalimentaire.", "Exemple : un cuisinier porteur de Staphylococcus aureus qui parle sans masque devant une préparation, ou goûte deux fois avec la même cuillère, la contamine.", "Si le germe se multiplie, l'aliment devient dangereux (toxi-infection). Le porteur ne peut le savoir sans analyse."], ["حامل الجراثيم السليم (porteur sain) يحمل جرثومة ممرضة دون أي علامة مرض. الحمل قد يكون دائمًا أو مؤقتًا.", "يكون خطيرًا إذا اشتغل في مطبخ جماعي أو في الصناعة الغذائية.", "مثال: طباخ حامل لـ Staphylococcus aureus يتكلم دون قناع أمام تحضير، أو يتذوق مرتين بنفس الملعقة، فيلوّثه.", "إذا تكاثرت الجرثومة، يصبح الغذاء خطيرًا (تسمم عدوائي). والحامل لا يمكنه معرفة ذلك دون تحليل."]], "k": ["Pas malade ≠ pas dangereux : d'où l'obligation d'analyses.", "غير مريض ≠ غير خطير: لذلك التحاليل إجبارية."], "q": ["Un porteur sain :", "حامل الجراثيم السليم:"], "o": [["présente toujours des symptômes", "héberge un pathogène sans être malade", "est immunisé contre tout"], ["تظهر عليه دائمًا الأعراض", "يحمل جرثومة ممرضة دون أن يكون مريضًا", "محصّن ضد كل شيء"]], "a": 1, "w": ["Il ne présente aucun signe clinique.", "لا تظهر عليه أي علامة سريرية."]}, {"img": "s11_32", "t": ["L'arrêté du 21 mars 2013", "قرار 21 مارس 2013"], "st": [["Arrêté conjoint Agriculture–Santé n° 983-13 relatif à l'état de santé et à l'hygiène du personnel manipulant les denrées animales.", "Germes visés : salmonelles, shigelles, E. coli, staphylocoques et streptocoques hémolytiques A, Listeria monocytogenes, tout germe reconnu pathogène.", "Toute personne reconnue atteinte ne peut rester au poste de manipulation tant que les examens restent positifs."], ["قرار مشترك بين وزارتي الفلاحة والصحة رقم 983-13 يتعلق بالحالة الصحية ونظافة المستخدمين الذين يتداولون المواد الحيوانية.", "الجراثيم المستهدفة: السالمونيلا، الشيغيلا، E. coli، المكورات العنقودية والعقدية الحالّة للدم A، Listeria monocytogenes، وكل جرثومة معترف بأنها ممرضة.", "كل شخص ثبتت إصابته لا يمكن أن يبقى في منصب التداول ما دامت الفحوص إيجابية."]], "k": ["Examens positifs = retrait du poste de manipulation.", "فحوص إيجابية = إبعاد عن منصب التداول."], "q": ["Selon l'arrêté, un manipulateur porteur de Salmonella :", "حسب القرار، العامل الحامل للسالمونيلا:"], "o": [["continue normalement", "est retiré du poste tant que les examens sont positifs", "doit seulement porter des gants"], ["يستمر بشكل عادي", "يُبعد عن المنصب ما دامت الفحوص إيجابية", "عليه فقط ارتداء القفازات"]], "a": 1, "w": ["C'est ce qu'impose l'arrêté n° 983-13.", "هذا ما يفرضه القرار رقم 983-13."]}]}, {"n": 12, "t": ["Toxines, altérations et micro-organismes utiles", "السموم، الإفساد والكائنات الدقيقة المفيدة"], "c": [{"img": "s12_09", "t": ["Les phycotoxines", "السموم الطحلبية (phycotoxines)"], "st": [["Une phycotoxine est une toxine produite par des algues unicellulaires ; on la retrouve dans les fruits de mer.", "Exemple : PSP (Paralytic Shellfish Poisoning), l'intoxication paralytique par les coquillages.", "Le coquillage filtre l'algue microscopique et concentre la toxine dans sa chair, sans en souffrir.", "Le coquillage n'est pas malade : il est seulement le véhicule de la toxine."], ["السمّ الطحلبي (phycotoxine) سمّ تنتجه طحالب وحيدة الخلية؛ نجده في المأكولات البحرية.", "مثال: PSP (Paralytic Shellfish Poisoning)، التسمم الشللي بالمحار.", "المحار يرشّح الطحلب المجهري ويركّز السمّ في لحمه دون أن يتضرر.", "المحار ليس مريضًا: هو فقط ناقل للسمّ."]], "k": ["Phyco = algue.", "Phyco = طحلب."], "q": ["Qui produit une phycotoxine ?", "من ينتج السمّ الطحلبي؟"], "o": [["Une moisissure", "Une algue unicellulaire", "Le coquillage lui-même"], ["العفن", "طحلب وحيد الخلية", "المحار نفسه"]], "a": 1, "w": ["Le coquillage ne fait que la concentrer.", "المحار يركّزه فقط."]}, {"img": "s12_11", "t": ["Les symptômes de l'intoxication PSP", "أعراض التسمم الشللي PSP"], "st": [["Délai très court : 5 à 30 minutes après l'ingestion des coquillages contaminés.", "Action neurologique : engourdissement des lèvres, du visage, puis des bras et des jambes ; maux de tête, nausées, vertiges.", "Formes graves : troubles de la motricité, parole incohérente, risque de décès par paralysie des muscles respiratoires.", "L'intoxication n'est pas contagieuse : elle ne se transmet pas d'une personne à l'autre."], ["مدة قصيرة جدًا: 5 إلى 30 دقيقة بعد تناول المحار الملوث.", "تأثير عصبي: تنميل الشفتين والوجه، ثم الذراعين والساقين؛ صداع، غثيان، دوار.", "الأشكال الخطيرة: اضطراب الحركة، كلام غير مترابط، خطر الوفاة بشلل عضلات التنفس.", "التسمم غير معدٍ: لا ينتقل من شخص إلى آخر."]], "k": ["PSP : neurologique, rapide, non contagieux.", "PSP: عصبي، سريع، غير معدٍ."], "q": ["Les premiers signes d'une intoxication PSP apparaissent :", "تظهر أولى علامات التسمم PSP:"], "o": [["après 3 à 8 jours", "en 5 à 30 minutes", "après un mois"], ["بعد 3 إلى 8 أيام", "خلال 5 إلى 30 دقيقة", "بعد شهر"]], "a": 1, "w": ["La toxine agit très vite sur le système nerveux.", "السمّ يؤثر بسرعة كبيرة على الجهاز العصبي."]}, {"img": "s12_15", "t": ["Les mycotoxines", "السموم الفطرية (mycotoxines)"], "st": [["Composés toxiques produits naturellement par certaines moisissures (champignons), pas par des bactéries.", "On les trouve sur les céréales, les fruits séchés, les fruits secs et les épices.", "Ce sont les moisissures de la séance 4 : filamenteuses, sporulées, tolérantes aux faibles Aw.", "Point de départ fréquent : un stock de céréales ou d'épices mal ventilé. Retirer la partie moisie n'enlève pas la toxine, déjà diffusée dans le produit."], ["مركبات سامة تنتجها طبيعيًا بعض أنواع العفن (الفطريات)، وليس البكتيريا.", "نجدها في الحبوب، الفواكه المجففة، الفواكه الجافة والتوابل.", "إنها أعفان الحصة 4: خيطية، مكوّنة للأبواغ، تتحمل نشاط ماء (Aw) منخفض.", "نقطة الانطلاق الشائعة: مخزون حبوب أو توابل سيئ التهوية. إزالة الجزء المتعفن لا تزيل السمّ الذي انتشر في المنتوج."]], "k": ["Myco = champignon. On ne sauve pas un produit moisi en grattant.", "Myco = فطر. لا ننقذ منتوجًا متعفنًا بكشط العفن."], "q": ["Retirer la partie moisie d'un pain suffit-il ?", "هل تكفي إزالة الجزء المتعفن من الخبز؟"], "o": [["Oui, toujours", "Non, la toxine a diffusé dans le produit", "Oui si on le toaste"], ["نعم دائمًا", "لا، السمّ انتشر في المنتوج", "نعم إذا حمّصناه"]], "a": 1, "w": ["La toxine est invisible et diffuse au-delà de la moisissure visible.", "السمّ غير مرئي وينتشر أبعد من العفن الظاهر."]}, {"img": "s12_17", "t": ["Ce que provoquent les mycotoxines", "ما تسببه السموم الفطرية"], "st": [["À court terme : nausées, troubles digestifs, vomissements.", "À long terme : cancers, modifications de l'ADN, effets néfastes sur le fœtus.", "À forte dose : atteinte des organes vitaux — foie, reins, système nerveux, système immunitaire.", "La moisissure se voit, la toxine non : d'où les limites réglementaires sur les céréales et les épices."], ["على المدى القصير: غثيان، اضطرابات هضمية، قيء.", "على المدى الطويل: سرطانات، تغيّرات في الحمض النووي (ADN)، آثار ضارة على الجنين.", "بجرعة عالية: إصابة الأعضاء الحيوية — الكبد، الكلى، الجهاز العصبي، الجهاز المناعي.", "العفن يُرى، والسمّ لا يُرى: لذلك توجد حدود قانونية للحبوب والتوابل."]], "k": ["Effet invisible et cumulatif : la prévention est la seule arme.", "تأثير غير مرئي ومتراكم: الوقاية هي السلاح الوحيد."], "q": ["Quel organe est particulièrement touché à forte dose ?", "أيّ عضو يتضرر خاصة بجرعة عالية؟"], "o": [["Le foie", "Les ongles", "Les cheveux"], ["الكبد", "الأظافر", "الشعر"]], "a": 0, "w": ["Foie, reins, système nerveux et immunitaire sont visés.", "الكبد والكلى والجهاز العصبي والمناعي هي المستهدفة."]}, {"img": "s12_19", "t": ["Pourquoi la cuisson ne suffit pas", "لماذا لا يكفي الطهي"], "st": [["Détruire le micro-organisme et détruire sa toxine sont deux opérations différentes.", "Beaucoup de toxines sont thermostables : elles traversent la cuisson.", "Un dénombrement compte des germes, pas des toxines : l'analyse classique ne la voit pas.", "Seule la prévention marche : empêcher la production de toxine, donc maîtriser le stockage. C'est la définition de l'intoxination (séance 11)."], ["تدمير الكائن الدقيق وتدمير سمّه عمليتان مختلفتان.", "كثير من السموم مقاومة للحرارة (thermostables): تصمد أمام الطهي.", "الإحصاء يعدّ الجراثيم وليس السموم: التحليل الكلاسيكي لا يراها.", "الوقاية وحدها تنجح: منع إنتاج السمّ، أي التحكم في التخزين. هذا تعريف الـ intoxination (الحصة 11)."]], "k": ["Le barème tue le germe, pas toujours la toxine.", "المعالجة الحرارية تقتل الجرثومة، وليس دائمًا السمّ."], "q": ["Une toxine thermostable :", "السمّ المقاوم للحرارة:"], "o": [["est détruite par la cuisson", "résiste à la cuisson", "n'existe pas"], ["يُدمَّر بالطهي", "يقاوم الطهي", "غير موجود"]], "a": 1, "w": ["Thermostable = stable à la chaleur.", "Thermostable = ثابت أمام الحرارة."]}, {"img": "s12_25", "t": ["Altération : aspect et couleur", "الإفساد: المظهر واللون"], "st": [["Une couleur qui disparaît : les enzymes microbiennes dégradent les pigments (caroténoïdes, hémoglobine).", "Une couleur qui apparaît : les métabolites microbiens créent de nouvelles couleurs ; les moisissures forment des taches colorées.", "Une couleur qui réagit : réaction chimique entre un produit microbien et un composé de l'aliment.", "L'œil du technicien voit la couleur avant tout : c'est le premier contrôle, et il est gratuit."], ["لون يختفي: الإنزيمات الميكروبية تحلّل الأصباغ (الكاروتينات، الهيموغلوبين).", "لون يظهر: النواتج الأيضية الميكروبية تكوّن ألوانًا جديدة؛ والعفن يكوّن بقعًا ملونة.", "لون يتفاعل: تفاعل كيميائي بين ناتج ميكروبي ومركب في الغذاء.", "عين التقني ترى اللون قبل كل شيء: إنها المراقبة الأولى، وهي مجانية."]], "k": ["Disparaît, apparaît, réagit : trois façons de changer de couleur.", "يختفي، يظهر، يتفاعل: ثلاث طرق لتغيّر اللون."], "q": ["Une viande qui perd sa couleur rouge, c'est :", "لحم يفقد لونه الأحمر، هذا:"], "o": [["une couleur qui apparaît", "la dégradation d'un pigment", "une réaction de cuisson"], ["لون يظهر", "تحلّل صبغة", "تفاعل طهي"]], "a": 1, "w": ["L'hémoglobine est dégradée par les enzymes microbiennes.", "الهيموغلوبين تحلّله الإنزيمات الميكروبية."]}, {"img": "s12_27", "t": ["Altération : la texture", "الإفساد: القوام"], "st": [["Origine : destruction des macromolécules de l'aliment ou production de métabolites microbiens.", "Polymères visés : cellulose, amidon, pectine, protéines, lipides.", "Exemples : ramollissement des fruits et légumes (pectines détruites), perte de forme des viandes ou fruits en conserve, affinage trop poussé d'un fromage.", "Plus la charge microbienne est grande, plus la modification est forte (courbe de croissance, séance 9)."], ["الأصل: تحلّل الجزيئات الكبيرة للغذاء أو إنتاج نواتج أيضية ميكروبية.", "البوليمرات المستهدفة: السيليلوز، النشا، البكتين، البروتينات، الدهون.", "أمثلة: ليونة الفواكه والخضر (تحلّل البكتين)، فقدان شكل اللحوم أو الفواكه المعلبة، تنضيج (affinage) مفرط للجبن.", "كلما كانت الحمولة الميكروبية كبيرة، كان التغيّر قويًا (منحنى النمو، الحصة 9)."]], "k": ["Fruit qui ramollit = pectines détruites.", "فاكهة تلين = بكتين متحلّل."], "q": ["Le ramollissement d'un fruit vient surtout de la destruction :", "ليونة الفاكهة تأتي أساسًا من تحلّل:"], "o": [["des pectines", "du sel", "de l'eau"], ["البكتين", "الملح", "الماء"]], "a": 0, "w": ["La pectine assure la tenue des tissus végétaux.", "البكتين يضمن تماسك الأنسجة النباتية."]}, {"img": "s12_29", "t": ["Altération : odeur et saveur", "الإفساد: الرائحة والطعم"], "st": [["Le développement microbien se traduit d'abord par un changement d'odeur.", "Ces altérations apparaissent vers 10⁶ à 10⁷ germes par gramme.", "Molécules en cause : acides (acétique, butyrique), alcools, esters, cétones, ammoniac, hydrogène sulfuré, triméthylamine et autres amines.", "Un million de germes par gramme avant la première odeur : le nez est un capteur tardif, l'analyse reste indispensable."], ["النمو الميكروبي يظهر أولًا بتغيّر الرائحة.", "تظهر هذه التغيرات عند حوالي 10⁶ إلى 10⁷ جرثومة في الغرام.", "الجزيئات المسؤولة: الأحماض (الخليك، الزبدي)، الكحولات، الإسترات، الكيتونات، الأمونياك، كبريتيد الهيدروجين، ثلاثي ميثيل الأمين وأمينات أخرى.", "مليون جرثومة في الغرام قبل أول رائحة: الأنف مستشعر متأخر، والتحليل يبقى ضروريًا."]], "k": ["Odeur à 10⁶–10⁷ germes/g : le nez arrive trop tard.", "الرائحة عند 10⁶–10⁷ جرثومة/غ: الأنف يصل متأخرًا."], "q": ["À partir de quelle charge apparaissent les odeurs d'altération ?", "ابتداءً من أي حمولة تظهر روائح الإفساد؟"], "o": [["10² germes/g", "10⁶ à 10⁷ germes/g", "10¹² germes/g"], ["10² جرثومة/غ", "10⁶ إلى 10⁷ جرثومة/غ", "10¹² جرثومة/غ"]], "a": 1, "w": ["C'est le seuil des altérations primaires.", "إنها عتبة الإفسادات الأولية."]}, {"img": "s12_35", "t": ["Les micro-organismes de transformation", "كائنات التحويل الدقيقة"], "st": [["Lait → yaourt : Streptococcus thermophilus et Lactobacillus bulgaricus.", "Lait → fromages : bactéries et moisissures variables ; Roquefort : Lactococcus lactis, L. cremoris, Penicillium roqueforti. Lait → beurre : Lactococcus lactis.", "Jus de raisin → vin ; céréales → bière ; farine → pain : Saccharomyces cerevisiae.", "Une seule levure fait le vin, la bière et le pain : c'est le substrat qui change, pas le ferment."], ["الحليب ← الياغورت: Streptococcus thermophilus و Lactobacillus bulgaricus.", "الحليب ← الأجبان: بكتيريا وأعفان متنوعة؛ روكفور: Lactococcus lactis، L. cremoris، Penicillium roqueforti. الحليب ← الزبدة: Lactococcus lactis.", "عصير العنب ← النبيذ؛ الحبوب ← الجعة؛ الدقيق ← الخبز: Saccharomyces cerevisiae.", "خميرة واحدة تصنع النبيذ والجعة والخبز: الركيزة (substrat) هي التي تتغير، وليس الخميرة."]], "k": ["Yaourt = S. thermophilus + L. bulgaricus.", "الياغورت = S. thermophilus + L. bulgaricus."], "q": ["Quels ferments produisent le yaourt ?", "ما الخمائر التي تصنع الياغورت؟"], "o": [["Saccharomyces cerevisiae", "S. thermophilus et L. bulgaricus", "Penicillium roqueforti"], ["Saccharomyces cerevisiae", "S. thermophilus و L. bulgaricus", "Penicillium roqueforti"]], "a": 1, "w": ["Ce sont les deux bactéries lactiques du yaourt.", "إنهما بكتيريتا اللبن في الياغورت."]}, {"img": "s12_37", "t": ["Trois fermentations, trois métiers", "ثلاث تخمرات، ثلاث حرف"], "st": [["Fermentation lactique : deux bactéries acidifient le lait et le font coaguler — cœur du module Technologie laitière.", "Affinage par moisissure : Penicillium roqueforti forme les veines bleues du fromage — la même famille que les moisissures nuisibles.", "Fermentation alcoolique : Saccharomyces cerevisiae dégage du CO₂ qui fait lever la pâte, et de l'alcool qui s'évapore à la cuisson.", "Utile, nuisible ou pathogène : c'est souvent le même genre microbien, placé au bon ou au mauvais endroit."], ["التخمر اللبني: بكتيريتان تحمّضان الحليب وتخثّرانه — قلب وحدة تكنولوجيا الحليب.", "التنضيج بالعفن: Penicillium roqueforti يكوّن العروق الزرقاء في الجبن — نفس عائلة الأعفان الضارة.", "التخمر الكحولي: Saccharomyces cerevisiae تُطلق CO₂ الذي يرفع العجين، والكحول الذي يتبخر عند الطهي.", "مفيد أو ضار أو ممرض: غالبًا نفس الجنس الميكروبي، في المكان المناسب أو غير المناسب."]], "k": ["Le bon germe au bon endroit.", "الجرثومة المناسبة في المكان المناسب."], "q": ["Qu'est-ce qui fait lever la pâte à pain ?", "ما الذي يرفع عجين الخبز؟"], "o": [["L'acide lactique", "Le CO₂ produit par la levure", "La chaleur du four seulement"], ["حمض اللبن", "CO₂ الذي تنتجه الخميرة", "حرارة الفرن فقط"]], "a": 1, "w": ["Saccharomyces cerevisiae dégage du gaz carbonique.", "Saccharomyces cerevisiae تُطلق ثاني أكسيد الكربون."]}]}, {"n": 13, "t": ["La maîtrise par le froid et la chaleur", "التحكم بالبرودة والحرارة"], "c": [{"img": "s13_09", "t": ["Deux façons d'agir", "طريقتان للتدخل"], "st": [["Maîtriser le développement : inhiber ou détruire les germes déjà présents par des techniques de conservation.", "Exemples : froid (réfrigération, congélation), chaleur (pasteurisation, stérilisation), baisse de l'Aw (séchage, salage, sucrage), conservateurs, atmosphères modifiées.", "Maîtriser la contamination : contrôler la qualité des matières premières et les causes de contamination pendant la production (locaux, équipements, air, eau, vapeur, personnel).", "Carte du chapitre D : séances 13 et 14 = agir sur le germe ; séances 15 et 16 = l'empêcher d'arriver."], ["التحكم في النمو: تثبيط الجراثيم الموجودة أو تدميرها بتقنيات الحفظ.", "أمثلة: البرودة (التبريد، التجميد)، الحرارة (البسترة، التعقيم)، خفض Aw (التجفيف، التمليح، التسكير)، المواد الحافظة، الأجواء المعدّلة.", "التحكم في التلوث: مراقبة جودة المواد الأولية وأسباب التلوث أثناء الإنتاج (المباني، المعدات، الهواء، الماء، البخار، المستخدمون).", "خريطة الفصل D: الحصتان 13 و14 = التدخل على الجرثومة؛ الحصتان 15 و16 = منعها من الوصول."]], "k": ["Agir sur le germe, ou sur son arrivée.", "التدخل على الجرثومة، أو على وصولها."], "q": ["Le lavage des mains relève de :", "غسل اليدين يندرج ضمن:"], "o": [["la maîtrise du développement", "la maîtrise de la contamination", "la stérilisation"], ["التحكم في النمو", "التحكم في التلوث", "التعقيم"]], "a": 1, "w": ["Il empêche le germe d'arriver sur le produit.", "يمنع الجرثومة من الوصول إلى المنتوج."]}, {"img": "s13_13", "t": ["Les techniques du froid", "تقنيات البرودة"], "st": [["Réfrigération : limite la multiplication des germes ; conservation à court ou moyen terme.", "Congélation et surgélation : baissent l'activité de l'eau (l'eau devient glace) et inhibent la multiplication ; conservation à long terme.", "Cryogénisation : par l'ammoniac (−40 °C) ou l'azote liquide, pour les produits très fragiles.", "Le froid ne détruit ni les germes ni les toxines : le développement reprend dès le retour à une température favorable."], ["التبريد (réfrigération): يحدّ من تكاثر الجراثيم؛ حفظ قصير أو متوسط المدى.", "التجميد والتجميد السريع (congélation, surgélation): يخفضان نشاط الماء (الماء يصير جليدًا) ويثبطان التكاثر؛ حفظ طويل المدى.", "التبريد العميق (cryogénisation): بالأمونياك (−40 درجة) أو الآزوت السائل، للمنتجات الهشة جدًا.", "البرودة لا تدمّر الجراثيم ولا السموم: يستأنف النمو بمجرد العودة إلى حرارة ملائمة."]], "k": ["Le froid ralentit, il ne tue pas.", "البرودة تبطئ، لا تقتل."], "q": ["La congélation agit :", "التجميد يعمل:"], "o": [["uniquement par la température", "par la température et par la baisse de l'Aw", "en détruisant les toxines"], ["بالحرارة فقط", "بالحرارة وبخفض Aw", "بتدمير السموم"]], "a": 1, "w": ["L'eau devenue glace n'est plus disponible pour les germes.", "الماء الذي صار جليدًا لم يعد متاحًا للجراثيم."]}, {"img": "s13_15", "t": ["La limite du froid", "حدود البرودة"], "st": [["Le froid gèle l'horloge microbienne, il ne remet jamais le compteur à zéro.", "Les ruptures s'additionnent : deux ruptures de 2 h valent une rupture de 4 h.", "Listeria ignore le froid : psychrophile, elle se multiplie à 4 °C (séance 11). Une toxine déjà produite traverse aussi la congélation.", "En atelier, l'enregistreur de température est la preuve que l'horloge est restée arrêtée."], ["البرودة توقف الساعة الميكروبية، لكنها لا تعيد العدّاد إلى الصفر أبدًا.", "الانقطاعات تتراكم: انقطاعان لمدة ساعتين يساويان انقطاعًا واحدًا لمدة 4 ساعات.", "الليستيريا لا تبالي بالبرودة: محبّة للبرودة، تتكاثر في 4 درجات (الحصة 11). والسمّ المنتَج مسبقًا يصمد أيضًا أمام التجميد.", "في الورشة، مسجّل الحرارة هو الدليل على أن الساعة بقيت متوقفة."]], "k": ["Rupture de la chaîne du froid = temps de croissance qui s'additionne.", "انقطاع سلسلة التبريد = زمن نمو يتراكم."], "q": ["Deux ruptures de 2 h de la chaîne du froid équivalent à :", "انقطاعان لمدة ساعتين لسلسلة التبريد يعادلان:"], "o": [["aucune rupture", "une rupture de 4 h", "une rupture de 1 h"], ["لا انقطاع", "انقطاعًا لمدة 4 ساعات", "انقطاعًا لمدة ساعة"]], "a": 1, "w": ["La croissance reprend là où elle s'était arrêtée.", "النمو يستأنف من حيث توقف."]}, {"img": "s13_19", "t": ["Pasteuriser, stériliser, UHT", "البسترة، التعقيم، UHT"], "st": [["Pasteurisation : 60 à 100 °C. Détruit les germes, sauf les thermorésistants ; il faut refroidir brusquement puis garder au froid (4 °C) ou sous vide. Exemple : le lait.", "Stérilisation : plus de 100 °C ; destruction de tous les micro-organismes.", "UHT (ultra haute température) : 135 à 150 °C pendant 1 à 5 secondes, refroidissement rapide, conditionnement aseptique. Exemples : lait, jus de fruit.", "Un produit pasteurisé n'est pas stérile : il est seulement assaini, il reste fragile."], ["البسترة (pasteurisation): 60 إلى 100 درجة. تدمّر الجراثيم ما عدا المقاومة للحرارة؛ يجب التبريد المفاجئ ثم الحفظ في البرودة (4 درجات) أو تحت الفراغ. مثال: الحليب.", "التعقيم (stérilisation): أكثر من 100 درجة؛ تدمير كل الكائنات الدقيقة.", "UHT (الحرارة الفائقة): 135 إلى 150 درجة لمدة 1 إلى 5 ثوانٍ، تبريد سريع، تعبئة معقّمة (aseptique). أمثلة: الحليب، عصير الفواكه.", "المنتوج المبستر ليس معقّمًا: إنه فقط مُطهَّر جزئيًا، ويبقى هشًا."]], "k": ["60–100 °C ; > 100 °C ; 135–150 °C / 1–5 s.", "60–100 درجة؛ > 100 درجة؛ 135–150 درجة / 1–5 ثوانٍ."], "q": ["Le traitement UHT se fait à :", "المعالجة UHT تتم في:"], "o": [["60 à 100 °C pendant 30 min", "135 à 150 °C pendant 1 à 5 s", "4 °C pendant 24 h"], ["60 إلى 100 درجة لمدة 30 دقيقة", "135 إلى 150 درجة لمدة 1 إلى 5 ثوانٍ", "4 درجات لمدة 24 ساعة"]], "a": 1, "w": ["Très haute température, très courte durée.", "حرارة عالية جدًا، مدة قصيرة جدًا."]}, {"img": "s13_21", "t": ["Comparer les traitements thermiques", "مقارنة المعالجات الحرارية"], "st": [["Pasteurisation (60–100 °C) : détruit les formes végétatives, les thermorésistantes survivent → refroidir vite et garder à 4 °C.", "Stérilisation (> 100 °C) : détruit tout, spores comprises → conservation à température ambiante.", "UHT (135–150 °C, 1–5 s) : détruit tout en quelques secondes → conditionnement aseptique.", "Lait cru (aucun traitement) : rien n'est détruit → chaîne du froid stricte, DLC courte. Plus le barème est sévère, plus la durée de vie est longue… et plus le produit est modifié."], ["البسترة (60–100 درجة): تدمّر الأشكال الخضرية، والمقاومة للحرارة تبقى ← تبريد سريع وحفظ في 4 درجات.", "التعقيم (> 100 درجة): يدمّر كل شيء بما في ذلك الأبواغ ← حفظ في درجة حرارة الغرفة.", "UHT (135–150 درجة، 1–5 ثوانٍ): يدمّر كل شيء في ثوانٍ ← تعبئة معقّمة.", "الحليب الخام (دون معالجة): لا شيء يُدمَّر ← سلسلة تبريد صارمة، DLC قصير. كلما كانت المعالجة أشد، طالت مدة الصلاحية… وتغيّر المنتوج أكثر."]], "k": ["Barème sévère = longue conservation, produit plus modifié.", "معالجة شديدة = حفظ طويل، منتوج أكثر تغيّرًا."], "q": ["Quel lait se conserve à température ambiante ?", "أيّ حليب يُحفظ في درجة حرارة الغرفة؟"], "o": [["Le lait cru", "Le lait pasteurisé", "Le lait UHT"], ["الحليب الخام", "الحليب المبستر", "حليب UHT"]], "a": 2, "w": ["Tous les germes sont détruits et l'emballage est aseptique.", "كل الجراثيم مدمّرة والتعبئة معقّمة."]}, {"img": "s13_23", "t": ["La spore, obstacle du traitement thermique", "البوغ، عائق المعالجة الحرارية"], "st": [["Une forme végétative meurt vers 70 °C ; une spore bactérienne survit à l'ébullition (séance 4).", "C'est la spore qui impose de dépasser 100 °C pour parler de stérilisation.", "Pasteuriser ne stérilise pas : les spores traversent le barème et attendent. La conserve (appertisation) vise justement les spores.", "Un produit pasteurisé se garde toujours au froid. C'est la flore visée qui fixe le barème, jamais l'inverse."], ["الشكل الخضري يموت حوالي 70 درجة؛ أما البوغ البكتيري فيصمد أمام الغليان (الحصة 4).", "البوغ هو الذي يفرض تجاوز 100 درجة لنتحدث عن التعقيم.", "البسترة لا تعقّم: الأبواغ تعبر المعالجة وتنتظر. والتعليب (appertisation) يستهدف الأبواغ بالضبط.", "المنتوج المبستر يُحفظ دائمًا في البرودة. الفلورا المستهدفة هي التي تحدد المعالجة، وليس العكس."]], "k": ["Spore = survit à 100 °C → stérilisation au-delà de 100 °C.", "البوغ = يصمد في 100 درجة ← التعقيم فوق 100 درجة."], "q": ["Pourquoi garder un lait pasteurisé au froid ?", "لماذا نحفظ الحليب المبستر في البرودة؟"], "o": [["Pour le goût uniquement", "Parce que des spores et thermorésistants ont survécu", "Parce qu'il est stérile"], ["من أجل الطعم فقط", "لأن أبواغًا وجراثيم مقاومة للحرارة بقيت حية", "لأنه معقّم"]], "a": 1, "w": ["La pasteurisation n'atteint pas les spores.", "البسترة لا تصل إلى الأبواغ."]}, {"img": "s13_25", "t": ["Le froid contre la chaleur", "البرودة مقابل الحرارة"], "st": [["Le froid ne détruit ni germes ni toxines ; il ralentit ou suspend la multiplication ; son effet est réversible.", "Le froid préserve les qualités du produit frais.", "La chaleur détruit les germes (et certaines toxines) ; son effet est irréversible ; les spores exigent un barème sévère.", "La chaleur modifie le goût, la couleur, les vitamines. Aucun ne remplace l'autre : dans la plupart des filières, ils se combinent."], ["البرودة لا تدمّر الجراثيم ولا السموم؛ تبطئ التكاثر أو توقفه؛ تأثيرها قابل للعكس.", "البرودة تحافظ على جودة المنتوج الطازج.", "الحرارة تدمّر الجراثيم (وبعض السموم)؛ تأثيرها غير قابل للعكس؛ الأبواغ تتطلب معالجة شديدة.", "الحرارة تغيّر الطعم واللون والفيتامينات. لا يعوّض أحدهما الآخر: في أغلب الشُّعب يُجمع بينهما."]], "k": ["Froid = réversible ; chaleur = irréversible.", "البرودة = قابلة للعكس؛ الحرارة = غير قابلة للعكس."], "q": ["Lequel a un effet irréversible sur la flore ?", "أيّهما له تأثير غير قابل للعكس على الفلورا؟"], "o": [["Le froid", "La chaleur", "Aucun des deux"], ["البرودة", "الحرارة", "لا أحد منهما"]], "a": 1, "w": ["Un germe tué par la chaleur ne repart pas.", "الجرثومة التي قتلتها الحرارة لا تعود."]}, {"img": "s13_27", "t": ["Trois laits, trois traitements", "ثلاثة أنواع حليب، ثلاث معالجات"], "st": [["Lait cru : aucun traitement, flore complète, DLC très courte, chaîne du froid stricte. Vecteur de Campylobacter et Listeria (séance 11).", "Lait pasteurisé : 60 à 100 °C ; flore pathogène détruite, flore thermorésistante présente ; froid, DLC de quelques jours.", "Lait UHT : 135 à 150 °C, 1 à 5 s, conditionnement aseptique ; plusieurs mois à température ambiante.", "Même produit, trois barèmes, trois durées de vie : c'est le sujet du TP."], ["الحليب الخام: دون معالجة، فلورا كاملة، DLC قصير جدًا، سلسلة تبريد صارمة. ناقل لـ Campylobacter و Listeria (الحصة 11).", "الحليب المبستر: 60 إلى 100 درجة؛ الفلورا الممرضة مدمّرة، والفلورا المقاومة للحرارة موجودة؛ تبريد، DLC لبضعة أيام.", "حليب UHT: 135 إلى 150 درجة، 1 إلى 5 ثوانٍ، تعبئة معقّمة؛ عدة أشهر في درجة حرارة الغرفة.", "نفس المنتوج، ثلاث معالجات، ثلاث مدد صلاحية: هذا موضوع الأشغال التطبيقية."]], "k": ["Cru = jours ; pasteurisé = quelques jours au froid ; UHT = mois à l'ambiante.", "خام = أيام؛ مبستر = بضعة أيام في البرودة؛ UHT = أشهر في حرارة الغرفة."], "q": ["Le lait pasteurisé contient encore :", "الحليب المبستر ما زال يحتوي على:"], "o": [["des pathogènes vivants", "une flore thermorésistante", "aucun germe"], ["ممرضات حية", "فلورا مقاومة للحرارة", "لا جرثومة"]], "a": 1, "w": ["Les pathogènes sont détruits, pas les thermorésistants.", "الممرضات مدمّرة، وليس المقاومة للحرارة."]}, {"img": "s13_29", "t": ["Ce que le traitement coûte au produit", "ما تكلّفه المعالجة للمنتوج"], "st": [["Qualités organoleptiques : goût cuit, couleur et texture modifiées ; un lait UHT n'a pas le goût d'un lait pasteurisé.", "Qualités nutritionnelles : une partie des vitamines et des nutriments thermosensibles est détruite.
