<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5A8C">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Asmekti Learn — OFPPT</title>
<link rel="icon" type="image/svg+xml" href="icons/asmekti-icon.svg">
<link rel="apple-touch-icon" href="icons/asmekti-icon-180.png">
<meta name="apple-mobile-web-app-title" content="Asmekti">
<style>
:root{
  --c:#1F5A8C; --c2:#2E7BB8; --ct:#E8F0F8; --ink:#1d232a; --mut:#5d6773; --line:#e2e8ef;
  --bg:#F3F6F9; --card:#fff; --ok:#1E8A55; --okt:#E4F4EB; --ko:#B3322F; --kot:#FBE9E8;
  --key:#FFF6DD; --keyb:#E3B53B; --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e7ecf1; --mut:#a4afbb; --line:#2c3743; --bg:#12181f; --card:#1b232c; --ct:#1f3346;
         --okt:#173a2a; --kot:#43201f; --key:#3a3220; --c2:#6fb0e6; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--ink)}
body{font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic",Tahoma,sans-serif;
     min-height:100vh; padding-bottom:env(safe-area-inset-bottom)}
[dir=rtl] body{font-size:18px; line-height:1.75}
button{font:inherit; color:inherit; cursor:pointer}
.top{position:sticky; top:0; z-index:5; background:var(--c); color:#fff; display:flex; align-items:center; gap:8px;
     padding:calc(10px + env(safe-area-inset-top)) 12px 10px; box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top .ttl{flex:1; font-weight:700; font-size:16px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.top .ttl small{display:block; font-weight:500; opacity:.85; font-size:12px}
.ib{background:rgba(255,255,255,.16); border:0; color:#fff; min-width:40px; height:40px; border-radius:10px; font-size:18px; font-weight:700; padding:0 10px}
.ib.lang{font-size:17px; min-width:48px}
.ib[hidden]{display:none}
.ib#home{display:grid;place-items:center}
.ib#home[hidden]{display:none}
.top .logo{cursor:pointer}
main{max-width:680px; margin:0 auto; padding:14px 14px 90px}
h1{font-size:22px; margin:6px 0 4px; line-height:1.3}
.sub{color:var(--mut); margin:0 0 14px; font-size:15px}
.tile{display:flex; align-items:center; gap:14px; width:100%; text-align:start; background:var(--card); border:1px solid var(--line);
      border-radius:var(--r); padding:14px; margin:0 0 10px; box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile .ic{font-size:28px; width:46px; height:46px; display:grid; place-items:center; background:var(--ct); border-radius:12px; flex:none}
.tile .tx{flex:1; min-width:0}
.tile .tx b{display:block; line-height:1.3}
.tile .tx span{color:var(--mut); font-size:14px}
.tile.off{opacity:.55}
.tag{font-size:12px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--ct); color:var(--c2); white-space:nowrap}
.big{display:block; width:100%; border:0; border-radius:var(--r); padding:15px; font-weight:700; font-size:17px; background:var(--c); color:#fff; margin:6px 0 10px}
.big.alt{background:var(--card); color:var(--c2); border:2px solid var(--c2)}
.big.gold{background:#E3A21A; color:#231a00}
.stats{display:flex; gap:10px; margin:6px 0 14px}
.stats div{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center}
.stats b{display:block; font-size:22px; color:var(--c2)}
.stats span{font-size:12.5px; color:var(--mut)}
.chap{margin:18px 0 8px; display:flex; align-items:center; gap:10px}
.chap .l{background:var(--c); color:#fff; font-weight:800; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex:none}
.chap b{line-height:1.25}
.srow{display:flex; align-items:center; gap:12px; width:100%; text-align:start; background:var(--card); border:1px solid var(--line);
      border-radius:12px; padding:11px 12px; margin:0 0 8px}
.srow .n{font-weight:800; color:var(--c2); width:34px; flex:none; font-size:15px}
.srow .tx{flex:1; min-width:0; line-height:1.3; font-size:15.5px}
.bar{height:6px; background:var(--line); border-radius:4px; margin-top:6px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ok); border-radius:4px}
.srow .ck{font-size:13px; color:var(--mut); white-space:nowrap}
.srow .ck.full{color:var(--ok); font-weight:700}
/* card */
.meta{display:flex; justify-content:space-between; align-items:center; color:var(--mut); font-size:13.5px; margin:2px 0 6px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:20px; line-height:1.3; margin:0; padding:14px 16px 10px}
figure{margin:0; background:#0e1318; position:relative}
figure img{display:block; width:100%; height:auto}
figure .zoom{position:absolute; bottom:8px; inset-inline-end:8px; background:rgba(0,0,0,.6); color:#fff; font-size:12.5px; padding:4px 9px; border-radius:20px; pointer-events:none}
.body{padding:12px 16px 16px}
.sec{font-size:12.5px; font-weight:800; letter-spacing:.06em; color:var(--c2); text-transform:uppercase; margin:6px 0 8px}
[dir=rtl] .sec{letter-spacing:0; font-size:14px}
ol.steps{list-style:none; margin:0; padding:0}
ol.steps li{display:flex; gap:11px; margin:0 0 10px; animation:fade .35s ease}
ol.steps .num{flex:none; width:28px; height:28px; border-radius:50%; background:var(--c); color:#fff; font-weight:800; font-size:14px; display:grid; place-items:center; margin-top:1px}
ol.steps p{margin:0}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.more{display:flex; gap:8px; margin:4px 0 6px}
.more button{flex:1; border:1.5px dashed var(--c2); background:transparent; color:var(--c2); border-radius:12px; padding:11px; font-weight:700; font-size:15.5px}
.more button.lnk{flex:none; border:0; font-weight:600; font-size:14px; color:var(--mut); padding:11px 6px}
.key{background:var(--key); border-inline-start:5px solid var(--keyb); border-radius:10px; padding:10px 13px; margin:12px 0; animation:fade .35s ease}
.key b{display:block; font-size:13px; letter-spacing:.04em; color:#9a6d00; text-transform:uppercase}
@media (prefers-color-scheme: dark){ .key b{color:#f0c35a} }
.key p{margin:3px 0 0; font-weight:600}
.quiz{border-top:1px solid var(--line); margin-top:14px; padding-top:12px; animation:fade .35s ease}
.quiz .qq{font-weight:700; margin:0 0 10px}
.opt{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:start; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; margin:0 0 8px; font-size:16px; line-height:1.4}
.opt .lt{flex:none; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--mut); display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--mut)}
.opt.ok{background:var(--okt); border-color:var(--ok)} .opt.ok .lt{background:var(--ok); border-color:var(--ok); color:#fff}
.opt.ko{background:var(--kot); border-color:var(--ko)} .opt.ko .lt{background:var(--ko); border-color:var(--ko); color:#fff}
.opt:disabled{cursor:default}
.why{border-radius:10px; padding:10px 12px; margin-top:4px; font-size:15.5px; animation:fade .3s ease}
.why.ok{background:var(--okt)} .why.ko{background:var(--kot)}
.why b{display:block}
.pager{position:fixed; bottom:0; left:0; right:0; z-index:4; background:var(--card); border-top:1px solid var(--line);
       padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center}
.pager .in{max-width:680px; margin:0 auto; display:flex; gap:10px; align-items:center; width:100%}
.pager button{border:0; border-radius:12px; padding:13px 10px; font-weight:700; font-size:16px}
.pager .prev{background:var(--ct); color:var(--c2); min-width:56px}
.pager .next{flex:1; background:var(--c); color:#fff}
.pager .prev:disabled{opacity:.35}
.dots{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; margin:10px 0 2px}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--line)}
.dots i.seen{background:#9fb6cc} .dots i.good{background:var(--ok)} .dots i.bad{background:var(--ko)} .dots i.cur{outline:2px solid var(--c2); outline-offset:1px}
.end{text-align:center; padding:24px 10px}
.end .score{font-size:46px; font-weight:800; color:var(--c2); margin:8px 0}
.zoomv{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.94); overflow:auto; display:flex; align-items:center; justify-content:center; -webkit-overflow-scrolling:touch}
.zoomv img{width:100%; max-width:1100px; height:auto; touch-action:pinch-zoom}
.zoomv button{position:fixed; top:calc(12px + env(safe-area-inset-top)); inset-inline-end:12px; background:rgba(255,255,255,.2); border:0; color:#fff; width:44px; height:44px; border-radius:50%; font-size:22px}
.zoomv .hint{position:fixed; bottom:18px; left:0; right:0; text-align:center; color:#ccc; font-size:13px}
.foot{color:var(--mut); font-size:12.5px; text-align:center; margin-top:26px}
.foot button{background:none; border:0; color:var(--mut); text-decoration:underline; font-size:12.5px}
.fr{direction:ltr; unicode-bidi:isolate}
.top .logo{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cover .wm{width:100%;max-width:400px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.25))}
.cover .emb img{width:100%;height:100%;border-radius:26px;display:block}
.cover{position:fixed; inset:0; z-index:30; overflow:auto; color:#fff; text-align:center;
  background:radial-gradient(circle at 50% 18%,#2E7BB8 0,#1F5A8C 45%,#12385a 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(28px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom))}
.cover .emb{width:96px; height:96px; border-radius:28px; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35);
  display:grid; place-items:center; font-size:58px; line-height:1; margin-bottom:14px; box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cover h1{font-size:34px; margin:0; letter-spacing:.01em; line-height:1.15}
.cover .tif{font-size:24px; letter-spacing:.12em; opacity:.9; margin:6px 0 22px}
.cover .mod{font-size:13.5px; opacity:.8; margin:0 0 20px}
.cover .sl{width:100%; max-width:420px; background:rgba(255,255,255,.1); border-radius:14px; padding:12px 14px; margin:0 0 10px; text-align:start}
.cover .sl small{display:block; font-size:11px; font-weight:800; letter-spacing:.08em; opacity:.7; text-transform:uppercase; margin-bottom:2px}
.cover .sl p{margin:0; font-size:16.5px; line-height:1.45; font-weight:600}
.cover .sl .lat{font-size:13.5px; font-weight:500; opacity:.8; margin-top:3px; font-style:italic}
.cover .go{margin-top:12px; width:100%; max-width:420px; border:0; border-radius:14px; padding:16px; font-size:18px; font-weight:800; background:#E3A21A; color:#231a00}
.modal{position:fixed; inset:0; z-index:40; background:rgba(8,20,32,.6); display:flex; align-items:flex-end; justify-content:center; animation:fade .25s ease}
.modal .box{background:var(--card); color:var(--ink); width:100%; max-width:560px; max-height:86vh; overflow:auto; border-radius:20px 20px 0 0; padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:600px){.modal{align-items:center}.modal .box{border-radius:20px}}
.modal h2{margin:0 0 4px; font-size:21px; color:var(--c2)}
.nv{border-top:1px solid var(--line); padding:12px 0 4px}
.nv:first-of-type{border-top:0}
.nv .vh{display:flex; justify-content:space-between; align-items:center; font-weight:800; margin-bottom:6px}
.nv .vh span{font-size:13px; color:var(--mut); font-weight:600}
.nv ul{margin:0; padding-inline-start:20px} .nv li{margin:0 0 6px}
.nv.cur .vh b{background:var(--ct); color:var(--c2); padding:2px 10px; border-radius:20px}
.upbar{position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:35; max-width:560px; margin:0 auto; background:#12385a; color:#fff;
  border-radius:14px; padding:12px 12px 12px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:fade .3s ease}
.upbar span{flex:1; font-weight:700; font-size:15px}
.upbar button{border:0; border-radius:10px; padding:10px 14px; font-weight:800; background:#E3A21A; color:#231a00}
.upbar .x{background:transparent; color:#fff; padding:10px 6px; font-weight:400}
.nb{display:inline-block; font-size:11px; font-weight:800; letter-spacing:.03em; background:#E3A21A; color:#231a00; padding:2px 7px; border-radius:20px; margin-inline-start:6px; vertical-align:2px}
.newslink{background:none; border:0; color:var(--c2); font-weight:700; font-size:14px; padding:6px 0; text-decoration:underline}
.big.rev{background:var(--c2);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.big.rev .cnt{background:#fff;color:var(--c);border-radius:20px;padding:1px 10px;font-size:15px}
.revnone{text-align:center;color:var(--ok);font-weight:700;background:var(--okt);border-radius:var(--r);padding:12px;margin:6px 0 10px;font-size:15px}
.stats .fire b{color:#D9480F}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.tools button span{font-size:26px;line-height:1}
.tools button.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px}
.tools em{font-style:normal;font-size:12px;background:var(--ct);color:var(--c2);border-radius:20px;padding:1px 8px}
.acts{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 11px;font-size:13.5px;font-weight:700}
.mini.star{font-size:18px;padding:2px 11px;color:#C98A00}
.mini.star.on{background:#FFF3CF;border-color:#E3B53B}
.gchips{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gchips span{font-size:13px;color:var(--mut);font-weight:700}
.gchips button{border:1px solid var(--c2);background:var(--ct);color:var(--c2);border-radius:20px;padding:4px 10px;font-size:13.5px;font-weight:600}
input.search{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 12px}
input.search:focus{outline:2px solid var(--c2);border-color:transparent}
.gl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.gl b{color:var(--c2)} .gl .ar-t{color:var(--mut);font-size:14px} .gl p{margin:4px 0 0;font-size:15.5px}
.gl-letter{font-weight:800;color:var(--c2);margin:14px 2px 6px;font-size:18px}
.etimer{font-weight:800;color:var(--c2);background:var(--ct);border-radius:20px;padding:3px 10px}
.etimer.low{color:#fff;background:var(--ko)}
.opt.sel{border-color:var(--c2);background:var(--ct)} .opt.sel .lt{background:var(--c2);border-color:var(--c2);color:#fff}
.err{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.err .opt{margin:0 0 6px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;opacity:.55}
.badge.on{opacity:1;border-color:#E3B53B;background:linear-gradient(180deg,#FFF6DD,var(--card))}
.badge .bi{font-size:34px;line-height:1.2} .badge b{display:block;font-size:14.5px;margin:4px 0 2px} .badge span{font-size:12.5px;color:var(--mut);line-height:1.3;display:block}
.certif{margin:6px 0 10px;border:3px solid #E3A21A;border-radius:18px;padding:22px 16px;text-align:center;background:linear-gradient(160deg,#fff,#F3F7FB);color:#1d232a;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.certif img{width:64px;height:64px;border-radius:16px}
.certif .ct{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#1F5A8C;font-weight:800;margin:10px 0 6px}
.certif .cn{font-size:26px;font-weight:800;color:#12385a;margin:4px 0}
.certif p{margin:6px 0;color:#5d6773}
.certif .cm{font-size:18px;font-weight:700;color:#1F5A8C}
.certif .cd{font-size:13px;color:#5d6773}
.certif .cf{margin-top:10px;font-size:12px;color:#8a94a0;letter-spacing:.05em}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;background:#12385a;color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:15px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .3s ease}
.xpc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 12px}
.xpl{display:flex;align-items:center;gap:8px;margin-bottom:6px}.xpl .xi{font-size:22px}.xpl b{flex:1}.xpl .xn{font-weight:800;color:#B7791F}
.xpc small{display:block;color:var(--mut);font-size:12.5px;margin-top:5px}
.big.learn{background:linear-gradient(135deg,#1E8A55,#2BA36A);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.big.learn span{font-size:18px}.big.learn small{font-weight:600;opacity:.9;font-size:13px}
.daily{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.daily.done{border-color:var(--ok);background:var(--okt)}
.daily .dh{display:flex;justify-content:space-between;margin-bottom:6px}.daily .dh span{font-size:13px;font-weight:800;color:#B7791F}
.ms{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.ms .mc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.ms.ok .mc{background:var(--ok);border-color:var(--ok);color:#fff}.ms.ok .mt{text-decoration:line-through;color:var(--mut)}
.ms .mt{flex:1}.ms .mv{font-size:13px;color:var(--mut);font-weight:700}
.tools{grid-template-columns:1fr 1fr 1fr!important}.tools button{padding:12px 6px;font-size:13.5px}.tools button span{font-size:24px}
.flipwrap{perspective:1200px}
.flipc{position:relative;min-height:440px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flipc.back{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.fface.front img{width:100%;display:block}.fface.front h2{font-size:21px;margin:14px 16px 6px;line-height:1.3}.fface .hint{text-align:center;color:var(--c2);font-weight:700;margin:6px}
.fface.bk{transform:rotateY(180deg);padding:16px}.fface .fk{font-size:19px;font-weight:800;color:var(--c);margin:0 0 12px;line-height:1.4}
ol.steps.small li{font-size:15px}ol.steps.small .num{width:24px;height:24px;font-size:12.5px}
.vfcard .vfa{font-size:21px;font-weight:800;text-align:center;color:var(--c);margin:14px 0 6px}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.pairs{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}
.pb{display:block;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:0 0 8px;font-size:14px;line-height:1.35;min-height:52px}
.pb:not(.r){font-weight:800;color:var(--c)}.pb.sel{border-color:var(--c2);background:var(--ct);box-shadow:0 0 0 2px var(--c2)}
