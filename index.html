e", "par la température et par la baisse de l'Aw", "en détruisant les toxines"], ["بالحرارة فقط", "بالحرارة وبخفض Aw", "بتدمير السموم"]], "a": 1, "w": ["L'eau devenue glace n'est plus disponible pour les germes.", "الماء الذي صار جليدًا لم يعد متاحًا للجراثيم."], "g": [11]}, {"img": "s13_15", "t": ["La limite du froid", "حدود البرودة"], "st": [["Le froid gèle l'horloge microbienne, il ne remet jamais le compteur à zéro.", "Les ruptures s'additionnent : deux ruptures de 2 h valent une rupture de 4 h.", "Listeria ignore le froid : psychrophile, elle se multiplie à 4 °C (séance 11). Une toxine déjà produite traverse aussi la congélation.", "En atelier, l'enregistreur de température est la preuve que l'horloge est restée arrêtée."], ["البرودة توقف الساعة الميكروبية، لكنها لا تعيد العدّاد إلى الصفر أبدًا.", "الانقطاعات تتراكم: انقطاعان لمدة ساعتين يساويان انقطاعًا واحدًا لمدة 4 ساعات.", "الليستيريا لا تبالي بالبرودة: محبّة للبرودة، تتكاثر في 4 درجات (الحصة 11). والسمّ المنتَج مسبقًا يصمد أيضًا أمام التجميد.", "في الورشة، مسجّل الحرارة هو الدليل على أن الساعة بقيت متوقفة."]], "k": ["Rupture de la chaîne du froid = temps de croissance qui s'additionne.", "انقطاع سلسلة التبريد = زمن نمو يتراكم."], "q": ["Deux ruptures de 2 h de la chaîne du froid équivalent à :", "انقطاعان لمدة ساعتين لسلسلة التبريد يعادلان:"], "o": [["aucune rupture", "une rupture de 4 h", "une rupture de 1 h"], ["لا انقطاع", "انقطاعًا لمدة 4 ساعات", "انقطاعًا لمدة ساعة"]], "a": 1, "w": ["La croissance reprend là où elle s'était arrêtée.", "النمو يستأنف من حيث توقف."], "g": [57]}, {"img": "s13_19", "t": ["Pasteuriser, stériliser, UHT", "البسترة، التعقيم، UHT"], "st": [["Pasteurisation : 60 à 100 °C. Détruit les germes, sauf les thermorésistants ; il faut refroidir brusquement puis garder au froid (4 °C) ou sous vide. Exemple : le lait.", "Stérilisation : plus de 100 °C ; destruction de tous les micro-organismes.", "UHT (ultra haute température) : 135 à 150 °C pendant 1 à 5 secondes, refroidissement rapide, conditionnement aseptique. Exemples : lait, jus de fruit.", "Un produit pasteurisé n'est pas stérile : il est seulement assaini, il reste fragile."], ["البسترة (pasteurisation): 60 إلى 100 درجة. تدمّر الجراثيم ما عدا المقاومة للحرارة؛ يجب التبريد المفاجئ ثم الحفظ في البرودة (4 درجات) أو تحت الفراغ. مثال: الحليب.", "التعقيم (stérilisation): أكثر من 100 درجة؛ تدمير كل الكائنات الدقيقة.", "UHT (الحرارة الفائقة): 135 إلى 150 درجة لمدة 1 إلى 5 ثوانٍ، تبريد سريع، تعبئة معقّمة (aseptique). أمثلة: الحليب، عصير الفواكه.", "المنتوج المبستر ليس معقّمًا: إنه فقط مُطهَّر جزئيًا، ويبقى هشًا."]], "k": ["60–100 °C ; > 100 °C ; 135–150 °C / 1–5 s.", "60–100 درجة؛ > 100 درجة؛ 135–150 درجة / 1–5 ثوانٍ."], "q": ["Le traitement UHT se fait à :", "المعالجة UHT تتم في:"], "o": [["60 à 100 °C pendant 30 min", "135 à 150 °C pendant 1 à 5 s", "4 °C pendant 24 h"], ["60 إلى 100 درجة لمدة 30 دقيقة", "135 إلى 150 درجة لمدة 1 إلى 5 ثوانٍ", "4 درجات لمدة 24 ساعة"]], "a": 1, "w": ["Très haute température, très courte durée.", "حرارة عالية جدًا، مدة قصيرة جدًا."], "g": [46, 60, 64]}, {"img": "s13_21", "t": ["Comparer les traitements thermiques", "مقارنة المعالجات الحرارية"], "st": [["Pasteurisation (60–100 °C) : détruit les formes végétatives, les thermorésistantes survivent → refroidir vite et garder à 4 °C.", "Stérilisation (> 100 °C) : détruit tout, spores comprises → conservation à température ambiante.", "UHT (135–150 °C, 1–5 s) : détruit tout en quelques secondes → conditionnement aseptique.", "Lait cru (aucun traitement) : rien n'est détruit → chaîne du froid stricte, DLC courte. Plus le barème est sévère, plus la durée de vie est longue… et plus le produit est modifié."], ["البسترة (60–100 درجة): تدمّر الأشكال الخضرية، والمقاومة للحرارة تبقى ← تبريد سريع وحفظ في 4 درجات.", "التعقيم (> 100 درجة): يدمّر كل شيء بما في ذلك الأبواغ ← حفظ في درجة حرارة الغرفة.", "UHT (135–150 درجة، 1–5 ثوانٍ): يدمّر كل شيء في ثوانٍ ← تعبئة معقّمة.", "الحليب الخام (دون معالجة): لا شيء يُدمَّر ← سلسلة تبريد صارمة، DLC قصير. كلما كانت المعالجة أشد، طالت مدة الصلاحية… وتغيّر المنتوج أكثر."]], "k": ["Barème sévère = longue conservation, produit plus modifié.", "معالجة شديدة = حفظ طويل، منتوج أكثر تغيّرًا."], "q": ["Quel lait se conserve à température ambiante ?", "أيّ حليب يُحفظ في درجة حرارة الغرفة؟"], "o": [["Le lait cru", "Le lait pasteurisé", "Le lait UHT"], ["الحليب الخام", "الحليب المبستر", "حليب UHT"]], "a": 2, "w": ["Tous les germes sont détruits et l'emballage est aseptique.", "كل الجراثيم مدمّرة والتعبئة معقّمة."], "g": [46, 60, 64]}, {"img": "s13_23", "t": ["La spore, obstacle du traitement thermique", "البوغ، عائق المعالجة الحرارية"], "st": [["Une forme végétative meurt vers 70 °C ; une spore bactérienne survit à l'ébullition (séance 4).", "C'est la spore qui impose de dépasser 100 °C pour parler de stérilisation.", "Pasteuriser ne stérilise pas : les spores traversent le barème et attendent. La conserve (appertisation) vise justement les spores.", "Un produit pasteurisé se garde toujours au froid. C'est la flore visée qui fixe le barème, jamais l'inverse."], ["الشكل الخضري يموت حوالي 70 درجة؛ أما البوغ البكتيري فيصمد أمام الغليان (الحصة 4).", "البوغ هو الذي يفرض تجاوز 100 درجة لنتحدث عن التعقيم.", "البسترة لا تعقّم: الأبواغ تعبر المعالجة وتنتظر. والتعليب (appertisation) يستهدف الأبواغ بالضبط.", "المنتوج المبستر يُحفظ دائمًا في البرودة. الفلورا المستهدفة هي التي تحدد المعالجة، وليس العكس."]], "k": ["Spore = survit à 100 °C → stérilisation au-delà de 100 °C.", "البوغ = يصمد في 100 درجة ← التعقيم فوق 100 درجة."], "q": ["Pourquoi garder un lait pasteurisé au froid ?", "لماذا نحفظ الحليب المبستر في البرودة؟"], "o": [["Pour le goût uniquement", "Parce que des spores et thermorésistants ont survécu", "Parce qu'il est stérile"], ["من أجل الطعم فقط", "لأن أبواغًا وجراثيم مقاومة للحرارة بقيت حية", "لأنه معقّم"]], "a": 1, "w": ["La pasteurisation n'atteint pas les spores.", "البسترة لا تصل إلى الأبواغ."], "g": [46, 59, 60]}, {"img": "s13_25", "t": ["Le froid contre la chaleur", "البرودة مقابل الحرارة"], "st": [["Le froid ne détruit ni germes ni toxines ; il ralentit ou suspend la multiplication ; son effet est réversible.", "Le froid préserve les qualités du produit frais.", "La chaleur détruit les germes (et certaines toxines) ; son effet est irréversible ; les spores exigent un barème sévère.", "La chaleur modifie le goût, la couleur, les vitamines. Aucun ne remplace l'autre : dans la plupart des filières, ils se combinent."], ["البرودة لا تدمّر الجراثيم ولا السموم؛ تبطئ التكاثر أو توقفه؛ تأثيرها قابل للعكس.", "البرودة تحافظ على جودة المنتوج الطازج.", "الحرارة تدمّر الجراثيم (وبعض السموم)؛ تأثيرها غير قابل للعكس؛ الأبواغ تتطلب معالجة شديدة.", "الحرارة تغيّر الطعم واللون والفيتامينات. لا يعوّض أحدهما الآخر: في أغلب الشُّعب يُجمع بينهما."]], "k": ["Froid = réversible ; chaleur = irréversible.", "البرودة = قابلة للعكس؛ الحرارة = غير قابلة للعكس."], "q": ["Lequel a un effet irréversible sur la flore ?", "أيّهما له تأثير غير قابل للعكس على الفلورا؟"], "o": [["Le froid", "La chaleur", "Aucun des deux"], ["البرودة", "الحرارة", "لا أحد منهما"]], "a": 1, "w": ["Un germe tué par la chaleur ne repart pas.", "الجرثومة التي قتلتها الحرارة لا تعود."], "g": []}, {"img": "s13_27", "t": ["Trois laits, trois traitements", "ثلاثة أنواع حليب، ثلاث معالجات"], "st": [["Lait cru : aucun traitement, flore complète, DLC très courte, chaîne du froid stricte. Vecteur de Campylobacter et Listeria (séance 11).", "Lait pasteurisé : 60 à 100 °C ; flore pathogène détruite, flore thermorésistante présente ; froid, DLC de quelques jours.", "Lait UHT : 135 à 150 °C, 1 à 5 s, conditionnement aseptique ; plusieurs mois à température ambiante.", "Même produit, trois barèmes, trois durées de vie : c'est le sujet du TP."], ["الحليب الخام: دون معالجة، فلورا كاملة، DLC قصير جدًا، سلسلة تبريد صارمة. ناقل لـ Campylobacter و Listeria (الحصة 11).", "الحليب المبستر: 60 إلى 100 درجة؛ الفلورا الممرضة مدمّرة، والفلورا المقاومة للحرارة موجودة؛ تبريد، DLC لبضعة أيام.", "حليب UHT: 135 إلى 150 درجة، 1 إلى 5 ثوانٍ، تعبئة معقّمة؛ عدة أشهر في درجة حرارة الغرفة.", "نفس المنتوج، ثلاث معالجات، ثلاث مدد صلاحية: هذا موضوع الأشغال التطبيقية."]], "k": ["Cru = jours ; pasteurisé = quelques jours au froid ; UHT = mois à l'ambiante.", "خام = أيام؛ مبستر = بضعة أيام في البرودة؛ UHT = أشهر في حرارة الغرفة."], "q": ["Le lait pasteurisé contient encore :", "الحليب المبستر ما زال يحتوي على:"], "o": [["des pathogènes vivants", "une flore thermorésistante", "aucun germe"], ["ممرضات حية", "فلورا مقاومة للحرارة", "لا جرثومة"]], "a": 1, "w": ["Les pathogènes sont détruits, pas les thermorésistants.", "الممرضات مدمّرة، وليس المقاومة للحرارة."], "g": [46, 64]}, {"img": "s13_29", "t": ["Ce que le traitement coûte au produit", "ما تكلّفه المعالجة للمنتوج"], "st": [["Qualités organoleptiques : goût cuit, couleur et texture modifiées ; un lait UHT n'a pas le goût d'un lait pasteurisé.", "Qualités nutritionnelles : une partie des vitamines et des nutriments thermosensibles est détruite.", "Coût énergétique : monter à 150 °C et redescendre en quelques secondes exige équipement et énergie.", "L'arbitrage du technicien : choisir le barème le plus doux qui assure la sécurité et la durée de vie visées."], ["الجودة الحسية (organoleptique): طعم مطبوخ، لون وقوام متغيران؛ حليب UHT ليس له طعم الحليب المبستر.", "الجودة الغذائية: جزء من الفيتامينات والمغذيات الحساسة للحرارة يُدمَّر.", "الكلفة الطاقية: الصعود إلى 150 درجة والنزول في ثوانٍ يتطلب معدات وطاقة.", "اختيار التقني: اختيار أخفّ معالجة تضمن السلامة ومدة الصلاحية المطلوبة."]], "k": ["Sécurité, qualité, coût : le barème le plus doux qui suffit.", "السلامة، الجودة، الكلفة: أخفّ معالجة كافية."], "q": ["Quel est le bon choix de barème ?", "ما هو الاختيار الصحيح للمعالجة؟"], "o": [["Toujours le plus sévère", "Le plus doux qui assure la sécurité visée", "Aucun traitement"], ["الأشد دائمًا", "الأخف الذي يضمن السلامة المطلوبة", "لا معالجة"]], "a": 1, "w": ["Un barème trop sévère abîme le produit inutilement.", "المعالجة الشديدة جدًا تُتلف المنتوج دون فائدة."], "g": [46, 64]}], "since": "1.0"}, {"n": 14, "t": ["Aw, conservateurs, atmosphères et barrières", "نشاط الماء، المواد الحافظة، الأجواء والحواجز"], "c": [{"img": "s14_09", "t": ["Retirer l'eau ou la rendre indisponible", "إزالة الماء أو جعله غير متاح"], "st": [["Séchage : on élimine l'eau libre et une partie de l'eau liée.", "Déshydratation : on retire la plus grande partie de l'eau liée ; l'Aw devient assez basse pour interdire tout développement microbien.", "Sucrage et salage : le sucre ou le sel dissous se lie aux molécules d'eau et les rend indisponibles.", "Sucrer ou saler n'enlève pas l'eau, cela l'occupe : pour le germe, le résultat est le même."], ["التجفيف (séchage): نزيل الماء الحر وجزءًا من الماء المرتبط.", "نزع الماء (déshydratation): نزيل الجزء الأكبر من الماء المرتبط؛ يصبح Aw منخفضًا بما يكفي لمنع كل نمو ميكروبي.", "التسكير والتمليح: السكر أو الملح المذاب يرتبط بجزيئات الماء ويجعلها غير متاحة.", "التسكير أو التمليح لا يزيل الماء بل يشغله: بالنسبة للجرثومة النتيجة واحدة."]], "k": ["Le sel et le sucre occupent l'eau.", "الملح والسكر يشغلان الماء."], "q": ["Comment le sucre conserve-t-il un produit ?", "كيف يحفظ السكر المنتوج؟"], "o": [["Il tue les germes par la chaleur", "Il lie l'eau et la rend indisponible", "Il acidifie fortement"], ["يقتل الجراثيم بالحرارة", "يربط الماء ويجعله غير متاح", "يحمّض بقوة"]], "a": 1, "w": ["Il abaisse l'activité de l'eau.", "يخفض نشاط الماء."], "g": [11]}, {"img": "s14_11", "t": ["L'Aw des produits courants", "نشاط الماء في المنتجات الشائعة"], "st": [["Aw élevée (> 0,95) : viandes, poissons, laits frais. Toutes les flores s'y développent ; froid ou traitement thermique obligatoires.", "Aw intermédiaire (0,60 à 0,90) : charcuteries sèches, fromages affinés, fruits secs. Seules les levures et moisissures osmophiles tiennent.", "Aw basse (< 0,60) : confitures, poudres, épices, lait en poudre. Plus aucune croissance microbienne.", "C'est la table de référence de l'atelier : chaque produit mesuré doit y être placé."], ["Aw مرتفع (> 0,95): اللحوم، الأسماك، الحليب الطازج. كل الفلورا تنمو؛ البرودة أو المعالجة الحرارية إجبارية.", "Aw متوسط (0,60 إلى 0,90): اللحوم المصنعة المجففة، الأجبان المنضّجة، الفواكه الجافة. لا تصمد إلا الخمائر والأعفان المحبة للسكر (osmophiles).", "Aw منخفض (< 0,60): المربى، المساحيق، التوابل، الحليب المجفف. لا نمو ميكروبي إطلاقًا.", "هذا جدول الورشة المرجعي: كل منتوج مَقيس يجب وضعه فيه."]], "k": ["0,95 : tout pousse ; 0,60 : plus rien.", "0,95: كل شيء ينمو؛ 0,60: لا شيء."], "q": ["Un lait en poudre (Aw < 0,60) :", "الحليب المجفف (Aw < 0,60):"], "o": [["permet la croissance de tous les germes", "ne permet plus de croissance microbienne", "doit être congelé"], ["يسمح بنمو كل الجراثيم", "لا يسمح بأي نمو ميكروبي", "يجب تجميده"]], "a": 1, "w": ["Sous 0,60, aucune croissance n'est possible.", "تحت 0,60 لا نمو ممكن."], "g": [11, 44]}, {"img": "s14_13", "t": ["Le poisson salé et la confiture", "السمك المملح والمربى"], "st": [["Salage : le sel dissous fixe les molécules d'eau. Associé au séchage puis au fumage, il conserve viandes et poissons depuis des siècles. « Le sel ne tue pas : il assèche. »", "Sucrage : une confiture à 60 % de sucre a une Aw trop basse pour toute bactérie ; seules quelques moisissures de surface peuvent s'y installer.", "La moisissure sur une confiture arrive par l'air, pas par le pot.", "Ces procédés sont des barrières : ils ne détruisent rien, ils rendent le milieu inhabitable."], ["التمليح: الملح المذاب يثبّت جزيئات الماء. مع التجفيف ثم التدخين، يحفظ اللحوم والأسماك منذ قرون. «الملح لا يقتل: إنه يجفّف».", "التسكير: مربى بـ 60٪ من السكر له Aw منخفض جدًا لأي بكتيريا؛ فقط بعض أعفان السطح يمكن أن تستقر.", "العفن على المربى يأتي من الهواء، وليس من الإناء.", "هذه الطرق حواجز: لا تدمّر شيئًا، بل تجعل الوسط غير صالح للعيش."]], "k": ["Barrière = rendre inhabitable, pas détruire.", "الحاجز = جعل الوسط غير صالح للعيش، وليس التدمير."], "q": ["Le sel conserve le poisson parce qu'il :", "الملح يحفظ السمك لأنه:"], "o": [["tue toutes les bactéries", "assèche en fixant l'eau", "le rend acide"], ["يقتل كل البكتيريا", "يجفّف بتثبيت الماء", "يجعله حمضيًا"]], "a": 1, "w": ["« Le sel ne tue pas : il assèche. »", "«الملح لا يقتل: إنه يجفّف»."], "g": [11]}, {"img": "s14_15", "t": ["Les conservateurs", "المواد الحافظة"], "st": [["Ce sont des composés utilisés à faibles doses.", "Le sel (chlorure de sodium) inhibe en particulier les bacilles à Gram négatif.", "Les nitrates et nitrites, utilisés en charcuterie, bloquent des flores ciblées et fixent la couleur.", "Un conservateur accompagne un procédé, il ne le remplace pas. Chaque conservateur autorisé porte un numéro E."], ["إنها مركبات تُستعمل بجرعات ضعيفة.", "الملح (كلوريد الصوديوم) يثبّط خاصة العصيات سالبة الغرام (Gram négatif).", "النترات والنتريت، المستعملة في اللحوم المصنعة، توقف فلورا محددة وتثبّت اللون.", "المادة الحافظة ترافق طريقة الحفظ ولا تعوّضها. كل مادة حافظة مرخّصة تحمل رقم E."]], "k": ["Faible dose, numéro E, jamais seul.", "جرعة ضعيفة، رقم E، ليس وحده أبدًا."], "q": ["À quoi servent les nitrites en charcuterie ?", "ما دور النتريت في اللحوم المصنعة؟"], "o": [["À sucrer le produit", "À bloquer certaines flores et fixer la couleur", "À stériliser"], ["تسكير المنتوج", "إيقاف بعض الفلورا وتثبيت اللون", "التعقيم"]], "a": 1, "w": ["Double rôle : antimicrobien ciblé et couleur.", "دور مزدوج: مضاد ميكروبي محدد وتثبيت اللون."], "g": [30]}, {"img": "s14_17", "t": ["La fermentation comme conservation", "التخمر كوسيلة حفظ"], "st": [["L'acide produit par les bactéries ou l'alcool produit par les levures protège l'aliment.", "Produits laitiers : l'acide lactique abaisse le pH (séance 12).", "Olives et légumes : saumure et fermentation lactique combinées. Vin et bière : l'alcool protège le produit fini.", "Le paradoxe : on utilise des micro-organismes pour en écarter d'autres ; le ferment occupe la place avant le contaminant."], ["الحمض الذي تنتجه البكتيريا أو الكحول الذي تنتجه الخمائر يحمي الغذاء.", "منتجات الحليب: حمض اللبن يخفض pH (الحصة 12).", "الزيتون والخضر: محلول ملحي وتخمر لبني معًا. النبيذ والجعة: الكحول يحمي المنتوج النهائي.", "المفارقة: نستعمل كائنات دقيقة لإبعاد كائنات أخرى؛ الخميرة تحتل المكان قبل الملوِّث."]], "k": ["Le ferment prend la place avant le contaminant.", "الخميرة تحتل المكان قبل الملوِّث."], "q": ["Comment le yaourt se protège-t-il des bactéries pathogènes ?", "كيف يحمي الياغورت نفسه من البكتيريا الممرضة؟"], "o": [["Par l'alcool", "Par l'acide lactique qui abaisse le pH", "Par le sel"], ["بالكحول", "بحمض اللبن الذي يخفض pH", "بالملح"]], "a": 1, "w": ["Le pH bas écarte les bactéries neutrophiles.", "pH المنخفض يُبعد البكتيريا محبّة التعادل."], "g": []}, {"img": "s14_19", "t": ["Le fumage", "التدخين"], "st": [["La fumée dépose des antiseptiques à la surface du produit et en écarte la flore.", "Séchage puis fumage : action combinée de la déshydratation et des antiseptiques, pour les viandes et poissons.", "Limite : c'est un traitement de surface, il ne protège pas le cœur ; d'où l'importance du séchage préalable.", "C'est le premier exemple de barrières multiples : deux obstacles modérés valent mieux qu'un seul forcé."], ["الدخان يضع مواد مطهّرة على سطح المنتوج ويُبعد عنه الفلورا.", "التجفيف ثم التدخين: تأثير مشترك لنزع الماء والمواد المطهرة، للحوم والأسماك.", "الحد: إنها معالجة سطحية لا تحمي القلب؛ لذلك أهمية التجفيف المسبق.", "إنه أول مثال للحواجز المتعددة: عائقان معتدلان أفضل من عائق واحد مُجهَد."]], "k": ["Fumage = surface ; séchage = cœur.", "التدخين = السطح؛ التجفيف = القلب."], "q": ["Pourquoi sécher avant de fumer ?", "لماذا نجفّف قبل التدخين؟"], "o": [["Pour la couleur", "Parce que le fumage n'agit qu'en surface", "Pour cuire le produit"], ["من أجل اللون", "لأن التدخين يعمل على السطح فقط", "لطهي المنتوج"]], "a": 1, "w": ["Le séchage protège le cœur du produit.", "التجفيف يحمي قلب المنتوج."], "g": [13]}, {"img": "s14_21", "t": ["Les atmosphères modifiées", "الأجواء المعدّلة"], "st": [["On remplace l'air de l'emballage par un mélange gazeux pauvre en oxygène.", "En retirant l'oxygène, on écarte la flore aérobie stricte (séance 7).", "Exemple : salade en sachet — 15 % de CO₂ (bactériostatique) et 80 % d'azote (gaz inerte). Le sous-vide pousse la logique à l'extrême.", "Attention : sans oxygène, les anaérobies sont favorisés, dont Clostridium botulinum. Une atmosphère modifiée se combine toujours avec le froid."], ["نعوّض هواء العبوة بخليط غازي فقير في الأكسجين.", "بإزالة الأكسجين، نُبعد الفلورا الهوائية الإجبارية (الحصة 7).", "مثال: السلطة في كيس — 15٪ CO₂ (مثبّط للبكتيريا) و80٪ آزوت (غاز خامل). التفريغ من الهواء (sous vide) يدفع المنطق إلى أقصاه.", "انتبه: دون أكسجين تُفضَّل اللاهوائية، ومنها Clostridium botulinum. الجو المعدّل يُقرن دائمًا بالبرودة."]], "k": ["Moins d'O₂ = moins d'aérobies… mais attention aux anaérobies.", "أكسجين أقل = هوائية أقل… لكن احذر اللاهوائية."], "q": ["Pourquoi associer l'atmosphère modifiée au froid ?", "لماذا نقرن الجو المعدّل بالبرودة؟"], "o": [["Pour le goût", "Pour bloquer les anaérobies comme C. botulinum", "Ce n'est pas nécessaire"], ["من أجل الطعم", "لإيقاف اللاهوائية مثل C. botulinum", "ليس ضروريًا"]], "a": 1, "w": ["Sans oxygène, les anaérobies ont le champ libre.", "دون أكسجين، يصبح المجال مفتوحًا للاهوائية."], "g": [2, 4]}, {"img": "s14_23", "t": ["Les procédés physiques", "الطرق الفيزيائية"], "st": [["Hautes pressions : 100 à 300 MPa réduisent fortement les formes végétatives, à température ambiante.", "Rayonnements (ultraviolets, gamma, X) : détruisent les germes, mais aussi des vitamines et nutriments.", "Filtration stérilisante : supports poreux (cellulose, verre fritté) aux pores ≤ 0,5 µm, plus petits que la plupart des germes.", "La filtration ne détruit pas, elle retient : elle sépare le germe du produit au lieu de l'attaquer."], ["الضغوط العالية: 100 إلى 300 ميغاباسكال تخفض بقوة الأشكال الخضرية، في درجة حرارة الغرفة.", "الإشعاعات (فوق البنفسجية، غاما، X): تدمّر الجراثيم، لكن أيضًا بعض الفيتامينات والمغذيات.", "الترشيح المعقِّم: دعامات مسامية (سيليلوز، زجاج ملبّد) بمسام ≤ 0,5 ميكرومتر، أصغر من أغلب الجراثيم.", "الترشيح لا يدمّر بل يحجز: يفصل الجرثومة عن المنتوج بدل مهاجمتها."]], "k": ["Filtrer = retenir, pas détruire.", "الترشيح = الحجز، وليس التدمير."], "q": ["La filtration stérilisante utilise des pores d'au plus :", "الترشيح المعقِّم يستعمل مسامًا لا تتجاوز:"], "o": [["5 mm", "0,5 µm", "50 µm"], ["5 مم", "0,5 ميكرومتر", "50 ميكرومتر"]], "a": 1, "w": ["Plus petits que la plupart des micro-organismes.", "أصغر من أغلب الكائنات الدقيقة."], "g": [60]}, {"img": "s14_27", "t": ["La conservation par barrières multiples", "الحفظ بالحواجز المتعددة"], "st": [["Au lieu de forcer un seul paramètre, on superpose plusieurs obstacles modérés (pH, Aw, température…) qu'aucun germe ne franchit tous.", "Charcuterie sèche : salage + séchage + nitrites + froid.", "Salade en sachet : lavage + atmosphère modifiée + froid + DLC courte. Yaourt : pasteurisation + acidification + froid.", "Avantage : chaque obstacle reste doux, le produit garde ses qualités, et l'ensemble reste infranchissable."], ["بدل إجهاد عامل واحد، نراكم عدة عوائق معتدلة (pH، Aw، الحرارة…) لا تتجاوزها أي جرثومة كلها.", "اللحوم المصنعة المجففة: تمليح + تجفيف + نتريت + برودة.", "السلطة في كيس: غسل + جو معدّل + برودة + DLC قصير. الياغورت: بسترة + تحميض + برودة.", "الميزة: كل عائق يبقى خفيفًا، والمنتوج يحتفظ بجودته، والمجموع يبقى غير قابل للتجاوز."]], "k": ["Plusieurs obstacles doux > un seul obstacle forcé.", "عدة عوائق خفيفة > عائق واحد مُجهَد."], "q": ["Les barrières du yaourt sont :", "حواجز الياغورت هي:"], "o": [["salage + fumage", "pasteurisation + acidification + froid", "UHT + sous vide"], ["تمليح + تدخين", "بسترة + تحميض + برودة", "UHT + تفريغ من الهواء"]], "a": 1, "w": ["Trois obstacles modérés combinés.", "ثلاثة عوائق معتدلة مجتمعة."], "g": [11, 13, 46]}], "since": "1.0"}, {"n": 15, "t": ["Hygiène alimentaire et méthode des 5 M", "النظافة الغذائية وطريقة 5 M"], "c": [{"img": "s15_11", "t": ["Les trois familles de dangers", "العائلات الثلاث للمخاطر"], "st": [["Dangers physiques : verre, plastique dur, aiguilles, objets tranchants, épingles, bois, arêtes, os, bijoux.", "Dangers chimiques : additifs et sous-produits (benzopyrène), résidus de médicaments vétérinaires, de nettoyage et désinfection, pesticides.", "Dangers biologiques : bactéries (S. aureus, Salmonella), virus (rotavirus, norovirus, hépatite A), parasites (Anisakis, Taenia), toxines et mycotoxines.", "Le pesticide contre les cafards est un danger chimique : la mesure de maîtrise d'un danger peut en créer un autre."], ["المخاطر الفيزيائية: الزجاج، البلاستيك الصلب، الإبر، الأدوات الحادة، الدبابيس، الخشب، حسك السمك، العظام، الحلي.", "المخاطر الكيميائية: المضافات ونواتجها (البنزوبيرين)، بقايا الأدوية البيطرية، بقايا التنظيف والتطهير، المبيدات.", "المخاطر البيولوجية: بكتيريا (S. aureus، Salmonella)، فيروسات (روتا، نورو، التهاب الكبد A)، طفيليات (Anisakis، Taenia)، سموم وسموم فطرية.", "المبيد ضد الصراصير خطر كيميائي: إجراء التحكم في خطر قد يخلق خطرًا آخر."]], "k": ["Physique, chimique, biologique.", "فيزيائي، كيميائي، بيولوجي."], "q": ["Un résidu de désinfectant dans un produit est un danger :", "بقايا المطهّر في منتوج خطر:"], "o": [["physique", "chimique", "biologique"], ["فيزيائي", "كيميائي", "بيولوجي"]], "a": 1, "w": ["C'est un résidu de nettoyage et désinfection.", "إنها بقايا التنظيف والتطهير."], "g": [20, 22, 41, 45, 65]}, {"img": "s15_13", "t": ["Pourquoi maîtriser l'hygiène", "لماذا نتحكم في النظافة"], "st": [["L'hygiène permet d'obtenir des aliments sains, sûrs et salubres.", "Objectif sanitaire : éviter les maladies et les toxi-infections alimentaires.", "Objectif économique : éviter les pertes de produit, protéger l'image de marque et l'export.", "Objectif réglementaire : respecter la loi — au Maroc, la loi 28-07. Un rappel produit fait manquer les trois d'un coup."], ["النظافة تسمح بالحصول على أغذية سليمة وآمنة وصحية.", "الهدف الصحي: تجنب الأمراض والتسممات الغذائية.", "الهدف الاقتصادي: تجنب خسارة المنتوج، حماية صورة العلامة والتصدير.", "الهدف القانوني: احترام القانون — في المغرب، القانون 28-07. سحب منتوج من السوق يُفشل الأهداف الثلاثة دفعة واحدة."]], "k": ["Sanitaire, économique, réglementaire (loi 28-07).", "صحي، اقتصادي، قانوني (القانون 28-07)."], "q": ["Au Maroc, la sécurité sanitaire des aliments est encadrée par :", "في المغرب، السلامة الصحية للأغذية يؤطرها:"], "o": [["la loi 28-07", "la loi 13-99", "aucun texte"], ["القانون 28-07", "القانون 13-99", "لا نص"]], "a": 0, "w": ["C'est la loi citée par le cours.", "هذا هو القانون المذكور في الدرس."], "g": [33, 62]}, {"img": "s15_15", "t": ["Le diagramme des 5 M", "مخطط 5 M"], "st": [["Un outil visuel pour représenter un problème et ses causes (appelé aussi diagramme d'Ishikawa ou en arêtes de poisson).", "Cinq familles de causes : Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "Une méthode : identifier les domaines importants pour trouver une solution.", "Les bonnes pratiques d'hygiène (BPH) s'organisent selon ces 5 M."], ["أداة بصرية لتمثيل مشكلة وأسبابها (تسمى أيضًا مخطط إيشيكاوا أو عظم السمكة).", "خمس عائلات من الأسباب: المواد (Matières)، المعدات (Matériel)، الوسط (Milieu)، الطرق (Méthodes)، اليد العاملة (Main-d'œuvre).", "طريقة: تحديد المجالات المهمة لإيجاد حل.", "ممارسات النظافة الجيدة (BPH) تُنظَّم حسب هذه الـ 5 M."]], "k": ["Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "المواد، المعدات، الوسط، الطرق، اليد العاملة."], "q": ["Lequel n'est PAS un des 5 M ?", "أيّها ليس من الـ 5 M؟"], "o": [["Milieu", "Marketing", "Main-d'œuvre"], ["Milieu", "Marketing", "Main-d'œuvre"]], "a": 1, "w": ["Les 5 M : Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "الـ 5 M: Matières، Matériel، Milieu، Méthodes، Main-d'œuvre."], "g": [33]}, {"img": "s15_19", "t": ["M1 Matières : la réception", "M1 المواد: الاستلام"], "st": [["Matières = matières premières, ingrédients, additifs, mais aussi eau, emballages, lubrifiants et produits de nettoyage.", "Une matière de mauvaise qualité à l'arrivée donne un mauvais produit fini : la réception est un poste clé.", "Quatre contrôles : qualitatif (origine, agrément du fournisseur, emballages intacts et propres), quantitatif, température, DLC.", "Décision : accepter si conforme, refuser sinon. C'est le seul moment où l'on peut encore refuser."], ["المواد = المواد الأولية، المكونات، المضافات، وأيضًا الماء، مواد التعبئة، مواد التشحيم ومواد التنظيف.", "مادة رديئة عند الوصول تعطي منتوجًا نهائيًا رديئًا: الاستلام منصب أساسي.", "أربع مراقبات: نوعية (المصدر، اعتماد المورّد، سلامة ونظافة التعبئة)، كمية، الحرارة، تاريخ الصلاحية DLC.", "القرار: القبول إذا كان مطابقًا، والرفض إذا لم يكن. إنها اللحظة الوحيدة التي يمكن فيها الرفض."]], "k": ["À la réception on peut refuser ; après, le problème est dedans.", "عند الاستلام يمكننا الرفض؛ بعده، المشكل صار في الداخل."], "q": ["Un camion livre du lait à 12 °C au lieu de 4 °C. On :", "شاحنة توصل حليبًا في 12 درجة بدل 4 درجات. نحن:"], "o": [["accepte et on refroidit", "refuse le lot non conforme", "le mélange au lait conforme"], ["نقبل ونبرّد", "نرفض الدفعة غير المطابقة", "نخلطه مع الحليب المطابق"]], "a": 1, "w": ["Contrôle de température non conforme = refus.", "مراقبة حرارة غير مطابقة = رفض."], "g": []}, {"img": "s15_21", "t": ["M1 Matières : stocker FEFO et FIFO", "M1 المواد: التخزين FEFO و FIFO"], "st": [["Stocker immédiatement dans de bonnes conditions : température conforme, propreté, zéro rongeur ; humidité maîtrisée.", "FEFO (First Expired, First Out) : ce qui périme en premier sort en premier.", "FIFO (First In, First Out) : ce qui est entré en premier sort en premier. Produits chimiques stockés séparément des denrées.", "Erreur classique : ranger le nouveau lot devant l'ancien ; le stock tourne à l'envers et l'ancien périme sur l'étagère."], ["التخزين فورًا في ظروف جيدة: حرارة مطابقة، نظافة، صفر قوارض؛ رطوبة متحكم فيها.", "FEFO (First Expired, First Out): ما تنتهي صلاحيته أولًا يخرج أولًا.", "FIFO (First In, First Out): ما دخل أولًا يخرج أولًا. المواد الكيميائية تُخزَّن منفصلة عن الأغذية.", "خطأ شائع: وضع الدفعة الجديدة أمام القديمة؛ يدور المخزون بالعكس وتنتهي صلاحية القديمة على الرف."]], "k": ["FEFO : date de péremption ; FIFO : date d'entrée.", "FEFO: تاريخ انتهاء الصلاحية؛ FIFO: تاريخ الدخول."], "q": ["FEFO signifie :", "FEFO تعني:"], "o": [["premier entré, premier sorti", "premier périmé, premier sorti", "dernier entré, premier sorti"], ["أول داخل، أول خارج", "أول منتهي الصلاحية، أول خارج", "آخر داخل، أول خارج"]], "a": 1, "w": ["First Expired, First Out.", "First Expired, First Out."], "g": [26]}, {"img": "s15_25", "t": ["M2 Matériel : nature et conception", "M2 المعدات: الطبيعة والتصميم"], "st": [["Matériaux en contact avec l'aliment : compatibles, résistants, lisses. Inox, verre et aluminium sont préférés au plastique ; le bois est interdit.", "Peinture ou revêtement en contact avec le produit : de qualité alimentaire (logo réglementaire).", "Conception simple : sans angle aigu, sans coin ni angle mort, facilement démontable et nettoyable.", "Codex Alimentarius : au moins 45 cm entre machine et mur, 20 cm entre machine et sol."], ["المواد الملامسة للغذاء: متوافقة، مقاومة، ملساء. الفولاذ المقاوم للصدأ والزجاج والألمنيوم تُفضَّل على البلاستيك؛ الخشب ممنوع.", "الطلاء أو الكسوة الملامسة للمنتوج: من جودة غذائية (شعار قانوني).", "تصميم بسيط: دون زوايا حادة، دون أركان أو زوايا ميتة، سهل التفكيك والتنظيف.", "الـ Codex Alimentarius: على الأقل 45 سم بين الآلة والجدار، و20 سم بين الآلة والأرض."]], "k": ["45 cm du mur, 20 cm du sol ; pas de bois.", "45 سم عن الجدار، 20 سم عن الأرض؛ لا خشب."], "q": ["Quel matériau est interdit au contact des aliments ?", "أيّ مادة ممنوعة في ملامسة الأغذية؟"], "o": [["L'inox", "Le verre", "Le bois"], ["الفولاذ المقاوم للصدأ", "الزجاج", "الخشب"]], "a": 2, "w": ["Poreux, il retient souillures et germes.", "مسامي، يحتفظ بالأوساخ والجراثيم."], "g": []}, {"img": "s15_31", "t": ["M3 Milieu : secteurs et marche en avant", "M3 الوسط: القطاعات والسير إلى الأمام"], "st": [["Le circuit des produits va du sale vers le propre, sans retour en arrière ni croisement : c'est la marche en avant.", "Séparer les secteurs : sale/propre, chaud/froid, emballage/déchet, alimentaire/non alimentaire.", "Un secteur chaud contre un secteur froid donne de la condensation au plafond, donc une contamination.", "Si le local est trop petit, on sépare dans le temps : le propre avant le sale, avec un nettoyage entre les deux."], ["مسار المنتجات يمضي من المتسخ نحو النظيف، دون رجوع ولا تقاطع: إنه السير إلى الأمام (marche en avant).", "فصل القطاعات: متسخ/نظيف، حار/بارد، تعبئة/نفايات، غذائي/غير غذائي.", "قطاع حار بجانب قطاع بارد يعطي تكثفًا في السقف، وبالتالي تلوثًا.", "إذا كان المحل صغيرًا جدًا، نفصل في الزمن: النظيف قبل المتسخ، مع تنظيف بينهما."]], "k": ["Du sale vers le propre, sans retour ni croisement.", "من المتسخ نحو النظيف، دون رجوع ولا تقاطع."], "q": ["La marche en avant interdit :", "السير إلى الأمام يمنع:"], "o": [["d'avancer vers le conditionnement", "les retours en arrière et les croisements", "le nettoyage"], ["التقدم نحو التعبئة", "الرجوع إلى الخلف والتقاطعات", "التنظيف"]], "a": 1, "w": ["Pour éviter les contaminations croisées.", "لتجنب التلوث المتقاطع."], "g": [38]}, {"img": "s15_35", "t": ["M3 Milieu : la lutte contre les nuisibles", "M3 الوسط: مكافحة الآفات"], "st": [["Mouches, cafards, fourmis, rongeurs, oiseaux, chats et chiens menacent la sécurité des aliments ; un cafard peut porter 14 millions de bactéries.", "Rongeurs : postes d'appâts dans des boîtes dédiées, bien entretenus ; plaques collantes avec couvercle transparent.", "Insectes volants : désinsectiseurs bien placés, tubes en verre incassable, entretenus. Rampants : gel, pesticides, fumigation ; oiseaux : ultrasons, répulsifs.", "Le pesticide est lui-même un danger chimique : la mesure de maîtrise doit être maîtrisée à son tour."], ["الذباب، الصراصير، النمل، القوارض، الطيور، القطط والكلاب تهدد سلامة الأغذية؛ الصرصور قد يحمل 14 مليون بكتيريا.", "القوارض: محطات طُعم في علب مخصصة، جيدة الصيانة؛ صفائح لاصقة بغطاء شفاف.", "الحشرات الطائرة: أجهزة قاتلة للحشرات جيدة الموضع، بأنابيب زجاج غير قابل للكسر، مع صيانة. الزاحفة: جل، مبيدات، تبخير؛ الطيور: موجات فوق صوتية، طاردات.", "المبيد نفسه خطر كيميائي: إجراء التحكم يجب التحكم فيه بدوره."]], "k": ["Un nuisible = un réservoir mobile de germes.", "الآفة = مستودع متنقل للجراثيم."], "q": ["Combien de bactéries un cafard peut-il porter ?", "كم بكتيريا يمكن أن يحمل الصرصور؟"], "o": [["Environ 100", "Jusqu'à 14 millions", "Aucune"], ["حوالي 100", "حتى 14 مليونًا", "لا شيء"]], "a": 1, "w": ["C'est le chiffre cité par le cours.", "هذا هو الرقم المذكور في الدرس."], "g": [20]}, {"img": "s15_37", "t": ["M4 Méthodes : la méthode AMER", "M4 الطرق: طريقة AMER"], "st": [["A — Apports : éviter l'arrivée des contaminants ; penser aux 5 M, surtout la main-d'œuvre.", "M — Multiplication : l'empêcher en jouant sur le temps, la température, l'Aw, le sel, le pH.", "E — Élimination : cuire à 70 °C, pasteuriser, stériliser ; nettoyer et désinfecter.", "R — Recontamination : conditionner dès que possible. Tranchage, hachage, broyage exposent le produit : machines très propres. Devise : vite, froid et propre."], ["A — Apports (الإدخال): منع وصول الملوِّثات؛ التفكير في الـ 5 M، خاصة اليد العاملة.", "M — Multiplication (التكاثر): منعه بالتحكم في الوقت، الحرارة، Aw، الملح، pH.", "E — Élimination (الإزالة): الطهي في 70 درجة، البسترة، التعقيم؛ التنظيف والتطهير.", "R — Recontamination (إعادة التلوث): التعبئة في أقرب وقت. التقطيع والفرم والطحن تعرّض المنتوج: آلات نظيفة جدًا. الشعار: بسرعة، بارد ونظيف."]], "k": ["AMER : Apports, Multiplication, Élimination, Recontamination.", "AMER: الإدخال، التكاثر، الإزالة، إعادة التلوث."], "q": ["Emballer le produit dès que possible répond à quelle lettre d'AMER ?", "تعبئة المنتوج في أقرب وقت تجيب عن أي حرف من AMER؟"], "o": [["A", "E", "R"], ["A", "E", "R"]], "a": 2, "w": ["Un aliment emballé est protégé de la recontamination.", "الغذاء المعبّأ محمي من إعادة التلوث."], "g": [3, 11, 22, 46, 60]}, {"img": "s15_41", "t": ["M5 Main-d'œuvre : mains, tenue, santé", "M5 اليد العاملة: اليدان، اللباس، الصحة"], "st": [["Se laver les mains : au sas avant la production, après les toilettes, une pause ou une cigarette.", "Aussi après une poignée de main, un éternuement, toute activité contaminante.", "Comment : lavabo à commande non manuelle, savon liquide, essuie-main à usage unique.", "Ongles courts, pas de bijoux. Les gants ne dispensent pas du lavage.", "Tenue : charlotte couvrant tous les cheveux, couvre-barbe si besoin, blouse claire changée chaque jour, chaussures propres, pédiluve.", "Santé : un malade est écarté des postes à risque ; coupures couvertes d'un pansement de couleur vive et détectable.", "WC séparés par deux portes : les selles contiennent plus de 10⁷ germes/g."], ["غسل اليدين: في المدخل (sas) قبل الإنتاج، بعد المرحاض، بعد الاستراحة أو السيجارة.", "وأيضًا بعد المصافحة، بعد العطس، وبعد كل نشاط ملوِّث.", "الطريقة: مغسلة بتشغيل غير يدوي، صابون سائل، منشفة للاستعمال الواحد.", "أظافر قصيرة، دون حلي. القفازات لا تُغني عن الغسل.", "اللباس: قبعة (charlotte) تغطي كل الشعر، غطاء اللحية عند الحاجة، وزرة فاتحة تُغيَّر يوميًا، أحذية نظيفة، حوض غسل الأقدام.", "الصحة: المريض يُبعد عن المناصب الخطرة؛ الجروح تُغطّى بضمادة بلون زاهٍ وقابلة للكشف.", "المراحيض مفصولة ببابين: البراز يحتوي على أكثر من 10⁷ جرثومة/غ."]], "k": ["Les gants ne remplacent pas le lavage des mains.", "القفازات لا تعوّض غسل اليدين."], "q": ["Pourquoi un pansement de couleur vive et détectable ?", "لماذا ضمادة بلون زاهٍ وقابلة للكشف؟"], "o": [["Pour l'esthétique", "Pour le retrouver s'il tombe dans le produit", "Pour désinfecter la plaie"], ["للمظهر", "لإيجادها إذا سقطت في المنتوج", "لتطهير الجرح"]], "a": 1, "w": ["Elle sera vue à l'œil ou repérée par le détecteur de métaux.", "تُرى بالعين أو يكشفها كاشف المعادن."], "g": []}], "since": "1.0"}, {"n": 16, "t": ["Nettoyage et désinfection", "التنظيف والتطهير"], "c": [{"img": "s16_07", "t": ["Nettoyer et désinfecter", "التنظيف والتطهير"], "st": [["Le nettoyage retire les souillures (organiques, minérales, corps étrangers) et rend la surface visuellement propre ; seul, il ne garantit pas la décontamination.", "La désinfection élimine les micro-organismes et inactive les virus présents sur la surface.", "La désinfection n'est efficace qu'après un nettoyage : sur une surface sale, le désinfectant est neutralisé par la souillure.", "Une surface visuellement propre peut donc rester bactériologiquement sale."], ["التنظيف يزيل الأوساخ (العضوية، المعدنية، الأجسام الغريبة) ويجعل السطح نظيفًا بصريًا؛ وحده لا يضمن إزالة التلوث.", "التطهير يقضي على الكائنات الدقيقة ويعطّل الفيروسات الموجودة على السطح.", "التطهير لا يكون فعالًا إلا بعد التنظيف: على سطح متسخ، الأوساخ تُبطل مفعول المطهّر.", "إذن سطح نظيف بصريًا قد يبقى متسخًا بكتيريولوجيًا."]], "k": ["Toujours nettoyer AVANT de désinfecter.", "دائمًا التنظيف قبل التطهير."], "q": ["Pourquoi nettoyer avant de désinfecter ?", "لماذا ننظف قبل أن نطهّر؟"], "o": [["Pour économiser du désinfectant", "Parce que la souillure neutralise le désinfectant", "L'ordre n'a pas d'importance"], ["لتوفير المطهّر", "لأن الأوساخ تُبطل مفعول المطهّر", "الترتيب ليس مهمًا"]], "a": 1, "w": ["Un désinfectant sur surface sale ne marche pas.", "المطهّر على سطح متسخ لا يعمل."], "g": [22, 65]}, {"img": "s16_09", "t": ["Trois propretés, pas une", "ثلاثة أنواع من النظافة، لا نوع واحد"], "st": [["Physiquement propre : aucune souillure visible.", "Microbiologiquement propre : un niveau acceptable de micro-organismes, sans danger pour le consommateur. Seule l'analyse le voit.", "Chimiquement propre : aucun résidu chimique de production ni de nettoyage-désinfection (N&D).", "Piège : sauter le rinçage final, c'est échanger une propreté microbiologique contre une saleté chimique."], ["نظيف فيزيائيًا: لا أوساخ مرئية.", "نظيف ميكروبيولوجيًا: مستوى مقبول من الكائنات الدقيقة، دون خطر على المستهلك. التحليل وحده يراه.", "نظيف كيميائيًا: لا بقايا كيميائية للإنتاج ولا للتنظيف والتطهير (N&D).", "الفخ: تجاوز الشطف النهائي يعني استبدال نظافة ميكروبيولوجية بوساخة كيميائية."]], "k": ["Physique, microbiologique, chimique.", "فيزيائية، ميكروبيولوجية، كيميائية."], "q": ["Oublier le rinçage final compromet la propreté :", "نسيان الشطف النهائي يُخلّ بالنظافة:"], "o": [["physique", "chimique", "visuelle"], ["الفيزيائية", "الكيميائية", "البصرية"]], "a": 1, "w": ["Il reste des résidus de désinfectant.", "تبقى بقايا المطهّر."], "g": [20, 22]}, {"img": "s16_11", "t": ["La nature de la souillure", "طبيعة الأوساخ"], "st": [["La souillure est un mélange de composés organiques (lipides, protéines, glucides), de minéraux (sels, calcaire, rouille) et de germes.", "Souillures organiques → détergent alcalin.", "Souillures minérales → détergent acide.", "Germes → désinfection, une fois les deux premières retirées. C'est la souillure qui dicte le choix du produit."], ["الأوساخ خليط من مركبات عضوية (دهون، بروتينات، سكريات)، ومعادن (أملاح، كلس، صدأ)، وجراثيم.", "أوساخ عضوية ← منظّف قاعدي (alcalin).", "أوساخ معدنية ← منظّف حمضي (acide).", "الجراثيم ← التطهير، بعد إزالة النوعين الأولين. الأوساخ هي التي تحدد اختيار المنتوج."]], "k": ["Organique → alcalin ; minéral → acide ; germes → désinfectant.", "عضوي ← قاعدي؛ معدني ← حمضي؛ جراثيم ← مطهّر."], "q": ["Du calcaire sur un échangeur s'élimine avec :", "الكلس على المبادل الحراري يُزال بـ:"], "o": [["un détergent alcalin", "un détergent acide", "de l'eau froide seule"], ["منظّف قاعدي", "منظّف حمضي", "ماء بارد فقط"]], "a": 1, "w": ["Le calcaire est une souillure minérale.", "الكلس وسخ معدني."], "g": [22, 23]}, {"img": "s16_13", "t": ["Comment agit un détergent", "كيف يعمل المنظّف"], "st": [["La molécule de détergent est amphiphile : une tête polaire qui aime l'eau (hydrophile), une queue apolaire qui la fuit (hydrophobe).", "La queue se fixe sur la graisse, la tête reste dans l'eau : la salissure est décrochée.", "L'eau emporte ensuite l'ensemble.", "C'est la même structure que les phospholipides de la membrane bactérienne (séance 3)."], ["جزيء المنظّف مزدوج الألفة (amphiphile): رأس قطبي يحب الماء (hydrophile)، وذيل غير قطبي ينفر منه (hydrophobe).", "الذيل يلتصق بالدهون، والرأس يبقى في الماء: فتنفصل الأوساخ.", "ثم يحمل الماء الكل.", "إنها نفس بنية الفوسفوليبيدات في الغشاء البكتيري (الحصة 3)."]], "k": ["Amphiphile = une tête dans l'eau, une queue dans la graisse.", "Amphiphile = رأس في الماء، ذيل في الدهون."], "q": ["La queue hydrophobe d'un détergent se fixe sur :", "الذيل الكاره للماء في المنظّف يلتصق بـ:"], "o": [["l'eau", "la graisse", "le métal"], ["الماء", "الدهون", "المعدن"]], "a": 1, "w": ["Elle fuit l'eau et s'accroche à la salissure grasse.", "ينفر من الماء ويلتصق بالوسخ الدهني."], "g": [23]}, {"img": "s16_15", "t": ["Les trois familles de détergents", "العائلات الثلاث للمنظّفات"], "st": [["Alcalin (dégraissant) : élimine les souillures organiques ; base type : la soude (NaOH).", "Acide (détartrant) : élimine le calcaire et les souillures minérales ; acide type : l'acide phosphorique.", "Neutre : surtout pour l'usage manuel, il ne doit pas attaquer la peau.", "Un détergent contient : une base pour l'organique, un acide pour le minéral, un complexant du calcium (EDTA), parfois une enzyme (lipase)."], ["القاعدي (مزيل الدهون): يزيل الأوساخ العضوية؛ القاعدة النموذجية: الصودا (NaOH).", "الحمضي (مزيل الكلس): يزيل الكلس والأوساخ المعدنية؛ الحمض النموذجي: حمض الفوسفوريك.", "المتعادل: خاصة للاستعمال اليدوي، يجب ألا يؤذي الجلد.", "المنظّف يحتوي: قاعدة للعضوي، حمضًا للمعدني، مركّبًا خالبًا للكالسيوم (EDTA)، وأحيانًا إنزيمًا (lipase)."]], "k": ["Soude = dégraissant ; acide phosphorique = détartrant.", "الصودا = مزيل الدهون؛ حمض الفوسفوريك = مزيل الكلس."], "q": ["La soude (NaOH) est un détergent :", "الصودا (NaOH) منظّف:"], "o": [["acide", "alcalin", "neutre"], ["حمضي", "قاعدي", "متعادل"]], "a": 1, "w": ["C'est une base : elle dégraisse.", "إنها قاعدة: تزيل الدهون."], "g": [23]}, {"img": "s16_21", "t": ["TACT et la roue de Sinner", "TACT وعجلة سينر"], "st": [["T — Température : eau à 40–50 °C.", "A — Action mécanique : brossage, raclage, jet haute pression.", "C — Concentration en détergent.", "T — Temps de contact : 10 à 30 minutes.", "Roue de Sinner : ce qu'on retire à un paramètre doit être compensé par un autre.", "Au-delà de 70 °C, les protéines coagulent et le détergent se décompose.", "Plus chaud n'est pas mieux."], ["T — الحرارة (Température): ماء في 40–50 درجة.", "A — الفعل الميكانيكي (Action mécanique): الفرك، الكشط، النفث بضغط عالٍ.", "C — تركيز المنظّف (Concentration).", "T — زمن التلامس (Temps): 10 إلى 30 دقيقة.", "عجلة سينر: ما ننقصه من عامل يجب تعويضه بعامل آخر.", "فوق 70 درجة تتخثر البروتينات ويتحلل المنظّف.", "الأسخن ليس الأفضل."]], "k": ["TACT : Température, Action, Concentration, Temps.", "TACT: الحرارة، الفعل، التركيز، الزمن."], "q": ["Si on ne peut pas brosser (moins d'action mécanique), on peut :", "إذا لم نستطع الفرك (فعل ميكانيكي أقل)، يمكننا:"], "o": [["réduire aussi le temps", "augmenter le temps ou la concentration", "chauffer à 90 °C"], ["تقليل الزمن أيضًا", "زيادة الزمن أو التركيز", "التسخين إلى 90 درجة"]], "a": 1, "w": ["C'est le principe de compensation de la roue de Sinner.", "هذا مبدأ التعويض في عجلة سينر."], "g": [23, 61]}, {"img": "s16_25", "t": ["Le protocole de N&D en 7 étapes", "بروتوكول التنظيف والتطهير في 7 مراحل"], "st": [["1 Pré-lavage (souillures peu adhérentes) → 2 Nettoyage alcalin (organique) → 3 Rinçage intermédiaire.", "4 Nettoyage acide (minéral) → 5 Rinçage intermédiaire.", "6 Désinfection (réduire les microbes restants, éliminer les pathogènes) → 7 Rinçage final à l'eau potable (résidus de désinfectant).", "Règle d'or : ne jamais mélanger un détergent et un désinfectant."], ["1 الغسل المسبق (أوساخ قليلة الالتصاق) ← 2 التنظيف القاعدي (العضوي) ← 3 شطف وسيط.", "4 التنظيف الحمضي (المعدني) ← 5 شطف وسيط.", "6 التطهير (تقليل الميكروبات المتبقية، القضاء على الممرضات) ← 7 شطف نهائي بالماء الصالح للشرب (بقايا المطهّر).", "القاعدة الذهبية: لا تخلط أبدًا منظّفًا ومطهّرًا."]], "k": ["Alcalin → rinçage → acide → rinçage → désinfection → rinçage.", "قاعدي ← شطف ← حمضي ← شطف ← تطهير ← شطف."], "q": ["Quelle étape vient juste avant la désinfection ?", "أيّ مرحلة تأتي مباشرة قبل التطهير؟"], "o": [["Le rinçage final", "Un rinçage intermédiaire après le nettoyage acide", "Le pré-lavage"], ["الشطف النهائي", "شطف وسيط بعد التنظيف الحمضي", "الغسل المسبق"]], "a": 1, "w": ["Étape 5 : on retire le détergent acide avant de désinfecter.", "المرحلة 5: نزيل المنظّف الحمضي قبل التطهير."], "g": [22, 23]}, {"img": "s16_29", "t": ["Les désinfectants", "المطهّرات"], "st": [["Chlorés : peu coûteux et efficaces, mais corrosifs à forte dose et en milieu acide, sensibles aux souillures, source de mauvais goûts.", "Ammoniums quaternaires : détergents et désinfectants à la fois, mais plus chers et moussants ; bien rincer.", "Eau chaude (82 °C, 20 min) : sans résidus, peu coûteuse, mais non sporicide, entartrante, dangereuse pour les mains.", "Autres : H₂O₂ sans rinçage (emballages UHT), acide peracétique (efficace à froid, mais corrosif et explosif), formol (efficace mais irritant, résidus toxiques)."], ["المركبات الكلورية: رخيصة وفعالة، لكنها أكّالة بجرعة عالية وفي الوسط الحمضي، حساسة للأوساخ، وتسبب طعمًا سيئًا.", "الأمونيوم الرباعي: منظّف ومطهّر في آن واحد، لكنه أغلى ويُكوّن رغوة؛ يجب الشطف الجيد.", "الماء الساخن (82 درجة، 20 دقيقة): دون بقايا، رخيص، لكنه لا يقتل الأبواغ، ويترك الكلس، وخطير على اليدين.", "أخرى: H₂O₂ دون شطف (عبوات UHT)، حمض البيراسيتيك (فعال في البرد لكنه أكّال وقابل للانفجار)، الفورمول (فعال لكنه مهيّج وبقاياه سامة)."]], "k": ["Chlore et ammoniums quaternaires : les deux principaux.", "الكلور والأمونيوم الرباعي: المطهّران الرئيسيان."], "q": ["Quel désinfectant est aussi détergent ?", "أيّ مطهّر هو أيضًا منظّف؟"], "o": [["Le chlore", "Les ammoniums quaternaires", "L'eau chaude"], ["الكلور", "الأمونيوم الرباعي", "الماء الساخن"]], "a": 1, "w": ["Ils ont une double action, mais moussent.", "لهم تأثير مزدوج، لكنهم يكوّنون رغوة."], "g": [20, 22, 23, 64]}, {"img": "s16_33", "t": ["Contrôler l'efficacité", "مراقبة الفعالية"], "st": [["Contrôle visuel et au toucher : simple et indispensable ; si c'est sale, la microbiologie est inutile.", "Contrôle chimique : colorant dans l'eau de rinçage (révèle les souillures) et vérification de la neutralité du pH.", "ATP-métrie : l'ATP de toute matière vivante est dosé par fluorescence en quelques secondes ; peu spécifique, mais permet de re-nettoyer tout de suite.", "Empreinte sur gélose : lames couvertes de géloses nutritives appliquées sur la surface. Tous les résultats sont enregistrés."], ["المراقبة البصرية واللمسية: بسيطة وضرورية؛ إذا كان متسخًا فالتحليل الميكروبيولوجي بلا فائدة.", "المراقبة الكيميائية: ملوّن في ماء الشطف (يكشف الأوساخ) والتحقق من تعادل pH.", "قياس ATP (ATP-métrie): يُقاس ATP لكل مادة حية بالتألق في ثوانٍ؛ قليل التخصص، لكنه يسمح بإعادة التنظيف فورًا.", "البصمة على الآغار: شرائح مغطاة بآغار مغذٍّ تُطبَّق على السطح. كل النتائج تُسجَّل."]], "k": ["ATP-métrie = réponse en secondes ; gélose = réponse en jours.", "قياس ATP = نتيجة في ثوانٍ؛ الآغار = نتيجة في أيام."], "q": ["Quel contrôle donne un résultat en quelques secondes ?", "أيّ مراقبة تعطي نتيجة في ثوانٍ؟"], "o": [["L'empreinte sur gélose", "L'ATP-métrie", "Le dénombrement en boîte"], ["البصمة على الآغار", "قياس ATP", "الإحصاء في العلبة"]], "a": 1, "w": ["Mesure par fluorescence en temps réel.", "قياس بالتألق في الوقت الحقيقي."], "g": [8]}, {"img": "s16_35", "t": ["Le plan de nettoyage et désinfection", "مخطط التنظيف والتطهير"], "st": [["C'est un document écrit, daté, signé et archivé, pour chaque local et chaque appareil.", "Quoi : le local, le matériel ou l'équipement concerné.", "Comment et quand : méthode, outils, TACT et fréquence (par exemple en fin de journée).", "Par qui et avec quelle preuve : le responsable qui signe, les contrôles d'efficacité et leur enregistrement. Ce qui n'est pas écrit n'a pas été fait."], ["إنه وثيقة مكتوبة، مؤرخة، موقّعة ومؤرشفة، لكل محل وكل جهاز.", "ماذا: المحل، أو العتاد، أو التجهيز المعني.", "كيف ومتى: الطريقة، الأدوات، TACT والتواتر (مثلًا في نهاية اليوم).", "من ينفذ وبأي دليل: المسؤول الذي يوقّع، مراقبات الفعالية وتسجيلها. ما ليس مكتوبًا لم يُنجز."]], "k": ["Quoi, comment, quand, qui, preuve.", "ماذا، كيف، متى، من، الدليل."], "q": [ let soundOn=load("mr_sound",true);
let actx=null;
function beep(freqs,dur){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;
    const t0=actx.currentTime+i*dur;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.02)})}catch(e){}}
function buzz(ms){if(!soundOn)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function sfx(kind){if(kind==="ok"){beep([660,880],.09);buzz(25)}else if(kind==="ko"){beep([220,180],.12);buzz([40,40,40])}else if(kind==="win"){beep([523,659,784,1047],.1);buzz(60)}}
function toggleSound(){soundOn=!soundOn;save("mr_sound",soundOn);render()}
function confetti(){
  const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);
  const W=cv.width=innerWidth,H=cv.height=innerHeight,ctx=cv.getContext("2d");
  const cols=["#1F5A8C","#2E7BB8","#E3A21A","#1E8A55","#D9480F","#8ecae6"];
  const P=Array.from({length:130},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
    if(++t<110)requestAnimationFrame(f);else cv.remove()})();
}

function vfAns(v){const g=st.game;if(!g||g.over||g.lock)return;const ok=(v===g.cur.truth);

function pairsStart(id){const set=pairSets().find(s=>s.id===id);let items;

function pairTap(side,i){const g=st.game;if(!g)return;

function orderStart(i){if(i<0){const done=load("mr_order",{});const left=DATA.seq.map((_,k)=>k).filter(k=>!done[k]&&(!st.game||st.game.i!==k));i=(left.length?left:DATA.seq.map((_,k)=>k))[Math.floor(Math.random()*(left.length||DATA.seq.length))]}
  const n=DATA.seq[i].it.length;let pool=shuffle([...Array(n).keys()]);if(pool.every((k,j)=>k===j))pool=pool.reverse();
  st.game={type:"order",i,pool,ans:[],checked:false,tries:0};vOrder();window.scrollTo(0,0)}
function orderTap(k){const g=st.game;if(!g||g.checked)return;g.ans.push(k);vOrder()}
function orderUndo(j){const g=st.game;if(!g||g.checked)return;g.ans.splice(j,1);vOrder()}
function orderCheck(){const g=st.game;g.checked=true;const ok=g.ans.every((k,j)=>k===j);
  if(ok){sfx("win");confetti();const d=load("mr_order",{});d[g.i]=1;save("mr_order",d);gameDone(20)}else{sfx("ko");gameDone(5)}
  vOrder()}

// --- 🤝 Défi entre amis (même code = mêmes questions)
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seededShuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function vDefi(){

    document.getElementById("main").innerHTML=`<div class="end" style="padding:14px 6px 6px"><div style="font-size:46px">🤝</div><p class="sub">${T("defiIntro")}</p></div>

    return}

  const it=g.q[g.pos],c=S_BY[it.r.s].c[it.r.i],a=g.ans[g.pos];

}

// --- mini encodeur QR (mode octet, correction M, versions 1 à 10) — d'après l'algorithme de référence (Nayuki)
const QR=(()=>{
  const ECC_CW=[0,10,16,26,18,24,16,18,22,22,26];          // codewords de correction par bloc (niveau M)
  const BLOCKS=[0,1,1,1,2,2,4,4,4,5,5];                    // nombre de blocs (niveau M)
  function rawMods(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
  const dataCW=v=>Math.floor(rawMods(v)/8)-ECC_CW[v]*BLOCKS[v];
  function mul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255}
  function divisor(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
  function remainder(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r}
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let v=1;for(;v<=10;v++){if(4+(v<10?8:16)+bytes.length*8<=dataCW(v)*8)break}
    if(v>10)throw new Error("QR trop long");
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCW(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
    // blocs + correction, puis entrelacement
    const nb=BLOCKS[v],ecl=ECC_CW[v],raw=Math.floor(rawMods(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb);
    const div=divisor(ecl),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-ecl+(i<nShort?0:1));k+=dat.length;const ec=remainder(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ecl||j>=nShort)all.push(b[i])});
    // matrice
    const size=v*4+17,M=[],F=[];for(let i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    if(v>=2){const n=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,pos=[6];for(let p=size-7;pos.length<n;p-=step)pos.splice(1,0,p);
      pos.forEach((a,i)=>pos.forEach((b,j)=>{if(!((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0)))for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
    const drawFormat=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412;const g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
      for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
    drawFormat(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);set(a,c,bit);set(c,a,bit)}}
    // placement des données
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!==0;i++}}}
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&maskFn[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      const pat=[true,false,true,true,true,false,true,false,false,false,false],pat2=pat.slice().reverse();
      for(let y=0;y<size;y++)for(let x=0;x+11<=size;x++){let a=true,b=true;for(let k=0;k<11;k++){if(M[y][x+k]!==pat[k])a=false;if(M[y][x+k]!==pat2[k])b=false}if(a)p+=40;if(b)p+=40}
      for(let x=0;x<size;x++)for(let y=0;y+11<=size;y++){let a=true,b=true;for(let k=0;k<11;k++){if(M[y+k][x]!==pat[k])a=false;if(M[y+k][x]!==pat2[k])b=false}if(a)p+=40;if(b)p+=40}
      let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++}));const tot=size*size;p+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;return p};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){applyMask(m);drawFormat(m);const p=penalty();if(p<bp){bp=p;best=m}applyMask(m)}
    applyMask(best);drawFormat(best);
    return M;
  }
  function svg(text,px,color){const M=encode(text),n=M.length,q=4;let d="";M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q} ${y+q}h1v1h-1z`}));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*q} ${n+2*q}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="${color||"#12385a"}"/></svg>`}
  return {encode,svg};
})();

  const l=L(), d=st.deck; let ok=0,ans=0;
  d.forEach(r=>{const a=st.answered[key(r)];if(a!==undefined){ans++;if(a===S_BY[r.s].c[r.i].a)ok++}});
  const tot=d.length;
  let btn="";
  if(st.mode==="s"){
    const nx=st.sn+1;
    btn=(S_BY[nx]?`<button class="big" onclick="go('s${nx}')">${T("nextS")}</button>`:"")+
        `<button class="big alt" onclick="again()">${T("again")}</button><button class="big alt" onclick="go('m')">${T("backMod")}</button><button class="big alt" onclick="go('')">🏠 ${T("home")}</button>`;
    setTop(`${T("seance")} ${st.sn}`,S_BY[st.sn].t[l],true);
  }else{
    if(st.mode==="x"){btn=`<button class="big gold" onclick="newExpress()">${T("newExp")}</button>`;setTop(T("expDone"),"",true)}
    else{btn=(st.mode==="r"&&dueList().length?`<button class="big rev" onclick="startReview()">${T("review")}</button>`:"")+(st.mode==="q"?`<button class="big alt" onclick="go('q')">${T("search")}</button>`:"");setTop({r:T("reviewTitle"),f:T("fav").replace(/^★\s*/,""),q:T("search").replace(/^🔍\s*/,""),w:T("examErrors")}[st.mode]||"✓","",true)}
    btn+=`<button class="big alt" onclick="go('')">🏠 ${T("home")}</button>`;
  }
  const emo=ok===tot?"🏆":ok>=tot*0.6?"👍":"💪";
  if(st.mode==="l"&&!st.learnCounted){st.learnCounted=1;bump("learn");addXP(20)}
  if(ok===tot&&tot>=3){confetti();sfx("win")}
  document.getElementById("main").innerHTML=`<div class="end">${mimg(ok===tot?"p_thumb":ok>=tot*0.6?"c_ok":"c_ask",ok===tot?130:110,"margin:0 auto")}
    <h1>${st.mode==="s"?T("done"):st.mode==="x"?T("expDone"):st.mode==="r"?T("revDone"):st.mode==="l"?T("learnDone"):T("allDone")}</h1><p class="sub">${T("yourScore")}</p>
    <div class="score" dir="ltr">${ok} / ${tot}</div></div>${st.mode==="s"?sessSummary(st.sn):""}${btn}`;
  document.getElementById("pager").innerHTML="";
}
function again(){st.deck.forEach(r=>{delete st.hint[key(r)];delete st.answered[key(r)];delete st.reveal[key(r)];delete st.order[key(r)]});st.pos=0;cardView();window.scrollTo(0,0)}
function zoom(img){
  const z=document.createElement("div");z.className="zoomv";
  z.innerHTML=`<img src="${IMGS[img]}" alt=""><button aria-label="Fermer">✕</button><div class="hint">${T("zoomHint")}</div>`;
  z.querySelector("button").onclick=()=>z.remove(); document.body.appendChild(z);
}
// balayage
let tx=null,ty=null;
document.addEventListener("touchstart",e=>{if(!document.getElementById("card")||document.querySelector(".zoomv"))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>1.8*Math.abs(dy)){let dir=dx<0?1:-1;if(st.lang==="ar")dir=-dir;move(dir)}},{passive:true});
function vCover(){
  document.querySelector(".top").style.display="none";
  const c=document.createElement("div");c.className="cover";c.id="cover";
  c.innerHTML=`<img class="wm" src="icons/asmekti-logo-fond-sombre.svg" alt="Asmekti Learn — Rappel de cours · OFPPT"><div class="tif">ⴰⵙⵎⴽⵜⵉ</div>
   <div class="sl" dir="rtl" style="text-align:right"><small>العربية</small><p>درسك في جيبك: تذكير سريع، بطاقة بعد بطاقة، بصور حصصك.</p></div>
   <div class="sl" dir="ltr"><small>ⵜⴰⵎⴰⵣⵉⵖⵜ</small><p>ⴰⵙⵎⴽⵜⵉ ⵏ ⵓⵍⵎⵓⴷ ⴳ ⵓⴼⵓⵙ ⵏⵏⴽ</p></div>
   <div class="sl" dir="ltr"><small>English</small><p>Your course in your pocket: a quick refresher, card by card, with pictures from your sessions.</p></div>
   <div class="sl" dir="ltr"><small>Français</small><p>Ton cours dans la poche : une piqûre de rappel, carte par carte, avec les images de tes séances.</p></div>
   <button class="go" onclick="closeCover()">ابدأ · ⴱⴷⵓ · Start · Commencer</button>
   <div class="cr">يعمل دون إنترنت · ⵉⵜⵜⵅⴷⴰⵎ ⴱⵍⴰ ⵉⵏⵜⵔⵏⵉⵜ · Works offline · Fonctionne sans Internet</div>
   <div class="ver">Version 1.5</div>`;
  document.body.appendChild(c);
}
function closeCover(){const c=document.getElementById("cover");c&&c.remove();document.querySelector(".top").style.display="";render();if(!profile&&!load("mr_profile_skip",0))go("u");else maybeNews()}
if(!location.hash) vCover();
render();
if(location.hash&&location.hash[1]!=="R") maybeNews();
// Mise à jour : détection d'une nouvelle version et bandeau
function forceUpdate(){
  const go=()=>location.reload();
  try{
    Promise.resolve(window.caches?caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))):0)
      .then(()=>navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update().catch(()=>{})))
      .then(go,go);
  }catch(e){go()}
}
function checkVersion(){
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(j&&j.v&&j.v!==DATA.v) showUpdateBar();
  }).catch(()=>{});
}
if("serviceWorker" in navigator){
  let hasCtrl=!!navigator.serviceWorker.controller;   // false à la toute première visite
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hasCtrl) showUpdateBar(); else hasCtrl=true; });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ reg.update().catch(()=>{}); checkVersion(); } });
    }).catch(()=>{});
    setTimeout(checkVersion,1500);
  });
}
