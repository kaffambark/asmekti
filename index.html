", "Coût énergétique : monter à 150 °C et redescendre en quelques secondes exige équipement et énergie.", "L'arbitrage du technicien : choisir le barème le plus doux qui assure la sécurité et la durée de vie visées."], ["الجودة الحسية (organoleptique): طعم مطبوخ، لون وقوام متغيران؛ حليب UHT ليس له طعم الحليب المبستر.", "الجودة الغذائية: جزء من الفيتامينات والمغذيات الحساسة للحرارة يُدمَّر.", "الكلفة الطاقية: الصعود إلى 150 درجة والنزول في ثوانٍ يتطلب معدات وطاقة.", "اختيار التقني: اختيار أخفّ معالجة تضمن السلامة ومدة الصلاحية المطلوبة."]], "k": ["Sécurité, qualité, coût : le barème le plus doux qui suffit.", "السلامة، الجودة، الكلفة: أخفّ معالجة كافية."], "q": ["Quel est le bon choix de barème ?", "ما هو الاختيار الصحيح للمعالجة؟"], "o": [["Toujours le plus sévère", "Le plus doux qui assure la sécurité visée", "Aucun traitement"], ["الأشد دائمًا", "الأخف الذي يضمن السلامة المطلوبة", "لا معالجة"]], "a": 1, "w": ["Un barème trop sévère abîme le produit inutilement.", "المعالجة الشديدة جدًا تُتلف المنتوج دون فائدة."]}]}, {"n": 14, "t": ["Aw, conservateurs, atmosphères et barrières", "نشاط الماء، المواد الحافظة، الأجواء والحواجز"], "c": [{"img": "s14_09", "t": ["Retirer l'eau ou la rendre indisponible", "إزالة الماء أو جعله غير متاح"], "st": [["Séchage : on élimine l'eau libre et une partie de l'eau liée.", "Déshydratation : on retire la plus grande partie de l'eau liée ; l'Aw devient assez basse pour interdire tout développement microbien.", "Sucrage et salage : le sucre ou le sel dissous se lie aux molécules d'eau et les rend indisponibles.", "Sucrer ou saler n'enlève pas l'eau, cela l'occupe : pour le germe, le résultat est le même."], ["التجفيف (séchage): نزيل الماء الحر وجزءًا من الماء المرتبط.", "نزع الماء (déshydratation): نزيل الجزء الأكبر من الماء المرتبط؛ يصبح Aw منخفضًا بما يكفي لمنع كل نمو ميكروبي.", "التسكير والتمليح: السكر أو الملح المذاب يرتبط بجزيئات الماء ويجعلها غير متاحة.", "التسكير أو التمليح لا يزيل الماء بل يشغله: بالنسبة للجرثومة النتيجة واحدة."]], "k": ["Le sel et le sucre occupent l'eau.", "الملح والسكر يشغلان الماء."], "q": ["Comment le sucre conserve-t-il un produit ?", "كيف يحفظ السكر المنتوج؟"], "o": [["Il tue les germes par la chaleur", "Il lie l'eau et la rend indisponible", "Il acidifie fortement"], ["يقتل الجراثيم بالحرارة", "يربط الماء ويجعله غير متاح", "يحمّض بقوة"]], "a": 1, "w": ["Il abaisse l'activité de l'eau.", "يخفض نشاط الماء."]}, {"img": "s14_11", "t": ["L'Aw des produits courants", "نشاط الماء في المنتجات الشائعة"], "st": [["Aw élevée (> 0,95) : viandes, poissons, laits frais. Toutes les flores s'y développent ; froid ou traitement thermique obligatoires.", "Aw intermédiaire (0,60 à 0,90) : charcuteries sèches, fromages affinés, fruits secs. Seules les levures et moisissures osmophiles tiennent.", "Aw basse (< 0,60) : confitures, poudres, épices, lait en poudre. Plus aucune croissance microbienne.", "C'est la table de référence de l'atelier : chaque produit mesuré doit y être placé."], ["Aw مرتفع (> 0,95): اللحوم، الأسماك، الحليب الطازج. كل الفلورا تنمو؛ البرودة أو المعالجة الحرارية إجبارية.", "Aw متوسط (0,60 إلى 0,90): اللحوم المصنعة المجففة، الأجبان المنضّجة، الفواكه الجافة. لا تصمد إلا الخمائر والأعفان المحبة للسكر (osmophiles).", "Aw منخفض (< 0,60): المربى، المساحيق، التوابل، الحليب المجفف. لا نمو ميكروبي إطلاقًا.", "هذا جدول الورشة المرجعي: كل منتوج مَقيس يجب وضعه فيه."]], "k": ["0,95 : tout pousse ; 0,60 : plus rien.", "0,95: كل شيء ينمو؛ 0,60: لا شيء."], "q": ["Un lait en poudre (Aw < 0,60) :", "الحليب المجفف (Aw < 0,60):"], "o": [["permet la croissance de tous les germes", "ne permet plus de croissance microbienne", "doit être congelé"], ["يسمح بنمو كل الجراثيم", "لا يسمح بأي نمو ميكروبي", "يجب تجميده"]], "a": 1, "w": ["Sous 0,60, aucune croissance n'est possible.", "تحت 0,60 لا نمو ممكن."]}, {"img": "s14_13", "t": ["Le poisson salé et la confiture", "السمك المملح والمربى"], "st": [["Salage : le sel dissous fixe les molécules d'eau. Associé au séchage puis au fumage, il conserve viandes et poissons depuis des siècles. « Le sel ne tue pas : il assèche. »", "Sucrage : une confiture à 60 % de sucre a une Aw trop basse pour toute bactérie ; seules quelques moisissures de surface peuvent s'y installer.", "La moisissure sur une confiture arrive par l'air, pas par le pot.", "Ces procédés sont des barrières : ils ne détruisent rien, ils rendent le milieu inhabitable."], ["التمليح: الملح المذاب يثبّت جزيئات الماء. مع التجفيف ثم التدخين، يحفظ اللحوم والأسماك منذ قرون. «الملح لا يقتل: إنه يجفّف».", "التسكير: مربى بـ 60٪ من السكر له Aw منخفض جدًا لأي بكتيريا؛ فقط بعض أعفان السطح يمكن أن تستقر.", "العفن على المربى يأتي من الهواء، وليس من الإناء.", "هذه الطرق حواجز: لا تدمّر شيئًا، بل تجعل الوسط غير صالح للعيش."]], "k": ["Barrière = rendre inhabitable, pas détruire.", "الحاجز = جعل الوسط غير صالح للعيش، وليس التدمير."], "q": ["Le sel conserve le poisson parce qu'il :", "الملح يحفظ السمك لأنه:"], "o": [["tue toutes les bactéries", "assèche en fixant l'eau", "le rend acide"], ["يقتل كل البكتيريا", "يجفّف بتثبيت الماء", "يجعله حمضيًا"]], "a": 1, "w": ["« Le sel ne tue pas : il assèche. »", "«الملح لا يقتل: إنه يجفّف»."]}, {"img": "s14_15", "t": ["Les conservateurs", "المواد الحافظة"], "st": [["Ce sont des composés utilisés à faibles doses.", "Le sel (chlorure de sodium) inhibe en particulier les bacilles à Gram négatif.", "Les nitrates et nitrites, utilisés en charcuterie, bloquent des flores ciblées et fixent la couleur.", "Un conservateur accompagne un procédé, il ne le remplace pas. Chaque conservateur autorisé porte un numéro E."], ["إنها مركبات تُستعمل بجرعات ضعيفة.", "الملح (كلوريد الصوديوم) يثبّط خاصة العصيات سالبة الغرام (Gram négatif).", "النترات والنتريت، المستعملة في اللحوم المصنعة، توقف فلورا محددة وتثبّت اللون.", "المادة الحافظة ترافق طريقة الحفظ ولا تعوّضها. كل مادة حافظة مرخّصة تحمل رقم E."]], "k": ["Faible dose, numéro E, jamais seul.", "جرعة ضعيفة، رقم E، ليس وحده أبدًا."], "q": ["À quoi servent les nitrites en charcuterie ?", "ما دور النتريت في اللحوم المصنعة؟"], "o": [["À sucrer le produit", "À bloquer certaines flores et fixer la couleur", "À stériliser"], ["تسكير المنتوج", "إيقاف بعض الفلورا وتثبيت اللون", "التعقيم"]], "a": 1, "w": ["Double rôle : antimicrobien ciblé et couleur.", "دور مزدوج: مضاد ميكروبي محدد وتثبيت اللون."]}, {"img": "s14_17", "t": ["La fermentation comme conservation", "التخمر كوسيلة حفظ"], "st": [["L'acide produit par les bactéries ou l'alcool produit par les levures protège l'aliment.", "Produits laitiers : l'acide lactique abaisse le pH (séance 12).", "Olives et légumes : saumure et fermentation lactique combinées. Vin et bière : l'alcool protège le produit fini.", "Le paradoxe : on utilise des micro-organismes pour en écarter d'autres ; le ferment occupe la place avant le contaminant."], ["الحمض الذي تنتجه البكتيريا أو الكحول الذي تنتجه الخمائر يحمي الغذاء.", "منتجات الحليب: حمض اللبن يخفض pH (الحصة 12).", "الزيتون والخضر: محلول ملحي وتخمر لبني معًا. النبيذ والجعة: الكحول يحمي المنتوج النهائي.", "المفارقة: نستعمل كائنات دقيقة لإبعاد كائنات أخرى؛ الخميرة تحتل المكان قبل الملوِّث."]], "k": ["Le ferment prend la place avant le contaminant.", "الخميرة تحتل المكان قبل الملوِّث."], "q": ["Comment le yaourt se protège-t-il des bactéries pathogènes ?", "كيف يحمي الياغورت نفسه من البكتيريا الممرضة؟"], "o": [["Par l'alcool", "Par l'acide lactique qui abaisse le pH", "Par le sel"], ["بالكحول", "بحمض اللبن الذي يخفض pH", "بالملح"]], "a": 1, "w": ["Le pH bas écarte les bactéries neutrophiles.", "pH المنخفض يُبعد البكتيريا محبّة التعادل."]}, {"img": "s14_19", "t": ["Le fumage", "التدخين"], "st": [["La fumée dépose des antiseptiques à la surface du produit et en écarte la flore.", "Séchage puis fumage : action combinée de la déshydratation et des antiseptiques, pour les viandes et poissons.", "Limite : c'est un traitement de surface, il ne protège pas le cœur ; d'où l'importance du séchage préalable.", "C'est le premier exemple de barrières multiples : deux obstacles modérés valent mieux qu'un seul forcé."], ["الدخان يضع مواد مطهّرة على سطح المنتوج ويُبعد عنه الفلورا.", "التجفيف ثم التدخين: تأثير مشترك لنزع الماء والمواد المطهرة، للحوم والأسماك.", "الحد: إنها معالجة سطحية لا تحمي القلب؛ لذلك أهمية التجفيف المسبق.", "إنه أول مثال للحواجز المتعددة: عائقان معتدلان أفضل من عائق واحد مُجهَد."]], "k": ["Fumage = surface ; séchage = cœur.", "التدخين = السطح؛ التجفيف = القلب."], "q": ["Pourquoi sécher avant de fumer ?", "لماذا نجفّف قبل التدخين؟"], "o": [["Pour la couleur", "Parce que le fumage n'agit qu'en surface", "Pour cuire le produit"], ["من أجل اللون", "لأن التدخين يعمل على السطح فقط", "لطهي المنتوج"]], "a": 1, "w": ["Le séchage protège le cœur du produit.", "التجفيف يحمي قلب المنتوج."]}, {"img": "s14_21", "t": ["Les atmosphères modifiées", "الأجواء المعدّلة"], "st": [["On remplace l'air de l'emballage par un mélange gazeux pauvre en oxygène.", "En retirant l'oxygène, on écarte la flore aérobie stricte (séance 7).", "Exemple : salade en sachet — 15 % de CO₂ (bactériostatique) et 80 % d'azote (gaz inerte). Le sous-vide pousse la logique à l'extrême.", "Attention : sans oxygène, les anaérobies sont favorisés, dont Clostridium botulinum. Une atmosphère modifiée se combine toujours avec le froid."], ["نعوّض هواء العبوة بخليط غازي فقير في الأكسجين.", "بإزالة الأكسجين، نُبعد الفلورا الهوائية الإجبارية (الحصة 7).", "مثال: السلطة في كيس — 15٪ CO₂ (مثبّط للبكتيريا) و80٪ آزوت (غاز خامل). التفريغ من الهواء (sous vide) يدفع المنطق إلى أقصاه.", "انتبه: دون أكسجين تُفضَّل اللاهوائية، ومنها Clostridium botulinum. الجو المعدّل يُقرن دائمًا بالبرودة."]], "k": ["Moins d'O₂ = moins d'aérobies… mais attention aux anaérobies.", "أكسجين أقل = هوائية أقل… لكن احذر اللاهوائية."], "q": ["Pourquoi associer l'atmosphère modifiée au froid ?", "لماذا نقرن الجو المعدّل بالبرودة؟"], "o": [["Pour le goût", "Pour bloquer les anaérobies comme C. botulinum", "Ce n'est pas nécessaire"], ["من أجل الطعم", "لإيقاف اللاهوائية مثل C. botulinum", "ليس ضروريًا"]], "a": 1, "w": ["Sans oxygène, les anaérobies ont le champ libre.", "دون أكسجين، يصبح المجال مفتوحًا للاهوائية."]}, {"img": "s14_23", "t": ["Les procédés physiques", "الطرق الفيزيائية"], "st": [["Hautes pressions : 100 à 300 MPa réduisent fortement les formes végétatives, à température ambiante.", "Rayonnements (ultraviolets, gamma, X) : détruisent les germes, mais aussi des vitamines et nutriments.", "Filtration stérilisante : supports poreux (cellulose, verre fritté) aux pores ≤ 0,5 µm, plus petits que la plupart des germes.", "La filtration ne détruit pas, elle retient : elle sépare le germe du produit au lieu de l'attaquer."], ["الضغوط العالية: 100 إلى 300 ميغاباسكال تخفض بقوة الأشكال الخضرية، في درجة حرارة الغرفة.", "الإشعاعات (فوق البنفسجية، غاما، X): تدمّر الجراثيم، لكن أيضًا بعض الفيتامينات والمغذيات.", "الترشيح المعقِّم: دعامات مسامية (سيليلوز، زجاج ملبّد) بمسام ≤ 0,5 ميكرومتر، أصغر من أغلب الجراثيم.", "الترشيح لا يدمّر بل يحجز: يفصل الجرثومة عن المنتوج بدل مهاجمتها."]], "k": ["Filtrer = retenir, pas détruire.", "الترشيح = الحجز، وليس التدمير."], "q": ["La filtration stérilisante utilise des pores d'au plus :", "الترشيح المعقِّم يستعمل مسامًا لا تتجاوز:"], "o": [["5 mm", "0,5 µm", "50 µm"], ["5 مم", "0,5 ميكرومتر", "50 ميكرومتر"]], "a": 1, "w": ["Plus petits que la plupart des micro-organismes.", "أصغر من أغلب الكائنات الدقيقة."]}, {"img": "s14_27", "t": ["La conservation par barrières multiples", "الحفظ بالحواجز المتعددة"], "st": [["Au lieu de forcer un seul paramètre, on superpose plusieurs obstacles modérés (pH, Aw, température…) qu'aucun germe ne franchit tous.", "Charcuterie sèche : salage + séchage + nitrites + froid.", "Salade en sachet : lavage + atmosphère modifiée + froid + DLC courte. Yaourt : pasteurisation + acidification + froid.", "Avantage : chaque obstacle reste doux, le produit garde ses qualités, et l'ensemble reste infranchissable."], ["بدل إجهاد عامل واحد، نراكم عدة عوائق معتدلة (pH، Aw، الحرارة…) لا تتجاوزها أي جرثومة كلها.", "اللحوم المصنعة المجففة: تمليح + تجفيف + نتريت + برودة.", "السلطة في كيس: غسل + جو معدّل + برودة + DLC قصير. الياغورت: بسترة + تحميض + برودة.", "الميزة: كل عائق يبقى خفيفًا، والمنتوج يحتفظ بجودته، والمجموع يبقى غير قابل للتجاوز."]], "k": ["Plusieurs obstacles doux > un seul obstacle forcé.", "عدة عوائق خفيفة > عائق واحد مُجهَد."], "q": ["Les barrières du yaourt sont :", "حواجز الياغورت هي:"], "o": [["salage + fumage", "pasteurisation + acidification + froid", "UHT + sous vide"], ["تمليح + تدخين", "بسترة + تحميض + برودة", "UHT + تفريغ من الهواء"]], "a": 1, "w": ["Trois obstacles modérés combinés.", "ثلاثة عوائق معتدلة مجتمعة."]}]}, {"n": 15, "t": ["Hygiène alimentaire et méthode des 5 M", "النظافة الغذائية وطريقة 5 M"], "c": [{"img": "s15_11", "t": ["Les trois familles de dangers", "العائلات الثلاث للمخاطر"], "st": [["Dangers physiques : verre, plastique dur, aiguilles, objets tranchants, épingles, bois, arêtes, os, bijoux.", "Dangers chimiques : additifs et sous-produits (benzopyrène), résidus de médicaments vétérinaires, de nettoyage et désinfection, pesticides.", "Dangers biologiques : bactéries (S. aureus, Salmonella), virus (rotavirus, norovirus, hépatite A), parasites (Anisakis, Taenia), toxines et mycotoxines.", "Le pesticide contre les cafards est un danger chimique : la mesure de maîtrise d'un danger peut en créer un autre."], ["المخاطر الفيزيائية: الزجاج، البلاستيك الصلب، الإبر، الأدوات الحادة، الدبابيس، الخشب، حسك السمك، العظام، الحلي.", "المخاطر الكيميائية: المضافات ونواتجها (البنزوبيرين)، بقايا الأدوية البيطرية، بقايا التنظيف والتطهير، المبيدات.", "المخاطر البيولوجية: بكتيريا (S. aureus، Salmonella)، فيروسات (روتا، نورو، التهاب الكبد A)، طفيليات (Anisakis، Taenia)، سموم وسموم فطرية.", "المبيد ضد الصراصير خطر كيميائي: إجراء التحكم في خطر قد يخلق خطرًا آخر."]], "k": ["Physique, chimique, biologique.", "فيزيائي، كيميائي، بيولوجي."], "q": ["Un résidu de désinfectant dans un produit est un danger :", "بقايا المطهّر في منتوج خطر:"], "o": [["physique", "chimique", "biologique"], ["فيزيائي", "كيميائي", "بيولوجي"]], "a": 1, "w": ["C'est un résidu de nettoyage et désinfection.", "إنها بقايا التنظيف والتطهير."]}, {"img": "s15_13", "t": ["Pourquoi maîtriser l'hygiène", "لماذا نتحكم في النظافة"], "st": [["L'hygiène permet d'obtenir des aliments sains, sûrs et salubres.", "Objectif sanitaire : éviter les maladies et les toxi-infections alimentaires.", "Objectif économique : éviter les pertes de produit, protéger l'image de marque et l'export.", "Objectif réglementaire : respecter la loi — au Maroc, la loi 28-07. Un rappel produit fait manquer les trois d'un coup."], ["النظافة تسمح بالحصول على أغذية سليمة وآمنة وصحية.", "الهدف الصحي: تجنب الأمراض والتسممات الغذائية.", "الهدف الاقتصادي: تجنب خسارة المنتوج، حماية صورة العلامة والتصدير.", "الهدف القانوني: احترام القانون — في المغرب، القانون 28-07. سحب منتوج من السوق يُفشل الأهداف الثلاثة دفعة واحدة."]], "k": ["Sanitaire, économique, réglementaire (loi 28-07).", "صحي، اقتصادي، قانوني (القانون 28-07)."], "q": ["Au Maroc, la sécurité sanitaire des aliments est encadrée par :", "في المغرب، السلامة الصحية للأغذية يؤطرها:"], "o": [["la loi 28-07", "la loi 13-99", "aucun texte"], ["القانون 28-07", "القانون 13-99", "لا نص"]], "a": 0, "w": ["C'est la loi citée par le cours.", "هذا هو القانون المذكور في الدرس."]}, {"img": "s15_15", "t": ["Le diagramme des 5 M", "مخطط 5 M"], "st": [["Un outil visuel pour représenter un problème et ses causes (appelé aussi diagramme d'Ishikawa ou en arêtes de poisson).", "Cinq familles de causes : Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "Une méthode : identifier les domaines importants pour trouver une solution.", "Les bonnes pratiques d'hygiène (BPH) s'organisent selon ces 5 M."], ["أداة بصرية لتمثيل مشكلة وأسبابها (تسمى أيضًا مخطط إيشيكاوا أو عظم السمكة).", "خمس عائلات من الأسباب: المواد (Matières)، المعدات (Matériel)، الوسط (Milieu)، الطرق (Méthodes)، اليد العاملة (Main-d'œuvre).", "طريقة: تحديد المجالات المهمة لإيجاد حل.", "ممارسات النظافة الجيدة (BPH) تُنظَّم حسب هذه الـ 5 M."]], "k": ["Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "المواد، المعدات، الوسط، الطرق، اليد العاملة."], "q": ["Lequel n'est PAS un des 5 M ?", "أيّها ليس من الـ 5 M؟"], "o": [["Milieu", "Marketing", "Main-d'œuvre"], ["Milieu", "Marketing", "Main-d'œuvre"]], "a": 1, "w": ["Les 5 M : Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "الـ 5 M: Matières، Matériel، Milieu، Méthodes، Main-d'œuvre."]}, {"img": "s15_19", "t": ["M1 Matières : la réception", "M1 المواد: الاستلام"], "st": [["Matières = matières premières, ingrédients, additifs, mais aussi eau, emballages, lubrifiants et produits de nettoyage.", "Une matière de mauvaise qualité à l'arrivée donne un mauvais produit fini : la réception est un poste clé.", "Quatre contrôles : qualitatif (origine, agrément du fournisseur, emballages intacts et propres), quantitatif, température, DLC.", "Décision : accepter si conforme, refuser sinon. C'est le seul moment où l'on peut encore refuser."], ["المواد = المواد الأولية، المكونات، المضافات، وأيضًا الماء، مواد التعبئة، مواد التشحيم ومواد التنظيف.", "مادة رديئة عند الوصول تعطي منتوجًا نهائيًا رديئًا: الاستلام منصب أساسي.", "أربع مراقبات: نوعية (المصدر، اعتماد المورّد، سلامة ونظافة التعبئة)، كمية، الحرارة، تاريخ الصلاحية DLC.", "القرار: القبول إذا كان مطابقًا، والرفض إذا لم يكن. إنها اللحظة الوحيدة التي يمكن فيها الرفض."]], "k": ["À la réception on peut refuser ; après, le problème est dedans.", "عند الاستلام يمكننا الرفض؛ بعده، المشكل صار في الداخل."], "q": ["Un camion livre du lait à 12 °C au lieu de 4 °C. On :", "شاحنة توصل حليبًا في 12 درجة بدل 4 درجات. نحن:"], "o": [["accepte et on refroidit", "refuse le lot non conforme", "le mélange au lait conforme"], ["نقبل ونبرّد", "نرفض الدفعة غير المطابقة", "نخلطه مع الحليب المطابق"]], "a": 1, "w": ["Contrôle de température non conforme = refus.", "مراقبة حرارة غير مطابقة = رفض."]}, {"img": "s15_21", "t": ["M1 Matières : stocker FEFO et FIFO", "M1 المواد: التخزين FEFO و FIFO"], "st": [["Stocker immédiatement dans de bonnes conditions : température conforme, propreté, zéro rongeur ; humidité maîtrisée.", "FEFO (First Expired, First Out) : ce qui périme en premier sort en premier.", "FIFO (First In, First Out) : ce qui est entré en premier sort en premier. Produits chimiques stockés séparément des denrées.", "Erreur classique : ranger le nouveau lot devant l'ancien ; le stock tourne à l'envers et l'ancien périme sur l'étagère."], ["التخزين فورًا في ظروف جيدة: حرارة مطابقة، نظافة، صفر قوارض؛ رطوبة متحكم فيها.", "FEFO (First Expired, First Out): ما تنتهي صلاحيته أولًا يخرج أولًا.", "FIFO (First In, First Out): ما دخل أولًا يخرج أولًا. المواد الكيميائية تُخزَّن منفصلة عن الأغذية.", "خطأ شائع: وضع الدفعة الجديدة أمام القديمة؛ يدور المخزون بالعكس وتنتهي صلاحية القديمة على الرف."]], "k": ["FEFO : date de péremption ; FIFO : date d'entrée.", "FEFO: تاريخ انتهاء الصلاحية؛ FIFO: تاريخ الدخول."], "q": ["FEFO signifie :", "FEFO تعني:"], "o": [["premier entré, premier sorti", "premier périmé, premier sorti", "dernier entré, premier sorti"], ["أول داخل، أول خارج", "أول منتهي الصلاحية، أول خارج", "آخر داخل، أول خارج"]], "a": 1, "w": ["First Expired, First Out.", "First Expired, First Out."]}, {"img": "s15_25", "t": ["M2 Matériel : nature et conception", "M2 المعدات: الطبيعة والتصميم"], "st": [["Matériaux en contact avec l'aliment : compatibles, résistants, lisses. Inox, verre et aluminium sont préférés au plastique ; le bois est interdit.", "Peinture ou revêtement en contact avec le produit : de qualité alimentaire (logo réglementaire).", "Conception simple : sans angle aigu, sans coin ni angle mort, facilement démontable et nettoyable.", "Codex Alimentarius : au moins 45 cm entre machine et mur, 20 cm entre machine et sol."], ["المواد الملامسة للغذاء: متوافقة، مقاومة، ملساء. الفولاذ المقاوم للصدأ والزجاج والألمنيوم تُفضَّل على البلاستيك؛ الخشب ممنوع.", "الطلاء أو الكسوة الملامسة للمنتوج: من جودة غذائية (شعار قانوني).", "تصميم بسيط: دون زوايا حادة، دون أركان أو زوايا ميتة، سهل التفكيك والتنظيف.", "الـ Codex Alimentarius: على الأقل 45 سم بين الآلة والجدار، و20 سم بين الآلة والأرض."]], "k": ["45 cm du mur, 20 cm du sol ; pas de bois.", "45 سم عن الجدار، 20 سم عن الأرض؛ لا خشب."], "q": ["Quel matériau est interdit au contact des aliments ?", "أيّ مادة ممنوعة في ملامسة الأغذية؟"], "o": [["L'inox", "Le verre", "Le bois"], ["الفولاذ المقاوم للصدأ", "الزجاج", "الخشب"]], "a": 2, "w": ["Poreux, il retient souillures et germes.", "مسامي، يحتفظ بالأوساخ والجراثيم."]}, {"img": "s15_31", "t": ["M3 Milieu : secteurs et marche en avant", "M3 الوسط: القطاعات والسير إلى الأمام"], "st": [["Le circuit des produits va du sale vers le propre, sans retour en arrière ni croisement : c'est la marche en avant.", "Séparer les secteurs : sale/propre, chaud/froid, emballage/déchet, alimentaire/non alimentaire.", "Un secteur chaud contre un secteur froid donne de la condensation au plafond, donc une contamination.", "Si le local est trop petit, on sépare dans le temps : le propre avant le sale, avec un nettoyage entre les deux."], ["مسار المنتجات يمضي من المتسخ نحو النظيف، دون رجوع ولا تقاطع: إنه السير إلى الأمام (marche en avant).", "فصل القطاعات: متسخ/نظيف، حار/بارد، تعبئة/نفايات، غذائي/غير غذائي.", "قطاع حار بجانب قطاع بارد يعطي تكثفًا في السقف، وبالتالي تلوثًا.", "إذا كان المحل صغيرًا جدًا، نفصل في الزمن: النظيف قبل المتسخ، مع تنظيف بينهما."]], "k": ["Du sale vers le propre, sans retour ni croisement.", "من المتسخ نحو النظيف، دون رجوع ولا تقاطع."], "q": ["La marche en avant interdit :", "السير إلى الأمام يمنع:"], "o": [["d'avancer vers le conditionnement", "les retours en arrière et les croisements", "le nettoyage"], ["التقدم نحو التعبئة", "الرجوع إلى الخلف والتقاطعات", "التنظيف"]], "a": 1, "w": ["Pour éviter les contaminations croisées.", "لتجنب التلوث المتقاطع."]}, {"img": "s15_35", "t": ["M3 Milieu : la lutte contre les nuisibles", "M3 الوسط: مكافحة الآفات"], "st": [["Mouches, cafards, fourmis, rongeurs, oiseaux, chats et chiens menacent la sécurité des aliments ; un cafard peut porter 14 millions de bactéries.", "Rongeurs : postes d'appâts dans des boîtes dédiées, bien entretenus ; plaques collantes avec couvercle transparent.", "Insectes volants : désinsectiseurs bien placés, tubes en verre incassable, entretenus. Rampants : gel, pesticides, fumigation ; oiseaux : ultrasons, répulsifs.", "Le pesticide est lui-même un danger chimique : la mesure de maîtrise doit être maîtrisée à son tour."], ["الذباب، الصراصير، النمل، القوارض، الطيور، القطط والكلاب تهدد سلامة الأغذية؛ الصرصور قد يحمل 14 مليون بكتيريا.", "القوارض: محطات طُعم في علب مخصصة، جيدة الصيانة؛ صفائح لاصقة بغطاء شفاف.", "الحشرات الطائرة: أجهزة قاتلة للحشرات جيدة الموضع، بأنابيب زجاج غير قابل للكسر، مع صيانة. الزاحفة: جل، مبيدات، تبخير؛ الطيور: موجات فوق صوتية، طاردات.", "المبيد نفسه خطر كيميائي: إجراء التحكم يجب التحكم فيه بدوره."]], "k": ["Un nuisible = un réservoir mobile de germes.", "الآفة = مستودع متنقل للجراثيم."], "q": ["Combien de bactéries un cafard peut-il porter ?", "كم بكتيريا يمكن أن يحمل الصرصور؟"], "o": [["Environ 100", "Jusqu'à 14 millions", "Aucune"], ["حوالي 100", "حتى 14 مليونًا", "لا شيء"]], "a": 1, "w": ["C'est le chiffre cité par le cours.", "هذا هو الرقم المذكور في الدرس."]}, {"img": "s15_37", "t": ["M4 Méthodes : la méthode AMER", "M4 الطرق: طريقة AMER"], "st": [["A — Apports : éviter l'arrivée des contaminants ; penser aux 5 M, surtout la main-d'œuvre.", "M — Multiplication : l'empêcher en jouant sur le temps, la température, l'Aw, le sel, le pH.", "E — Élimination : cuire à 70 °C, pasteuriser, stériliser ; nettoyer et désinfecter.", "R — Recontamination : conditionner dès que possible. Tranchage, hachage, broyage exposent le produit : machines très propres. Devise : vite, froid et propre."], ["A — Apports (الإدخال): منع وصول الملوِّثات؛ التفكير في الـ 5 M، خاصة اليد العاملة.", "M — Multiplication (التكاثر): منعه بالتحكم في الوقت، الحرارة، Aw، الملح، pH.", "E — Élimination (الإزالة): الطهي في 70 درجة، البسترة، التعقيم؛ التنظيف والتطهير.", "R — Recontamination (إعادة التلوث): التعبئة في أقرب وقت. التقطيع والفرم والطحن تعرّض المنتوج: آلات نظيفة جدًا. الشعار: بسرعة، بارد ونظيف."]], "k": ["AMER : Apports, Multiplication, Élimination, Recontamination.", "AMER: الإدخال، التكاثر، الإزالة، إعادة التلوث."], "q": ["Emballer le produit dès que possible répond à quelle lettre d'AMER ?", "تعبئة المنتوج في أقرب وقت تجيب عن أي حرف من AMER؟"], "o": [["A", "E", "R"], ["A", "E", "R"]], "a": 2, "w": ["Un aliment emballé est protégé de la recontamination.", "الغذاء المعبّأ محمي من إعادة التلوث."]}, {"img": "s15_41", "t": ["M5 Main-d'œuvre : mains, tenue, santé", "M5 اليد العاملة: اليدان، اللباس، الصحة"], "st": [["Se laver les mains : au sas avant la production, après les toilettes, une pause ou une cigarette, une poignée de main, un éternuement, toute activité contaminante.", "Comment : lavabo à commande non manuelle, savon liquide, essuie-main à usage unique ; ongles courts, pas de bijoux. Les gants ne dispensent pas du lavage.", "Tenue : charlotte couvrant tous les cheveux, couvre-barbe si besoin, blouse claire changée chaque jour, chaussures propres, pédiluve.", "Santé : un malade est écarté des postes à risque ; coupures couvertes d'un pansement de couleur vive et détectable. WC séparés par deux portes : les selles contiennent plus de 10⁷ germes/g."], ["غسل اليدين: في المدخل (sas) قبل الإنتاج، بعد المرحاض، بعد الاستراحة أو السيجارة، بعد المصافحة، بعد العطس، وبعد كل نشاط ملوِّث.", "الطريقة: مغسلة بتشغيل غير يدوي، صابون سائل، منشفة للاستعمال الواحد؛ أظافر قصيرة، دون حلي. القفازات لا تُغني عن الغسل.", "اللباس: قبعة (charlotte) تغطي كل الشعر، غطاء اللحية عند الحاجة، وزرة فاتحة تُغيَّر يوميًا، أحذية نظيفة، حوض غسل الأقدام.", "الصحة: المريض يُبعد عن المناصب الخطرة؛ الجروح تُغطّى بضمادة بلون زاهٍ وقابلة للكشف. المراحيض مفصولة ببابين: البراز يحتوي على أكثر من 10⁷ جرثومة/غ."]], "k": ["Les gants ne remplacent pas le lavage des mains.", "القفازات لا تعوّض غسل اليدين."], "q": ["Pourquoi un pansement de couleur vive et détectable ?", "لماذا ضمادة بلون زاهٍ وقابلة للكشف؟"], "o": [["Pour l'esthétique", "Pour le retrouver s'il tombe dans le produit", "Pour désinfecter la plaie"], ["للمظهر", "لإيجادها إذا سقطت في المنتوج", "لتطهير الجرح"]], "a": 1, "w": ["Elle sera vue à l'œil ou repérée par le détecteur de métaux.", "تُرى بالعين أو يكشفها كاشف المعادن."]}]}, {"n": 16, "t": ["Nettoyage et désinfection", "التنظيف والتطهير"], "c": [{"img": "s16_07", "t": ["Nettoyer et désinfecter", "التنظيف والتطهير"], "st": [["Le nettoyage retire les souillures (organiques, minérales, corps étrangers) et rend la surface visuellement propre ; seul, il ne garantit pas la décontamination.", "La désinfection élimine les micro-organismes et inactive les virus présents sur la surface.", "La désinfection n'est efficace qu'après un nettoyage : sur une surface sale, le désinfectant est neutralisé par la souillure.", "Une surface visuellement propre peut donc rester bactériologiquement sale."], ["التنظيف يزيل الأوساخ (العضوية، المعدنية، الأجسام الغريبة) ويجعل السطح نظيفًا بصريًا؛ وحده لا يضمن إزالة التلوث.", "التطهير يقضي على الكائنات الدقيقة ويعطّل الفيروسات الموجودة على السطح.", "التطهير لا يكون فعالًا إلا بعد التنظيف: على سطح متسخ، الأوساخ تُبطل مفعول المطهّر.", "إذن سطح نظيف بصريًا قد يبقى متسخًا بكتيريولوجيًا."]], "k": ["Toujours nettoyer AVANT de désinfecter.", "دائمًا التنظيف قبل التطهير."], "q": ["Pourquoi nettoyer avant de désinfecter ?", "لماذا ننظف قبل أن نطهّر؟"], "o": [["Pour économiser du désinfectant", "Parce que la souillure neutralise le désinfectant", "L'ordre n'a pas d'importance"], ["لتوفير المطهّر", "لأن الأوساخ تُبطل مفعول المطهّر", "الترتيب ليس مهمًا"]], "a": 1, "w": ["Un désinfectant sur surface sale ne marche pas.", "المطهّر على سطح متسخ لا يعمل."]}, {"img": "s16_09", "t": ["Trois propretés, pas une", "ثلاثة أنواع من النظافة، لا نوع واحد"], "st": [["Physiquement propre : aucune souillure visible.", "Microbiologiquement propre : un niveau acceptable de micro-organismes, sans danger pour le consommateur. Seule l'analyse le voit.", "Chimiquement propre : aucun résidu chimique de production ni de nettoyage-désinfection (N&D).", "Piège : sauter le rinçage final, c'est échanger une propreté microbiologique contre une saleté chimique."], ["نظيف فيزيائيًا: لا أوساخ مرئية.", "نظيف ميكروبيولوجيًا: مستوى مقبول من الكائنات الدقيقة، دون خطر على المستهلك. التحليل وحده يراه.", "نظيف كيميائيًا: لا بقايا كيميائية للإنتاج ولا للتنظيف والتطهير (N&D).", "الفخ: تجاوز الشطف النهائي يعني استبدال نظافة ميكروبيولوجية بوساخة كيميائية."]], "k": ["Physique, microbiologique, chimique.", "فيزيائية، ميكروبيولوجية، كيميائية."], "q": ["Oublier le rinçage final compromet la propreté :", "نسيان الشطف النهائي يُخلّ بالنظافة:"], "o": [["physique", "chimique", "visuelle"], ["الفيزيائية", "الكيميائية", "البصرية"]], "a": 1, "w": ["Il reste des résidus de désinfectant.", "تبقى بقايا المطهّر."]}, {"img": "s16_11", "t": ["La nature de la souillure", "طبيعة الأوساخ"], "st": [["La souillure est un mélange de composés organiques (lipides, protéines, glucides), de minéraux (sels, calcaire, rouille) et de germes.", "Souillures organiques → détergent alcalin.", "Souillures minérales → détergent acide.", "Germes → désinfection, une fois les deux premières retirées. C'est la souillure qui dicte le choix du produit."], ["الأوساخ خليط من مركبات عضوية (دهون، بروتينات، سكريات)، ومعادن (أملاح، كلس، صدأ)، وجراثيم.", "أوساخ عضوية ← منظّف قاعدي (alcalin).", "أوساخ معدنية ← منظّف حمضي (acide).", "الجراثيم ← التطهير، بعد إزالة النوعين الأولين. الأوساخ هي التي تحدد اختيار المنتوج."]], "k": ["Organique → alcalin ; minéral → acide ; germes → désinfectant.", "عضوي ← قاعدي؛ معدني ← حمضي؛ جراثيم ← مطهّر."], "q": ["Du calcaire sur un échangeur s'élimine avec :", "الكلس على المبادل الحراري يُزال بـ:"], "o": [["un détergent alcalin", "un détergent acide", "de l'eau froide seule"], ["منظّف قاعدي", "منظّف حمضي", "ماء بارد فقط"]], "a": 1, "w": ["Le calcaire est une souillure minérale.", "الكلس وسخ معدني."]}, {"img": "s16_13", "t": ["Comment agit un détergent", "كيف يعمل المنظّف"], "st": [["La molécule de détergent est amphiphile : une tête polaire qui aime l'eau (hydrophile), une queue apolaire qui la fuit (hydrophobe).", "La queue se fixe sur la graisse, la tête reste dans l'eau : la salissure est décrochée.", "L'eau emporte ensuite l'ensemble.", "C'est la même structure que les phospholipides de la membrane bactérienne (séance 3)."], ["جزيء المنظّف مزدوج الألفة (amphiphile): رأس قطبي يحب الماء (hydrophile)، وذيل غير قطبي ينفر منه (hydrophobe).", "الذيل يلتصق بالدهون، والرأس يبقى في الماء: فتنفصل الأوساخ.", "ثم يحمل الماء الكل.", "إنها نفس بنية الفوسفوليبيدات في الغشاء البكتيري (الحصة 3)."]], "k": ["Amphiphile = une tête dans l'eau, une queue dans la graisse.", "Amphiphile = رأس في الماء، ذيل في الدهون."], "q": ["La queue hydrophobe d'un détergent se fixe sur :", "الذيل الكاره للماء في المنظّف يلتصق بـ:"], "o": [["l'eau", "la graisse", "le métal"], ["الماء", "الدهون", "المعدن"]], "a": 1, "w": ["Elle fuit l'eau et s'accroche à la salissure grasse.", "ينفر من الماء ويلتصق بالوسخ الدهني."]}, {"img": "s16_15", "t": ["Les trois familles de détergents", "العائلات الثلاث للمنظّفات"], "st": [["Alcalin (dégraissant) : élimine les souillures organiques ; base type : la soude (NaOH).", "Acide (détartrant) : élimine le calcaire et les souillures minérales ; acide type : l'acide phosphorique.", "Neutre : surtout pour l'usage manuel, il ne doit pas attaquer la peau.", "Un détergent contient : une base pour l'organique, un acide pour le minéral, un complexant du calcium (EDTA), parfois une enzyme (lipase)."], ["القاعدي (مزيل الدهون): يزيل الأوساخ العضوية؛ القاعدة النموذجية: الصودا (NaOH).", "الحمضي (مزيل الكلس): يزيل الكلس والأوساخ المعدنية؛ الحمض النموذجي: حمض الفوسفوريك.", "المتعادل: خاصة للاستعمال اليدوي، يجب ألا يؤذي الجلد.", "المنظّف يحتوي: قاعدة للعضوي، حمضًا للمعدني، مركّبًا خالبًا للكالسيوم (EDTA)، وأحيانًا إنزيمًا (lipase)."]], "k": ["Soude = dégraissant ; acide phosphorique = détartrant.", "الصودا = مزيل الدهون؛ حمض الفوسفوريك = مزيل الكلس."], "q": ["La soude (NaOH) est un détergent :", "الصودا (NaOH) منظّف:"], "o": [["acide", "alcalin", "neutre"], ["حمضي", "قاعدي", "متعادل"]], "a": 1, "w": ["C'est une base : elle dégraisse.", "إنها قاعدة: تزيل الدهون."]}, {"img": "s16_21", "t": ["TACT et la roue de Sinner", "TACT وعجلة سينر"], "st": [["T — Température : eau à 40–50 °C.", "A — Action mécanique : brossage, raclage, jet haute pression. C — Concentration en détergent.", "T — Temps de contact : 10 à 30 minutes.", "Roue de Sinner : ce qu'on retire à un paramètre doit être compensé par un autre. Au-delà de 70 °C, les protéines coagulent et le détergent se décompose : plus chaud n'est pas mieux."], ["T — الحرارة (Température): ماء في 40–50 درجة.", "A — الفعل الميكانيكي (Action mécanique): الفرك، الكشط، النفث بضغط عالٍ. C — تركيز المنظّف (Concentration).", "T — زمن التلامس (Temps): 10 إلى 30 دقيقة.", "عجلة سينر: ما ننقصه من عامل يجب تعويضه بعامل آخر. فوق 70 درجة تتخثر البروتينات ويتحلل المنظّف: الأسخن ليس الأفضل."]], "k": ["TACT : Température, Action, Concentration, Temps.", "TACT: الحرارة، الفعل، التركيز، الزمن."], "q": ["Si on ne peut pas brosser (moins d'action mécanique), on peut :", "إذا لم نستطع الفرك (فعل ميكانيكي أقل)، يمكننا:"], "o": [["réduire aussi le temps", "augmenter le temps ou la concentration", "chauffer à 90 °C"], ["تقليل الزمن أيضًا", "زيادة الزمن أو التركيز", "التسخين إلى 90 درجة"]], "a": 1, "w": ["C'est le principe de compensation de la roue de Sinner.", "هذا مبدأ التعويض في عجلة سينر."]}, {"img": "s16_25", "t": ["Le protocole de N&D en 7 étapes", "بروتوكول التنظيف والتطهير في 7 مراحل"], "st": [["1 Pré-lavage (souillures peu adhérentes) → 2 Nettoyage alcalin (organique) → 3 Rinçage intermédiaire.", "4 Nettoyage acide (minéral) → 5 Rinçage intermédiaire.", "6 Désinfection (réduire les microbes restants, éliminer les pathogènes) → 7 Rinçage final à l'eau potable (résidus de désinfectant).", "Règle d'or : ne jamais mélanger un détergent et un désinfectant."], ["1 الغسل المسبق (أوساخ قليلة الالتصاق) ← 2 التنظيف القاعدي (العضوي) ← 3 شطف وسيط.", "4 التنظيف الحمضي (المعدني) ← 5 شطف وسيط.", "6 التطهير (تقليل الميكروبات المتبقية، القضاء على الممرضات) ← 7 شطف نهائي بالماء الصالح للشرب (بقايا المطهّر).", "القاعدة الذهبية: لا تخلط أبدًا منظّفًا ومطهّرًا."]], "k": ["Alcalin → rinçage → acide → rinçage → désinfection → rinçage.", "قاعدي ← شطف ← حمضي ← شطف ← تطهير ← شطف."], "q": ["Quelle étape vient juste avant la désinfection ?", "أيّ مرحلة تأتي مباشرة قبل التطهير؟"], "o": [["Le rinçage final", "Un rinçage intermédiaire après le nettoyage acide", "Le pré-lavage"], ["الشطف النهائي", "شطف وسيط بعد التنظيف الحمضي", "الغسل المسبق"]], "a": 1, "w": ["Étape 5 : on retire le détergent acide avant de désinfecter.", "المرحلة 5: نزيل المنظّف الحمضي قبل التطهير."]}, {"img": "s16_29", "t": ["Les désinfectants", "المطهّرات"], "st": [["Chlorés : peu coûteux et efficaces, mais corrosifs à forte dose et en milieu acide, sensibles aux souillures, source de mauvais goûts.", "Ammoniums quaternaires : détergents et désinfectants à la fois, mais plus chers et moussants ; bien rincer.", "Eau chaude (82 °C, 20 min) : sans résidus, peu coûteuse, mais non sporicide, entartrante, dangereuse pour les mains.", "Autres : H₂O₂ sans rinçage (emballages UHT), acide peracétique (efficace à froid, mais corrosif et explosif), formol (efficace mais irritant, résidus toxiques)."], ["المركبات الكلورية: رخيصة وفعالة، لكنها أكّالة بجرعة عالية وفي الوسط الحمضي، حساسة للأوساخ، وتسبب طعمًا سيئًا.", "الأمونيوم الرباعي: منظّف ومطهّر في آن واحد، لكنه أغلى ويُكوّن رغوة؛ يجب الشطف الجيد.", "الماء الساخن (82 درجة، 20 دقيقة): دون بقايا، رخيص، لكنه لا يقتل الأبواغ، ويترك الكلس، وخطير على اليدين.", "أخرى: H₂O₂ دون شطف (عبوات UHT)، حمض البيراسيتيك (فعال في البرد لكنه أكّال وقابل للانفجار)، الفورمول (فعال لكنه مهيّج وبقاياه سامة)."]], "k": ["Chlore et ammoniums quaternaires : les deux principaux.", "الكلور والأمونيوم الرباعي: المطهّران الرئيسيان."], "q": ["Quel désinfectant est aussi détergent ?", "أيّ مطهّر هو أيضًا منظّف؟"], "o": [["Le chlore", "Les ammoniums quaternaires", "L'eau chaude"], ["الكلور", "الأمونيوم الرباعي", "الماء الساخن"]], "a": 1, "w": ["Ils ont une double action, mais moussent.", "لهم تأثير مزدوج، لكنهم يكوّنون رغوة."]}, {"img": "s16_33", "t": ["Contrôler l'efficacité", "مراقبة الفعالية"], "st": [["Contrôle visuel et au toucher : simple et indispensable ; si c'est sale, la microbiologie est inutile.", "Contrôle chimique : colorant dans l'eau de rinçage (révèle les souillures) et vérification de la neutralité du pH.", "ATP-métrie : l'ATP de toute matière vivante est dosé par fluorescence en quelques secondes ; peu spécifique, mais permet de re-nettoyer tout de suite.", "Empreinte sur gélose : lames couvertes de géloses nutritives appliquées sur la surface. Tous les résultats sont enregistrés."], ["المراقبة البصرية واللمسية: بسيطة وضرورية؛ إذا كان متسخًا فالتحليل الميكروبيولوجي بلا فائدة.", "المراقبة الكيميائية: ملوّن في ماء الشطف (يكشف الأوساخ) والتحقق من تعادل pH.", "قياس ATP (ATP-métrie): يُقاس ATP لكل مادة حية بالتألق في ثوانٍ؛ قليل التخصص، لكنه يسمح بإعادة التنظيف فورًا.", "البصمة على الآغار: شرائح مغطاة بآغار مغذٍّ تُطبَّق على السطح. كل النتائج تُسجَّل."]], "k": ["ATP-métrie = réponse en secondes ; gélose = réponse en jours.", "قياس ATP = نتيجة في ثوانٍ؛ الآغار = نتيجة في أيام."], "q": ["Quel contrôle donne un résultat en quelques secondes ?", "أيّ مراقبة تعطي نتيجة في ثوانٍ؟"], "o": [["L'empreinte sur gélose", "L'ATP-métrie", "Le dénombrement en boîte"], ["البصمة على الآغار", "قياس ATP", "الإحصاء في العلبة"]], "a": 1, "w": ["Mesure par fluorescence en temps réel.", "قياس بالتألق في الوقت الحقيقي."]}, {"img": "s16_35", "t": ["Le plan de nettoyage et désinfection", "مخطط التنظيف والتطهير"], "st": [["C'est un document écrit, daté, signé et archivé, pour chaque local et chaque appareil.", "Quoi : le local, le matériel ou l'équipement concerné.", "Comment et quand : méthode, outils, TACT et fréquence (par exemple en fin de journée const L=()=>st.lang==="ar"?1:0, T=k=>UI[k][L()];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S_BY={}; DATA.seances.forEach(s=>S_BY[s.n]=s);
const ALL=[]; DATA.seances.forEach(s=>s.c.forEach((c,i)=>ALL.push({s:s.n,i})));
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const st={lang:load("mr_lang","fr"), prog:load("mr_prog",{}), last:load("mr_last",null),
          deck:null, pos:0, reveal:{}, order:{}, answered:{}, xpick:{}};
// prog[img] = {seen:1, ok:true/false}
function P(img){return st.prog[img]||{}}
function mark(img,f){st.prog[img]=Object.assign({},P(img),f);save("mr_prog",st.prog)}

function applyLang(){
  const ar=st.lang==="ar";
  document.documentElement.lang=ar?"ar":"fr"; document.documentElement.dir=ar?"rtl":"ltr";
  document.getElementById("lang").textContent=ar?"FR":"ع";
  document.getElementById("back").textContent=ar?"›":"‹";
}
document.getElementById("lang").onclick=()=>{st.lang=st.lang==="ar"?"fr":"ar";save("mr_lang",st.lang);applyLang();render()};
document.getElementById("back").onclick=()=>history.length>1&&location.hash?history.back():go("");

function go(h){ if(location.hash==="#"+h||(!h&&!location.hash)) render(); else location.hash=h; }
window.addEventListener("hashchange",()=>{st.pos=0;render();window.scrollTo(0,0)});

function setTop(title,sub,back){
  document.getElementById("ttl").innerHTML=esc(title)+(sub?`<small>${esc(sub)}</small>`:"");
  document.getElementById("back").hidden=!back;
}
function counts(list){let seen=0,ok=0;list.forEach(r=>{const p=P(S_BY[r.s].c[r.i].img);if(p.seen)seen++;if(p.ok)ok++});return{seen,ok}}
function sessCards(n){return S_BY[n].c.map((c,i)=>({s:n,i}))}

function render(){
  applyLang();
  const h=location.hash.slice(1);
  document.getElementById("pager").innerHTML="";
  if(h==="m") return vModule();
  if(/^s\d+$/.test(h)) return vSession(+h.slice(1));
  if(h==="x") return vExpress();
  vHome();
}

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(!location.hash)render()});
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function installTile(){
  if(!window.PWA||isStandalone())return "";
  if(deferredPrompt) return `<button class="big alt" onclick="doInstall()">📲 ${T("install")}</button>`;
  return `<div class="tile" style="display:block"><b>📲 ${T("install")}</b><span class="sub" style="display:block;margin:4px 0 0">${isIOS?T("instIOS"):T("instAnd")}</span></div>`;
}
async function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;render()}
function vHome(){
  setTop(T("app"),"ⴰⵙⵎⴽⵜⵉ · OFPPT · ISIA Agadir",false);
  const c=counts(ALL), l=L();
  let last="";
  if(st.last&&S_BY[st.last]) last=`<button class="big alt" onclick="go('s${st.last}')">${T("resume")} — ${T("seance")} ${st.last}</button>`;
  let mods=DATA.modules.map(m=>`<button class="tile ${m.on?"":"off"}" ${m.on?`onclick="go('m')"`:"disabled"}>
     <span class="ic">${m.ic}</span><span class="tx"><b>${esc(m.t[l])}</b><span>${m.on?`16 ${T("seance")==="Séance"?"séances":"حصة"} · ${ALL.length} ${T("cards")}`:""}</span></span>
     <span class="tag">${m.on?T("open"):T("soon")}</span></button>`).join("");
  document.getElementById("main").innerHTML=`
   <h1>${T("hello")}</h1><p class="sub">${T("intro")}</p>
   <div class="stats"><div><b>${c.ok}</b><span>${T("learned")}</span></div><div><b>${c.seen}</b><span>${T("seen")}</span></div><div><b>${ALL.length}</b><span>${T("total")}</span></div></div>
   <button class="big gold" onclick="newExpress()">${T("express")}</button>${last}${installTile()}
   <p class="sec" style="margin-top:18px">${T("choose")}</p>${mods}
   <p class="sub" style="margin-top:14px">💡 ${T("tipMsg")}</p>
   <div class="foot">${T("credit")}<br><button onclick="resetProg()">${T("reset")}</button></div>`;
}
function resetProg(){ if(confirm(T("resetQ"))){st.prog={};st.last=null;save("mr_prog",{});save("mr_last",null);render()} }

function vModule(){
  const l=L(), m=DATA.modules[0];
  setTop(m.t[l],"",true);
  let h="";
  DATA.chaps.forEach(ch=>{
    h+=`<div class="chap"><span class="l">${ch.id}</span><b>${T("chap")} ${ch.id} — ${esc(ch.t[l])}</b></div>`;
    ch.s.forEach(n=>{
      const s=S_BY[n], c=counts(sessCards(n)), tot=s.c.length, pc=Math.round(100*c.ok/tot);
      h+=`<button class="srow" onclick="go('s${n}')"><span class="n">S${String(n).padStart(2,"0")}</span>
        <span class="tx">${esc(s.t[l])}<div class="bar"><i style="width:${pc}%"></i></div></span>
        <span class="ck ${c.ok===tot?"full":""}">${c.ok===tot?"✓ ":""}${c.ok}/${tot}</span></button>`;
    });
  });
  document.getElementById("main").innerHTML=h+`<div class="foot">${T("swipe")}</div>`;
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function vSession(n){
  if(!S_BY[n]) return go("m");
  st.last=n; save("mr_last",n);
  st.deck=sessCards(n); st.mode="s"; st.sn=n;
  cardView();
}
function newExpress(){
  // favorise les cartes pas encore réussies
  const notOk=ALL.filter(r=>!P(S_BY[r.s].c[r.i].img).ok), okc=ALL.filter(r=>P(S_BY[r.s].c[r.i].img).ok);
  let pick=shuffle(notOk).slice(0,5); if(pick.length<5) pick=pick.concat(shuffle(okc).slice(0,5-pick.length));
  st.xdeck=pick; st.answered={}; st.reveal={};
  if(location.hash==="#x"){st.pos=0;render()} else go("x");
}
function vExpress(){
  if(!st.xdeck){ newExpressSilent(); }
  st.deck=st.xdeck; st.mode="x"; cardView();
}
function newExpressSilent(){const notOk=ALL.filter(r=>!P(S_BY[r.s].c[r.i].img).ok);st.xdeck=shuffle(notOk.length>=5?notOk:ALL).slice(0,5)}

function key(r){return r.s+"_"+r.i}
function cardView(){
  const l=L(), d=st.deck;
  if(st.pos>=d.length) return endView();
  const r=d[st.pos], s=S_BY[r.s], c=s.c[r.i], k=key(r);
  mark(c.img,{seen:1});
  if(!st.order[k]) st.order[k]=shuffle(c.o[0].map((_,i)=>i));
  const nSteps=c.st[l].length;
  if(st.reveal[k]===undefined) st.reveal[k]=P(c.img).ok!==undefined?nSteps:1;
  const rv=Math.min(st.reveal[k],nSteps), all=rv>=nSteps;
  const title=st.mode==="x"?T("express").replace(/^⚡\s*/,"").split(" — ")[0]:`${T("seance")} ${s.n}`;
  setTop(title, st.mode==="x"?`${T("seance")} ${s.n} · ${s.t[l]}`:s.t[l], true);
  let steps=c.st[l].slice(0,rv).map((t,i)=>`<li><span class="num">${i+1}</span><p>${esc(t)}</p></li>`).join("");
  let more=all?"":`<div class="more"><button onclick="step(1)">${T("nextStep")} (${rv}/${nSteps})</button><button class="lnk" onclick="step(99)">${T("showAll")}</button></div>`;
  let rest="";
  if(all){
    const ans=st.answered[k];
    const opts=st.order[k].map((oi,j)=>{
      let cls="";
      if(ans!==undefined){ if(oi===c.a) cls="ok"; else if(oi===ans) cls="ko"; }
      return `<button class="opt ${cls}" ${ans!==undefined?"disabled":""} onclick="pick(${oi})"><span class="lt">${ans!==undefined&&oi===c.a?"✓":ans===oi?"✗":(l?"أبج":"abc")[j]}</span><span>${esc(c.o[l][oi])}</span></button>`;
    }).join("");
    let why="";
    if(ans!==undefined){
      const ok=ans===c.a;
      why=`<div class="why ${ok?"ok":"ko"}"><b>${ok?T("good"):T("bad")}</b>${ok?"":`${T("answer")} ${esc(c.o[l][c.a])}<br>`}${esc(c.w[l])}</div>`;
    }
    rest=`<div class="key"><b>${T("key")}</b><p>${esc(c.k[l])}</p></div>
      <div class="quiz"><p class="sec">✔ ${T("check")}</p><p class="qq">${esc(c.q[l])}</p>${opts}${why}</div>`;
  }
  const dots=d.map((rr,i)=>{const p=P(S_BY[rr.s].c[rr.i].img);const a=st.answered[key(rr)];
     let cl=a!==undefined?(a===S_BY[rr.s].c[rr.i].a?"good":"bad"):(p.ok?"good":p.seen?"seen":"");return `<i class="${cl} ${i===st.pos?"cur":""}"></i>`}).join("");
  document.getElementById("main").innerHTML=`
   <div class="meta"><span dir="ltr">${st.pos+1} / ${d.length}</span><span>${P(c.img).ok?"✓":""}</span></div>
   <article class="card" id="card">
     <h2>${esc(c.t[l])}</h2>
     <figure onclick="zoom('${c.img}')"><img src="${IMGS[c.img]}" alt=""><span class="zoom">${T("zoom")}</span></figure>
     <div class="body"><p class="sec">${T("steps")}</p><ol class="steps">${steps}</ol>${more}${rest}</div>
   </article><div class="dots">${dots}</div>`;
  const last=st.pos===d.length-1;
  document.getElementById("pager").innerHTML=`<div class="pager"><div class="in">
     <button class="prev" ${st.pos===0?"disabled":""} onclick="move(-1)">${l?"›":"‹"}</button>
     <button class="next" onclick="move(1)">${last?T("finish"):T("next")} ${l?"◂":"▸"}</button></div></div>`;
}
function step(n){const r=st.deck[st.pos],k=key(r);st.reveal[k]+=n;cardView();
  if(n===1){const li=document.querySelectorAll("ol.steps li");li.length&&li[li.length-1].scrollIntoView({behavior:"smooth",block:"center"})}
  else{const q=document.querySelector(".key");q&&q.scrollIntoView({behavior:"smooth",block:"center"})}}
function pick(oi){const r=st.deck[st.pos],k=key(r),c=S_BY[r.s].c[r.i];
  if(st.answered[k]!==undefined)return; st.answered[k]=oi; mark(c.img,{ok:oi===c.a}); cardView();
  const w=document.querySelector(".why"); w&&w.scrollIntoView({behavior:"smooth",block:"center"});}
function move(dx){const np=st.pos+dx; if(np<0)return; st.pos=np; cardView(); window.scrollTo(0,0)}
function endView(){
  const l=L(), d=st.deck; let ok=0,ans=0;
  d.forEach(r=>{const a=st.answered[key(r)];if(a!==undefined){ans++;if(a===S_BY[r.s].c[r.i].a)ok++}});
  const tot=d.length;
  let btn="";
  if(st.mode==="s"){
    const nx=st.sn+1;
    btn=(S_BY[nx]?`<button class="big" onclick="go('s${nx}')">${T("nextS")}</button>`:"")+
        `<button class="big alt" onclick="again()">${T("again")}</button><button class="big alt" onclick="go('m')">${T("backMod")}</button>`;
    setTop(`${T("seance")} ${st.sn}`,S_BY[st.sn].t[l],true);
  }else{
    btn=`<button class="big gold" onclick="newExpress()">${T("newExp")}</button><button class="big alt" onclick="go('')">${T("home")}</button>`;
    setTop(T("expDone"),"",true);
  }
  const emo=ok===tot?"🏆":ok>=tot*0.6?"👍":"💪";
  document.getElementById("main").innerHTML=`<div class="end"><div style="font-size:52px">${emo}</div>
    <h1>${st.mode==="s"?T("done"):T("expDone")}</h1><p class="sub">${T("yourScore")}</p>
    <div class="score" dir="ltr">${ok} / ${tot}</div></div>${btn}`;
  document.getElementById("pager").innerHTML="";
}
function again(){st.deck.forEach(r=>{delete st.answered[key(r)];delete st.reveal[key(r)];delete st.order[key(r)]});st.pos=0;cardView();window.scrollTo(0,0)}
function zoom(img){
  const z=document.createElement("div");z.className="zoomv";
  z.innerHTML=`<img src="${IMGS[img]}" alt=""><button aria-label="Fermer">✕</button><div class="hint">${T("zoomHint")}</div>`;
  z.querySelector("button").onclick=()=>z.remove(); document.body.appendChild(z);
}
// balayage
let tx=null,ty=null;
document.addEventListener("touchstart",e=>{if(!document.getElementById("card")||document.querySelector(".zoomv"))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>1.8*Math.abs(dy)){let dir=dx<0?1:-1;if(st.lang==="ar")dir=-dir;move(dir)}},{passive:true});
function vCover(){
  document.querySelector(".top").style.display="none";
  const c=document.createElement("div");c.className="cover";c.id="cover";
  c.innerHTML=`<img class="wm" src="icons/asmekti-logo-fond-sombre.svg" alt="Asmekti Learn — Rappel de cours · OFPPT"><div class="tif">ⴰⵙⵎⴽⵜⵉ</div>
   <p class="mod">ISIA Agadir</p>
   <div class="sl" dir="ltr"><small>Français</small><p>Ton cours dans la poche : une piqûre de rappel, carte par carte, avec les images de tes séances.</p></div>
   <div class="sl" dir="rtl" style="text-align:right"><small>العربية</small><p>درسك في جيبك: تذكير سريع، بطاقة بعد بطاقة، بصور حصصك.</p></div>
   <div class="sl" dir="ltr"><small>Tamaziɣt</small><p>ⴰⵙⵎⴽⵜⵉ ⵏ ⵓⵍⵎⵓⴷ ⴳ ⵓⴼⵓⵙ ⵏⵏⴽ</p><p class="lat">Asmekti n ulmud g ufus nnek — le rappel du cours dans ta main</p></div>
   <button class="go" onclick="closeCover()">Commencer · ابدأ · ⴱⴷⵓ</button>
   <div class="cr">Fonctionne sans Internet · يعمل دون إنترنت</div>`;
  document.body.appendChild(c);
}
function closeCover(){const c=document.getElementById("cover");c&&c.remove();document.querySelector(".top").style.display="";render()}
if(!location.hash) vCover();
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
