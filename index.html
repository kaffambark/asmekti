bactéries", "Que le lait soit devenu stérile"], ["لا شيء، الحليب طازج من الصباح", "تكاثرًا قويًا للبكتيريا", "أن يصبح الحليب معقّمًا"]], "a": 1, "fb": ["À la chaleur, les mésophiles se divisent vite. Avec G = 20 min, 3 h font 9 générations : 512 fois plus.", "في الحرارة، تنقسم محبّة الاعتدال بسرعة. مع G = 20 دقيقة، 3 ساعات تعطي 9 أجيال: 512 مرة أكثر."]}, {"q": ["Tu prépares les dilutions décimales. Dans quel liquide ?", "تحضّر التخفيفات العشرية. في أيّ سائل؟"], "o": [["Eau physiologique stérile", "Eau distillée stérile", "Eau du robinet"], ["ماء فيزيولوجي معقّم", "ماء مقطّر معقّم", "ماء الصنبور"]], "a": 0, "fb": ["L'eau physiologique est isotonique : les cellules n'éclatent pas avant d'être comptées.", "الماء الفيزيولوجي متساوي التوتر: لا تنفجر الخلايا قبل أن تُعدّ."]}, {"q": ["Tu veux compter toutes les bactéries du lait. Quel milieu choisis-tu ?", "تريد عدّ كل بكتيريا الحليب. أيّ وسط تختار؟"], "o": [["Un bouillon liquide", "Un milieu sélectif à antibiotique", "Une gélose de base (milieu empirique)"], ["مرق سائل", "وسط انتقائي بمضاد حيوي", "آغار أساسي (وسط تجريبي)"]], "a": 2, "fb": ["La gélose donne des colonies à compter ; un milieu sélectif bloquerait une partie de la flore.", "الآغار يعطي مستعمرات للعدّ؛ أما الوسط الانتقائي فسيوقف جزءًا من الفلورا."]}, {"q": ["Après incubation (1 mL par boîte) : 10⁻³ envahie, plus de 300 ; 10⁻⁴ : 56 colonies ; 10⁻⁵ : 4. Ton résultat ?", "بعد الحضن (1 مل لكل علبة): 10⁻³ ممتلئة، أكثر من 300؛ 10⁻⁴: 56 مستعمرة؛ 10⁻⁵: 4. ما نتيجتك؟"], "o": [["10⁻³ : impossible à compter, donc 0", "10⁻⁵ : 4 × 10⁵ UFC/mL", "10⁻⁴ : 5,6 × 10⁵ UFC/mL"], ["10⁻³: لا يمكن عدّها، إذن 0", "10⁻⁵: 4 × 10⁵ UFC/mL", "10⁻⁴: 5,6 × 10⁵ UFC/mL"]], "a": 2, "fb": ["Seule la boîte 10⁻⁴ est entre 15 et 300 : 56 × 10⁴ = 5,6 × 10⁵ UFC/mL.", "العلبة 10⁻⁴ وحدها بين 15 و300: 56 × 10⁴ = 5,6 × 10⁵ UFC/mL."]}, {"q": ["Le lait sera transformé en lben demain. Que fais-tu en attendant ?", "سيُحوَّل الحليب إلى لبن غدًا. ماذا تفعل في الانتظار؟"], "o": [["Le laisser à température ambiante", "Le refroidir tout de suite à 4 °C", "Le couvrir d'un simple tissu"], ["تركه في درجة حرارة الغرفة", "تبريده فورًا في 4 درجات", "تغطيته بقطعة قماش فقط"]], "a": 1, "fb": ["Le froid allonge la latence et ralentit les mésophiles. Il ne tue pas : les psychrophiles continuent, donc on n'attend pas trop.", "البرودة تُطيل الكمون وتبطئ محبّة الاعتدال. لا تقتل: محبّة البرودة تستمر، فلا ننتظر كثيرًا."]}], "end": ["Tu as utilisé G, les dilutions, le bon milieu, la règle des 15 à 300 et le froid pour décider.", "استعملت G، والتخفيفات، والوسط المناسب، وقاعدة 15 إلى 300، والبرودة لكي تقرر."]}, "hot": {"s09_19": [{"x": 13, "y": 44, "t": ["Latence", "الكمون"], "d": ["µ = 0 : les bactéries s'adaptent au milieu, sans se diviser.", "µ = 0: تتكيف البكتيريا مع الوسط، دون أن تنقسم."]}, {"x": 28, "y": 41, "t": ["Accélération", "التسارع"], "d": ["La division commence, µ devient positif et augmente.", "يبدأ الانقسام، يصبح µ موجبًا ويزداد."]}, {"x": 38, "y": 35, "t": ["Exponentielle", "الأسّية"], "d": ["µ est maximal, le temps de génération est le plus court.", "µ في أقصاه، وزمن الجيل في أقصره."]}, {"x": 46, "y": 31, "t": ["Ralentissement", "التباطؤ"], "d": ["La masse augmente moins vite, µ diminue.", "تزداد الكتلة بسرعة أقل، µ ينخفض."]}, {"x": 70, "y": 31, "t": ["Stationnaire", "الاستقرار"], "d": ["µ = 0 : autant de naissances que de morts.", "µ = 0: الولادات تساوي الوفيات."]}, {"x": 89, "y": 36, "t": ["Déclin", "الانحدار"], "d": ["Les morts dépassent les naissances, la population diminue.", "الوفيات تفوق الولادات، وتنخفض الساكنة."]}], "s07_22": [{"x": 20, "y": 41, "t": ["Milieu hypertonique", "وسط مفرط التوتر"], "d": ["L'eau sort de la cellule, qui se rétracte : plasmolyse.", "يخرج الماء من الخلية فتنكمش: بلزمة."]}, {"x": 55, "y": 40, "t": ["Milieu isotonique", "وسط متساوي التوتر"], "d": ["Même concentration dedans et dehors : la cellule garde sa forme.", "نفس التركيز داخل الخلية وخارجها: تحافظ الخلية على شكلها."]}, {"x": 86, "y": 40, "t": ["Milieu hypotonique", "وسط ناقص التوتر"], "d ales, épices", "السموم الفطرية: أعفان، حبوب، توابل"], ["Souvent thermostables : prévenir au stockage", "غالبًا مقاومة للحرارة: الوقاية في التخزين"]]}, {"t": ["Altérations et germes utiles", "الإفساد والجراثيم المفيدة"], "i": [["Couleur, texture, odeur", "اللون، القوام، الرائحة"], ["Odeur vers 10⁶–10⁷ germes/g", "الرائحة عند 10⁶–10⁷ جرثومة/غ"], ["Yaourt : S. thermophilus + L. bulgaricus", "الياغورت: S. thermophilus + L. bulgaricus"], ["Pain, vin, bière : Saccharomyces cerevisiae", "الخبز، النبيذ، الجعة: Saccharomyces cerevisiae"]]}]}, "case": {"t": ["Diarrhées après le jben de la coopérative", "إسهال بعد جبن التعاونية"], "ctx": ["Tu es technicien stagiaire dans une coopérative laitière. Elle fabrique du lben et du jben avec du lait de ferme. Plusieurs clients se plaignent de diarrhées après avoir mangé du jben.", "أنت تقني متدرب في تعاونية حليبية. تصنع اللبن والجبن (jben) من حليب المزرعة. عدة زبناء يشتكون من الإسهال بعد أكل الجبن."], "steps": [{"q": ["Le laboratoire trouve des entérocoques dans l'eau du puits qui sert à laver le matériel. Que conclus-tu ?", "وجد المختبر مكورات معوية في ماء البئر المستعمل لغسل المعدات. ماذا تستنتج؟"], "o": [["L'eau vient d'une source pure", "L'eau a une pollution fécale : il faut la traiter", "L'eau contient trop de chlore"], ["الماء من عين نقية", "في الماء تلوث برازي: يجب معالجته", "في الماء كلور زائد"]], "a": 1, "fb": ["Les entérocoques sont des germes intestinaux. L'eau est traitée, par exemple par chloration, avant usage.", "المكورات المعوية جراثيم معوية. يُعالَج الماء، مثلًا بالكلورة، قبل استعماله."]}, {"q": ["Le contrôle médical montre qu'une ouvrière porte Salmonella. Elle se sent très bien. Que décides-tu ?", "أظهرت المراقبة الطبية أن عاملة تحمل السالمونيلا. وهي تشعر أنها بخير. ماذا تقرر؟"], "o": [["Elle quitte le poste de manipulation tant que ses examens sont positifs", "Elle continue avec des gants", "Elle continue : elle n'est pas malade"], ["تغادر منصب التداول ما دامت فحوصها إيجابية", "تستمر مع ارتداء القفازات", "تستمر: فهي ليست مريضة"]], "a": 0, "fb": ["C'est une porteuse saine. L'arrêté n° 983-13 impose son retrait du poste tant que les examens restent positifs.", "إنها حاملة سليمة للجراثيم. القرار رقم 983-13 يفرض إبعادها عن المنصب ما دامت الفحوص إيجابية."]}, {"q": ["Le jben est stocké à 4 °C. Le responsable dit : « Au froid, aucun pathogène ne se multiplie. » Qu'en penses-tu ?", "يُخزَّن الجبن في 4 درجات. يقول المسؤول: «في البرد لا تتكاثر أي جرثومة ممرضة.» ما رأيك؟"], "o": [["Il a raison", "Il a raison, sauf pour Salmonella", "Il a tort : Listeria se multiplie encore à 4 °C"], ["هو على حق", "هو على حق، إلا بالنسبة للسالمونيلا", "هو مخطئ: الليستيريا تتكاثر حتى في 4 درجات"]], "a": 2, "fb": ["Listeria est psychrophile. Un fromage à pâte molle au lait cru est un aliment typique pour elle.", "الليستيريا محبّة للبرودة. والجبن الطري من حليب نيء غذاء نموذجي لها."]}, {"q": ["Un lot de jben présente des taches de moisissure. Un ouvrier propose d'enlever les taches et de vendre le reste. Que réponds-tu ?", "دفعة من الجبن تظهر عليها بقع عفن. يقترح عامل إزالة البقع وبيع الباقي. بماذا تجيب؟"], "o": [["D'accord, si on enlève bien les taches", "Non : on écarte le lot, la toxine a pu diffuser", "D'accord, si on cuit le jben ensuite"], ["موافق، إذا أزلنا البقع جيدًا", "لا: نستبعد الدفعة، فالسمّ قد يكون انتشر", "موافق، إذا طهونا الجبن بعد ذلك"]], "a": 1, "fb": ["La mycotoxine est invisible et diffuse dans le produit. Beaucoup de toxines résistent aussi à la cuisson.", "السمّ الفطري غير مرئي وينتشر في المنتوج. وكثير من السموم تقاوم الطهي أيضًا."]}, {"q": ["Pour la suite, que proposes-tu pour le lait de ferme utilisé pour le jben ?", "في المستقبل، ماذا تقترح بالنسبة لحليب المزرعة المستعمل في صنع الجبن؟"], "o": [["L'utiliser cru mais plus vite", "Y ajouter du sel", "Le pasteuriser avant la fabrication"], ["استعماله نيئًا لكن بسرعة أكبر", "إضافة الملح إليه", "بسترته قبل التصنيع"]], "a": 2, "fb": ["Le lait non pasteurisé est un aliment à risque pour Campylobacter, E. coli ECEH et Listeria.", "الحليب غير المبستر غذاء خطر بالنسبة لكامبيلوباكتر و E. coli ECEH والليستيريا."]}], "end": ["Tu as remonté aux sources (eau, manipulateur), tenu compte de Listeria au froid et des mycotoxines. Une contamination a souvent plusieurs causes à traiter ensemble.", "رجعت إلى المصادر (الماء، العامل)، وأخذت بعين الاعتبار الليستيريا في البرد والسموم الفطرية. التلوث غالبًا له عدة أسباب يجب معالجتها معًا."]}, "hot": {"s10_19": [{"x": 21, "y": 11, "t": ["L'eau", "الماء"], "d": ["Pseudomonas vient du sol et des plantes ; entérobactéries et entérocoques signent une pollution fécale.", "Pseudomonas يأتي من التربة والنباتات؛ والبكتيريا المعوية والمكورات المعوية علامة تلوث برازي."]}, {"x": 22, "y": 32, "t": ["Le sol", "التربة"], "d": ["Réservoir riche et permanent ; les sporulés y survivent entre deux hôtes.", "مستودع غني ودائم؛ المكوّنة للأبواغ تعيش فيه بين مضيفين."]}, {"x": 45, "y": 40, "t": ["Clostridium (sol)", "Clostridium (التربة)"], "d": ["Un Clostridium trouvé en analyse oriente vers le sol ou le digestif.", "وجود Clostridium في التحليل يوجّه نحو التربة أو الجهاز الهضمي."]}, {"x": 21, "y": 52, "t": ["L'air", "الهواء"], "d": ["Sans nutriments, les germes n'y poussent pas : ils voyagent sur les poussières.", "دون مغذيات لا تنمو الجراثيم فيه: إنها تسافر عالقة بالغبار."]}, {"x": 28, "y": 72, "t": ["L'homme et les animaux", "الإنسان والحيوان"], "d": ["Flore commensale abondante : peau, bouche, tube digestif, voies respiratoires.", "فلورا متعايشة كثيفة: الجلد، الفم، الجهاز الهضمي، المجاري التنفسية."]}, {"x": 53, "y": 81, "t": ["Staphylococcus", "المكورات العنقودية (Staphylococcus)"], "d": ["Vit sur la peau et dans les voies respiratoires : il oriente vers le manipulateur.", "يعيش على الجلد وفي المجاري التنفسية: يوجّه نحو العامل الذي يتداول الغذاء."]}], "s11_18": [{"x": 11, "y": 21, "t": ["Infection", "العدوى (infection)"], "d": ["Le germe se multiplie dans les tissus, comme Mycobacterium tuberculosis.", "تتكاثر الجرثومة في الأنسجة، مثل Mycobacterium tuberculosis."]}, {"x": 13, "y": 38, "t": ["Toxi-infection", "التسمم العدوائي (toxi-infection)"], "d": ["Multiplication du germe et libération de toxines, comme Salmonella.", "تكاثر الجرثومة وإفراز السموم، مثل السالمونيلا."]}, {"x": 12, "y": 55, "t": ["Intoxination", "التسمم الذيفاني (intoxination)"], "d": ["La toxine agit sans la bactérie, comme celle de Clostridium botulinum.", "يعمل السمّ دون البكتيريا، مثل سمّ Clostridium botulinum."]}, {"x": 12, "y": 72, "t": ["Intoxication", "التسمم (intoxication)"], "d": ["Action toxique de produits de transformation, comme les amines des coliformes.", "تأثير سام لنواتج التحويل، مثل الأمينات التي تنتجها القولونيات."]}, {"x": 9, "y": 89, "t": ["À retenir", "للحفظ"], "d": ["Dans une intoxination, tuer la bactérie ne suffit pas : la toxine reste.", "في التسمم الذيفاني، قتل البكتيريا لا يكفي: السمّ يبقى."]}], "s11_28": [{"x": 7, "y": 23, "t": ["Salmonella", "السالمونيلا"], "d": ["Œufs, viande et lait crus ; toxi-infection.", "بيض، لحم وحليب نيء؛ تسمم عدوائي."]}, {"x": 8, "y": 37, "t": ["E. coli ECEH", "الإشريكية القولونية (E. coli ECEH)"], "d": ["Viande hachée peu cuite, lait non pasteurisé, jeunes pousses, eau souillée.", "لحم مفروم قليل الطهي، حليب غير مبستر، براعم صغيرة، ماء ملوث."]}, {"x": 82, "y": 40, "t": ["SHU", "متلازمة SHU"], "d": ["Complication d'E. coli ECEH dans 10 % des cas ; antibiotiques déconseillés.", "مضاعفة لـ E. coli ECEH في 10٪ من الحالات؛ المضادات الحيوية غير منصوح بها."]}, {"x": 9, "y": 52, "t": ["Campylobacter", "كامبيلوباكتر"], "d": ["Bactérie spiralée ; volaille, lait non pasteurisé, contact animal.", "بكتيريا حلزونية؛ دواجن، حليب غير مبستر، اتصال بالحيوان."]}, {"x": 9, "y": 68, "t": ["Listeria monocytogenes", "الليستيريا (Listeria monocytogenes)"], "d": ["Viande, poisson fumé, charcuterie, fromage à pâte molle ; grave pendant la grossesse.", "لحم، سمك مدخن، لحوم مصنعة، جبن طري؛ خطيرة أثناء الحمل."]}, {"x": 72, "y": 70, "t": ["Se développe au froid", "تنمو في البرد"], "d": ["Listeria se multiplie encore à 4 °C : le réfrigérateur ne l'arrête pas.", "الليستيريا تتكاثر حتى في 4 درجات: الثلاجة لا توقفها."]}]}}, "D": {"mnemo": [{"t": ["Les 5 M", "الـ 5 M"], "x": ["Suis le produit : Matières (ce qui entre), Matériel (sur quoi), Milieu (où), Méthodes (comment), Main-d'œuvre (qui).", "تتبّع المنتوج: المواد (ما يدخل)، المعدات (على ماذا)، الوسط (أين)، الطرق (كيف)، اليد العاملة (من)."], "s": [15]}, {"t": ["AMER", "طريقة AMER"], "x": ["AMER comme un goût amer à éviter : Apports, Multiplication, Élimination, Recontamination. Devise : vite, froid et propre.", "AMER كطعم مُرّ نتجنّبه: الإدخال، التكاثر، الإزالة، إعادة التلوث. الشعار: بسرعة، بارد ونظيف."], "s": [15]}, {"t": ["TACT", "قاعدة TACT"], "x": ["Nettoyer avec TACT : Température, Action mécanique, Concentration, Temps. Si l'un baisse, un autre monte.", "نظّف بـ TACT: الحرارة، الفعل الميكانيكي، التركيز، الزمن. إذا نقص عامل، يزيد عامل آخر."], "s": [16]}], "map": {"c": ["Maîtriser la contamination des aliments", "التحكم في تلوث الأغذية"], "b": [{"t": ["Le froid", "البرودة"], "i": [["Réfrigération : court ou moyen terme", "التبريد: مدى قصير أو متوسط"], ["Congélation : long terme, baisse l'Aw", "التجميد: مدى طويل، يخفض Aw"], ["Ralentit, ne tue pas", "يُبطئ ولا يقتل"], ["Ruptures qui s'additionnent", "انقطاعات تتراكم"]]}, {"t": ["La chaleur", "الحرارة"], "i": [["Pasteurisation 60–100 °C", "البسترة 60–100 درجة"], ["Stérilisation au-delà de 100 °C", "التعقيم فوق 100 درجة"], ["UHT 135–150 °C, 1–5 s", "UHT من 135 إلى 150 درجة، 1–5 ثوانٍ"], ["La spore impose le barème", "البوغ يفرض المعيار الحراري"]]}, {"t": ["Aw et barrières", "Aw والحواجز"], "i": [["Sel et sucre occupent l'eau", "الملح والسكر يشغلان الماء"], ["Fermentation, fumage, conservateurs", "التخمّر، التدخين، المواد الحافظة"], ["Atmosphère modifiée + froid", "جو معدّل + برودة"], ["Plusieurs obstacles doux", "عدة حواجز معتدلة"]]}, {"t": ["Hygiène et 5 M", "النظافة والـ 5 M"], "i": [["Dangers physiques, chimiques, biologiques", "أخطار فيزيائية، كيميائية، بيولوجية"], ["Réception, FEFO et FIFO", "الاستلام، FEFO وFIFO"], ["Marche en avant", "السير إلى الأمام"], ["AMER : vite, froid, propre", "AMER: بسرعة، بارد، نظيف"], ["Mains lavées, gants en plus", "غسل اليدين، والقفازات إضافة"]]}, {"t": ["Nettoyage et désinfection", "التنظيف والتطهير"], "i": [["Nettoyer avant de désinfecter", "التنظيف قبل التطهير"], ["Organique alcalin, minéral acide", "العضوي قاعدي، المعدني حمضي"], ["TACT et roue de Sinner", "TACT وعجلة سينر"], ["Protocole en 7 étapes", "بروتوكول في 7 مراحل"], ["Contrôler et enregistrer", "المراقبة والتسجيل"]]}]}, "case": {"t": ["Une journée à la coopérative laitière", "يوم في تعاونية الحليب"], "ctx": ["Tu es technicien dans une coopérative laitière du Souss. Elle fabrique du lait pasteurisé, du lben et du jben. Aujourd'hui, tu suis le produit de la réception au nettoyage.", "أنت تقني في تعاونية حليب بسوس. تصنع الحليب المبستر واللبن والجبن. اليوم تتبع المنتوج من الاستلام إلى التنظيف."], "steps": [{"q": ["7 h : un éleveur livre un bidon de lait à 12 °C au lieu de 4 °C. Que décides-tu ?", "الساعة 7: مربٍّ يسلّم إناء حليب في 12 درجة بدل 4 درجات. ماذا تقرر؟"], "o": [["Tu l'acceptes et tu le refroidis.", "Tu refuses ce lot non conforme.", "Tu le mélanges au lait conforme."], ["تقبله وتبرّده.", "ترفض هذه الدفعة غير المطابقة.", "تخلطه مع الحليب المطابق."]], "a": 1, "fb": ["La réception est le seul moment où l'on peut refuser. Mélanger contaminerait tout le tank.", "الاستلام هو اللحظة الوحيدة التي يمكن فيها الرفض. الخلط سيلوّث الخزان كله."]}, {"q": ["8 h : le lait accepté est pasteurisé. À quoi dois-tu penser juste après ?", "الساعة 8: الحليب المقبول يُبستر. بماذا يجب أن تفكر مباشرة بعد ذلك؟"], "o": [["Le laisser refroidir lentement dans la salle.", "Rien : il est stérile maintenant.", "Le refroidir vite et le garder à 4 °C."], ["تركه يبرد ببطء في القاعة.", "لا شيء: أصبح معقّمًا الآن.", "تبريده بسرعة وحفظه في 4 درجات."]], "a": 2, "fb": ["Les thermorésistants et les spores ont survécu. Le froid rapide freine leur multiplication.", "المقاومة للحرارة والأبواغ نجت. التبريد السريع يُبطئ تكاثرها."]}, {"q": ["11 h : en chambre froide, un nouveau lot de lben arrive. Où le ranges-tu ?", "الساعة 11: في غرفة التبريد، تصل دفعة جديدة من اللبن. أين تضعها؟"], "o": [["Derrière l'ancien lot, qui périme plus tôt.", "Devant l'ancien lot, c'est plus rapide.", "N'importe où, tant qu'il fait froid."], ["خلف الدفعة القديمة التي تنتهي صلاحيتها أولًا.", "أمام الدفعة القديمة، هذا أسرع.", "في أي مكان، ما دام المكان باردًا."]], "a": 0, "fb": ["C'est le FEFO : ce qui périme en premier sort en premier. Sinon, l'ancien lot périme au fond.", "هذه قاعدة FEFO: ما تنتهي صلاحيته أولًا يخرج أولًا. وإلا فسدت الدفعة القديمة في الخلف."]}, {"q": ["17 h : nettoyage du pasteurisateur. Il y a des dépôts de lait cuit et du calcaire. Quel ordre suis-tu ?", "الساعة 17: تنظيف جهاز البسترة. توجد رواسب حليب مطبوخ وكلس. أيّ ترتيب تتبع؟"], "o": [["Désinfectant d'abord, puis détergent, mélangés pour aller vite.", "Pré-lavage, alcalin, rinçage, acide, rinçage, désinfection, rinçage final.", "Acide seul à 90 °C, sans rinçage."], ["المطهّر أولًا ثم المنظّف، مخلوطين للسرعة.", "غسل مسبق، قاعدي، شطف، حمضي، شطف، تطهير، شطف نهائي.", "حمضي وحده في 90 درجة، دون شطف."]], "a": 1, "fb": ["L'alcalin enlève le lait cuit, l'acide le calcaire. On ne mélange jamais détergent et désinfectant.", "القاعدي يزيل الحليب المطبوخ، والحمضي يزيل الكلس. لا نخلط أبدًا منظّفًا ومطهّرًا."]}, {"q": ["18 h : le nettoyage est fini. Que fais-tu avant de partir ?", "الساعة 18: انتهى التنظيف. ماذا تفعل قبل المغادرة؟"], "o": [["Tu pars : l'appareil brille.", "Tu fais un contrôle, puis tu remplis et signes le plan de N&D.", "Tu notes le nettoyage demain matin, de mémoire."], ["تغادر: الجهاز يلمع.", "تُجري مراقبة، ثم تملأ وتوقّع مخطط التنظيف والتطهير.", "تسجّل التنظيف غدًا صباحًا من الذاكرة."]], "a": 1, "fb": ["Propre à l'œil ne suffit pas. Et ce qui n'est pas écrit n'a pas été fait.", "النظافة الظاهرة لا تكفي. وما لم يُكتب لم يُنجَز."]}], "end": ["Tu as maîtrisé la contamination à chaque étape : refuser, chauffer puis refroidir, bien stocker, bien nettoyer, et prouver.", "تحكّمت في التلوث في كل مرحلة: الرفض، التسخين ثم التبريد، التخزين الجيد، التنظيف الجيد، والإثبات."]}, "hot": {"s15_15": [{"x": 40, "y": 19, "t": ["Matières", "المواد (Matières)"], "d": ["Matières premières, ingrédients, eau, emballages : une mauvaise matière donne un mauvais produit.", "المواد الأولية، المكوّنات، الماء، التغليف: مادة رديئة تعطي منتوجًا رديئًا."]}, {"x": 60, "y": 19, "t": ["Milieu", "الوسط (Milieu)"], "d": ["Les locaux, l'air, la température : ils doivent suivre la marche en avant.", "المباني، الهواء، الحرارة: يجب أن تحترم السير إلى الأمام."]}, {"x": 81, "y": 19, "t": ["Matériel", "المعدات (Matériel)"], "d": ["Équipements lisses, sans bois, faciles à démonter et à nettoyer.", "معدات ملساء، بدون خشب، سهلة التفكيك والتنظيف."]}, {"x": 40, "y": 58, "t": ["Méthodes", "الطرق (Méthodes)"], "d": ["Les procédures de travail : la méthode AMER en donne le fil.", "طرق العمل: طريقة AMER تعطي خيطها."]}, {"x": 70, "y": 58, "t": ["Main-d'œuvre", "اليد العاملة (Main-d'œuvre)"], "d": ["Le personnel : lavage des mains, tenue, santé, formation.", "المستخدمون: غسل اليدين، اللباس، الصحة، التكوين."]}, {"x": 92, "y": 45, "t": ["Le problème", "المشكلة"], "d": ["La tête du poisson : l'effet observé. Les arêtes mènent à ses causes.", "رأس السمكة: الأثر الملاحَظ. والحسكات تقود إلى أسبابه."]}], "s16_21": [{"x": 51, "y": 45, "t": ["La roue de Sinner", "عجلة سينر"], "d": ["Les quatre paramètres se compensent : si l'un baisse, un autre doit monter.", "العوامل الأربعة تعوّض بعضها: إذا نقص أحدها، يجب أن يزيد آخر."]}, {"x": 40, "y": 35, "t": ["Température", "الحرارة"], "d": ["Eau à 40–50 °C pour nettoyer.", "ماء في 40–50 درجة للتنظيف."]}, {"x": 60, "y": 35, "t": ["Temps", "الزمن"], "d": ["Temps de contact de 10 à 30 minutes.", "زمن تلامس من 10 إلى 30 دقيقة."]}, {"x": 57, "y": 58, "t": ["Action mécanique", "الفعل الميكانيكي"], "d": ["Brossage, raclage ou jet haute pression.", "الفرك أو الكشط أو النفث بضغط عالٍ."]}, {"x": 43, "y": 58, "t": ["Concentration", "التركيز"], "d": ["La dose de détergent dans l'eau.", "كمية المنظّف في الماء."]}, {"x": 76, "y": 86, "t": ["La limite de 70 °C", "حدّ 70 درجة"], "d": ["Au-delà, les protéines coagulent et le détergent se décompose.", "فوقها تتخثر البروتينات ويتحلل المنظّف."]}], "s16_13": [{"x": 54, "y": 26, "t": ["Tête hydrophile", "الرأس المحب للماء (hydrophile)"], "d": ["La tête polaire aime l'eau et reste dedans.", "الرأس القطبي يحب الماء ويبقى فيه."]}, {"x": 66, "y": 25, "t": ["Queue hydrophobe", "الذيل الكاره للماء (hydrophobe)"], "d": ["La queue apolaire fuit l'eau et se fixe sur la graisse.", "الذيل غير القطبي يهرب من الماء ويلتصق بالدهون."]}, {"x": 87, "y": 25, "t": ["Graisse entourée", "دهون محاطة"], "d": ["Les molécules entourent la graisse, les queues vers l'intérieur.", "الجزيئات تحيط بالدهون، والذيول نحو الداخل."]}, {"x": 47, "y": 67, "t": ["La graisse décrochée", "نزع الدهون"], "d": ["Les queues tirent sur la salissure et la décollent de la surface.", "الذيول تسحب الوسخ وتفصله عن السطح."]}, {"x": 82, "y": 65, "t": ["L'eau emporte tout", "الماء يحمل كل شيء"], "d": ["La graisse entourée est entraînée par l'eau de rinçage.", "الدهون المحاطة يحملها ماء الشطف."]}]}}}}, "seances": [{"n": 1, "t": ["Introduction, historique et impact des micro-organismes", "مدخل، تاريخ وتأثير الكائنات الدقيقة"], "c": [{"img": "s01_08", "t": ["Pourquoi la microbiologie en agroalimentaire ?", "لماذا علم الأحياء الدقيقة في الصناعة الغذائية؟"], "st": [["La microbiologie est la science qui étudie les micro-organismes : des êtres vivants trop petits pour être vus à l'œil nu, qu'on observe au microscope.", "1re raison — accepter un lot : l'analyse dit si un aliment ou un lot de matière première peut être accepté.", "2e raison — vérifier le système : elle contrôle que la sécurité sanitaire fonctionne tout au long de la chaîne alimentaire.", "3e raison — fabriquer : yaourt, fromage, pain et vinaigre n'existent que grâce au travail des micro-organismes."], ["علم الأحياء الدقيقة (microbiologie) هو العلم الذي يدرس الكائنات الدقيقة (micro-organismes): كائنات حية صغيرة جدًا لا تُرى بالعين المجردة، نلاحظها بالمجهر (microscope).", "السبب الأول — قبول دفعة (accepter un lot): التحليل يحدد هل يمكن قبول غذاء أو دفعة من المادة الأولية.", "السبب الثاني — مراقبة النظام: يتأكد من أن السلامة الصحية تعمل على طول السلسلة الغذائية.", "السبب الثالث — التصنيع: الياغورت والجبن والخبز والخل لا توجد إلا بفضل عمل الكائنات الدقيقة."]], "k": ["La microbiologie ne sert pas seulement à refuser des produits : elle sert aussi à en fabriquer.", "علم الأحياء الدقيقة لا يُستعمل فقط لرفض المنتجات، بل أيضًا لتصنيعها."], "q": ["Laquelle n'est PAS une raison de faire de la microbiologie en usine ?", "أيّ مما يلي ليس سببًا لإجراء التحاليل الميكروبيولوجية في المصنع؟"], "o": [["Accepter ou refuser un lot", "Colorer les aliments", "Fabriquer des produits fermentés"], ["قبول أو رفض دفعة", "تلوين الأغذية", "تصنيع منتجات مخمّرة"]], "a": 1, "w": ["Les trois raisons du cours : accepter un lot, vérifier le système, fabriquer.", "الأسباب الثلاثة: قبول الدفعة، مراقبة النظام، التصنيع."], "g": []}, {"img": "s01_10", "t": ["Les 7 étapes d'une analyse microbiologique", "المراحل السبع للتحليل الميكروبيولوجي"], "st": [["Étape 1 : préparer et stériliser le matériel (verrerie, milieux, pipettes). Étape 2 : réceptionner l'échantillon (identification, température, emballage intact).", "Étape 3 : préparer l'échantillon — pesée, broyage, suspension mère, puis dilutions décimales.", "Étape 4 : ensemencer le milieu de culture adapté. Étape 5 : incuber à l'étuve, à la température et pendant la durée de la méthode.", "Étape 6 : lire et calculer le résultat en UFC/g ou UFC/mL. Étape 7 : rédiger le rapport au client, qui déclare le produit conforme ou non."], ["المرحلة 1: تحضير وتعقيم الأدوات (stérilisation). المرحلة 2: استقبال العيّنة (التعريف، درجة الحرارة، سلامة التغليف).", "المرحلة 3: تحضير العيّنة — الوزن، الطحن، المعلّق الأم، ثم التخفيفات العشرية (dilutions décimales).", "المرحلة 4: الزرع (ensemencement) في وسط الزرع المناسب. المرحلة 5: الحضن في الحاضنة (étuve) بالحرارة والمدة المحددتين.", "المرحلة 6: القراءة وحساب النتيجة بـ UFC/g أو UFC/mL. المرحلة 7: تحرير التقرير للزبون الذي يُعلن مطابقة المنتوج أو عدمها."]], "k": ["Toujours le même ordre, du matériel stérile au rapport : l'objectif final est la déclaration de conformité.", "دائمًا نفس الترتيب، من الأدوات المعقّمة إلى التقرير: الهدف النهائي هو التصريح بالمطابقة (conformité)."], "q": ["Quelle étape vient juste après l'ensemencement ?", "ما المرحلة التي تأتي مباشرة بعد الزرع؟"], "o": [["La réception des échantillons", "L'incubation", "La stérilisation du matériel"], ["استقبال العيّنات", "الحضن", "تعقيم الأدوات"]], "a": 1, "w": ["Après l'ensemencement, les boîtes vont à l'étuve : c'est l'incubation.", "بعد الزرع توضع العلب في الحاضنة: إنها مرحلة الحضن."], "g": [60, 63]}, {"img": "s01_17", "t": ["Trois siècles en trois temps", "ثلاثة قرون في ثلاث مراحل"], "st": [["Observer (1676) : Leeuwenhoek taille ses propres lentilles et voit pour la première fois des micro-organismes dans le tartre dentaire et la levure de bière.", "Cultiver (XVIIIe siècle) : Spallanzani cultive des micro-organismes sur du jus de viande et montre qu'ils se multiplient en se divisant en deux.", "Maîtriser (1846-1876) : Semmelweis impose le lavage des mains (mortalité de 27 % à 0,23 %), Koch prouve le lien maladie-microbe avec Bacillus anthracis et ses spores.", "Pasteur (1857) explique la fermentation par un micro-organisme et découvre la vaccination ; la pasteurisation porte son nom."], ["الملاحظة (1676): ليفنهوك (Leeuwenhoek) يصنع عدساته بنفسه ويرى لأول مرة كائنات دقيقة في جير الأسنان وخميرة الجعة.", "الزرع (القرن 18): سبالانزاني (Spallanzani) يزرع كائنات دقيقة في مرق اللحم ويبيّن أنها تتكاثر بالانقسام إلى اثنين.", "التحكم (1846-1876): سيملفايس (Semmelweis) يفرض غسل اليدين (الوفيات من 27٪ إلى 0,23٪)، وكوخ (Koch) يثبت العلاقة بين المرض والميكروب مع Bacillus anthracis وأبواغه (spores).", "باستور (Pasteur, 1857) يفسّر التخمّر (fermentation) بكائن دقيق ويكتشف التلقيح؛ والبسترة (pasteurisation) تحمل اسمه."]], "k": ["Observer → cultiver → maîtriser : c'est aussi le plan du module.", "الملاحظة ← الزرع ← التحكم: هذه أيضًا خطة الوحدة."], "q": ["Qui a prouvé le premier le lien entre une maladie et un microbe ?", "من أثبت أولًا العلاقة بين مرض وميكروب؟"], "o": [["Pasteur", "Koch", "Leeuwenhoek"], ["باستور", "كوخ", "ليفنهوك"]], "a": 1, "w": ["Koch, en 1876, avec le charbon des moutons dû à Bacillus anthracis.", "كوخ سنة 1876، مع مرض الجمرة عند الأغنام الناتج عن Bacillus anthracis."], "g": [46]}, {"img": "s01_21", "t": ["Les cinq besoins de la croissance microbienne", "الحاجيات الخمس لنمو الكائنات الدقيقة"], "st": [["Les micro-organismes sont partout : air, sol, eau, peau, surfaces. Aucun environnement naturel n'est stérile : l'hygiène réduit, elle ne supprime pas.", "Pour se multiplier, ils ont besoin de cinq choses : eau, nutriments, température, temps et oxygène (certains le fuient).", "L'aliment leur apporte déjà l'eau et les nutriments : c'est un milieu de culture idéal.", "Retirer un seul de ces besoins suffit à bloquer la croissance : c'est tout le principe de la conservation (froid, séchage, sous vide…)."], ["الكائنات الدقيقة موجودة في كل مكان: الهواء، التربة، الماء، الجلد، الأسطح. لا توجد بيئة طبيعية معقّمة: النظافة تُقلّص ولا تُلغي.", "لكي تتكاثر تحتاج إلى خمسة أشياء: الماء، المغذيات، درجة الحرارة، الوقت والأكسجين (بعضها يهرب منه).", "الغذاء يوفّر لها الماء والمغذيات: إنه وسط زرع مثالي.", "حذف حاجة واحدة يكفي لإيقاف النمو: هذا هو مبدأ الحفظ (conservation) كله (البرودة، التجفيف، التفريغ من الهواء…)."]], "k": ["Eau, nutriments, température, temps, oxygène : retirer un seul besoin bloque la croissance.", "الماء، المغذيات، الحرارة، الوقت، الأكسجين: حذف حاجة واحدة يوقف النمو."], "q": ["Pourquoi un aliment est-il un « milieu de culture idéal » ?", "لماذا يُعتبر الغذاء «وسط زرع مثالي»؟"], "o": [["Il est toujours stérile", "Il fournit l'eau et les nutriments", "Il contient de l'oxygène pur"], ["لأنه دائمًا معقّم", "لأنه يوفّر الماء والمغذيات", "لأنه يحتوي على أكسجين خالص"]], "a": 1, "w": ["L'aliment couvre deux des cinq besoins : l'eau et les nutriments.", "الغذاء يغطي حاجتين من الحاجيات الخمس: الماء والمغذيات."], "g": [33]}, {"img": "s01_24", "t": ["Utiles, nuisibles, pathogènes", "نافعة، ضارّة، ممرضة"], "st": [["Utiles : ils transforment un aliment brut en aliment nouveau (yaourt, fromage, vinaigre, alcool) ou produisent des substances (antibiotiques). Ce sont les ferments : on les favorise.", "Nuisibles : ils abîment l'aspect ou le goût (gonflement d'une conserve, tavelure de la pomme) sans danger pour l'homme. Le produit devient invendable : on les limite.", "Pathogènes : ils provoquent des maladies, parfois mortelles, souvent sans aucun signe visible sur l'aliment. On les élimine.", "Attention : nuisible et pathogène ne sont pas synonymes. « Pas visible ne veut pas dire pas présent »."], ["النافعة: تحوّل غذاءً خامًا إلى غذاء جديد (ياغورت، جبن، خل، كحول) أو تنتج مواد (مضادات حيوية). إنها الخمائر (ferments): نشجّعها.", "الضارّة (nuisibles): تُفسد المظهر أو الطعم (انتفاخ علبة مصبّرة، تبقّع التفاح) دون خطر على الإنسان. يصبح المنتوج غير قابل للبيع: نحدّ منها.", "الممرضة (pathogènes): تسبب أمراضًا قد تكون قاتلة، وغالبًا دون أي علامة ظاهرة على الغذاء. نقضي عليها.", "انتبه: الضارّة ليست هي الممرضة. «عدم الرؤية لا يعني عدم الوجود»."]], "k": ["Favoriser les utiles, limiter les nuisibles, éliminer les pathogènes.", "نشجّع النافعة، نحدّ من الضارّة، نقضي على الممرضة."], "q": ["Une conserve gonflée mais sans danger contient des micro-organismes :", "علبة مصبّرة منتفخة لكن دون خطر تحتوي على كائنات دقيقة:"], "o": [["utiles", "nuisibles", "pathogènes"], ["نافعة", "ضارّة", "ممرضة"]], "a": 1, "w": ["Défaut d'aspect sans danger pour l'homme : c'est la famille des nuisibles.", "عيب في المظهر دون خطر على الإنسان: إنها عائلة الكائنات الضارّة."], "g": [20]}], "since": "1.0"}, {"n": 2, "t": ["Classification du vivant et cellule eucaryote", "تصنيف الكائنات الحية والخلية حقيقية النواة"], "c": [{"img": "s02_10", "t": ["Cellulaires ou non cellulaires ?", "خلوية أم غير خلوية؟"], "st": [["Pour classer un micro-organisme, on se pose trois questions : d'où vient son énergie, combien a-t-il de cellules, et a-t-il un noyau ?", "Les cellulaires sont faits d'une ou plusieurs cellules et se nourrissent et se multiplient seuls : algues, protozoaires, champignons (eucaryotes) et bactéries (procaryotes).", "Les non cellulaires ne sont pas faits de cellules et ne peuvent pas se multiplier seuls : il leur faut une cellule hôte. Ce sont les virus, les bactériophages et les prions."], ["لتصنيف كائن دقيق نطرح ثلاثة أسئلة: من أين تأتي طاقته، كم عدد خلاياه، وهل له نواة (noyau)؟", "الكائنات الخلوية تتكوّن من خلية أو عدة خلايا وتتغذى وتتكاثر وحدها: الطحالب، الأوالي، الفطريات (حقيقيات النواة) والبكتيريا (بدائيات النواة).", "الكائنات غير الخلوية لا تتكون من خلايا ولا تتكاثر وحدها: تحتاج إلى خلية مضيفة (cellule hôte). وهي الفيروسات، العاثيات (bactériophages) والبريونات (prions)."]], "k": ["La question qui structure toute la microbiologie : y a-t-il une cellule, et a-t-elle un noyau ?", "السؤال الذي يبني علم الأحياء الدقيقة كله: هل توجد خلية، وهل لها نواة؟"], "q": ["Lequel n'est PAS un micro-organisme cellulaire ?", "أيّ مما يلي ليس كائنًا دقيقًا خلويًا؟"], "o": [["La levure", "La bactérie", "Le virus"], ["الخميرة", "البكتيريا", "الفيروس"]], "a": 2, "w": ["Le virus n'a pas de cellule : il lui faut une cellule hôte pour se multiplier.", "الفيروس ليس له خلية: يحتاج إلى خلية مضيفة ليتكاثر."], "g": [12, 24, 55, 65]}, {"img": "s02_12", "t": ["Les procaryotes : sans noyau", "بدائيات النواة: بدون نواة"], "st": [["Un procaryote est unicellulaire et n'a pas de noyau : son ADN flotte librement dans le cytoplasme, sans membrane autour.", "Deux familles : les bactéries, le groupe le plus important en agroalimentaire (ferments, germes d'altération, pathogènes), et les archées.", "Les archées sont extrêmophiles : elles vivent là où rien d'autre ne survit — sources chaudes, milieux très salés, volcans.", "L'absence de noyau change tout : la taille, la structure et surtout la vitesse de multiplication."], ["بدائي النواة (procaryote) أحادي الخلية وليس له نواة: حمضه النووي (ADN) يسبح بحرية في السيتوبلازم (cytoplasme) دون غشاء حوله.", "عائلتان: البكتيريا، وهي أهم مجموعة في الصناعة الغذائية (خمائر، جراثيم الإفساد، ممرضات)، والعتائق (archées).", "العتائق محبّة للظروف القصوى (extrêmophiles): تعيش حيث لا يعيش غيرها — الينابيع الحارة، الأوساط المالحة جدًا، البراكين.", "غياب النواة يغيّر كل شيء: الحجم، البنية، وخاصة سرعة التكاثر."]], "k": ["Procaryote = unicellulaire, sans noyau : bactéries et archées.", "بدائي النواة = أحادي الخلية، بدون نواة: البكتيريا والعتائق."], "q": ["Où se trouve l'ADN d'une bactérie ?", "أين يوجد الحمض النووي للبكتيريا؟"], "o": [["Dans un noyau à double membrane", "Libre dans le cytoplasme", "Dans la mitochondrie"], ["في نواة ذات غشاء مزدوج", "حرًّا في السيتوبلازم", "في الميتوكوندري"]], "a": 1, "w": ["Sans noyau, l'ADN du procaryote flotte librement dans le cytoplasme.", "بدون نواة، يسبح الحمض النووي لبدائي النواة حرًّا في السيتوبلازم."], "g": [6, 55]}, {"img": "s02_14", "t": ["Les eucaryotes : avec noyau", "حقيقيات النواة: مع نواة"], "st": [["Un eucaryote peut être unicellulaire ou multicellulaire ; sa cellule a un vrai noyau, entouré d'une double membrane, et des organites spécialisés.", "Les algues : les seules à avoir des chloroplastes et à faire la photosynthèse.", "Les protozoaires : proches de la cellule animale, la plupart sont mobiles.", "Les champignons : levures (unicellulaires) et moisissures (filamenteuses)."], ["حقيقي النواة (eucaryote) قد يكون أحادي الخلية أو متعدد الخلايا؛ لخليته نواة حقيقية محاطة بغشاء مزدوج، وعضيات متخصصة (organites).", "الطحالب (algues): الوحيدة التي تملك صانعات اليخضور (chloroplastes) وتقوم بالتركيب الضوئي (photosynthèse).", "الأوالي (protozoaires): قريبة من الخلية الحيوانية، وأغلبها متحركة.", "الفطريات (champignons): الخمائر (levures) أحادية الخلية والعفن (moisissures) الخيطي."]], "k": ["Eucaryotes microscopiques = algues, protozoaires, champignons : tous ont un noyau.", "حقيقيات النواة المجهرية = الطحالب، الأوالي، الفطريات: كلها لها نواة."], "q": ["Quel eucaryote fait la photosynthèse ?", "أيّ حقيقي نواة يقوم بالتركيب الضوئي؟"], "o": [["L'algue", "La levure", "Le protozoaire"], ["الطحلب", "الخميرة", "الأوالي"]], "a": 0, "w": ["Les algues sont les seuls protistes eucaryotes dotés de chloroplastes.", "الطحالب هي الوحيدة بين الطلائعيات حقيقية النواة التي تملك صانعات اليخضور."], "g": [24]}, {"img": "s02_16", "t": ["Les acaryotes : non cellulaires", "عديمات الخلية"], "st": [["Les virus : une information génétique protégée par une capside ; ils ne se multiplient que dans une cellule hôte.", "Les bactériophages : des virus qui infectent les bactéries — un ennemi bien connu des levains laitiers.", "Les prions : une simple protéine infectieuse, sans aucun matériel génétique.", "Ils ne se nourrissent pas, ne produisent pas d'énergie et ne se divisent pas seuls : leur statut de « vivant » est discuté."], ["الفيروسات (virus): معلومة وراثية محمية بغلاف بروتيني (capside)؛ لا تتكاثر إلا داخل خلية مضيفة.", "العاثيات (bactériophages): فيروسات تصيب البكتيريا — عدو معروف لخمائر الحليب (levains).", "البريونات (prions): بروتين معدٍ بسيط، دون أي مادة وراثية.", "لا تتغذى ولا تنتج الطاقة ولا تنقسم وحدها: كونها «حيّة» محلّ نقاش."]], "k": ["Acaryote = pas de cellule du tout : virus, bactériophages, prions.", "عديم الخلية = لا توجد خلية أصلًا: فيروسات، عاثيات، بريونات."], "q": ["Quel agent n'a AUCUN matériel génétique ?", "أيّ عامل ليس له أي مادة وراثية؟"], "o": [["Le virus", "Le bactériophage", "Le prion"], ["الفيروس", "العاثية", "البريون"]], "a": 2, "w": ["Le prion est une protéine seule, sans ADN ni ARN.", "البريون بروتين وحده، دون ADN ولا ARN."], "g": [0, 12, 15, 65]}, {"img": "s02_21", "t": ["La cellule eucaryote en un schéma", "الخلية حقيقية النواة في رسم"], "st": [["Ce qui délimite : la paroi (à l'extérieur, rigide) et la membrane plasmique (qui laisse entrer et sortir).", "Ce qui commande : le noyau, entouré de deux membranes percées de pores, qui contient les chromosomes et le nucléole.", "Ce qui produit : mitochondries (énergie), réticulum endoplasmique et ribosomes (synthèse), appareil de Golgi (tri et distribution), vacuole (stockage).", "Ce schéma est à savoir légender par cœur : il tombe au contrôle n° 1."], ["ما يحدّ الخلية: الجدار (paroi) من الخارج وهو صلب، والغشاء البلازمي (membrane plasmique) الذي يسمح بالدخول والخروج.", "ما يقود الخلية: النواة، محاطة بغشاءين مثقوبين بمسام، وتحتوي على الصبغيات (chromosomes) والنوية (nucléole).", "ما ينتج: الميتوكوندري (الطاقة)، الشبكة الإندوبلازمية (réticulum) والريبوزومات (التركيب)، جهاز غولجي (الفرز والتوزيع)، الفجوة (vacuole) للتخزين.", "يجب حفظ هذا الرسم وتسمية أجزائه: يأتي في المراقبة رقم 1."]], "k": ["Une cellule, c'est une usine : chaque organite est un atelier.", "الخلية مصنع: كل عضيّة ورشة."], "q": ["Quel élément contrôle toutes les activités de la cellule ?", "أيّ عنصر يتحكم في كل أنشطة الخلية؟"], "o": [["La vacuole", "Le noyau", "La paroi"], ["الفجوة", "النواة", "الجدار"]], "a": 1, "w": ["Le noyau contient l'information génétique et commande la cellule.", "النواة تحتوي على المعلومة الوراثية وتقود الخلية."], "g": [24]}, {"img": "s02_23", "t": ["Noyau, cytoplasme et membrane", "النواة، السيتوبلازم والغشاء"], "st": [["Le noyau contient l'information génétique, contrôle toutes les activités cellulaires et la transmet d'une génération de cellules à l'autre.", "Le cytoplasme comprend tout ce qui est à l'intérieur de la membrane, sauf le noyau et certains organites.", "La membrane cytoplasmique sépare l'intérieur de l'extérieur : les nutriments entrent, les déchets sortent à travers elle.", "La nuance à retenir : la membrane laisse passer, la paroi maintient la forme."], ["النواة تحتوي على المعلومة الوراثية، تتحكم في كل أنشطة الخلية، وتنقلها من جيل خلوي إلى آخر.", "السيتوبلازم يضم كل ما بداخل الغشاء، باستثناء النواة وبعض العضيات.", "الغشاء السيتوبلازمي يفصل الداخل عن الخارج: تدخل المغذيات وتخرج الفضلات عبره.", "الفرق الذي يجب تذكّره: الغشاء يسمح بالمرور، والجدار يحافظ على الشكل."]], "k": ["Membrane = échanges ; paroi = forme.", "الغشاء = التبادل؛ الجدار = الشكل."], "q": ["Le rôle principal de la membrane cytoplasmique est :", "الدور الأساسي للغشاء السيتوبلازمي هو:"], "o": [["de maintenir la forme de la cellule", "de laisser entrer les nutriments et sortir les déchets", "de produire l'ATP"], ["الحفاظ على شكل الخلية", "إدخال المغذيات وإخراج الفضلات", "إنتاج ATP"]], "a": 1, "w": ["C'est la paroi qui maintient la forme ; la membrane contrôle les échanges.", "الجدار هو الذي يحافظ على الشكل؛ الغشاء يتحكم في التبادل."], "g": []}, {"img": "s02_25", "t": ["Paroi, mitochondrie et réticulum", "الجدار، الميتوكوندري والشبكة الإندوبلازمية"], "st": [["La paroi est à l'extérieur de la membrane : plus rigide, elle maintient la structure de la cellule.", "La mitochondrie, organite ovoïde, assure la respiration cellulaire et fournit l'énergie sous forme d'ATP : c'est la centrale électrique de la cellule.", "Le réticulum endoplasmique, associé aux ribosomes, fabrique les protéines et les lipides et les transporte vers l'appareil de Golgi grâce à des vésicules."], ["الجدار يوجد خارج الغشاء: وهو أكثر صلابة ويحافظ على بنية الخلية.", "الميتوكوندري (mitochondrie) عضيّة بيضوية تقوم بالتنفس الخلوي وتوفر الطاقة على شكل ATP: إنها محطة الكهرباء في الخلية.", "الشبكة الإندوبلازمية (réticulum endoplasmique)، مع الريبوزومات، تصنع البروتينات والدهون وتنقلها إلى جهاز غولجي عبر حويصلات."]], "k": ["Pas d'ATP, pas d'activité : la mitochondrie est la centrale d'énergie.", "لا ATP، لا نشاط: الميتوكوندري هي محطة الطاقة."], "q": ["Quel organite produit l'ATP ?", "أيّ عضيّة تنتج ATP؟"], "o": [["Le réticulum", "La mitochondrie", "La vacuole"], ["الشبكة الإندوبلازمية", "الميتوكوندري", "الفجوة"]], "a": 1, "w": ["La mitochondrie réalise la respiration cellulaire et fournit l'ATP.", "الميتوكوندري تقوم بالتنفس الخلوي وتوفر ATP."], "g": []}, {"img": "s02_29", "t": ["Chaque organite et son rôle", "كل عضيّة ودورها"], "st": [["Présents dans toutes les cellules eucaryotes : noyau, cytoplasme, membrane, mitochondrie, réticulum, appareil de Golgi (maturation, tri et distribution des molécules).", "Présents seulement chez certaines : la paroi, le chloroplaste (photosynthèse : lumière → sucres), la vacuole (stockage des réserves), le cil et le flagelle (mobilité).", "Ces « équipements en option » permettent de distinguer les groupes : une algue a des chloroplastes et une paroi, un protozoaire n'en a pas."], ["موجودة في كل الخلايا حقيقية النواة: النواة، السيتوبلازم، الغشاء، الميتوكوندري، الشبكة الإندوبلازمية، جهاز غولجي (نضج وفرز وتوزيع الجزيئات).", "موجودة فقط عند البعض: الجدار، صانعة اليخضور (التركيب الضوئي: الضوء ← السكريات)، الفجوة (تخزين المدخرات)، الأهداب والسوط (cil, flagelle) للحركة.", "هذه «التجهيزات الاختيارية» تسمح بالتمييز بين المجموعات: الطحلب له صانعات اليخضور وجدار، أما الأوالي فلا."]], "k": ["Paroi, chloroplaste, vacuole, cil et flagelle : des options qui aident à classer.", "الجدار، صانعة اليخضور، الفجوة، الأهداب والسوط: خيارات تساعد على التصنيف."], "q": ["Le rôle de l'appareil de Golgi est :", "دور جهاز غولجي هو:"], "o": [["la photosynthèse", "la maturation, le tri et la distribution des molécules", "le stockage de l'eau"], ["التركيب الضوئي", "نضج وفرز وتوزيع الجزيئات", "تخزين الماء"]], "a": 1, "w": ["Le Golgi rend les protéines et lipides fonctionnels et les envoie là où la cellule en a besoin.", "جهاز غولجي يجعل البروتينات والدهون فعّالة ويرسلها حيث تحتاجها الخلية."], "g": [24]}], "since": "1.0"}, {"n": 3, "t": ["Algues, protozoaires, levures et moisissures", "الطحالب، الأوالي، الخمائر والعفن"], "c": [{"img": "s03_17", "t": ["Qu'est-ce qu'un champignon microscopique ?", "ما هو الفطر المجهري؟"], "st": [["Les champignons microscopiques sont soit filamenteux et pluricellulaires (les moisissures), soit unicellulaires (les levures).", "Ils sont hétérotrophes : ils ne fabriquent pas leur matière organique, ils la prennent dans l'aliment.", "Ils n'ont pas de chlorophylle : aucune photosynthèse, c'est ce qui les sépare des algues et des végétaux.", "On les trouve partout : saprophytes sur la matière morte, parasites sur un hôte vivant."], ["الفطريات المجهرية إما خيطية متعددة الخلايا (العفن moisissures)، أو أحادية الخلية (الخمائر levures).", "هي غيرية التغذية (hétérotrophes): لا تصنع مادتها العضوية، بل تأخذها من الغذاء.", "ليس لها يخضور (chlorophylle): لا تقوم بالتركيب الضوئي، وهذا ما يميزها عن الطحالب والنباتات.", "توجد في كل مكان: رمّية (saprophytes) على المادة الميتة، أو طفيلية على كائن حي."]], "k": ["« Hétérotrophe et sans chlorophylle » : il mange votre produit.", "«غيري التغذية وبدون يخضور»: إنه يأكل منتوجك."], "q": ["Qu'est-ce qui distingue un champignon d'une algue ?", "ما الذي يميز الفطر عن الطحلب؟"], "o": [["Le champignon a un noyau", "Le champignon n'a pas de chlorophylle", "Le champignon est toujours unicellulaire"], ["الفطر له نواة", "الفطر ليس له يخضور", "الفطر دائمًا أحادي الخلية"]], "a": 1, "w": ["Les deux ont un noyau, mais seul l'algue a de la chlorophylle et fait la photosynthèse.", "كلاهما له نواة، لكن الطحلب وحده له يخضور ويقوم بالتركيب الضوئي."], "g": [32, 45, 58]}, {"img": "s03_21", "t": ["Hyphes, mycélium et cloisons", "الخيوط الفطرية، الغزل الفطري والحواجز"], "st": [["Les cellules fongiques sont rassemblées en filaments ramifiés appelés hyphes.", "L'enchevêtrement des hyphes forme le mycélium (ou thalle) : c'est ce qu'on voit à l'œil nu sur un pain moisi.", "Les filaments sont cloisonnés ou non. Les cloisons sont perforées : les passages entre cellules s'appellent des plasmodesmes.", "Ce critère — cloisonné ou non — sépare les deux grands groupes de moisissures."], ["الخلايا الفطرية مجمّعة في خيوط متفرعة تسمى الخيوط الفطرية (hyphes).", "تشابك الخيوط يكوّن الغزل الفطري (mycélium أو thalle): وهو ما نراه بالعين على الخبز المتعفّن.", "الخيوط إما مقسّمة بحواجز (cloisonnés) أو غير مقسّمة. الحواجز مثقوبة: الممرات بين الخلايا تسمى plasmodesmes.", "هذا المعيار — مقسّم أم لا — يفصل بين المجموعتين الكبيرتين للعفن."]], "k": ["Hyphe = filament ; mycélium = l'ensemble des hyphes.", "الخيط الفطري = خيط؛ الغزل الفطري = مجموع الخيوط."], "q": ["Ce qu'on voit à l'œil nu sur un pain moisi, c'est :", "ما نراه بالعين على الخبز المتعفّن هو:"], "o": [["une seule hyphe", "le mycélium", "une spore isolée"], ["خيط فطري واحد", "الغزل الفطري", "بوغ منفرد"]], "a": 1, "w": ["Le mycélium est l'enchevêtrement de milliers d'hyphes.", "الغزل الفطري هو تشابك آلاف الخيوط الفطرية."], "g": [34]}, {"img": "s03_23", "t": ["Zygomycètes et ascomycètes", "الفطريات اللاقحية والفطريات الزقية"], "st": [["Zygomycètes : hyphes non cloisonnés — le filament est une seule grande cellule à plusieurs noyaux.", "Exemples de zygomycètes : Rhizopus nigricans, la moisissure noire du pain, et Mucor, qui altère les produits humides.", "Ascomycètes : hyphes cloisonnés par des septums perforés.", "Exemples d'ascomycètes : Penicillium notatum (pénicilline), P. roqueforti (Roquefort), P. camemberti (Camembert), Aspergillus glaucum (confitures)."], ["الفطريات اللاقحية (zygomycètes): خيوط غير مقسّمة — الخيط خلية واحدة كبيرة متعددة النوى.", "أمثلة: Rhizopus nigricans، العفن الأسود للخبز، و Mucor الذي يفسد المنتجات الرطبة.", "الفطريات الزقية (ascomycètes): خيوط مقسّمة بحواجز مثقوبة (septums).", "أمثلة: Penicillium notatum (البنسلين)، P. roqueforti (جبن روكفور)، P. camemberti (جبن كامومبير)، Aspergillus glaucum (المربى)."]], "k": ["Non cloisonné = zygomycète ; cloisonné = ascomycète.", "غير مقسّم = لاقحي؛ مقسّم = زقي."], "q": ["Penicillium roqueforti appartient aux :", "Penicillium roqueforti ينتمي إلى:"], "o": [["zygomycètes, hyphes non cloisonnés", "ascomycètes, hyphes cloisonnés", "levures"], ["اللاقحية، خيوط غير مقسّمة", "الزقية، خيوط مقسّمة", "الخمائر"]], "a": 1, "w": ["Les moisissures nobles de fromagerie sont toutes des ascomycètes.", "كل أنواع العفن النبيل في صناعة الجبن من الفطريات الزقية."], "g": [7, 67]}, {"img": "s03_25", "t": ["La même famille, nuisible et utile", "نفس العائلة، ضارّة ونافعة"], "st": [["Nuisible : Rhizopus nigricans sur le pain rend le produit invendable en quelques jours à température ambiante.", "Nuisible : Aspergillus glaucum supporte les fortes concentrations de sucre et pousse sur les confitures.", "Utile : Penicillium roqueforti fabrique les veines bleues des fromages à pâte persillée.", "Les moisissures servent aussi à produire des antibiotiques, des enzymes et diverses fermentations."], ["ضارّة: Rhizopus nigricans على الخبز يجعل المنتوج غير قابل للبيع في أيام قليلة في درجة حرارة الغرفة.", "ضارّة: Aspergillus glaucum يتحمل تركيزات عالية من السكر وينمو على المربى.", "نافعة: Penicillium roqueforti يصنع العروق الزرقاء في الأجبان المعرّقة (pâte persillée).", "يُستعمل العفن أيضًا لإنتاج المضادات الحيوية والإنزيمات وتخمّرات مختلفة."]], "k": ["La même famille fabrique le Roquefort et gâte le pain.", "نفس العائلة تصنع جبن روكفور وتفسد الخبز."], "q": ["Quelle moisissure pousse sur les confitures malgré le sucre ?", "أيّ عفن ينمو على المربى رغم السكر؟"], "o": [["Penicillium roqueforti", "Aspergillus glaucum", "Mucor"], ["Penicillium roqueforti", "Aspergillus glaucum", "Mucor"]], "a": 1, "w": ["Aspergillus glaucum tolère les fortes concentrations de sucre.", "Aspergillus glaucum يتحمل التركيزات العالية من السكر."], "g": []}, {"img": "s03_29", "t": ["Les levures", "الخمائر"], "st": [["Les levures sont des champignons généralement unicellulaires, sphériques ou ovoïdes, de 6 à 10 µm (jusqu'à 50 µm).", "Elles vivent avec ou sans oxygène et provoquent la fermentation des matières organiques : c'est cette souplesse qui en fait l'outil universel de la fermentation.", "Saccharomyces : la levure de bière et de pain (vin, bière, cidre, pain).", "Candida : pathogène, responsable des mycoses de la peau (candidoses)."], ["الخمائر فطريات أحادية الخلية غالبًا، كروية أو بيضوية، من 6 إلى 10 ميكرومتر (حتى 50).", "تعيش مع الأكسجين أو بدونه وتُحدث تخمّر المواد العضوية: هذه المرونة تجعلها الأداة العالمية للتخمّر.", "Saccharomyces: خميرة الجعة والخبز (النبيذ، الجعة، عصير التفاح المخمّر، الخبز).", "Candida: ممرضة، مسؤولة عن الفطريات الجلدية (candidoses)."]], "k": ["Avec ou sans oxygène : la levure fermente partout.", "مع الأكسجين أو بدونه: الخميرة تخمّر في كل مكان."], "q": ["Quelle levure fait lever le pain ?", "أيّ خميرة تجعل الخبز ينتفخ؟"], "o": [["Candida", "Saccharomyces", "Penicillium"], ["Candida", "Saccharomyces", "Penicillium"]], "a": 1, "w": ["Saccharomyces produit le CO₂ qui fait lever la pâte.", "Saccharomyces تنتج ثاني أكسيد الكربون الذي يجعل العجين ينتفخ."], "g": []}, {"img": "s03_31", "t": ["Ce que les levures fabriquent", "ما تصنعه الخمائر"], "st": [["Panification : la levure produit le gaz carbonique qui fait lever la pâte, et les arômes du pain.", "Protéines : leur culture de masse produit des protéines complètes et équilibrées en acides aminés.", "Mais elles altèrent aussi les aliments : jus troubles, boissons qui refermentent dans la bouteille, confitures qui moussent."], ["الخبز: تنتج الخميرة غاز ثاني أكسيد الكربون الذي يجعل العجين ينتفخ، وتنتج روائح الخبز.", "البروتينات: زراعتها بكميات كبيرة تنتج بروتينات كاملة ومتوازنة في الأحماض الأمينية.", "لكنها تفسد الأغذية أيضًا: عصائر عكرة، مشروبات تعيد التخمّر في القنينة، مربى يُزبد."]], "k": ["Vin, bière, cidre, pain : quatre industries reposent sur un champignon unicellulaire.", "النبيذ، الجعة، عصير التفاح، الخبز: أربع صناعات تعتمد على فطر أحادي الخلية."], "q": ["Un jus de fruit qui mousse dans sa bouteille est souvent dû à :", "عصير فاكهة يُزبد داخل قنينته يعود غالبًا إلى:"], "o": [["des levures", "des virus", "des algues"], ["خمائر", "فيروسات", "طحالب"]], "a": 0, "w": ["Les levures fermentent le sucre et dégagent du gaz : c'est une altération.", "الخمائر تخمّر السكر وتطلق الغاز: إنه إفساد."], "g": []}, {"img": "s03_33", "t": ["Quatre façons de se reproduire sans sexe", "أربع طرق للتكاثر اللاجنسي"], "st": [["Bourgeonnement : division inégale, la cellule fille est plus petite que la mère. C'est le mode de la levure.", "Fission binaire : division égale en deux cellules identiques.", "Fragmentation : un morceau d'hyphe se détache et forme un nouveau mycélium.", "Sporulation : des spores asexuées (mitospores) se forment, se dispersent dans l'air et germent ailleurs — d'où la contamination de tout un atelier."], ["التبرعم (bourgeonnement): انقسام غير متساوٍ، الخلية البنت أصغر من الأم. إنها طريقة الخميرة.", "الانشطار الثنائي (fission binaire): انقسام متساوٍ إلى خليتين متطابقتين.", "التجزؤ (fragmentation): قطعة من الخيط الفطري تنفصل وتكوّن غزلًا جديدًا.", "التبوّغ (sporulation): تتكوّن أبواغ لاجنسية تنتشر في الهواء وتنبت في مكان آخر — ومن هنا تلوّث ورشة كاملة."]], "k": ["Bourgeonnement = inégal ; fission binaire = égal.", "التبرعم = غير متساوٍ؛ الانشطار الثنائي = متساوٍ."], "q": ["Comment une moisissure contamine-t-elle tout un atelier ?", "كيف يلوّث العفن ورشة كاملة؟"], "o": [["Par bourgeonnement", "Par ses spores qui voyagent dans l'air", "Par fission binaire"], ["بالتبرعم", "بأبواغه التي تنتقل في الهواء", "بالانشطار الثنائي"]], "a": 1, "w": ["Les spores sont légères et transportées par l'air.", "الأبواغ خفيفة وينقلها الهواء."], "g": [14, 27, 34, 59]}, {"img": "s03_35", "t": ["Bourgeonnement, fission, fragmentation", "التبرعم، الانشطار، التجزؤ"], "st": [["Au bourgeonnement, une petite excroissance pousse sur la cellule mère, grossit puis se détache ; la mère garde une cicatrice.", "À la fission binaire, la cellule s'allonge puis se coupe en deux cellules identiques — c'est aussi le mode des bactéries (séance 9).", "À la sporulation, le sporange se gonfle de spores puis éclate ; les spores qui tombent sur un milieu favorable forment de nouveaux mycéliums."], ["في التبرعم، ينمو بروز صغير على الخلية الأم، يكبر ثم ينفصل؛ وتحتفظ الأم بندبة.", "في الانشطار الثنائي، تستطيل الخلية ثم تنقسم إلى خليتين متطابقتين — وهي أيضًا طريقة البكتيريا (الحصة 9).", "في التبوّغ، ينتفخ الكيس البوغي (sporange) بالأبواغ ثم ينفجر؛ والأبواغ التي تسقط على وسط ملائم تكوّن غزلًا جديدًا."]], "k": ["La levure bourgeonne ; la bactérie se divise en deux.", "الخميرة تتبرعم؛ البكتيريا تنقسم إلى اثنين."], "q": ["La fission binaire donne :", "الانشطار الثنائي يعطي:"], "o": [["une cellule fille plus petite", "deux cellules identiques", "des spores"], ["خلية بنتًا أصغر", "خليتين متطابقتين", "أبواغًا"]], "a": 1, "w": ["Division égale : deux cellules identiques.", "انقسام متساوٍ: خليتان متطابقتان."], "g": [14, 27, 34, 59]}, {"img": "s03_37", "t": ["La reproduction sexuée", "التكاثر الجنسي"], "st": [["Il faut deux noyaux haploïdes (n chromosomes) qui fusionnent pour donner un noyau diploïde (2n).", "Ce noyau diploïde subit ensuite une méiose, puis des spores se forment : « fusion, puis méiose, puis spores ».", "Beaucoup de champignons alternent : reproduction asexuée quand tout va bien, sexuée en conditions défavorables (dessiccation, UV, chaud ou froid).", "Mitose : chaque chromosome se dédouble. Méiose : division en deux étapes avec réduction du nombre de chromosomes."], ["يلزم نواتان أحاديتا الصيغة (n) تندمجان لتعطيا نواة ثنائية الصيغة (2n).", "هذه النواة تخضع بعد ذلك لانقسام اختزالي (méiose)، ثم تتكوّن الأبواغ: «اندماج، ثم انقسام اختزالي، ثم أبواغ».", "كثير من الفطريات تتناوب: تكاثر لاجنسي عندما تكون الظروف جيدة، وجنسي في الظروف غير الملائمة (الجفاف، الأشعة فوق البنفسجية، الحر أو البرد).", "الانقسام العادي (mitose): كل صبغي يتضاعف. الانقسام الاختزالي (méiose): مرحلتان مع تقليص عدد الصبغيات."]], "k": ["Fusion (n + n → 2n), puis méiose, puis spores.", "اندماج (n + n ← 2n)، ثم انقسام اختزالي، ثم أبواغ."], "q": ["La méiose est une division :", "الانقسام الاختزالي هو انقسام:"], "o": [["où chaque chromosome se dédouble", "avec réduction du nombre de chromosomes", "réservée aux bactéries"], ["يتضاعف فيه كل صبغي", "مع تقليص عدد الصبغيات", "خاص بالبكتيريا"]], "a": 1, "w": ["La méiose ramène 2n à n, en deux étapes.", "الانقسام الاختزالي يُرجع 2n إلى n في مرحلتين."], "g": []}], "since": "1.0"}, {"n": 4, "t": ["La cellule bactérienne : structure, Gram et sporulation", "الخلية البكتيرية: البنية، صبغة غرام والتبوّغ"], "c": [{"img": "s04_09", "t": ["Les formes des bactéries", "أشكال البكتيريا"], "st": [["Une bactérie est un procaryote : une seule cellule, sans noyau, un seul chromosome, de 0,5 à 5 µm.", "Les coques sont sphériques : en chaînettes (streptocoques) ou en amas (staphylocoques, comme Staphylococcus aureus).", "Les bacilles sont en bâtonnets : Salmonella, colibacille, Clostridium, Listeria, Bacillus.", "Les spiralés sont en spirale ou en virgule : Vibrio cholerae, Helicobacter pylori. La forme et le groupement sont la première chose qu'on note au microscope."], ["البكتيريا بدائية النواة: خلية واحدة، بدون نواة، صبغي واحد، من 0,5 إلى 5 ميكرومتر.", "المكوّرات (coques) كروية: في سلاسل (streptocoques) أو عناقيد (staphylocoques مثل Staphylococcus aureus).", "العصيات (bacilles) على شكل عُصيّ: Salmonella، العصية القولونية، Clostridium، Listeria، Bacillus.", "الحلزونية (spiralés) على شكل لولب أو فاصلة: Vibrio cholerae، Helicobacter pylori. الشكل والتجمّع أول ما نلاحظه بالمجهر."]], "k": ["Trois formes : coques, bacilles, spiralés.", "ثلاثة أشكال: مكوّرات، عصيات، حلزونية."], "q": ["Staphylococcus aureus est :", "Staphylococcus aureus هي:"], "o": [["un bacille", "une coque en amas", "un spiralé"], ["عصية", "مكوّرة في عناقيد", "حلزونية"]], "a": 1, "w": ["Les staphylocoques sont des coques groupées en amas.", "المكوّرات العنقودية مكوّرات مجمّعة في عناقيد."], "g": [55]}, {"img": "s04_11", "t": ["Éléments constants et facultatifs", "العناصر الثابتة والاختيارية"], "st": [["Constants — chez toutes les bactéries : paroi, membrane cytoplasmique, cytoplasme (avec ribosomes et vacuoles) et chromosome.", "Facultatifs — chez certaines seulement : capsule, flagelle, pili et spore.", "Pourquoi c'est important : le pouvoir pathogène d'une souche repose en grande partie sur ses éléments facultatifs.", "Ce schéma est à légender au contrôle n° 1, en séparant bien les deux familles."], ["الثابتة — عند كل البكتيريا: الجدار، الغشاء السيتوبلازمي، السيتوبلازم (مع الريبوزومات والفجوات) والصبغي.", "الاختيارية — عند بعضها فقط: المحفظة (capsule)، السوط (flagelle)، الأشعار (pili) والبوغ (spore).", "لماذا هذا مهم: القدرة الممرضة لسلالة ما تعتمد كثيرًا على عناصرها الاختيارية.", "هذا الرسم يُطلب تسميته في المراقبة رقم 1، مع الفصل بين العائلتين."]], "k": ["Constants : paroi, membrane, cytoplasme, chromosome. Facultatifs : capsule, flagelle, pili, spore.", "الثابتة: الجدار، الغشاء، السيتوبلازم، الصبغي. الاختيارية: المحفظة، السوط، الأشعار، البوغ."], "q": ["Lequel est un élément FACULTATIF ?", "أيّها عنصر اختياري؟"], "o": [["La paroi", "Le chromosome", "La capsule"], ["الجدار", "الصبغي", "المحفظة"]], "a": 2, "w": ["La capsule n'existe que chez certaines bactéries.", "المحفظة لا توجد إلا عند بعض البكتيريا."], "g": [16, 50, 53, 59]}, {"img": "s04_13", "t": ["La paroi et le peptidoglycane", "الجدار والببتيدوغليكان"], "st": [["La paroi est rigide : elle donne à la bactérie sa forme et la protège dans les milieux moins concentrés que son cytoplasme.", "Elle porte les antigènes (substances qui déclenchent une réponse immunitaire) et les sites de fixation des bactériophages.", "Sa partie commune à toutes les bactéries est le peptidoglycane : son épaisseur sépare les bactéries en Gram positif et Gram négatif.", "Gram + : paroi épaisse, sans membrane externe. Gram − : paroi fine, avec une membrane externe riche en lipides."], ["الجدار صلب: يعطي البكتيريا شكلها ويحميها في الأوساط الأقل تركيزًا من سيتوبلازمها.", "يحمل المستضدات (antigènes) — مواد تثير استجابة مناعية — ومواقع تثبيت العاثيات.", "الجزء المشترك عند كل البكتيريا هو الببتيدوغليكان (peptidoglycane): سمكه يفصل البكتيريا إلى موجبة غرام وسالبة غرام.", "موجبة غرام (Gram +): جدار سميك دون غشاء خارجي. سالبة غرام (Gram −): جدار رقيق مع غشاء خارجي غني بالدهون."]], "k": ["Le Gram, c'est la paroi.", "صبغة غرام تعكس الجدار."], "q": ["Une bactérie Gram − possède :", "البكتيريا سالبة غرام لها:"], "o": [["une paroi épaisse sans membrane externe", "une paroi fine avec une membrane externe", "aucune paroi"], ["جدار سميك دون غشاء خارجي", "جدار رقيق مع غشاء خارجي", "لا جدار لها"]], "a": 1, "w": ["Fine couche de peptidoglycane + membrane externe lipidique.", "طبقة رقيقة من الببتيدوغليكان + غشاء خارجي دهني."], "g": [5, 12, 30, 47]}, {"img": "s04_17", "t": ["Le principe de la coloration de Gram", "مبدأ صبغة غرام"], "st": [["1er temps : le frottis séché et fixé est recouvert de violet de gentiane, puis de lugol (le mordant). Toutes les bactéries deviennent violettes.", "2e temps : on applique l'alcool. Il décolore les bactéries Gram −, plus perméables à cause des lipides de leur membrane externe. Les Gram + restent violettes.", "3e temps : après rinçage, on recouvre de safranine ou de fuchsine, qui recolore en rose les bactéries décolorées.", "L'étape critique est l'alcool : trop long, toutes les bactéries deviennent roses."], ["المرحلة 1: تُغطّى اللطاخة المجففة والمثبّتة بالبنفسجي الجنسياني (violet de gentiane)، ثم باللوغول (lugol) المثبّت. كل البكتيريا تصبح بنفسجية.", "المرحلة 2: يُطبّق الكحول. يزيل لون البكتيريا سالبة غرام لأنها أكثر نفاذية بسبب دهون غشائها الخارجي. تبقى موجبة غرام بنفسجية.", "المرحلة 3: بعد الشطف، تُغطّى بالسافرانين أو الفوكسين (fuchsine) الذي يعيد تلوين البكتيريا المنزوعة اللون بالوردي.", "المرحلة الحرجة هي الكحول: إذا طالت، تصبح كل البكتيريا وردية."]], "k": ["Gram + = violet ; Gram − = rose.", "موجبة غرام = بنفسجي؛ سالبة غرام = وردي."], "q": ["Quelle étape décolore les bactéries Gram − ?", "أيّ مرحلة تزيل لون البكتيريا سالبة غرام؟"], "o": [["Le lugol", "L'alcool", "La fuchsine"], ["اللوغول", "الكحول", "الفوكسين"]], "a": 1, "w": ["L'alcool traverse la paroi fine et riche en lipides des Gram −.", "الكحول يعبر الجدار الرقيق الغني بالدهون عند سالبة غرام."], "g": [30]}, {"img": "s04_19", "t": ["La couleur à chaque étape", "اللون في كل مرحلة"], "st": [["Violet de gentiane : Gram + violette, Gram − violette.", "Lugol : les deux restent violettes.", "Alcool à 90° puis rinçage : Gram + reste violette, Gram − devient incolore.", "Safranine ou fuchsine : Gram + reste violette, Gram − devient rose."], ["البنفسجي الجنسياني: موجبة غرام بنفسجية، سالبة غرام بنفسجية.", "اللوغول: تبقى الاثنتان بنفسجيتين.", "الكحول 90° ثم الشطف: موجبة غرام تبقى بنفسجية، سالبة غرام تصبح عديمة اللون.", "السافرانين أو الفوكسين: موجبة غرام تبقى بنفسجية، سالبة غرام تصبح وردية."]], "k": ["C'est seulement à l'alcool que les deux groupes se séparent.", "لا يفترق النوعان إلا عند مرحلة الكحول."], "q": ["Après l'alcool, une bactérie Gram − est :", "بعد الكحول، البكتيريا سالبة غرام تكون:"], "o": [["violette", "incolore", "rose"], ["بنفسجية", "عديمة اللون", "وردية"]], "a": 1, "w": ["Elle ne devient rose qu'après la fuchsine.", "لا تصبح وردية إلا بعد الفوكسين."], "g": [30]}, {"img": "s04_21", "t": ["La membrane cytoplasmique", "الغشاء السيتوبلازمي"], "st": [["Elle contrôle les échanges entre le cytoplasme et le milieu extérieur.", "Elle retient les constituants du cytoplasme et trie les nutriments qui entrent (pénétration sélective).", "Elle porte les enzymes de la respiration et produit l'ATP.", "Différence majeure avec l'eucaryote : la bactérie n'a pas de mitochondrie, c'est sa membrane qui produit l'énergie."], ["يتحكم في التبادلات بين السيتوبلازم والوسط الخارجي.", "يحتفظ بمكونات السيتوبلازم ويفرز المغذيات التي تدخل (نفاذ انتقائي).", "يحمل إنزيمات التنفس وينتج ATP.", "الفرق الكبير مع حقيقي النواة: البكتيريا ليس لها ميتوكوندري، فغشاؤها هو الذي ينتج الطاقة."]], "k": ["Chez la bactérie, la membrane fait le travail de la mitochondrie.", "عند البكتيريا، الغشاء يقوم بعمل الميتوكوندري."], "q": ["Où la bactérie produit-elle son ATP ?", "أين تنتج البكتيريا ATP؟"], "o": [["Dans la mitochondrie", "Au niveau de la membrane cytoplasmique", "Dans la capsule"], ["في الميتوكوندري", "على مستوى الغشاء السيتوبلازمي", "في المحفظة"]], "a": 1, "w": ["Pas de mitochondrie chez les procaryotes.", "لا توجد ميتوكوندري عند بدائيات النواة."], "g": [24]}, {"img": "s04_23", "t": ["Le cytoplasme et le chromosome", "السيتوبلازم والصبغي"], "st": [["Le cytoplasme est le seul compartiment de la cellule : un gel aqueux (le cytosol) où tout flotte librement — réserves, ribosomes, matériel génétique.", "Le chromosome est un seul filament d'ADN, libre dans le cytoplasme : il porte le programme de fabrication des protéines et tous les gènes de la bactérie.", "Comme l'ADN n'est pas enfermé, la bactérie se multiplie très vite : elle peut se diviser toutes les 20 minutes."], ["السيتوبلازم هو الحيّز الوحيد في الخلية: هلام مائي (cytosol) يسبح فيه كل شيء بحرية — المدخرات، الريبوزومات، المادة الوراثية.", "الصبغي خيط واحد من ADN، حرّ في السيتوبلازم: يحمل برنامج صنع البروتينات وكل جينات البكتيريا.", "لأن ADN غير محصور، تتكاثر البكتيريا بسرعة كبيرة: يمكن أن تنقسم كل 20 دقيقة."]], "k": ["Un seul compartiment, un seul filament d'ADN libre : d'où la vitesse de division.", "حيّز واحد، خيط ADN واحد حرّ: ومن هنا سرعة الانقسام."], "q": ["Dans de bonnes conditions, une bactérie peut se diviser toutes les :", "في الظروف الجيدة، يمكن للبكتيريا أن تنقسم كل:"], "o": [["20 minutes", "24 heures", "7 jours"], ["20 دقيقة", "24 ساعة", "7 أيام"]], "a": 0, "w": ["D'où l'urgence de refroidir un aliment.", "ومن هنا ضرورة تبريد الغذاء بسرعة."], "g": []}, {"img": "s04_27", "t": ["La capsule et le flagelle", "المحفظة والسوط"], "st": [["La capsule est une couche visqueuse de polysaccharides et de protéines, accumulée autour de la paroi.", "Elle fixe la bactérie aux surfaces et la protège contre les composés toxiques et les détergents : c'est un élément du pouvoir pathogène, et la raison pour laquelle certains biofilms résistent au nettoyage.", "Le flagelle est un filament protéique (flagelline) de 6 à 15 µm : il assure la mobilité et sert à différencier les espèces."], ["المحفظة طبقة لزجة من السكريات المتعددة والبروتينات تتجمع حول الجدار.", "تثبّت البكتيريا على الأسطح وتحميها من المواد السامة والمنظفات (détergents): إنها من عناصر القدرة الممرضة، وسبب مقاومة بعض الأغشية الحيوية (biofilms) للتنظيف.", "السوط خيط بروتيني (flagelline) من 6 إلى 15 ميكرومتر: يضمن الحركة ويساعد على تمييز الأنواع."]], "k": ["Capsule = protection et adhésion ; flagelle = mobilité.", "المحفظة = الحماية والالتصاق؛ السوط = الحركة."], "q": ["Pourquoi certains biofilms résistent-ils au nettoyage ?", "لماذا تقاوم بعض الأغشية الحيوية التنظيف؟"], "o": [["Grâce au flagelle", "Grâce à la capsule qui protège des détergents", "Grâce au chromosome"], ["بفضل السوط", "بفضل المحفظة التي تحمي من المنظفات", "بفضل الصبغي"]], "a": 1, "w": ["La capsule protège la bactérie contre les détergents.", "المحفظة تحمي البكتيريا من المنظفات."], "g": [16, 23, 53]}, {"img": "s04_29", "t": ["Les pili", "الأشعار"], "st": [["Les pili sont des fibres fines et rigides, surtout chez les bactéries Gram −.", "Les pili communs (fimbriae) : très courts (moins de 1 µm), nombreux (100 à 200), ils servent à l'adhésion aux surfaces et aux cellules.", "Les pili sexuels : plus longs (20 µm), 1 à 4 par bactérie, ils permettent l'échange de gènes : la conjugaison.", "Adhérer et échanger des gènes : deux capacités qui expliquent la persistance des germes en atelier."], ["الأشعار (pili) ألياف رفيعة وصلبة، خاصة عند البكتيريا سالبة غرام.", "الأشعار العادية (fimbriae): قصيرة جدًا (أقل من 1 ميكرومتر)، كثيرة (100 إلى 200)، تُستعمل للالتصاق بالأسطح والخلايا.", "الأشعار الجنسية: أطول (20 ميكرومتر)، من 1 إلى 4 لكل بكتيريا، تسمح بتبادل الجينات: الاقتران (conjugaison).", "الالتصاق وتبادل الجينات: قدرتان تفسّران بقاء الجراثيم في الورشة."]], "k": ["Pili communs = adhésion ; pili sexuels = conjugaison.", "الأشعار العادية = الالتصاق؛ الأشعار الجنسية = الاقتران."], "q": ["À quoi servent les pili sexuels ?", "فيمَ تُستعمل الأشعار الجنسية؟"], "o": [["À la mobilité", "À la conjugaison", "À résister à la chaleur"], ["في الحركة", "في الاقتران", "في مقاومة الحرارة"]], "a": 1, "w": ["Ils permettent l'échange de matériel génétique entre bactéries.", "تسمح بتبادل المادة الوراثية بين البكتيريا."], "g": [30, 50]}, {"img": "s04_31", "t": ["La spore", "البوغ"], "st": [["Quand les conditions deviennent défavorables (vieillissement, manque de nutriments), certaines bactéries forment une spore.", "La spore a une paroi épaisse et renferme le matériel génétique et un peu de cytoplasme.", "Elle résiste au temps (des dizaines d'années) et à la chaleur : toutes survivent à un chauffage prolongé à 100 °C.", "Quand les conditions redeviennent favorables, elle se réhydrate et redonne une bactérie active : c'est la germination."], ["عندما تصبح الظروف غير ملائمة (الشيخوخة، نقص المغذيات)، تكوّن بعض البكتيريا بوغًا (spore).", "للبوغ جدار سميك ويحتوي على المادة الوراثية وقليل من السيتوبلازم.", "يقاوم الزمن (عشرات السنين) والحرارة: كلها تنجو من تسخين مطوّل في 100 درجة.", "عندما تعود الظروف ملائمة، يتشرّب الماء ويعطي بكتيريا نشطة من جديد: إنه الإنبات (germination)."]], "k": ["« Cent degrés ne suffisent pas » : c'est la spore qui impose l'autoclave.", "«مئة درجة لا تكفي»: البوغ هو الذي يفرض استعمال الأوتوكلاف."], "q": ["Une spore bactérienne chauffée longtemps à 100 °C :", "بوغ بكتيري يُسخَّن طويلًا في 100 درجة:"], "o": [["est détruite", "survit", "devient une levure"], ["يُدمَّر", "ينجو", "يصبح خميرة"]], "a": 1, "w": ["Il faut dépasser 100 °C (autoclave, 120 °C) pour détruire les spores.", "يجب تجاوز 100 درجة (الأوتوكلاف، 120 درجة) لتدمير الأبواغ."], "g": [59]}, {"img": "s04_35", "t": ["Comment une bactérie devient une spore", "كيف تتحول البكتيريا إلى بوغ"], "st": [["Étapes 1 et 2 : l'appareil nucléaire se réorganise en filament, puis se condense à une extrémité où apparaît une cloison (septum).", "Étapes 3 et 4 : la préspore se forme, entourée d'une membrane, puis ses enveloppes extérieures apparaissent.", "Étape 5 : la spore mûrit, puis elle est libérée par la lyse (destruction) du reste de la cellule.", "La germination fait le chemin inverse : les enveloppes éclatent et une jeune cellule est libérée."], ["المرحلتان 1 و2: يعيد الجهاز النووي تنظيم نفسه على شكل خيط، ثم يتكثف في طرف تظهر فيه حاجز (septum).", "المرحلتان 3 و4: يتكوّن البوغ الأولي (préspore) محاطًا بغشاء، ثم تظهر أغلفته الخارجية.", "المرحلة 5: ينضج البوغ ثم يتحرر بتحلّل (lyse) باقي الخلية.", "الإنبات يسلك الطريق المعاكس: تنفجر الأغلفة وتتحرر خلية فتية."]], "k": ["Sporulation = 5 étapes ; germination = le retour à la vie active.", "التبوّغ = 5 مراحل؛ الإنبات = العودة إلى الحياة النشطة."], "q": ["Comment la spore est-elle libérée ?", "كيف يتحرر البوغ؟"], "o": [["Par bourgeonnement", "Par lyse du reste de la cellule", "Par conjugaison"], ["بالتبرعم", "بتحلّل باقي الخلية", "بالاقتران"]], "a": 1, "w": ["La cellule mère se détruit et libère la spore mûre.", "الخلية الأم تتحلّل وتحرّر البوغ الناضج."], "g": [59]}], "since": "1.0"}, {"n": 5, "t": ["Virus, bactériophages et prions", "الفيروسات، العاثيات والبريونات"], "c": [{"img": "s05_07", "t": ["Qu'est-ce qu'un virus ?", "ما هو الفيروس؟"], "st": [["Un virus est acellulaire : il n'a ni membrane plasmique ni ribosomes.", "Il est minuscule : 50 nm au maximum (1 nm = 10⁻⁹ m), mille fois plus petit qu'une bactérie. On ne le voit qu'au microscope électronique.", "C'est un agent infectieux qui a besoin d'une cellule hôte : il utilise son métabolisme et ses constituants pour se reproduire."], ["الفيروس عديم الخلية (acellulaire): ليس له غشاء بلازمي ولا ريبوزومات.", "صغير جدًا: 50 نانومتر على الأكثر (1 نانومتر = 10⁻⁹ م)، أصغر من البكتيريا بألف مرة. لا يُرى إلا بالمجهر الإلكتروني.", "إنه عامل معدٍ يحتاج إلى خلية مضيفة: يستعمل أيضها ومكوناتها ليتكاثر."]], "k": ["Acellulaire, minuscule, parasite.", "عديم الخلية، صغير جدًا، طفيلي."], "q": ["Avec quel appareil observe-t-on un virus ?", "بأيّ جهاز نلاحظ الفيروس؟"], "o": [["La loupe", "Le microscope optique", "Le microscope électronique"], ["العدسة المكبرة", "المجهر الضوئي", "المجهر الإلكتروني"]], "a": 2, "w": ["Trop petit (≤ 50 nm) pour le microscope optique.", "صغير جدًا (≤ 50 نانومتر) بالنسبة للمجهر الضوئي."], "g": [45, 65]}, {"img": "s05_09", "t": ["Quatre caractéristiques des virus", "أربع خصائص للفيروسات"], "st": [["1. Une taille infime : 50 nm au maximum.", "2. Incapables de se reproduire seuls : ils parasitent une cellule hôte.", "3. Un seul type d'acide nucléique : soit de l'ADN, soit de l'ARN — jamais les deux à la fois.", "4. Aucune structure cellulaire : pas de membrane plasmique, pas de ribosomes."], ["1. حجم صغير جدًا: 50 نانومتر على الأكثر.", "2. عاجزة عن التكاثر وحدها: تتطفل على خلية مضيفة.", "3. نوع واحد من الحمض النووي: إما ADN وإما ARN — ولا تجمع بينهما أبدًا.", "4. لا بنية خلوية: لا غشاء بلازمي، لا ريبوزومات."]], "k": ["« Jamais les deux à la fois » : cette phrase tombe très souvent en évaluation.", "«لا تجمع بينهما أبدًا»: هذه الجملة تتكرر كثيرًا في الامتحانات."], "q": ["L'acide nucléique d'un virus est :", "الحمض النووي للفيروس هو:"], "o": [["de l'ADN et de l'ARN", "de l'ADN ou de l'ARN, jamais les deux", "absent"], ["ADN و ARN معًا", "ADN أو ARN، لا يجمع بينهما أبدًا", "غائب"]], "a": 1, "w": ["Un seul type d'acide nucléique par virus.", "نوع واحد من الحمض النووي في كل فيروس."], "g": [45, 65]}, {"img": "s05_11", "t": ["Capside et nucléocapside", "الغلاف البروتيني والقفيصة النووية"], "st": [["Au centre : l'acide nucléique, soit ADN soit ARN.", "Autour : une coque de protéines, la capside, qui le protège.", "L'ensemble capside + acide nucléique s'appelle la nucléocapside.", "Trois mots à ne pas confondre : acide nucléique, capside, nucléocapside."], ["في الوسط: الحمض النووي، إما ADN وإما ARN.", "حوله: غلاف من البروتينات هو القفيصة (capside) الذي يحميه.", "مجموع القفيصة + الحمض النووي يسمى القفيصة النووية (nucléocapside).", "ثلاث كلمات لا يجب الخلط بينها: الحمض النووي، القفيصة، القفيصة النووية."]], "k": ["Nucléocapside = capside + acide nucléique.", "القفيصة النووية = القفيصة + الحمض النووي."], "q": ["La capside est :", "القفيصة هي:"], "o": [["l'acide nucléique du virus", "la coque protéique qui entoure l'acide nucléique", "l'enveloppe lipidique"], ["الحمض النووي للفيروس", "الغلاف البروتيني الذي يحيط بالحمض النووي", "الغلاف الدهني"]], "a": 1, "w": ["La capside est faite de protéines.", "القفيصة مكوّنة من بروتينات."], "g": [15, 43]}, {"img": "s05_13", "t": ["Virus nu et virus enveloppé", "فيروس عارٍ وفيروس مغلّف"], "st": [["Virus nu : la nucléocapside seule constitue le virus complet.", "Virus enveloppé : la nucléocapside est recouverte d'une enveloppe externe.", "Conséquence pratique : le virus enveloppé est en général plus fragile hors de l'hôte, car son enveloppe est sensible aux solvants et aux détergents.", "Cela change l'efficacité des désinfectants (séance 16)."], ["الفيروس العاري (nu): القفيصة النووية وحدها تشكّل الفيروس الكامل.", "الفيروس المغلّف (enveloppé): القفيصة النووية مغطاة بغلاف خارجي.", "النتيجة العملية: الفيروس المغلّف غالبًا أكثر هشاشة خارج المضيف، لأن غلافه حساس للمذيبات والمنظفات.", "هذا يغيّر فعالية المطهّرات (الحصة 16)."]], "k": ["Une couche de plus… et plus de fragilité face aux détergents.", "طبقة إضافية… وهشاشة أكبر أمام المنظفات."], "q": ["Quel virus est le plus sensible aux détergents ?", "أيّ فيروس أكثر حساسية للمنظفات؟"], "o": [["Le virus nu", "Le virus enveloppé", "Aucun des deux"], ["الفيروس العاري", "الفيروس المغلّف", "لا أحد منهما"]], "a": 1, "w": ["Son enveloppe lipidique est attaquée par les détergents et les solvants.", "غلافه الدهني تهاجمه المنظفات والمذيبات."], "g": [22, 23, 43, 65]}, {"img": "s05_15", "t": ["Comment un virus se multiplie", "كيف يتكاثر الفيروس"], "st": [["1. Adsorption : le virus se fixe sur une cellule (animale, végétale ou bactérienne). 2. Pénétration : il y entre.", "3. Réplication : il détourne le mécanisme de division de la cellule et toute son énergie pour copier son acide nucléique.", "4. Assemblage : les nouveaux virus sont construits. 5. Libération : ils sortent et la cellule est détruite.", "Sans cellule hôte, le virus meurt : il ne reste pas vivant sur une surface, contrairement aux bactéries."], ["1. الامتزاز (adsorption): يلتصق الفيروس بخلية (حيوانية، نباتية أو بكتيرية). 2. الاختراق (pénétration): يدخلها.", "3. التضاعف (réplication): يحوّل آلية انقسام الخلية وكل طاقتها لنسخ حمضه النووي.", "4. التجميع (assemblage): تُبنى فيروسات جديدة. 5. التحرر (libération): تخرج وتُدمَّر الخلية.", "بدون خلية مضيفة يموت الفيروس: لا يبقى حيًا على سطح، على عكس البكتيريا."]], "k": ["Adsorption, pénétration, réplication, assemblage, libération.", "الامتزاز، الاختراق، التضاعف، التجميع، التحرر."], "q": ["Que devient la cellule hôte à la fin du cycle ?", "ماذا يحدث للخلية المضيفة في نهاية الدورة؟"], "o": [["Elle guérit", "Elle est détruite", "Elle devient un virus"], ["تُشفى", "تُدمَّر", "تصبح فيروسًا"]], "a": 1, "w": ["Les nouveaux virus sortent en détruisant la cellule.", "الفيروسات الجديدة تخرج بتدمير الخلية."], "g": [65]}, {"img": "s05_17", "t": ["Les bactériophages", "العاثيات"], "st": [["Un bactériophage est un virus dont l'hôte exclusif est une bactérie ; il ne s'attaque jamais à une cellule humaine.", "La tête contient l'ADN protégé par la capside.", "Le col et la queue forment une gaine contractile qui injecte l'ADN dans la bactérie.", "Les fibres caudales se fixent sur les récepteurs de la bactérie : ces récepteurs décident quel phage peut l'infecter."], ["العاثية (bactériophage) فيروس مضيفه الوحيد بكتيريا؛ لا تهاجم أبدًا خلية بشرية.", "الرأس يحتوي على ADN المحمي بالقفيصة.", "العنق والذيل يكوّنان غمدًا قابلًا للانقباض يحقن ADN داخل البكتيريا.", "الألياف الذيلية تلتصق بمستقبلات البكتيريا: هذه المستقبلات تحدد أيّ عاثية يمكنها إصابتها."]], "k": ["Hôte exclusif : une bactérie.", "المضيف الوحيد: بكتيريا."], "q": ["Quelle partie du phage se fixe sur la bactérie ?", "أيّ جزء من العاثية يلتصق بالبكتيريا؟"], "o": [["La tête", "Les fibres caudales", "La capside"], ["الرأس", "الألياف الذيلية", "القفيصة"]], "a": 1, "w": ["Les fibres caudales reconnaissent les récepteurs de la paroi bactérienne.", "الألياف الذيلية تتعرف على مستقبلات جدار البكتيريا."], "g": [12, 15, 65]}, {"img": "s05_19", "t": ["Le bactériophage en laiterie", "العاثية في معامل الحليب"], "st": [["L'attaque : le phage se fixe sur les ferments lactiques et leur injecte son ADN.", "L'effet visible : l'acidification s'arrête ou ralentit fortement, le lait ne caille pas ou mal.", "La conséquence : toute la cuve est perdue, et l'atelier reste contaminé si le nettoyage n'élimine pas les phages.", "La prévention : rotation des souches de levain, nettoyage et désinfection rigoureux, maîtrise des aérosols."], ["الهجوم: تلتصق العاثية بالخمائر اللبنية (ferments lactiques) وتحقنها بـ ADN.", "الأثر الظاهر: يتوقف التحمّض أو يتباطأ كثيرًا، فلا يتخثر الحليب أو يتخثر بشكل سيئ.", "النتيجة: يضيع الحوض كله، وتبقى الورشة ملوّثة إن لم يقضِ التنظيف على العاثيات.", "الوقاية: تناوب سلالات الخميرة، تنظيف وتطهير صارمان، التحكم في الرذاذ (aérosols)."]], "k": ["Le phage coûte cher : c'est une cuve entière qui se perd.", "العاثية مكلفة: حوض كامل يضيع."], "q": ["Quel signe montre une attaque de phage en fromagerie ?", "ما العلامة التي تدل على هجوم عاثية في معمل الجبن؟"], "o": [["Le lait s'acidifie trop vite", "L'acidification s'arrête, le lait ne caille pas", "Le lait devient bleu"], ["الحليب يتحمّض بسرعة كبيرة", "يتوقف التحمّض ولا يتخثر الحليب", "يصبح الحليب أزرق"]], "a": 1, "w": ["Les ferments détruits ne produisent plus d'acide lactique.", "الخمائر المدمّرة لم تعد تنتج حمض اللبن."], "g": [12, 22]}, {"img": "s05_21", "t": ["Les prions", "البريونات"], "st": [["Le prion est une protéine normalement présente dans l'organisme, qui devient pathogène par un mauvais repliement. On ignore encore ce qui cause ce repliement.", "Il n'a ni ADN ni ARN : c'est le seul agent infectieux connu sans matériel génétique.", "Il détruit sélectivement les cellules nerveuses des mammifères.", "Il cause les encéphalopathies spongiformes transmissibles, héréditaires ou infectieuses, toujours mortelles."], ["البريون (prion) بروتين موجود طبيعيًا في الجسم، يصبح ممرضًا بسبب انطواء خاطئ. لا يزال سبب هذا الانطواء مجهولًا.", "ليس له ADN ولا ARN: إنه العامل المعدي الوحيد المعروف دون مادة وراثية.", "يدمّر بشكل انتقائي الخلايا العصبية عند الثدييات.", "يسبب الاعتلالات الدماغية الإسفنجية المعدية (encéphalopathies spongiformes)، الوراثية أو المعدية، وهي دائمًا قاتلة."]], "k": ["Une protéine mal pliée, et rien d'autre.", "بروتين مطويّ بشكل خاطئ، ولا شيء غير ذلك."], "q": ["Le prion est :", "البريون هو:"], "o": [["un virus à ARN", "une protéine mal repliée", "une bactérie sporulée"], ["فيروس بـ ARN", "بروتين مطويّ بشكل خاطئ", "بكتيريا متبوّغة"]], "a": 1, "w": ["Aucun acide nucléique : juste une protéine.", "لا حمض نووي: مجرد بروتين."], "g": [54]}, {"img": "s05_23", "t": ["Procaryotes et eucaryotes : le bilan du chapitre A", "بدائيات وحقيقيات النواة: حصيلة الفصل A"], "st": [["Noyau : l'eucaryote a un vrai noyau entouré d'une membrane ; le procaryote a un seul chromosome, sans membrane.", "Paroi : présente chez certains eucaryotes (algues, champignons), absente chez d'autres (protozoaires) ; toujours présente chez les procaryotes.", "Mitochondries : présentes chez les eucaryotes ; absentes chez les procaryotes, où la respiration se fait dans la membrane.", "Organites : réticulum, Golgi, chloroplastes, ribosomes, vacuole chez l'eucaryote ; seulement ribosomes et vacuole chez le procaryote."], ["النواة: لحقيقي النواة نواة حقيقية محاطة بغشاء؛ لبدائي النواة صبغي واحد دون غشاء.", "الجدار: موجود عند بعض حقيقيات النواة (الطحالب، الفطريات) وغائب عند أخرى (الأوالي)؛ ودائمًا موجود عند بدائيات النواة.", "الميتوكوندري: موجودة عند حقيقيات النواة؛ غائبة عند بدائيات النواة حيث يتم التنفس في الغشاء.", "العضيات: الشبكة الإندوبلازمية، غولجي، صانعات اليخضور، الريبوزومات، الفجوة عند حقيقي النواة؛ فقط الريبوزومات والفجوة عند بدائي النواة."]], "k": ["Ce tableau résume le chapitre A : il est souvent demandé au contrôle n° 1.", "هذا الجدول يلخص الفصل A: يُطلب غالبًا في المراقبة رقم 1."], "q": ["Chez les procaryotes, la paroi est :", "عند بدائيات النواة، الجدار:"], "o": [["toujours présente", "toujours absente", "présente seulement chez les algues"], ["موجود دائمًا", "غائب دائمًا", "موجود فقط عند الطحالب"]], "a": 0, "w": ["Toutes les bactéries ont une paroi (Gram + ou Gram −).", "كل البكتيريا لها جدار (موجبة أو سالبة غرام)."], "g": [24, 55]}], "since": "1.0"}, {"n": 6, "t": ["Les besoins nutritionnels et les types trophiques", "الحاجيات الغذائية وأنماط التغذية"], "c": [{"img": "s06_09", "t": ["D'où vient l'énergie ?", "من أين تأتي الطاق
